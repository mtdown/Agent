name: deploy-cloudwiki

# 推送到部署分支即自动部署；也可在 Actions 页面手动点 Run workflow
on:
  push:
    branches:
      - feature/deploy-cicd开发
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    # 固定 24.04 而不是 ubuntu-latest：2026-10-19 起浮动标签会漂到 Ubuntu 26.04，
    # Docker Compose 由 v2 2.38 跳到 v5。agentDeployment.test.mjs 依赖
    # `docker compose config --format json` 的输出结构（services.*.environment.*），
    # 跨大版本可能变。要升级 runner 镜像，先单独验证该结构未变再放开。
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: cloud/pom.xml

      - name: 构建后端 jar
        working-directory: cloud
        run: mvn -B -DskipTests package

      - name: 构建 Agent jar
        working-directory: cloud_agent
        run: mvn -B -DskipTests package

      - name: 准备 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud_front/package-lock.json

      - name: 校验 Agent 部署配置
        run: node agentDeployment.test.mjs

      - name: 校验代理动态解析（容器回归）
        # 真实起容器复现"后端换 IP、Nginx 不重启"：写死 upstream 的旧配置会在这里失败
        run: node deployProxy.test.mjs

      - name: 构建前端产物
        working-directory: cloud_front
        # 用 build-only 而不是 build：后者会先跑 vue-tsc 类型检查，
        # 前端类型问题不该阻塞后端部署。
        run: |
          npm ci
          npm run build-only

      - name: 组装部署包
        run: |
          rm -rf bundle && mkdir -p bundle/dist
          cp cloud/target/cloud-0.0.1-SNAPSHOT.jar bundle/app.jar
          cp cloud_agent/target/cloud-agent-0.0.1-SNAPSHOT.jar bundle/agent.jar
          cp -r cloud_front/dist/. bundle/dist/
          # rollback.sh 必须一起打包：否则服务器上根本没有它，
          # README 里写的 `bash rollback.sh` 一直跑不了（2026-10-16 实测确认）。
          cp deploy/Dockerfile deploy/AgentDockerfile deploy/docker-compose.yml deploy/nginx.conf \
             deploy/schema-init.sql deploy/deploy.sh deploy/rollback.sh bundle/

      - name: 生成服务器 .env（值只来自 Secrets，不落日志）
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          RAG_EMBEDDING_API_KEY: ${{ secrets.RAG_EMBEDDING_API_KEY }}
          RAG_LLM_API_KEY: ${{ secrets.RAG_LLM_API_KEY }}
          AGENT_INTERNAL_KEY: ${{ secrets.AGENT_INTERNAL_KEY }}
          DOC_USERNAME: ${{ secrets.DOC_USERNAME }}
          DOC_PASSWORD: ${{ secrets.DOC_PASSWORD }}
        run: |
          [ -n "$RAG_LLM_API_KEY" ] || { echo "::error::Secret RAG_LLM_API_KEY is required for Agent"; exit 1; }
          if [ -z "$AGENT_INTERNAL_KEY" ]; then
            AGENT_INTERNAL_KEY="$(openssl rand -hex 32)"
          fi
          # 用 printf 而不是 heredoc：避免密钥里的特殊字符被 shell 解析
          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'COS_SECRET_ID=%s\n' "$COS_SECRET_ID"
            printf 'COS_SECRET_KEY=%s\n' "$COS_SECRET_KEY"
            printf 'RAG_EMBEDDING_API_KEY=%s\n' "$RAG_EMBEDDING_API_KEY"
            printf 'RAG_LLM_API_KEY=%s\n' "$RAG_LLM_API_KEY"
            printf 'AGENT_INTERNAL_KEY=%s\n' "$AGENT_INTERNAL_KEY"
            printf 'DOC_USERNAME=%s\n' "${DOC_USERNAME:-admin}"
            printf 'DOC_PASSWORD=%s\n' "$DOC_PASSWORD"
            printf 'HTTP_PORT=8080\n'
          } > bundle/.env

      - name: 打包
        run: tar czf bundle.tar.gz -C bundle .

      - name: 校验部署所需 Secrets
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          fail=0
          [ -n "$SSH_KEY" ] || { echo "::error::Secret SSH_PRIVATE_KEY 为空"; fail=1; }
          [ -n "$HOST" ]    || { echo "::error::Secret SERVER_HOST 为空"; fail=1; }
          [ -n "$USER" ]    || { echo "::error::Secret SERVER_USER 为空"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "    Secrets 齐备，目标 ${USER}@${HOST}"

      - name: 上传到服务器并部署
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 阿里云密钥对多为 RSA，而 OpenSSH 8.8+ 默认禁用 ssh-rsa，
          # 不显式放开会报 "no mutual signature algorithm" / "no matching host key type"。
          export SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o LogLevel=ERROR \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"

          echo "== 测试 SSH 连通性 =="
          ssh $SSH_OPTS "$USER@$HOST" 'echo SSH-OK; whoami; docker compose version' || {
            echo "::error::SSH 登录失败。请检查：1) SERVER_HOST/SERVER_USER 是否正确；"
            echo "::error::2) 服务器安全组入方向是否放行 22；"
            echo "::error::3) SSH_PRIVATE_KEY 是否是该 ECS 实例绑定的密钥对私钥（含 BEGIN/END 行）。"
            exit 1
          }

          ssh $SSH_OPTS "$USER@$HOST" 'mkdir -p /opt/cloudwiki'
          scp $SSH_OPTS bundle.tar.gz "$USER@$HOST:/opt/cloudwiki/bundle.tar.gz"
          ssh $SSH_OPTS "$USER@$HOST" '
            set -e
            cd /opt/cloudwiki
            for file in app.jar agent.jar docker-compose.yml Dockerfile AgentDockerfile nginx.conf; do
              if [ -f "$file" ]; then cp -f "$file" "$file.bak"; fi
            done
            tar xzf bundle.tar.gz
            rm -f bundle.tar.gz
            bash deploy.sh
          '
