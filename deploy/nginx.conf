server {
    # 备案通过前用 8080（国内服务器未备案时 80/443 会被拦截）
    # 备案通过后可改成 80，并另加一个 443 的 server 块启用 HTTPS
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart 的 30MB 保持一致
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 事故背景（2026-10-16）：后端容器每次部署都会被重建，重建后 IP 会变。
    # 写成 proxy_pass http://backend:8123 时，Nginx 只在「加载配置的那一次」把
    # backend 解析成 IP 并一直复用；容器重建后旧 IP 没人监听 => /api 全量 502，
    # 而首页由 Nginx 自己吐静态文件，所以首页仍是 200（极易误判为部署成功）。
    # 修法：用 Docker 内嵌 DNS（127.0.0.11）+ 变量形式的 upstream，
    # 让 Nginx 在请求时重新解析；valid=10s 是解析结果缓存时间，
    # 后端启动窗口内也能很快追上新 IP，无需重建/重启 Nginx 容器。
    # ipv6=off：Docker 内嵌 DNS 只给 A 记录，关掉 AAAA 查询省一次往返。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8123";

    # 前端是 SPA，刷新子路径要回落到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 context-path 就是 /api，这里不做 rewrite，原样转发保留 /api 前缀。
    # proxy_pass 用变量且末尾不带 / ：保留原始请求路径原样透传。
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（项目引入了 spring-boot-starter-websocket）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # RAG 首次向量化实测可达 20s，默认 60s 足够；AI 对话流式响应时间长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
