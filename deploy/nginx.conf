server {
    # 备案通过前用 8080（国内服务器未备案时 80/443 会被拦截）
    # 备案通过后可改成 80，并另加一个 443 的 server 块启用 HTTPS
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 spring.servlet.multipart 的 30MB 保持一致
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 SPA，刷新子路径要回落到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 context-path 就是 /api，这里不做 rewrite，原样转发保留 /api 前缀。
    # proxy_pass 末尾不带 / ：保留原始请求路径。
    location /api/ {
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（项目引入了 spring-boot-starter-websocket）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # RAG 首次向量化实测可达 20s，默认 60s 足够；AI 对话流式响应时间长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
