创新构建“9611”现代服务业体系...“9”是指通过全链条补短板，打造9大优势生产性服务业。“6”是指以满足居民美好生活需要为导向，培育壮大6大特色生活性服务业。“11”是指通过做靓做精服务业品牌，打造以11张“金名片”为代表的品牌矩阵。", "candidateChunks": [2, 30, 1, 29, 6, 5, 0, 35, 20, 28, 33, 23], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-25-1", "category": "pair", "question": "重庆长期护理保险制度实施方案主要包含哪些核心内容？", "answer": "核心内容是“两个扩面、三个明确”。即参保人群和护理项目扩面；明确职工居民筹资标准、待遇保障规则及管理服务要求。", "expectRefusal": false, "gold": [{"docId": 2097637769677754370, "chunkIndex": 1, "why": "重庆市建立健全长期护理保险制度实施方案", "quote": "逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系", "text": "\n为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大和二十届历次全会精神，全面贯彻落实习近平总书记视察重庆重要讲话重要指示精神，认真贯彻落实市委六届历次全会精神，逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系，加快建立与重庆经济社会发展相协调的覆盖全民、统筹城乡、公平统一、安全规范、可持续的长期护理保险制度。2026年，我市长期护理保险继续覆盖参保职工，并启动居民长期护理保险筹资，与居民医保集中筹资同步。2027年，按国家规定调整职工筹资标准和待遇标准，城乡居民按规定开始享受长期护理保险待遇。2028年及以后，不断健全责任共担的资金筹集机制、公平适度的待遇保障机制和科学规范的管理运行机制，更好满足失能人员长期护理基本保障需求，不断增强人民群众的获得感、幸福感、安全感。\n\n二、参保筹资\n\n职工和居民参加基本医疗保险时同步参加长期护理保险，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资"}, {"docId": 2097637769677754370, "chunkIndex": 3, "why": "重庆市建立健全长期护理保险制度实施方案", "quote": "享受长期护理保险待遇对象为，按规定参保缴费且失能状态原则上持续6个月以上，经申请通过评估认定的人员。", "text": "分担。18周岁以下居民跟随父母或其他法定抚养人等参保，不单独筹资，符合待遇享受条件的，按居民待遇标准享受待遇；孤儿、事实无人抚养儿童等无法跟从参保的，视同参保。\n2．政府对符合条件的困难人群个人缴费部分予以分类资助。对特困人员给予全额资助，对低保对象、符合条件的防止返贫致贫对象给予定额资助。具体资助办法由市医保局商市级有关部门确定。\n\n三、待遇保障\n\n（一）待遇对象。享受长期护理保险待遇对象为，按规定参保缴费且失能状态原则上持续6个月以上，经申请通过评估认定的人员。职工参保人员2026年按现行政策人员范围享受待遇。居民参保人员从2027年起按规定享受待遇，起步阶段待遇享受对象为重度失能人员，并根据国家统一规定逐步扩大保障范围。\n\n（二）待遇标准。待遇享受不设起付标准，根据参保类别、失能等级、服务提供方式等实行差别化待遇保障政策。符合规定的长期护理服务费用，按居民筹资政策参保缴费的，基金支付比例为50%左右；按职工筹资政策参保缴费的，基金支付比例为70%左右。居民和职工年度最高支付限额原则上不超过全市上年度城乡居民人均可支配收入的50%。鼓励发展居家和社区护理服务，在支付比例上给予适当倾斜。探索建立社区护理待遇享受标准。2027年起按国家统一规定逐步调整，根据不同服务方式实行差异化待遇享受标准。\n\n待遇享受标准由市医保局会同市财政局根据本市经济发展水平、基金运行情况、长期护理服务项目变化、长期照护师服务能力等因素研究确定。调整待遇享受标准应按国家有关规定程序办理。"}], "source": {"pairId": "p-25", "policyDocId": 2097637769677754370, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建立健全长期护理保险制度实施方案》的通知", "interpretDocId": 2097637775340064769, "interpretTitle": "《重庆市建立健全长期护理保险制度实施方案》政策例行吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2026〕36号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "两个扩面、三个明确", "answerQuote": "《实施方案》的核心内容概括起来，就是两个扩面、三个明确。", "candidateChunks": [1, 0, 3, 4, 9, 6, 5, 7, 8, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-26-1", "category": "pair", "question": "重庆市“十五五”交通物流规划主要包含哪些方面的重大任务？", "answer": "规划重点谋划了5个方面重大任务：一是织密全要素现代化综合交通10张网；二是打造四港联动的国际性综合交通枢纽集群；三是建成“人享其行”的高品质出行服务体系；四是建成“物畅其流”的现代物流和供应链体系；五是推动交通物流高质量转型。", "expectRefusal": false, "gold": [{"docId": 2097637769740668930, "chunkIndex": 7, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "（一）高质量建设全要素现代化综合交通10张网", "text": "\n3．“千里轻舟”全国标志性品牌。“千里轻舟”成为江海直达、铁海联运、“亚欧快线”的衔接纽带，累计货运量突破5000万吨。\n4．“一核三带三环”全国精品旅游公路。形成精品旅游公路超1100公里，成为全国自驾游重要目的地。\n\n5．亚欧快线。建立“亚欧快线”品牌矩阵，打造“一次委托、一单到底、一箱到底、一码贯通”的多式联运集成服务场景，“亚欧快线”货运量年均增长15%。\n\n6．可转让货物单证公共服务平台。一纸单证通全球，单证签发流转时间从2天压缩至2小时，货物周转与贸易资金流转效率大幅提升，制度型开放优势稳步扩大。\n\n7．数智交通走廊。建成“三轴贯双圈、一廊联江海”数智通道3800公里，推动大山区大库区交通基础设施数字化转型升级。\n\n8．大山区大库区“空天地”多源立体监测感知网。建成基础设施监测预警系统，实现桥梁、边坡、隧道等重点结构物以及风险路段感知网全覆盖。通过人工智能模型分析，协同路网监测、一路多方体系，灾害事件应急救援能力持续提升。\n\n9．长江上游绿色交通示范引领。新建200艘新能源清洁能源船舶，全域实现船舶水污染物全接收、零排放，岸基供电全覆盖、全使用，靠港船舶岸电使用量内河领先，支撑重庆在长江经济带绿色发展中发挥示范作用‌。\n\n到2035年，全面建成现代化高水平交通强市和国际性综合交通枢纽城市，全面实现“人享其行、物畅其流”美好愿景。\n\n二、建设链接全球的全国交通极，支撑内陆开放综合枢纽能级整体跃升\n\n（一）高质量建设全要素现代化综合交通10张网"}, {"docId": 2097637769740668930, "chunkIndex": 18, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "（二）打造四港联动的国际性综合交通枢纽集群", "text": "，因地制宜推进13个老旧长途客运站增设物流快递等设施，提高快递业干线运输规模化水平，拓展支线运输网络化覆盖面。推进城市末端智能收投终端、标准化末端服务设施建设。\n打造畅安舒美的绿道网。打造“山城绿道”特色品牌体系，实现“30分钟入山林、15分钟亲水岸、10分钟进公园”。深入实施山城步道“成网”计划，有序推动山城步道连线成片。建设路景融合的美丽绿色交通廊道，推动高速公路、普通公路路域环境洁化、绿化、美化，打造一批绿色廊道工程。深化“美丽农村路”建设，力争每个区县累计建成1—2条“美丽农村路”，助力打造巴渝和美乡村。建设生态美丽航道，形成航旅融合的巴渝文化水上风景线。\n\n专栏12  绿道网建设重大工程\n\n1．山城绿道。中心城区累计建成“三级六类”山城绿道1000公里以上。\n\n2．山城步道。开工建设云碚映象步道等项目；建成塔子山滨江步道等项目，山城步道里程达到1000公里以上。\n\n3．美丽绿色交通廊道。打造旅游绿色廊道1100公里以上、“美丽农村路”1000公里以上、生态美丽航道170公里以上。\n\n统筹推动10张网高效衔接。坚持“多规合一”，构建全量交通“一张图”，强化通道线位资源、岸线资源、土地资源、空域资源、水域资源节约集约利用，推动铁路、轨道、道路、管道等线位统筹，促进通道由单一向综合、由平面向立体发展。推动多层次轨道交通融合发展，拓展跨线运营覆盖面。强化高速公路、干线公路与城市道路标准匹配、建设同步，推动城市绿道、公共交通、慢行交通一体融合。\n\n（二）打造四港联动的国际性综合交通枢纽集群"}, {"docId": 2097637769740668930, "chunkIndex": 24, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "三、建成高品质“人享其行”的现代出行服务体系，打造更高水平人民满意交通", "text": "绸之路经济带通道，丰富拓展渝满俄通道，研究重庆衔接北极航线的国际贸易新路径，构建贯通欧洲—中国—东盟跨欧亚大陆的超级走廊，支撑重庆成为我国南向西向开放战略高地。\n支撑构建市域高质量发展新格局。推动中心城区强核提能级，提升两江新区空港型、港口型国家物流枢纽全球连通度与区域辐射力，支持北碚打造北部门户枢纽。提升永川城市副中心综合交通发展能级，协同打造渝西国际开放枢纽，构建渝西地区“半小时交通圈”。支持渝东新城共建长江上游大宗商品供应链组织枢纽。以万州重要城市副中心为引领打造万达开云全国性综合交通枢纽，构建渝东北“1小时交通圈”。提升黔江区域中心城市交通发展能级，服务渝东南武陵山区高质量发展。\n\n三、建成高品质“人享其行”的现代出行服务体系，打造更高水平人民满意交通\n\n（四）优化提升多层次出行服务品质\n\n提升国际出行服务水平。加快构建航班波，江北国际机场飞机年起降达到52万架次，国际地区旅客吞吐量达到500万人次。提升入境游便利化水平，升级打造入境游口岸签“一网通办”应用，提供“零延时”通关服务。构建以机场为主体的跨航司中转平台，提升跨航司、跨地服代理、跨航站楼“三跨中转”效率，完善“5E+”中转服务，联合在线旅游信息服务商（OTA）开发航线中转产品，丰富空空、空铁等联运产品供给，提升综合服务品质。"}, {"docId": 2097637769740668930, "chunkIndex": 28, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "四、建成高质量“物畅其流”的现代物流和供应链体系，服务现代化产业体系迭代升级", "text": "旅游、亲子旅游、红色旅游等特色旅游产品，探索发展游艇经济，创新低空文旅消费融合发展模式。聚焦节假日等客流高峰时段，加密旅游专线、定制客运班次，保障游客便捷出行。\n四、建成高质量“物畅其流”的现代物流和供应链体系，服务现代化产业体系迭代升级\n\n（六）全面提升通道运营组织能力\n\n增强“双主轴”运营组织能力。集成做优陆路主轴“亚欧快线”产品矩阵，推动中新、中缅、中老通道拓网提质，建立西部陆海新通道沿线“13+2”省区市项目、政策、改革、平台联动机制，搭建“跨区域综合运营平台+专业化子公司+海外机构”的跨区域运营体系。优化南通道班列开行，探索“班列集运+海外仓前置”一体化模式，提升中欧（亚）班列发展能级。强化西部陆海新通道和中欧班列高效衔接，创新集装箱共享调拨机制。统筹推动长江水路主轴降本增效，整合口岸通关、保税仓储、航运物流、智慧信息管理等综合服务功能，提升港口一体化运营服务能级与长江水运通道整体运行效能。开发“新三样”货物江铁海联运班列产品，联动长江沿线港口城市强化航线网络等资源集成，实现降本增效。"}], "source": {"pairId": "p-26", "policyDocId": 2097637769740668930, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》的通知", "interpretDocId": 2097637775440728066, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕18号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "5个方面重大任务", "answerQuote": "规划重点谋划了5个方面重大任务：一是织密全要素现代化综合交通10张网。", "candidateChunks": [2, 43, 7, 18, 24, 6, 8, 19, 20, 28, 32, 21], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-26-2", "category": "pair", "question": "到2030年，重庆新能源重卡的渗透率目标是多少？", "answer": "根据规划，重庆将深入推动新能源重卡规模化应用，力争到2030年新能源重卡渗透率达到40%。", "expectRefusal": false, "gold": [{"docId": 2097637769740668930, "chunkIndex": 38, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "深入推进大规模设备更新行动，促进新能源重卡规模化应用", "text": "，常态化推进城市道路、桥梁、隧道风险隐患排查整治，加强地下空洞探测与土体疏松治理，分类推进危旧桥隧整治加固，对承载力不足、抗灾性能落后的设施实施改造或有序更新。\n7．能源管道养护。规范油气管道竣工测量图管理，确保管道路由清晰、中心线定位精准，标志桩、警示牌科学规范。基于内检测数据对老旧管道开展完整性评估，根据评估结果实施缺陷整治。\n\n（十）描绘绿色低碳交通新画卷\n\n推广绿色设施设备。建设“零碳运输通道”，新建加氢站15座以上，建成超充重卡场站100座以上，开展高速公路服务区、景区等充电设施提升行动，力争高速公路服务区超充设施覆盖率达到100%，打造成渝地区双城经济圈和西部陆海新通道“氢走廊”“电走廊”。建设“零碳枢纽”，推广绿电、绿证在客货枢纽运营使用，推进枢纽场站和邮政快递分拨中心、网点、仓储设施绿色化改造，加快场站内部作业设备电动化替代，争创3—5个“零碳枢纽”示范工程。深入推进大规模设备更新行动，促进新能源重卡规模化应用，引导中心城区新增及更新公交车、巡游出租车使用新能源车；推广应用电动、液化天然气、甲醇等新能源、清洁能源船舶，打造“千里轻舟”新能源船队，完善补能设施布局。\n\n持续深化运输结构调整。加快推进大宗物资中长距离运输“公转铁”“公转水”，大力发展铁水联运、江海联运、水水中转，支持“散改集”运输，推动铁水联运量占港口吞吐量的比重达到12%，有效降低公路运输比重。推广卡车航班、高铁快运等模式，推动联程运输一体化。"}], "source": {"pairId": "p-26", "policyDocId": 2097637769740668930, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》的通知", "interpretDocId": 2097637775440728066, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕18号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "新能源重卡渗透率", "answerQuote": "深入推动新能源重卡规模化应用，到2030年新能源重卡渗透率达到40%。", "candidateChunks": [38, 15, 39, 34, 17, 20, 2, 21, 16, 22, 37, 24], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-27-1", "category": "pair", "question": "重庆市“十五五”美丽重庆建设规划主要包含哪些方面的重点任务？", "answer": "聚焦打造美丽河湖、美丽蓝天、美丽净土、美丽山川、美丽岸线、美丽城市、美丽乡村等7个方面重点任务，并安排了22项指标、58项任务、22个重大事项。", "expectRefusal": false, "gold": [{"docId": 2097637769845526529, "chunkIndex": 4, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "二、深化实施治水治气治土治废治塑，增进生态环境民生福祉\n\n（一）全力治水，打造美丽河湖", "text": "\n—\n\n达到国家考核目标\n\n约束性\n\n化学需氧量、总磷排放总量分别下降\n\n18\n\n生态安全守护\n\n建设用地安全利用\n\n—\n\n有效\n\n保障\n\n全面保障\n\n预期性\n19\n\n地下水国控区域点位优良水质比例\n\n%\n\n—\n\n≥80\n\n预期性\n\n20\n\n非法倾倒和非法处置固体废物事件发生率\n\n%\n\n—\n\n大幅降低\n\n预期性\n\n21\n\n森林火灾受害率\n\n‰\n\n＜0.3\n\n≤0.3\n\n预期性\n\n22\n\n辐射安全与辐射环境优良指数\n\n%\n\n—\n\n达到国家考核目标\n\n预期性\n\n注：1．细颗粒物浓度、空气质量优良天数比例、63个地表水国控断面优良水体比例、63个地表水国控断面达到或优于Ⅲ类水质比例、地下水国控区域点位优良水质比例根据《环境空气质量标准》（GB 3095—2026）和“十五五”国家地表水、地下水生态环境监测断面（点位）测算。\n\n2．优良水体比例是在水质类别基础上叠加水生态指标，综合确定水生态环境达到“优秀”和“良好”状况的比例。\n\n3．带*为“十五五”基准值（国家考核测算基数）。\n\n二、深化实施治水治气治土治废治塑，增进生态环境民生福祉\n\n（一）全力治水，打造美丽河湖"}, {"docId": 2097637769845526529, "chunkIndex": 12, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "（二）精心治岸塑造美丽岸线", "text": "推进候鸟迁飞通道建设，加强开州汉丰湖、梁平双桂湖等湿地公园候鸟重要栖息地、繁殖地、停歇地和越冬地保护。推进中心城区“四山”优化治理，统筹实施生态保护修复等任务。\n2﹒加强林草湿生态系统保护。加强森林资源用途管制，严格建设项目使用林地总量控制和定额管理。实施公益林保护，强化天然林重点保护区和一般保护区分类保护。健全古树名木挂牌保护制度，推进衰弱濒危古树名木复壮保护。开展草原资源本底调查监测，加强奉节茅草坝、开州雪宝山等草甸生态系统原生态保护。严格湿地用途管控，完善湿地分级分类管理体系，推进国家重要湿地等保护修复。科学推进国土绿化，开展森林质量精准提升，全市森林覆盖率保持在55%以上。\n\n3﹒强化重要生态区域监管。加快自然保护地整合优化成果落地，推进自然保护地勘界立标，加强国家级自然保护区能力建设，自然保护地占国土面积的比例不低于13.55%。严格落实生态保护红线监管制度，持续实施“绿盾”自然保护地生态环境问题排查专项行动，推动国家级自然保护区重点生态破坏问题动态清零，全市生态保护红线面积不低于1.92万平方公里。\n\n（二）精心治岸塑造美丽岸线\n\n1﹒建设绿色生态水域廊道。统筹实施长江岸线保护和利用，严格河道水域岸线分区分类管控。纵深推进河湖“清四乱”常态化规范化，重点清理整治警戒水位以下的违法违规建筑设施。一体打造山水、建筑、滩涂、桥梁、灯光景观，有序推进河湖水域岸线空间开放共享，做靓现代化国际大都市滨江风景线。"}, {"docId": 2097637769845526529, "chunkIndex": 6, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "（二）精准治气，守护美丽蓝天", "text": "态流量监测预警机制，重点河湖基本生态流量保障率保持在90%以上。巩固城市饮用水水源地保护成效，开展乡镇水源地达标治理和规范化建设，实施提升农村饮水质量专项行动。\n3﹒推动水生态修复。编制水生态评价技术指南，探索开展水生态调查评估。因地制宜实施水系连通、河道清淤疏浚等工程，推进长江、嘉陵江、乌江等重点流域、城市河段及其他重要水体河湖生态缓冲带建设。推进长江三峡库区（重庆段）水华重点区域预警与安全监控能力建设，加强湖库富营养化综合治理，逐步解决湖库水生态失衡问题。建立完善美丽河湖、幸福河湖综合评价和管理体系。\n\n（二）精准治气，守护美丽蓝天\n\n1﹒强化重点行业深度治理。推进水泥、垃圾焚烧等重点行业及燃煤锅炉超低排放改造，实施玻璃、有色金属、铸造等工业炉窑及殡葬行业废气深度治理，加强低效失效大气污染治理设施排查整治。推进烧结砖瓦行业整合升级，实施铸造、家具等传统产业集群整治。推动汽车供应链集群整治，加强低（无）挥发性有机物（VOCs）原辅材料源头替代和全流程治理。持续健全以大气环境绩效分级为导向的管理体系，开展绩效等级提升行动。\n\n2﹒强化移动源污染防治。开展油品储运销深度治理，深化机动车年检机构监管执法，推进新生产柴油货车系族检查全覆盖。加强重型货车路检路查和入户检查，严厉打击拆除尾气后处理装置、破坏或篡改车载诊断系统等违法行为。优化调整柴油货车限行区域，严查冒黑烟车辆上路行驶。开展非道路移动机械、船舶清洁化发展攻坚行动，基本实现靠港船舶岸电使用常态化，鼓励使用新能源或国四及以上排放标准的非道路移动机械。"}, {"docId": 2097637769845526529, "chunkIndex": 15, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "四、协同治城治乡，塑造全市域整体大美风貌\n\n（一）聚力治城做靓美丽城市", "text": "化主要支流和中小河流岸线治理，完成130公顷生态缓冲带保护与修复。治理水土流失面积6000平方公里。完成1500公顷废弃矿山生态修复，建成绿色矿山120座以上。\n3﹒生物多样性保护。科学规范开展增殖放流，每年放流水生生物1500万尾以上，其中珍贵濒危物种比例不低于10%，推动“三江”干流重点水域水生生物资源监测实现全覆盖。开展保护鸟类活动和打击非法捕猎贩卖鸟类专项行动。建成高标准野生植物资源库（圃）不少于10个，保存野生植物资源5万份以上。生物多样性观测站点基本覆盖全市自然保护地和典型生态系统。\n\n四、协同治城治乡，塑造全市域整体大美风貌\n\n（一）聚力治城做靓美丽城市\n\n1﹒整治群众反映强烈的城市环境问题。实施城市噪声综合治理，开展声环境功能区划成效评估，完善数智化噪声地图。加强新建餐饮服务项目选址管控，推进公共机构食堂和特色餐饮油烟深度治理。开展工业、市政等领域恶臭异味重点源排查治理，建立长效巩固机制。完善公众生态环境监督和举报反馈机制，加强网络热点环境污染问题监控分析，及时解决群众急难愁盼问题，生态环境公众满意度稳定在93%左右。\n\n2﹒提升国际化大都市风貌品质。实施城市更新行动，推进现代化都市风貌展示区、城市“美丽廊道”等建设，塑造区县城特色风貌名片，持续擦亮“山城夜景”品牌。实施中心城区第五立面治理提升行动。推进城市绿地微更新，实施“增绿添园”，推动山城绿道建设，打造具有国际风范的“立体绿城”。\n\n（二）纵深治乡建设美丽乡村"}], "source": {"pairId": "p-27", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 2097637775600111618, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”美丽重庆建设规划（2026—2030年）》解读 新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "7个方面重点任务", "answerQuote": "安排了美丽河湖、美丽蓝天、美丽净土、美丽山川、美丽岸线、美丽城市、美丽乡村等7个方面重点任务", "candidateChunks": [2, 0, 1, 32, 4, 5, 12, 26, 6, 15, 11, 13], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-27-2", "category": "pair", "question": "到2030年，重庆在绿色工厂和绿色园区建设方面有什么具体目标？", "answer": "到2030年，累计建成绿色工厂500个、绿色园区36个。这是产业结构绿色低碳转型的重要指标，旨在建立绿色低碳循环产业体系。", "expectRefusal": false, "gold": [{"docId": 2097637769845526529, "chunkIndex": 21, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "培育壮大绿色制造体系，累计建成绿色工厂500个、绿色园区36个。", "text": "升气候风险防范能力，完善自然灾害综合风险图和防治区划图，优化灾害应急响应救援扁平化组织指挥模式。深化国家气候适应型城市建设试点，开展气候变化适应能力和成效评估。\n3﹒深入践行绿色低碳生活方式。有序实施消费品以旧换新政策，积极发展绿色消费新模式和新业态，组织开展绿色智能家电以旧换新、新能源汽车置换等促进绿色消费活动。持续开展节约型机关建设，严格执行政府绿色采购政策，引导企业执行绿色采购指南。接续开展国际生物多样性日、世界环境日、全国生态日、全国低碳日等宣传活动，倡导简约适度、绿色低碳、文明健康的生活理念和消费方式。\n\n专栏5  绿色低碳转型重大事项\n\n1﹒产业绿色低碳转型。培育壮大绿色制造体系，累计建成绿色工厂500个、绿色园区36个。实施钢铁、石化等行业节能节水降碳改造升级，加大报废汽车、废动力电池、再生金属等再生资源回收利用力度，全市主要再生资源年循环利用量达到1100万吨。\n\n2﹒构建清洁低碳能源体系。大力发展清洁能源，建成川渝千亿立方米国家油气生产基地，建设百亿立方米储气库群，全市新能源装机达到1100万千瓦，清洁能源装机占比达到50%。实施高耗能、高污染存量机组“上大压小”项目，有序推动老旧煤电机组关停淘汰或退役转备用，煤炭消费比重降至39%，实现煤炭、成品油消费达峰。\n\n3﹒交通运输绿色转型。推进交通运输大规模设备更新，推动新能源重型卡车规模化应用，重点大宗货物清洁运输比例达到90%以上，中心城区公交车和巡游出租车纯电动化占比达到80%以上。推进“零碳枢纽”建设，实施3—5个绿色港口建设工程。"}], "source": {"pairId": "p-27", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 2097637775600111618, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”美丽重庆建设规划（2026—2030年）》解读 新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "绿色工厂500个", "answerQuote": "到2030年，累计建成绿色工厂500个、绿色园区36个", "candidateChunks": [21, 18, 17, 2, 1, 14, 31, 19, 28, 24, 9, 5], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-28-1", "category": "pair", "question": "重庆市推进城市全域数字化转型行动计划主要部署了哪几方面的能力提升行动？", "answer": "该计划部署了五大核心能力提升行动，覆盖数字底座、智能中枢、六大系统、基层智治、适数生态等方面。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "二、数字底座能力提升行动", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 7, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "五、基层智治体系能力提升行动", "text": "代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。\n（二十）全面构建数字经济系统体系能力。聚焦产业集群培育、企业成长服务、产业创新生态系统重塑、产业发展质效提升、现代化产业治理等，持续深化梳理迭代数字经济系统五级核心业务体系。迭代建设产业一链通、数智金融服务、智汇攻关、数字陆海新通道等数字化应用，加快构建产业培育、科技创新、企业服务等五级联动业务承接体系，推动数智赋能新质生产力发展和现代化产业体系建设。\n\n（二十一）全面构建数字社会系统体系能力。聚焦投资于人、消费提档、民生改善等，持续优化完善数字社会系统五级核心业务体系。迭代建设惠学生、智慧医保、救助通、渝你同行、信用等数字化应用，有效提升五级联动业务承接能力，赋能构建更加优质均衡的公共服务体系。\n\n（二十二）全面构建数字文化系统体系能力。聚焦主流价值、主流舆论、主流文化等，持续优化完善数字文化系统五级核心业务体系。迭代建设春风满巴渝、巴渝文物、惠游重庆等数字化应用，加快构建数字文化系统五级联动业务承接体系，全面推动数智赋能新时代文化强市建设。\n\n（二十三）全面构建数字法治系统体系能力。聚焦维护国家政治安全、确保社会大局稳定、促进社会公平正义、保障人民安居乐业等，持续优化完善数字法治系统五级核心业务体系。迭代情指行、全民反诈、重庆调解在线、“执法+监督”等数字化应用，加快构建数字法治系统五级联动业务承接体系。\n\n五、基层智治体系能力提升行动"}, {"docId": 2097637763906392065, "chunkIndex": 6, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "四、六大系统能力提升行动", "text": "方案优化完善、线上精细化智能预案各跑道全覆盖，打造全媒体传播大脑、智慧文旅等综合场景，全面提升舆论引导精准度、文化服务普惠度、文明素养浸润度，营造良好文化氛围。\n（十六）加快集成生态景观防治协同支撑能力。聚焦空气环境、固废与土壤环境、自然资源等领域，推动生态景观板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造污染防治攻坚战智管、中心城区“四山”管理等综合场景，加快构建生态环境数字治理新形态。\n\n（十七）加快集成高品质生产生活服务支撑能力。聚焦医疗、教育、就业、养老等领域，推动生产生活服务板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造15分钟高品质生活服务圈、“三医”协同、高质量就业综合智服等综合场景。\n\n四、六大系统能力提升行动\n\n（十八）全面构建数字党建系统体系能力。聚焦推动党的领导一贯到底、纵深推进全面从严治党、深化全过程人民民主市域实践等，持续深化梳理迭代数字党建系统五级核心业务体系。迭代建设八张报表、八张问题清单、突发事件直报快响、渝才荟、人大代表全渝通、青春重庆等数字化应用，持续提升数字党建五级联动业务承接能力，加快完善党建统领整体智治工作格局。\n\n（十九）全面构建数字政务系统体系能力。聚焦全生命周期服务、全要素决策发展、全链条本质安全、全域协同治理等，持续深化梳理迭代数字政务系统五级核心业务体系。迭代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。"}, {"docId": 2097637763906392065, "chunkIndex": 3, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "三、智能中枢能力提升行动", "text": "模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。\n（五）推进感知可用。强化感知资源“一本账”管理，推进感知盲区补点、接入，构建融通智联感知体系。鼓励社会主体感知资源接入，推进感知资源与体征指标、风险点、智能预案等深度关联。提升AI赋能视频感知资源利用率、共享率、复用率，强化城市基础设施数字化改造。\n\n（六）推进空间孪生。建设空间数据体系，迭代国土空间数据综合信息系统，深化“多规合一”专题图，构建“挂图作战”智能体系，加快自然空间、人造空间向数字空间全量孪生。聚焦产业升级、科技创新等发展行为，应急调度、风险排查等治理行为，教育就业、卫生健康等服务行为，推动行为（活动）向数字空间映射。推动先进文化向数字空间孪生。\n\n（七）优化“两端”入口。迭代升级“渝快政”，开展信创化改造和客户端适配。升级“渝快办”，深化线上全程网办、线下全渝通办和一站式服务。\n\n（八）抓实数据安全。建设数据灾备中心，加强数字重庆人工智能底座保密防护和管理。落实数据分类分级保护制度，完善风险监测预警、安全审查监管等机制。\n\n三、智能中枢能力提升行动"}], "source": {"pairId": "p-28", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637779450482689, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》印发 到2027年 数字重庆体系能力全面建成", "interpretSection": "媒体视角", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "五大核心能力", "answerQuote": "为实现目标，行动计划部署了五大核心能力提升行动，覆盖数字底座、智能中枢、六大系统、基层智治、适数生态等。", "candidateChunks": [1, 0, 7, 6, 3, 4, 8, 9, 10, 5, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-28-2", "category": "pair", "question": "到2027年，重庆在数据企业培育和数字经济占比方面有什么具体指标？", "answer": "到2027年，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}], "source": {"pairId": "p-28", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637779450482689, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》印发 到2027年 数字重庆体系能力全面建成", "interpretSection": "媒体视角", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "1000家", "answerQuote": "新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "candidateChunks": [1, 4, 7, 10, 0, 9, 3, 5, 2, 8, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-29-1", "category": "pair", "question": "重庆市突发事件总体应急预案主要涵盖了哪些方面的内容？", "answer": "该预案全文共5个部分，从组织指挥体系、运行机制、应急保障等方面，对突发事件应急管理全链条、全流程工作进行了规范。", "expectRefusal": false, "gold": [{"docId": 2097637768146833409, "chunkIndex": 0, "why": "重庆市突发事件总体应急预案", "quote": "《重庆市突发事件总体应急预案》主要内容如下。", "text": "---\r\ntitle: \"市委、市政府印发《重庆市突发事件总体应急预案》\"\r\nfileNum: \"\"\r\npubDate: 2026-06-16 09:28:12\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/swygwj/202606/t20260616_15755690.html\r\nmetadataId: 15755690\r\nchannelId: 418672\r\nsubcat: 884\r\nbodyShort: false\r\n---\n\n近日，市委、市政府印发了《重庆市突发事件总体应急预案》，并发出通知，要求各地、各部门结合实际认真贯彻落实。《重庆市人民政府关于实施重庆市突发公共事件总体应急预案的决定》（渝府发〔2007〕87号）同时废止。\n\n《重庆市突发事件总体应急预案》主要内容如下。\n\n为有效防范化解重大安全风险、应对本市突发事件，保护人民群众生命财产安全，维护国家安全和社会稳定，依据《国家突发事件总体应急预案》《中华人民共和国突发事件应对法》等法律法规和有关规定，制定本预案。\n\n1 总则\n\n1.1 总体要求"}, {"docId": 2097637768146833409, "chunkIndex": 2, "why": "重庆市突发事件总体应急预案", "quote": "2 组织指挥体系", "text": "\n本预案所称突发事件是指突然发生，造成或可能造成严重社会危害，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。\n自然灾害主要包括连晴高温、冰冻雨雪、局部大风、强降雨、地震、地质灾害和森林草原火灾等；事故灾难主要包括工矿商贸等生产经营单位的各类生产安全事故，交通运输、燃气、化工、公共设施和设备事故，高层建筑火灾、生态环境、网络安全事件等；公共卫生事件主要包括传染病疫情、群体性不明原因疾病、群体性中毒，食品安全事故、药品安全事件、动物疫情等；社会安全事件主要包括刑事案件和恐怖、群体性、民族宗教事件等。\n\n自然灾害、事故灾难、公共卫生事件分为特别重大、重大、较大、一般4级，其种类和分级标准按照国家有关规定执行，作为突发事件信息报送和分级处置的依据。社会安全事件分级按照国家相关规定另行明确。\n\n1.4 应急预案体系\n\n突发事件应急预案体系包括市、区县党委和政府及其有关部门、基层组织、企事业单位、社会团体等制定的各类突发事件应急预案以及相关支撑性文件。市、区县党委和政府应急预案由总体应急预案、专项应急预案、部门应急预案组成。\n\n2 组织指挥体系\n\n2.1 市级层面指挥体制\n\n2.1.1 指挥机构\n\n设立重庆市突发事件应急总指挥部（以下简称市总指挥部），统一指挥协调全市突发事件应对工作。市总指挥部总指挥由市委书记、市政府市长担任，副总指挥由市委副书记、市委常委和市政府副市长担任，成员由市级有关部门主要负责人，以及重庆警备区、武警重庆总队相关负责人组成。市治理中心为市总指挥部提供指挥平台支撑。"}], "source": {"pairId": "p-29", "policyDocId": 2097637768146833409, "policyTitle": "市委、市政府印发《重庆市突发事件总体应急预案》", "interpretDocId": 2097637783007252482, "interpretTitle": "《重庆市突发事件总体应急预案》出台 规范突发事件应急管理全链条全流程工作", "interpretSection": "媒体视角", "docNumber": ""}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "组织指挥体系", "answerQuote": "全文共5个部分，从组织指挥体系、运行机制、应急保障等方面，对突发事件应急管理全链条、全流程工作进行了规范。", "candidateChunks": [0, 2, 1, 4, 14, 15, 3, 8, 12, 13, 6, 11], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-29-2", "category": "pair", "question": "重庆在突发事件监测预警方面，对数据接入和重点区域风险管控有什么具体要求？", "answer": "明确行业感知设备与数据资源全量接入三级治理中心，重点区域建立风险管控清单并全量落图，构建统一的全域监测网络与信息共享平台。", "expectRefusal": false, "gold": [{"docId": 2097637768146833409, "chunkIndex": 5, "why": "重庆市突发事件总体应急预案", "quote": "推动行业感知设备与数据资源接入三级治理中心，构建统一的全域监测网络与信息共享平台", "text": "”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警\n3.2.1 监测\n\n市、区县及其有关部门应当根据自然灾害、事故灾难、公共卫生事件、社会安全事件的种类和特点，完善监测网络，科学划分监测区域、确定监测点、明确监测项目，建立健全基础信息数据库，加强情报信息综合监测，推动专业监测和群测群防深度融合，推动行业感知设备与数据资源接入三级治理中心，构建统一的全域监测网络与信息共享平台，加强综合分析研判，及早发现可能引发突发事件的苗头性信息，提出预警和处置措施建议。\n\n3.2.2 预警\n\n本市预警级别分为一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示，一级为最高级。市、区县政府或者其授权的部门、应急指挥机构按照本市规定，通过政府突发事件预警信息发布系统，发布本行政区域各级别预警信息。乡镇（街道）负责接收传递预警信息，落实不同行业（领域）、重点部位临灾针对性预警“叫应”措施。预警级别的具体划分标准依据国家相关规定执行。\n\n（1）预警信息发布。对可预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，及时发布相应级别预警信息，决定并宣布有关地区进入预警期，同时向有关方面通报，并根据事态发展及时作出调整。预警信息应当采用统一规范的格式。"}, {"docId": 2097637768146833409, "chunkIndex": 4, "why": "重庆市突发事件总体应急预案", "quote": "建立重点区域风险管控清单并在三级治理中心落图", "text": "\n2.2 区县层面指挥体制\n\n区县可参照市级设立本级指挥体制。\n\n2.3 基层指挥体制\n乡镇（街道）健全“141”基层智治体系，开发区、工业园区、港区、风景区等应当完善本区域应急管理组织体系，明确专门工作力量，细化应急预案。村（社区）应当增强监测预警、信息报告、先期处置和组织动员能力，依法健全应急工作机制，做好本区域应急管理相关工作。\n\n相邻地区应当建立信息共享和应急联动机制，共同做好区域性、流域性、关联性强的突发事件防范应对工作。\n\n2.4 专家组\n\n市、区县部门建立相关专业人才库，根据需要聘请有关专家组成专家组，为应急管理提供决策建议和技术支持；建立技术指挥官制度，根据有关指挥机构指令，指定技术指挥官负责突发事件现场处置的技术指挥工作。\n\n3 运行机制\n\n3.1 风险防控\n\n市、区县党委和政府应当健全风险防范化解机制，强化系统治理、依法治理、综合治理、源头治理和专项治理。有关部门按规定对各类危险源、危险区域、传染病疫情及生物安全风险等开展调查、评估与登记，加强对高层建筑、学校、养老院、大型商超等场所和化工、燃气等领域的风险隐患排查，建立重点区域风险管控清单并在三级治理中心落图，健全安全风险分级管控和隐患排查治理双重预防、跨部门风险信息共享与协同防控等机制。乡镇（街道）和村（社区）利用“141”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警"}], "source": {"pairId": "p-29", "policyDocId": 2097637768146833409, "policyTitle": "市委、市政府印发《重庆市突发事件总体应急预案》", "interpretDocId": 2097637783007252482, "interpretTitle": "《重庆市突发事件总体应急预案》出台 规范突发事件应急管理全链条全流程工作", "interpretSection": "媒体视角", "docNumber": ""}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "全量接入", "answerQuote": "明确行业感知设备与数据资源全量接入三级治理中心，重点区域建立风险管控清单并全量落图", "candidateChunks": [5, 4, 1, 3, 13, 7, 6, 8, 11, 10, 0, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-30-1", "category": "pair", "question": "重庆市十五五社会发展规划主要包含哪些重点任务？", "answer": "规划围绕构建全龄友好型社会、建设教育强市、实施就业优先战略、推进健康中国行动、优化住房供应、健全社会保障、建设体育强市及改善民生等八大方面明确重点任务。", "expectRefusal": false, "gold": [{"docId": 2097637769459650561, "chunkIndex": 25, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "七、健全社会保障体系，夯实共同富裕基石", "text": "系。培育“好房子”建造企业，推动建造模块化、装修定制化、全屋智能化，探索推广装配式建筑、绿色建材等。建立房屋安全体检、安全管理资金、质量安全保险等安全管理制度。\n积极推进“好小区”建设。稳步推进城中村和城市危旧房改造，鼓励依托新工艺、新技术、新材料、新设备改造老旧住宅，改善群众居住生活条件。持续推进完整社区建设，补齐“一老一小”、停车充电等服务设施短板。实施物业服务质量提升行动，探索“物业服务+生活服务”模式，鼓励有条件的物业企业提供养老、托幼、家政等服务。\n\n（三）探索房地产发展新模式\n\n“一区（县）一策”支持刚性和改善性住房需求，着力稳定房地产市场。加强商品房开发、融资、销售全链条监管，严格落实房地产开发项目公司制和房地产融资主办银行制，支持房地产企业合理融资需求，有序推进现房销售。培育规模化、专业化租赁企业，规范发展住房租赁市场，推动租购住房享有同等公共服务权利。深化住房公积金制度改革，推动公积金向新市民、青年人、灵活就业等群体广覆盖。分类施策推进“久供未建、久建未完”项目处置。\n\n专栏15  保障高水平住有所居重点事项\n\n优化保障性住房供给。实施城镇老旧小区改造，改造老旧小区2000个。公租房入住率保持在92%以上，新筹集保障性租赁住房2.5万套（间）。\n\n实施房屋品质提升工程。推动政府建设的保障性住房率先实现“好房子”“好小区”全覆盖。稳步推进存量城市危旧房改造2.85万户。\n\n七、健全社会保障体系，夯实共同富裕基石\n\n（一）健全社会保险制度"}, {"docId": 2097637769459650561, "chunkIndex": 18, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "五、推进健康中国重庆行动，增进全民健康福祉", "text": "\n提升就业创业服务。打造“青来渝州”就业创业综合体10个。建设青年就业驿站50个。实施“就业公共服务进校园百日行动”。\n开展就业能力培训。实施青年群体技能培训专项计划，每年培训4万人次。支持应届毕业生参加职业技能培训。\n\n（三）大力支持自主创业、灵活就业\n\n完善创业带动就业扶持体系。推进“渝创渝新”创业扶持工程，健全创业培训、孵化、服务等联动机制，提质发展环大学创新创业生态圈等平台。完善创业担保贷款体系，用好风险补偿资金池，健全银担风险熔断机制。分类培育科技、产业等“+创业”新模式，拓展人工智能赋能创新创业创意空间，推动OPC（一人公司）集聚发展。支持企业走出去带动海外就业。\n\n推动灵活就业和新就业形态健康发展。促进平台经济健康发展，挖掘人工智能应用就业岗位，妥善应对人工智能对就业的影响。实施支持多渠道灵活就业行动计划，发展夜间经济、小店经济、上门经济等，鼓励个体经营发展，建设零工市场、零工驿站、线上零工平台。探索建立新职业观测站，开展新职业培育、认定和评价。\n\n专栏11  新就业形态劳动者就业质量提升计划\n\n开展专项技能培训。新就业形态职业技能培训每年1万人次。\n\n加强公共服务保障。扩围新就业形态人员职业伤害保障试点，推动在就业地平等纳入保障性住房、子女教育等基本公共服务保障范围。\n\n实施暖心关爱保障工程。建成新就业群体友好阵地7500个以上。\n\n五、推进健康中国重庆行动，增进全民健康福祉\n\n（一）保障超大城市公共卫生安全"}, {"docId": 2097637769459650561, "chunkIndex": 24, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "六、优化住房供应体系，实现更高水平住有所居", "text": "病专科等医疗合作，探索开展省级医检互认信息化平台协作。深化鲁渝合作，强化医疗援藏、援疆。\n\n六、优化住房供应体系，实现更高水平住有所居\n\n（一）提高住房保障水平\n优化保障性住房供给和服务。坚持货币与实物、配租与配售相结合，通过存量改造、收购转化等方式优化保障性住房供给。试点开展房源统筹使用，增加配租型保障性住房供应。建立配售型保障性住房封闭体系流转机制，支持有条件的家庭申购配售型保障性住房。强化保障性住房政策向城镇低收入家庭、新市民、青年人和多子女家庭倾斜。优化租赁补贴申请流程，适时适度调整补贴标准。\n\n推动超大体量公租房可持续发展。强化公租房小区教育、医疗、养老、托育、商业等配套功能，有序推进电梯、管网、健身等设施设备更新改造。完善公租房小区物业服务评价和维护保养管理机制，引导居民参与设施维护、环境美化。探索发展保障性住房不动产投资信托基金，鼓励社会力量参与建设运营。打造住房保障综合服务平台，迭代升级公租房智慧化管理。\n\n（二）大力建设“好房子”“好小区”\n\n建设安全舒适绿色智慧的“好房子”。实施房屋品质提升工程，全产业链打造“好房子”，健全支持政策、技术导则和评价体系。培育“好房子”建造企业，推动建造模块化、装修定制化、全屋智能化，探索推广装配式建筑、绿色建材等。建立房屋安全体检、安全管理资金、质量安全保险等安全管理制度。"}, {"docId": 2097637769459650561, "chunkIndex": 15, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "四、实施就业优先战略，促进高质量充分就业", "text": "智能通识教育指南，实施人工智能赋能教师发展行动，探索打造“人工智能+”未来学校等。推动“高效办成一件事”，开发“惠学生”“数智强师”“数智校园”等综合应用场景。\n深化教育综合改革。推行中小学生全学段成长性评价，持续巩固“双减”成果，加强对“掐尖”“小升初”违规考试招生等问题的治理。稳妥推进中考改革，探索普通高中多元化录取机制。深化高考综合改革，实施高等职业教育对口招生考试改革。弘扬践行教育家精神，健全新时代师德师风建设长效机制，强化待遇保障。深入实施教师教育能力提升工程，培育一批巴渝优师，突出教师教书育人实绩考核。引导规范民办教育高质量发展。\n\n推动高水平教育开放合作。推动新加坡南洋理工大学、新西兰奥克兰大学等知名高校来渝合作，建设高水平中外合作办学机构和项目20个以上。推进“留学重庆”品牌建设，迭代升级市长奖学金“丝路项目”，推动来渝留学规模质量双提升。举办一批境外办学机构和项目，支持职教出海。推动西部陆海新通道沿线地区重点城市教育协同发展。\n\n四、实施就业优先战略，促进高质量充分就业\n\n（一）健全就业促进体制机制\n\n强化宏观政策就业协同。健全高质量充分就业指标体系，力争培育全国高质量充分就业示范地区5个以上。健全就业影响评估和监测预警机制，探索建立就业岗位调查制度，动态调整就业政策和储备应急政策，防范化解规模性失业风险。实施就业稳岗扩容提质行动，拓展数字经济、低空经济等就业新空间，实施中小微企业就业支持计划，促进城镇新增就业325万人以上。"}], "source": {"pairId": "p-30", "policyDocId": 2097637769459650561, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”社会发展规划（2026—2030年）》的通知", "interpretDocId": 2097637785519640577, "interpretTitle": "《重庆市“十五五”社会发展规划（2026—2030年）》印发 加强普惠性、基础性、兜底性民生建设，着力缩小地区差距、城乡差别", "interpretSection": "媒体视角", "docNumber": "渝府发〔2026〕17号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "重点任务", "answerQuote": "规划还明确了一系列重点任务——围绕构建全龄友好型社会、促进人口长期均衡发展，要共筑生育友好型社会，打造青年圆梦之城，建设老年友好型社会；围绕建设新时代教育强市、办好人民满意的教育，要实施新时代立德树人工程，促进基础教育公平优质发展，加快高等教育突破跃升，推动职业教育提质领跑，构筑高质量教育发展生态；围绕实施就业优先战略、促进高质量充分就业，要健全就业促进体制机制，更大力度促进重点群体就业，大力支持自主创业、灵活就业；围绕推进健康中国重庆行动、增进全民健康福祉，要保障超大城市公共卫生安全，加强优质高效智慧医疗服务供给，深化医药卫生体制改革，推进中医药传承创新发展，深化区域医疗开放合作；围绕优化住房供应体系、实现更高水平住有所居，要提高住房保障水平，大力建设“好房子”“好小区”，探索房地产发展新模式；围绕健全社会保障体系、夯实共同富裕基石，要健全社会保险制度，构建多层次医疗保障体系，完善社会救助与社会服务体系，加强退役军人服务保障，强化残疾人发展保障；围绕建设现代化体育强市、推动体育事业全面进步，要开展全民健身行动，提升竞技体育水平，丰富体育服务供给；围绕持续在发展中改善民生、增强公共服务均衡性和可及性，要稳步推进基本公共服务均等化，全域打造高品质生活服务圈，推进公共服务数智化改革，加强公共服务多元化保障。", "candidateChunks": [25, 18, 24, 26, 23, 15, 33, 8, 32, 19, 30, 34], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-30-2", "category": "pair", "question": "重庆十五五规划里人均预期寿命和基层诊疗量占比目标是多少？", "answer": "人均预期寿命达80.5岁，基层医疗卫生机构诊疗量占比预期不低于60%。", "expectRefusal": false, "gold": [{"docId": 2097637769459650561, "chunkIndex": 2, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "基层医疗卫生机构诊疗量占比\n% \n54.38\n≥60\n预期性", "text": "\n3\n\n基本医疗保险参保率\n\n%\n\n≥98\n\n95左右\n\n约束性\n\n4\n\n职工养老保险参保人数占基本养老保险总人数比例\n\n%\n\n58\n\n60\n\n预期性\n\n5\n失业保险参保人数\n\n万人\n\n672\n\n677\n\n预期性\n\n6\n\n残疾人两项补贴覆盖率\n\n%\n\n100\n\n100\n\n约束性\n\n均衡性\n\n7\n\n城乡居民人均可支配收入比\n\n—\n\n2.21∶1\n\n2.1∶1\n\n左右\n\n预期性\n\n8\n\n城乡居民最低生活保障平均标准比\n\n—\n\n1.22\n\n≤1.2\n\n预期性 030年）》印发", "interpretSection": "媒体视角", "docNumber": "渝府发〔2026〕17号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "百万亩级战略储备", "answerQuote": "建设道地中药材优势产区和百万亩级中药材战略储备基地，提质扩能重庆中医药科技产业园等园区。", "candidateChunks": [23, 6, 15, 32, 14, 17, 10, 33, 0, 16, 29, 31], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-01", "category": "docnum", "question": "渝府发〔2026〕11号 这份文件是关于什么内容的？", "answer": "即《重庆市推进政务服务全面通办实施方案》。“高效办成一件事”部署和数字重庆建设要求，推动政务服务全要素集成、全流程闭环、全场景实战，加快从基本能力向全面通办体系能力跃升，制定本实施方案。", "expectRefusal": false, "gold": [{"docId": 2097637768037781505, "chunkIndex": 1, "why": "重庆市推进政务服务全面通办实施方案 正文开头", "quote": "", "text": "“高效办成一件事”部署和数字重庆建设要求，推动政务服务全要素集成、全流程闭环、全场景实战，加快从基本能力向全面通办体系能力跃升，制定本实施方案。\n\n一、总体要求\n坚持集约高效、整体规划，紧紧围绕线上全程网办、线下全渝通办提质增效，依法依规推进政务服务事项下沉，迭代优化网上办、跨域办、预约办、一门办、集成办、帮代办等服务场景，坚决防治和纠正政务服务中的“面子工程”，加快形成市、区县、乡镇（街道，以下统称乡镇）三级高效协同、全面通办的政务服务体系能力。\n\n二、推动政务服务事项下沉，全面统一标准规范\n\n（一）优化办理层级。坚持依法、合理、就近、便民原则，将程序较简单、基层可承接、审批风险低的涉企政务服务事项下沉区县、个人事项下沉乡镇。其中，多层级行使的事项原则上由下级行政机关行使，只能由市级审批的事项原则上委托区县收件。下级初审、上级审批的事项，企业群众向下级行政机关提出申请，申请材料和相关信息由行政机关内部流转，防止让企业群众多头跑。坚持依法办理，加强对已下沉事项的跟踪指导，防止违规降低审批标准。\n\n（二）加强同源管理。适时修订《重庆市政务服务事项管理办法》，以重庆市政务服务事项管理系统中的事项为唯一源头，落实市级部门对本行业领域事项设立、拆分、发布、实施、监督、评价、调整闭环管理责任，强化市、区县司法行政部门合法性审核责任，确保事项要素与法律法规规定一致、实际办理与办事指南一致、线上与线下办理一致、部门业务系统与“渝快办”平台标准一致。探索推进重庆市政务服务事项管理系统与法律法规规章等权威数据库关联。"}, {"docId": 2097637768037781505, "chunkIndex": 2, "why": "重庆市推进政务服务全面通办实施方案 正文开头", "quote": "", "text": "规规定一致、实际办理与办事指南一致、线上与线下办理一致、部门业务系统与“渝快办”平台标准一致。探索推进重庆市政务服务事项管理系统与法律法规规章等权威数据库关联。\n（三）规范办事指南。全面规范办理情形、受理条件、办理流程、申请材料、受理标准、需要提前知悉的特别要求等内容。制作简洁版办事指南，推动音视频、图文解读和事项名称通俗化表述，编制常见“问答对”，做到一次讲清、一看就懂、准确回应。编制标准统一、内容清晰的审查要点，确保准确受理、规范办理。加强办事指南发布前的审查，把好政治关、法律关、政策关、保密关、程序关。\n\n三、构建全面通办服务场景，更好实现“一次办成”\n\n（四）提质扩面网上办。除法律法规规定必须到现场办理、高度依赖现场检测环境办理外，推动更多事项全程网办，提供办理结果线上下载或通过邮政寄递送达等便利化服务。凡是能线上提交申请材料的，不得再要求邮寄纸质材料或到窗口提交。增强数据共享复用能力，原则上政府部门核发的材料免于提交、能够通过数据共享核验的事项免于提交证明材料、能够提供电子证照的免于提交实体证照，以减证便民“免证办”的更好实效，提高全程网办服务能级。"}], "source": {"pairId": "", "policyDocId": 2097637768037781505, "policyTitle": "重庆市人民政府关于印发《重庆市推进政务服务全面通办实施方案》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕11号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府发〔2026〕11号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-02", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕3号 文件的主要内容。", "answer": "即《重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施》。重庆市人民政府办公厅 2026年1月21日 （此件公开发布） 重庆市深化药品医疗器械监管改革 促进医药产业高质量发展若干措施 为深入贯彻《国务院办公厅关于全面深化药品医疗器械监管改革促进医药产业高质量", "expectRefusal": false, "gold": [{"docId": 2097637762941702145, "chunkIndex": 1, "why": "重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年1月21日\n\n（此件公开发布）\n\n重庆市深化药品医疗器械监管改革\n\n促进医药产业高质量发展若干措施\n为深入贯彻《国务院办公厅关于全面深化药品医疗器械监管改革促进医药产业高质量发展的意见》（国办发〔2024〕53号），持续深化药品医疗器械监管改革，聚焦培育生物医药新质生产力，推进创新药、高端医疗器械等全产业链系统创新，促进重庆生物医药产业高质量发展，制定如下措施。\n\n一、强化研发创新支撑\n\n1．建强药械创新平台。依托“渝药创新生态链”平台，集聚“政、产、学、研、用”创新要素。发挥“智汇攻关”数字化平台作用，谋划建设重大科技创新基地，围绕创新药、智慧医疗装备等领域打造一批市级重点实验室、技术创新中心、产业重大平台。（牵头单位：市药监局；责任单位：市科技局、市经济信息委、市卫生健康委）\n\n2．加强药械产品研发。引导支持科研院所、高校、医疗机构、科技企业等补位药品医疗器械创新赛道、申报国家级药品医疗器械科研项目、牵头重大（重点）科技专项。制定创新培源项目清单，对在创新赛道中具有国际国内影响力、关键技术创新突破、临床应用价值的在研项目，靠前对接、精准支持。加快推进金凤实验室干细胞药物质量评价研究，提升干细胞药物质量控制水平。（牵头单位：市科技局；责任单位：市经济信息委、市卫生健康委、市药监局、金凤实验室）"}, {"docId": 2097637762941702145, "chunkIndex": 2, "why": "重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施 正文开头", "quote": "", "text": "准支持。加快推进金凤实验室干细胞药物质量评价研究，提升干细胞药物质量控制水平。（牵头单位：市科技局；责任单位：市经济信息委、市卫生健康委、市药监局、金凤实验室）\n3．促进中药传承创新转化。加强“渝十味”等省级中药饮片炮制规范研究，推动将其纳入国家药品标准体系。鼓励研发机构和企业以临床价值为导向，积极运用新技术、新工艺等进行创新改良，实现中药大品种的二次开发；支持古代经典名方、珍稀濒危中药材替代品研究及成果转化。鼓励医疗机构强化临床有效经方验方向中药制剂转化，探索人用经验规范收集整理机制，强化临床用药经验与新药研发桥接，推动中药新药注册申报。支持中医药高等院校、科研院所开展科技成果“以权代股”改革试点。（牵头单位：市卫生健康委；责任单位：市科技局、市药监局）\n\n4．健全知识产权保护机制。探索建立企业与科研机构之间的专利转化保障机制、知识产权快速维权机制。支持企业加快药品医疗器械原创性成果专利布局，提升专利质量。建设运营重庆生物医药产业知识产权运营中心，促进生物医药产业知识产权转化运用。（牵头单位：市知识产权局；责任单位：市发展改革委、市药监局）"}], "source": {"pairId": "", "policyDocId": 2097637762941702145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕3号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕3号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-03", "category": "docnum", "question": "文号 渝府办发〔2026〕36号 对应的政策文件，主要规定了哪些方面？", "answer": "即《重庆市建立健全长期护理保险制度实施方案》。为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。", "expectRefusal": false, "gold": [{"docId": 2097637769677754370, "chunkIndex": 1, "why": "重庆市建立健全长期护理保险制度实施方案 正文开头", "quote": "", "text": "\n为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大和二十届历次全会精神，全面贯彻落实习近平总书记视察重庆重要讲话重要指示精神，认真贯彻落实市委六届历次全会精神，逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系，加快建立与重庆经济社会发展相协调的覆盖全民、统筹城乡、公平统一、安全规范、可持续的长期护理保险制度。2026年，我市长期护理保险继续覆盖参保职工，并启动居民长期护理保险筹资，与居民医保集中筹资同步。2027年，按国家规定调整职工筹资标准和待遇标准，城乡居民按规定开始享受长期护理保险待遇。2028年及以后，不断健全责任共担的资金筹集机制、公平适度的待遇保障机制和科学规范的管理运行机制，更好满足失能人员长期护理基本保障需求，不断增强人民群众的获得感、幸福感、安全感。\n\n二、参保筹资\n\n职工和居民参加基本医疗保险时同步参加长期护理保险，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资"}, {"docId": 2097637769677754370, "chunkIndex": 2, "why": "重庆市建立健全长期护理保险制度实施方案 正文开头", "quote": "", "text": "，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资\n1．单位职工。由用人单位和职工个人共同缴费，与城镇职工基本医疗保险（以下简称职工基本医保）费同步缴纳。费率为0.3%，缴费基数与职工基本医保缴费基数保持一致，用人单位和个人按同比例分担，各承担0.15%的缴费费率。2027年，用人单位承担部分从职工基本医保费率（含生育保险费率）8.5%中平移，职工基本医保单位费率（含生育保险费率）由8.5%调整为8.35%。\n\n2．退休人员。缴费费率为0.15%，缴费基数为本人基本养老金，由个人按规定缴费，原用人单位不缴费。\n\n3．以个人身份参加职工医保人员。缴费费率为0.3%，缴费基数为我市上年度在职职工基本医保实际平均缴费基数，由个人按规定缴费。\n\n职工医保个人账户可以用于本人及近亲属（包括配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女）参加长期护理保险的个人缴费。\n\n（二）居民筹资\n\n1．按年筹集资金，与城乡居民基本医疗保险费同步缴纳。缴费基数为全市上年度城乡居民人均可支配收入；2027年度参保缴费费率减半，从0.15%起步，每年增加0.03个百分点，用5年时间过渡到0.3%；缴费由个人和政府按1∶1分担。18周岁以下居民跟随父母或其他法定抚养人等参保，不单独筹资，符合待遇享受条件的，按居民待遇标准享受待遇；孤儿、事实无人抚养儿童等无法跟从参保的，视同参保。"}], "source": {"pairId": "", "policyDocId": 2097637769677754370, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建立健全长期护理保险制度实施方案》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕36号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕36号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-04", "category": "docnum", "question": "渝府办发〔2026〕23号 这份文件是关于什么内容的？", "answer": "即《印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知》。关于印发2025年度重庆市经济建设领域 改革发展最佳实践案例的通知 渝府办发〔2026〕23号 各区县（自治县）人民政府，市政府各部门，有关单位： 2025年，全市各级各部门坚持以习近平新时代中国特色", "expectRefusal": false, "gold": [{"docId": 2097637767274418178, "chunkIndex": 1, "why": "印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知 正文开头", "quote": "", "text": "\n关于印发2025年度重庆市经济建设领域\n\n改革发展最佳实践案例的通知\n\n渝府办发〔2026〕23号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n2025年，全市各级各部门坚持以习近平新时代中国特色社会主义思想为指导，深入学习贯彻党的二十大、二十届历次全会精神和习近平总书记视察重庆重要讲话重要指示精神，聚焦做实“两大定位”、发挥“三个作用”，完整准确全面贯彻新发展理念，积极服务融入新发展格局，迎难而上、实干争先，推动全市经济发展顶压前行、向新向好，涌现出一批勇于创新、卓有成效的典型经验做法。根据《重庆市改革发展最佳实践案例选树推广办法》，经市选委会同意，确定《实施软件和信息服务业高质量发展“满天星”行动》等15个案例为2025年度重庆市经济建设领域改革发展最佳实践案例，现印发给你们，请结合实际认真学习借鉴。\n\n重庆市人民政府办公厅\n\n重庆市发展和改革委员会\n\n2026年5月5日\n\n（本文有删减）\n\n2025年度重庆市经济建设领域改革发展\n\n最佳实践案例\n\n一、最佳案例（10个）"}, {"docId": 2097637767274418178, "chunkIndex": 2, "why": "印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知 正文开头", "quote": "", "text": "\n重庆市发展和改革委员会\n\n2026年5月5日\n\n（本文有删减）\n\n2025年度重庆市经济建设领域改革发展\n\n最佳实践案例\n\n一、最佳案例（10个）\n1．实施软件和信息服务业高质量发展“满天星”行动。建立楼宇、企业、项目、人才、活动、宣传6本台账，迭代完善评价体系，实施“赛马比拼”和典型案例复盘机制。中心城区“一把手”挂帅，市区两级聚焦关键环节精准施策，开放应用场景，梯度培育企业，盘活存量楼宇，校企联动培养人才，形成市区联动、部门协同、政企互动、齐抓共管的工作格局，合力推动软信产业发展。产业规模从2021年的2824亿元跃升至2025年的5017.8亿元，进入全国第一方阵，成为“33618”现代制造业集群体系中首个完成既定目标的支柱产业。\n\n牵头单位：市经济信息委\n\n协同单位：市政府办公厅、市发展改革委、市教委、市科技局、市财政局、市人力社保局、市大数据发展局\n\n2．实施“满园扩园”行动打造千亿级智能网联新能源汽车产业集群。沙坪坝区以赛力斯汽车为链主，实施“满园扩园”行动，推进区域全员招商、深化链群融合，构建“整车+零部件+后市场”全产业链。2025年，招商落地汽车零部件企业62家，其中世界百强企业4家、上市企业13家，新增产能400亿元；出让土地21宗、1350亩，居中心城区第1。新培育规上企业17家、规上企业数量同比增长38%，汽车零部件产值增速达25.5%，赛力斯本地配套率跃升至46%，形成“500亿整车+500亿零部件”产业格局。\n\n牵头单位：沙坪坝区\n\n协同单位：市政府办公厅、市经济信息委"}], "source": {"pairId": "", "policyDocId": 2097637767274418178, "policyTitle": "重庆市人民政府办公厅 重庆市发展和改革委员会关于印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕23号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕23号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-05", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕5号 文件的主要内容。", "answer": "即《印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知》。重庆市人民政府办公厅 2026年2月4日 （此件公开发布） 重庆市支持食品及农产品加工产业 高质量发展新十条政策 一、支持农村一二三产业融合发展 支持农村一二三产业融合发展，对成功创建国家级现代农业产", "expectRefusal": false, "gold": [{"docId": 2097637763717648386, "chunkIndex": 1, "why": "印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 2, "why": "印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知 正文开头", "quote": "", "text": "\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。\n牵头单位：市财政局\n\n责任单位：市农业农村委\n\n五、支持对种养业主农业保险保费补贴\n\n支持符合条件的食品及农产品加工原辅料基地种养业主依法依规参与政策性农业保险，给予最高不超过85%的保费补贴。\n\n牵头单位：市财政局\n\n责任单位：市农业农村委、重庆金融监管局\n\n六、支持冷链物流体系建设\n\n支持区域冷链物流基地标准化、智慧化改造及配套设施设备投入，按照不超过实际有效投资额40%的标准，给予金额最高不超过1000万元的补助。支持农村冷链物流资源整合利用，提升运营效益。对家庭农场、农民合作社、供销合作社、邮政快递企业、产业化龙头企业在农村建设的冷链物流仓储设施用电执行农业生产用电价格。支持布局农村冷链物流揽货点、前置仓，有效降低食品及农产品加工产业冷链物流成本。\n\n牵头单位：市政府口岸物流办\n\n责任单位：市商务委、市农业农村委、市发展改革委\n\n七、支持企业数字化、智能化转型"}], "source": {"pairId": "", "policyDocId": 2097637763717648386, "policyTitle": "重庆市人民政府办公厅关于印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕5号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕5号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-06", "category": "docnum", "question": "文号 渝府发〔2026〕23号 对应的政策文件，主要规定了哪些方面？", "answer": "即《重庆市“十五五”美丽重庆建设规划（2026—2030年）》。设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。", "expectRefusal": false, "gold": [{"docId": 2097637769845526529, "chunkIndex": 1, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年） 正文开头", "quote": "", "text": "设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深学笃行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，认真落实习近平总书记视察重庆重要讲话重要指示精神，按照市委六届历次全会工作部署，紧扣做实“两大定位”、发挥“三个作用”，牢固树立和践行“绿水青山就是金山银山”理念，全面落实精准科学依法治污方针，协同推进降碳、减污、扩绿、增长，以“九治”为牵引推进污染防治攻坚和生态系统优化，深化改革创新和数智赋能双轮驱动，推动经济社会发展全面绿色转型，提供更多优质生态产品以满足人民日益增长的美好生活需要，为奋力谱写中国式现代化重庆篇章提供有力支撑。\n\n到2030年，美丽重庆建设取得新的重大进展，川渝地区美丽中国先行区基本建成。长江干流重庆段水质稳定保持在Ⅱ类，城乡黑臭水体保持动态清零，细颗粒物（PM2.5）浓度持续下降，基本消除重污染天气，主要污染物排放总量持续减少，生态系统多样性稳定性持续性不断提升，山水都市风貌整体大美全面彰显，碳达峰目标如期实现，绿色生产生活方式基本形成，适应美丽重庆建设的生态环境治理体系不断健全，打造一批“西部领先、全国进位和重庆辨识度”的标志性成果，全面筑牢长江上游重要生态屏障。到2035年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。"}, {"docId": 2097637769845526529, "chunkIndex": 2, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年） 正文开头", "quote": "", "text": "5年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。\n“十五五”时期建设省域美丽中国先行区的总体布局：\n\n——加快建设各美其美的美丽城市和美丽乡村。以绿色低碳、环境优美、生态宜居、安全健康、智慧高效为导向，差异化、特色化推进美丽城市建设，塑造都市风貌展示区、美丽廊道、区县城特色风貌名片，纳入市级美丽城市培育的区县占比达到60%。立足农村人居环境改善、农业绿色低碳发展、乡村风貌品质提升，梯次分类推进具有巴渝韵味的美丽乡村建设，美丽乡村整县建成比例达到60%。\n\n——全面推进“美丽系列”建设。加快实施美丽河湖保护与建设行动，推进幸福河湖建设，建成美丽河湖45个（段）、幸福河湖400条（个）。深化生态文明建设示范区、“绿水青山就是金山银山”实践创新基地和生态工业园区、零碳园区、零碳工厂建设，提质建设全域“无废城市”。鼓励园区、企业、社区、学校、医院等开展“美丽+”特色模式探索。\n\n专栏1  “十五五”美丽重庆建设主要指标\n\n序号\n\n类别\n\n指标\n\n单位\n\n2025年\n\n2030年\n\n目标值\n\n指标\n\n属性\n\n1\n\n环境质量改善\n\n63个地表水国控断面优良水体比例\n\n%\n\n85.7\n\n93.7\n\n约束性\n\n2\n\n63个地表水国控断面达到或优于Ⅲ类水质比例\n\n%\n\n93.7\n\n96.8\n\n预期性\n\n3\n\n中心城区城市生活污水集中收集率\n\n%\n\n88.3\n\n≥90.0\n\n预期性\n\n4\n\n细颗粒物（PM2.5）浓度\n\n微克/立方米\n\n33.5*"}], "source": {"pairId": "", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府发〔2026〕23号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-07", "category": "docnum", "question": "渝府办发〔2026〕8号 这份文件是关于什么内容的？", "answer": "即《重庆市推进城市全域数字化转型行动计划》。2026年2月10日 （此件公开发布） 重庆市推进城市全域数字化转型行动计划 为推动数据赋能城市高质量发展，特制定本行动计划。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划 正文开头", "quote": "", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 2, "why": "重庆市推进城市全域数字化转型行动计划 正文开头", "quote": "", "text": "量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。\n（二）提质网络通道。扩容重庆国家级互联网骨干直联点，推进5G-A（第五代移动通信技术演进版）升级、6G（第六代移动通信技术）研发应用、IPv6（互联网协议第6版）规模部署，用好中新（重庆）国际互联网数据专用通道，提升工业互联网基础设施能力，完善政务网络带宽监测调配机制，加快建设国家区块链网络（西南）枢纽节点。深化基于电子政务外网和视联网的“一网两线”政务网建设。积极参与空天地网络融合设施建设，鼓励区县承接试点。\n\n（三）强化算力协同。提质建设全国一体化算力网络成渝国家枢纽节点，加快建设重庆数据中心集群，深入实施“疆算入渝”工程，推动低效数据中心节能降碳改造，探索算力电力协同布局，迭代升级国家（西部）算力调度平台，夯实拓展算力“一朵云”。\n\n（四）推进AI赋能。优化数字重庆人工智能底座，培育建设一批政府侧、行业侧高质量数据集。强化大模型和智能体“一本账”统筹管理，统一部署语言、视觉、多模态等通用大模型，迭代超大城市治理大模型，提速打造汽车行业等垂类大模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。"}], "source": {"pairId": "", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕8号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-08", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕41号 文件的主要内容。", "answer": "即《重庆市“十五五”文化旅游发展规划（2026—2030年）》。重庆市人民政府办公厅 2026年8月5日 （本文有删减） 重庆市“十五五”文化旅游发展规划 （2026—2030年） 为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五", "expectRefusal": false, "gold": [{"docId": 2097637770155905026, "chunkIndex": 1, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年） 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年8月5日\n\n（本文有删减）\n\n重庆市“十五五”文化旅游发展规划\n\n（2026—2030年）\n为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五”规划》（文旅资源发〔2026〕42号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，全面落实习近平总书记视察重庆重要讲话重要指示精神，紧扣做实“两大定位”、发挥“三个作用”，坚持以文塑旅、以旅彰文，突出创新引领、数智赋能、改革突破、开放协同，持续做靓“雄奇山水 新韵重庆”品牌，加快打造巴蜀文化旅游走廊标志性成果，提质建设具有国际范、中国韵、重庆味的文化旅游强市，为奋力谱写中国式现代化重庆篇章注入强劲文旅动能。到2030年，文化旅游强市建设取得显著进展，文化旅游惠民生、扩内需、增动能综合效能全面释放，赋能经济社会高质量发展铸就新篇章。\n\n——巴蜀文化旅游走廊建设实现新提升。平台联通、标准互认、品牌同塑、项目共建等协同联动机制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。"}, {"docId": 2097637770155905026, "chunkIndex": 2, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年） 正文开头", "quote": "", "text": "制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。\n——产业发展能级实现新跃升。文旅产业成为国民经济支柱产业，文化及相关产业增加值等主要经济指标进入全国前列，为全国文化旅游高质量发展提供重庆案例。\n\n——文旅深度融合迈出新步伐。文旅市场、产品、业态、场景等领域实现全链条融合，在特色场景营造、新业态培育、现象级消费引流等方面形成区域领先优势。\n\n——高质量便利服务再上新台阶。覆盖全域、便捷高效、安全舒适的现代文旅公共服务体系构建形成，游客综合满意度持续保持全国前列，主客共享的文旅氛围更加浓厚，“最宠游客城市”形象深入人心。\n\n——文化繁荣发展构筑新图景。巴渝文化标识体系全面完善，文艺“攀峰登顶”之作不断涌现，文化遗产保护传承更加有力，文化软实力成为城市发展核心竞争力。\n\n——对外开放合作取得新突破。“雄奇山水 新韵重庆”品牌国际影响力持续攀升，内外联动的文旅交流合作平台日臻完善，入境便利化水平显著提升，打造我国内陆入境游首选地。\n\n——数智全域赋能形成新范式。数智文旅体系能力构建形成，人工智能与数据要素赋能文旅全域发展，重点文旅场所数字化转型基本完成，数智文旅多项创新实践成为全国可复制、可推广的典型经验。\n\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局"}], "source": {"pairId": "", "policyDocId": 2097637770155905026, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市“十五五”文化旅游发展规划（2026—2030年）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕41号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕41号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "B-09", "category": "docnum", "question": "文号 渝府发〔2026〕12号 对应的政策文件，主要规定了哪些方面？", "answer": "即《公布重庆市第七批市级非物质文化遗产代表性项目名录的通知》。条例》有关规定，市政府批准重庆市第七批市级非物质文化遗产代表性项目名录（共计129项）和市级非物质文化遗产代表性项目名录扩展项目名录（共计13项），现予以公布。", "expectRefusal": false, "gold": [{"docId": 2097637768415268865, "chunkIndex": 1, "why": "公布重庆市第七批市级非物质文化遗产代表性项目名录的通知 正文开头", "quote": "", "text": "条例》有关规定，市政府批准重庆市第七批市级非物质文化遗产代表性项目名录（共计129项）和市级非物质文化遗产代表性项目名录扩展项目名录（共计13项），现予以公布。\n各区县政府、市级各部门、有关单位要深入学习贯彻习近平文化思想，坚持“保护为主、抢救第一、合理利用、传承发展”工作方针，扎实做好非物质文化遗产系统性保护工作，推动中华优秀传统文化创造性转化和创新性发展，为加快建设文化旅游强市提供有力支撑。\n\n附件：\n\n1．重庆市第七批市级非物质文化遗产代表性项目名录\n\n2．重庆市市级非物质文化遗产代表性项目名录扩展项目名录\n\n重庆市人民政府\n\n2026年6月15日\n\n（此件公开发布）\n\n附件1\n\n重庆市第七批市级非物质文化遗产\n\n代表性项目名录\n\n（共计129项）\n\n一、民间文学（2项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n1\n\nⅠ―32\n\n沙坪坝民间故事\n\n沙坪坝区\n\n2\n\nⅠ―33\n\n长寿民间故事\n\n长寿区\n\n二、传统音乐（4项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n3\n\nⅡ―106\n\n古琴艺术\n\n两江新区、大渡口区、沙坪坝区、北碚区、西部科学城重庆高新区\n\n4\n\nⅡ―107\n\n盐客调\n\n黔江区\n\n5\n\nⅡ―108\n\n华岩寺上江腔音乐\n\n九龙坡区\n\n6\n\nⅡ―109\n\n巫溪小调\n\n巫溪县\n\n三、传统舞蹈（2项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n7\n\nⅢ―55\n\n巴渝莲箫\n\n巴南区、巫山县、秀山土家族苗族自治县\n\n8\n\nⅢ―56\n\n石柱土家水龙\n\n石柱土家族自治县\n\n四、传统戏剧（1项）"}, {"docId": 2097637768415268865, "chunkIndex": 2, "why": "公布重庆市第七批市级非物质文化遗产代表性项目名录的通知 正文开头", "quote": "", "text": "\n7\n\nⅢ―55\n\n巴渝莲箫\n\n巴南区、巫山县、秀山土家族苗族自治县\n\n8\n\nⅢ―56\n\n石柱土家水龙\n\n石柱土家族自治县\n\n四、传统戏剧（1项）\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n9\n\nⅣ―29\n\n丰都木棒头戏\n\n丰都县\n\n五、传统体育、游艺与杂技（11项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n10\n\nⅥ―34\n\n岳家拳\n\n两江新区\n\n11\n\nⅥ―35\n\n子午拳术\n\n南岸区\n\n12\n\nⅥ―36\n\n四维拳\n\n开州区\n\n13\n\nⅥ―37\n\n字门拳\n\n梁平区\n\n14\n\nⅥ―38\n\n逍遥无极拳\n\n云阳县\n\n15\n\nⅥ―39\n\n克星掌\n\n云阳县\n\n16\n\nⅥ―40\n\n拦手门武术\n\n长寿区\n\n17\n\nⅥ―41\n\n三元门武术\n\n合川区\n\n18\n\nⅥ―42\n\n铜梁竞技龙\n\n铜梁区\n\n19\n\nⅥ―43\n\n高空绳技\n\n重庆杂技艺术团有限责任公司\n\n20\n\nⅥ―44\n\n爬杆\n\n重庆杂技艺术团有限责任公司\n\n六、传统美术（12项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n21\n\nⅦ―62\n\n巴渝木雕\n\n黔江区、合川区、丰都县\n\n22\n\nⅦ―63\n\n江津玉雕\n\n江津区\n\n23\n\nⅦ―64\n\n永川核雕\n\n永川区\n\n24\n\nⅦ―65\n\n雕版拓印\n\n两江新区\n\n25\n\nⅦ―66\n\n掐丝珐琅\n\n渝中区\n\n26\n\nⅦ―67\n\n抛沙画\n\n长寿区\n\n27\n\nⅦ―68\n\n忠州葫芦刻烙画\n\n忠县\n\n28\n\nⅦ―69\n\n彩墨画\n\n忠县\n\n29\n\nⅦ―70\n\n蚕丝画\n\n奉节县\n\n30\n\nⅦ―71\n\n青年镇木刻版画"}], "source": {"pairId": "", "policyDocId": 2097637768415268865, "policyTitle": "重庆市人民政府关于公布重庆市第七批市级非物质文化遗产代表性项目名录的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕12号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府发〔2026〕12号", "answerQuote": "", "candidateChun   const s = state[d.id] || {};
  const q = s.q ?? d.question, a = s.a ?? d.answer;
  let html = `<div class="card"><h3>问题 · ${d.id} · <span class="tag t-${d.category}">${d.category}</span></h3>
    <textarea id="eq" rows="2">${esc(q)}</textarea></div>`;
  html += `<div class="card"><h3>标准答案</h3><textarea id="ea" rows="3">${esc(a)}</textarea></div>`;
  if(d.gold && d.gold.length){
    html += `<div class="card"><h3>证据 chunk（${d.gold.length}）</h3>` +
      d.gold.map(g=>`<div class="chunk"><div class="h">docId ${g.docId} · chunkIndex ${g.chunkIndex} · ${esc(g.why||'')}</div>
        <div class="t">${hl(g.text||'', g.quote)}</div></div>`).join('') + `</div>`;
  } else if(d.category === 'unanswerable'){
    html += `<div class="card"><h3>预期</h3><div class="a">系统应当拒答（知识库无此内容）</div>
      <div class="meta">库外依据：<b>${esc(d.meta.outOfScopeReason||'')}</b></div></div>`;
  } else if(d.category === 'permission'){
    html += `<div class="card"><h3>权限对照</h3><div class="a">非成员账号检索必须 0 命中；成员账号应能命中（镜像题 ${esc(d.meta.mirrorOf||'')}）</div>
      <div class="meta">目标空间 <b>${d.permission.targetSpaceId}</b> · 禁止文档 <b>${d.permission.forbiddenDocIds.join(', ')}</b><br>
      成员 ${d.permission.memberUserIds.length} 人 · 非成员账号 ${d.permission.nonMemberUserIds.length} 个</div></div>`;
  }
  html += `<div class="card"><h3>元信息</h3><div class="meta">
    来源政策：<b>${esc(d.source.policyTitle||'')}</b><br>
    文号：<b>${esc(d.source.docNumber||'-')}</b> ｜ 解读篇：<b>${esc(d.source.interpretTitle||'-')}</b><br>
    qType：${esc(d.meta.qType||'')} ｜ 关键术语：${esc(d.meta.evidenceKey||'-')} ｜ 生成：${esc(d.meta.generatedBy||'')}
    </div></div>`;
  html += `<div class="card"><h3>操作</h3><div class="actions">
    <button class="keep" onclick="act('kept')">保留 (K)</button>
    <button class="drop" onclick="act('dropped')">删除 (D)</button>
    <button onclick="act('pending')">待定 (P)</button>
    <span style="color:var(--muted)">当前状态：<b class="st-${st(d.id)}">${st(d.id)}</b></span></div>
    <textarea class="note" id="en" rows="2" placeholder="备注（可选）：为什么删／怎么改">${esc(s.note||'')}</textarea>
    <div class="meta" style="margin-top:6px">快捷键 <span class="kbd">K</span> 保留 ·
      <span class="kbd">D</span> 删除 · <span class="kbd">←</span> <span class="kbd">→</span> 切换</div></div>`;
  document.getElementById('main').innerHTML = html;
}
function sync(){
  const d = view[cur]; if(!d) return;
  state[d.id] = state[d.id] || {};
  const eq = document.getElementById('eq'), ea = document.getElementById('ea'), en = document.getElementById('en');
  if(eq) state[d.id].q = eq.value;
  if(ea) state[d.id].a = ea.value;
  if(en) state[d.id].note = en.value;
  save();
}
function act(s){
  const d = view[cur]; if(!d) return;
  sync();
  state[d.id].st = s;
  save();
  if(cur < view.length - 1) nav(1); else render();
}
function exportJson(){
  sync();
  const out = DATA.filter(d => st(d.id) === 'kept').map(d=>{
    const s = state[d.id] || {};
    const o = JSON.parse(JSON.stringify(d));
    if(s.q) o.question = s.q;
    if(s.a) o.answer = s.a;
    o.meta.reviewState = 'kept';
    o.meta.reviewNote = s.note || '';
    o.gold.forEach(g=>{ delete g.text; });
    return o;
  });
  const dropped = DATA.filter(d => st(d.id) === 'dropped').length;
  const pending = DATA.filter(d => st(d.id) === 'pending').length;
  const blob = new Blob([out.map(o=>JSON.stringify(o)).join('\n') + '\n'], {type:'application/jsonl'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'golden.v1.jsonl';
  a.click();
  alert(`导出 ${out.length} 题（已删除 ${dropped}，仍待定 ${pending}）`);
}
function resetAll(){ if(confirm('确认清空全部筛选进度？')){ state = {}; save(); render(); } }
document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.target?.tagName || e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if(k==='k') act('kept'); else if(k==='d') act('dropped'); else if(k==='p') act('pending');
  else if(e.key==='ArrowLeft') nav(-1); else if(e.key==='ArrowRight') nav(1);
});
// 分类下拉
const cats = [...new Set(DATA.map(d=>d.category))];
document.getElementById('fcat').innerHTML = '<option value="">全部分类</option>' +
  cats.map(c=>`<option value="${c}">${c} (${DATA.filter(d=>d.category===c).length})</option>`).join('');
render();
</script>
</body>
</html>
