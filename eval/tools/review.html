ggest": [], "suggestDocId": 2097637762580992002, "fixable": false, "hint": ""}}, {"id": "A-p-01-2", "category": "pair", "question": "如果邻省发生地震，距离重庆多远且震级多少时，重庆会启动应急响应研判？", "answer": "邻省距我市边界300公里内7.0级以上、100公里内6.0级以上、或50公里内5.0级以上地震时，作为响应研判条件。", "expectRefusal": false, "gold": [{"docId": 2097637762580992002, "chunkIndex": 19, "why": "重庆市地震应急预案", "quote": "当震中距离我市行政边界300公里范围内发生7.0级以上地震，或震中距离我市行政边界100公里范围内发生6.0级以上地震，或震中距离我市行政边界50公里范围内发生5.0级以上地震时", "text": "\n国网重庆电力加强电力基础设施、电力调度系统建设，保障抢险救援现场应急装备的临时供电需求和灾区电力供应。\n市公安局、市交通运输委、重庆海事局、重庆铁路办事处、民航重庆监管局等部门（单位）协调建立公路、铁路、航空、水运应急运输保障体系，加强统一指挥调度，并采取必要的交通管制措施，建立应急救援“绿色通道”机制。\n\n7  其他地震事件的应急处置\n\n7.1  强有感地震事件应急处置\n\n当我市行政区域内发生强有感地震事件并可能产生较大社会影响时，重庆地震局加强震情趋势研判，提出应对处置建议；震中所在区县政府或其抗震救灾指挥机构负责组织应对处置工作，市地指办指导、协调相关工作。主要采取以下措施：\n\n（1）重庆地震局及时向市委、市政府报告地震速报信息，并通报市应急管理局和有关部门（单位）。\n\n（2）市地指办收集相关情况报告市政府，并通报有关部门（单位）。\n\n（3）区县政府或其抗震救灾指挥机构组织做好信息收集、群众安抚、信息发布等工作，维护社会稳定。\n\n7.2  行政区域外地震事件应急处置\n\n当震中距离我市行政边界300公里范围内发生7.0级以上地震，或震中距离我市行政边界100公里范围内发生6.0级以上地震，或震中距离我市行政边界50公里范围内发生5.0级以上地震时，市地指组织应对。主要采取以下措施：\n\n（1）重庆地震局分析地震对我市的影响程度，研判我市境内最高地震烈度，及时报告市委、市政府，并通报市应急管理局和有关部门（单位）。"}], "source": {"pairId": "p-01", "policyDocId": 2097637762580992002, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市地震应急预案》的通知", "interpretDocId": 2097637772127227906, "interpretTitle": "《重庆市地震应急预案》文字解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2025〕66号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "响应研判条件", "answerQuote": "邻省发生地震距离我市行政边界300公里范围内发生7.0级以上地震...作为响应研判条件", "candidateChunks": [19, 7, 10, 11, 8, 9, 18, 13, 2, 5, 1, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案准确提取了邻省地震启动响应的距离和震级阈值，但仅标注了触发条件所在的段落[19]，未包含后续关于‘按程序启动应急响应’的具体执行动作段落[20]，导致证据链在‘启动响应’这一动作上略显单薄。", "suggestion": "将段落 [20] 补充标记为 ★ 证据，以完整覆盖从‘满足研判条件’到‘实际启动应急响应’的全过程依据。", "suggest": [{"chunkIndex": 20, "text": "\n（1）重庆地震局分析地震对我市的影响程度，研判我市境内最高地震烈度，及时报告市委、市政府，并通报市应急管理局和有关部门（单位）。\n（2）市地指办收集相关情况报告市政府，根据对我市造成的影响，组织开展应对处置工作。必要时，按程序启动应急响应。\n\n（3）受影响区县政府或其抗震救灾指挥机构组织做好信息收集、群众安抚、信息发布等工作，维护社会稳定。\n\n（4）市地指成员单位按照职能职责，组织开展本行业、本领域应对处置工作，并及时向市地指办通报有关情况。\n\n（5）当其他省（自治区、直辖市）受灾严重，需要我市支援时，按照国务院抗震救灾指挥机构的安排部署或根据受灾省（自治区、直辖市）政府的请求，由市地指组织有关成员单位开展救援救助工作。\n\n8  预案管理\n\n8.1  预案编制\n\n市应急管理局会同有关部门（单位）制定本预案，报市政府同意后发布实施。区县政府制定本行政区域地震应急预案，报市应急管理局备案。市、区县政府有关部门（单位）根据自身职能制定地震应急预案或包括抗震救灾内容的应急预案，按规定备案。乡镇（街道）、开发区等根据实际情况制定地震应急预案或包括抗震救灾内容的应急预案，按规定备案。交通、水利、电力、通信、市政等基础设施和学校、医院等人员密集场所的经营管理单位，以及可能发生次生灾害的矿山、油（气）田、石油化工等危险物品生产储运经营单位制定地震应急预案或包括抗震救灾内容的应急预案，按规定备案。\n\n8.2  预案修订\n\n市应急管理局会同市级有关部门（单位）根据实际情况适时修订完善本预案。\n\n8.3  宣传、培训与演练"}], "suggestDocId": 2097637762580992002, "fixable": true, "hint": ""}}, {"id": "A-p-02-1", "category": "pair", "question": "重庆市推进空中丝绸之路建设实施方案主要包含哪些方面的支持措施？", "answer": "方案围绕民航基础设施“硬联通”、规则标准“软联通”和人文交流“心联通”，提出五个部分14条举措，涵盖提升运行效率、构建综合交通体系、提高通关便利化、壮大航空产业集群及促进国际经贸合作与人文交流。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 1, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作", "text": "\n（此件公开发布）\n\n重庆市推进空中丝绸之路建设实施方案\n\n为奋力打造内陆开放综合枢纽，加快推进重庆空中丝绸之路建设，制定本实施方案。\n\n一、总体目标\n深入对接六大国际经济合作走廊，以新亚欧大陆桥经济走廊、中国—中南半岛经济走廊为重点，推进我市与阿姆斯特丹、法兰克福、布达佩斯、新加坡、吉隆坡、曼谷、河内等重点城市共建空中丝绸之路，完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作，为深度融入共建“一带一路”高质量发展、加快打造内陆开放综合枢纽提供重要支撑。\n\n到2027年，重庆空中丝绸之路建设取得阶段性成果，重点领域合作实现突破，国际航空枢纽功能显著提升，在飞国际（地区）航线达到60条，年国际（地区）旅客、货邮吞吐量分别达到330万人次、22万吨。到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素"}, {"docId": 2097637762685849602, "chunkIndex": 2, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "二、进一步完善基础资源要素", "text": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素\n（一）完善机场基础设施。有序推进重庆江北国际机场（以下简称江北机场）西区提质改造，持续推进数字孪生机场建设，加强航空口岸指定监管场地硬件设施建设，实现前置拦截、查验作业、检疫处理、冷链暂存等环节标准化、信息化、智能化升级。推进重庆新机场项目前期工作。推动与空中丝绸之路共建城市的机场集团开展战略合作，促进规划建设、口岸环境、安全服务、运营管理等领域交流。探索与海外机场互设海外航空货站。（责任单位：重庆机场集团、市发展改革委、市交通运输委、市政府口岸物流办、重庆海关）\n\n（二）优化资源要素供给。深化空域资源动态利用，以数字化、智能化手段提升运行效率，强化多主体协同，实现“空域—地面—机场”联动。利用大数据、人工智能技术优化机场运行管理，实现对航班调度、资源分配的智能决策。积极推动江北机场增量时刻投入使用，适时启动新一轮时刻容量评估。围绕重点国际客货运中转通道，积极争取扩大“第五航权”覆盖范围。深化与航空枢纽运营人合作，创新战略协同机制，引导航空枢纽运营人加大运力投入，拓展空中丝绸之路航线网络，强化机务、维修等后勤保障。（责任单位：市交通运输委、市政府口岸物流办、重庆机场集团）\n\n三、进一步提升互联互通水平"}, {"docId": 2097637762685849602, "chunkIndex": 4, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "四、进一步提升口岸通关效能", "text": "链、电子产品等重点适航货物运输需求，布局国际货运航线网络，以“东南亚—重庆—欧美”为核心进一步提升航空物流中转效能。（责任单位：市政府口岸物流办、重庆机场集团）\n（五）构建综合交通运输体系。大力发展“民航+铁路”旅客运输服务，用好铁路枢纽东环线运力，研究论证将渝宜高铁引入江北机场，加快西渝高铁、渝宜高铁、渝万高铁项目建设，形成辐射广安、恩施等周边城市的综合交通网络。完善“民航+轨道”市内便捷出行体系，加快建设轨道交通15号线，畅通江北机场与重庆北站、重庆西站、重庆东站、科学城站的轨道交通连接。织密“民航+公路”运输网络，完善长途客运、旅游巴士等地面接驳服务体系。推动空中丝绸之路与西部陆海新通道、中欧班列、长江黄金水道协同构建“铁公水空”多式联运体系。（责任单位：市交通运输委、市发展改革委、市政府口岸物流办）\n\n四、进一步提升口岸通关效能\n\n（六）提升口岸服务能力。优化口岸营商环境，进一步发挥进境肉类、水果、食用水生动物、冰鲜水产品、植物种苗、药品等口岸功能，扩大与空中丝绸之路共建城市的进出口业务规模。积极实施外国人过境免签和外籍商务人员专项签证便利政策，启用贴纸式临时入境许可。推进江北机场口岸公共卫生核心能力建设，强化卫生检疫监管、突发公共卫生事件应对等领域联防联控，完善口岸应急处置措施及程序。（责任单位：市政府口岸物流办、市公安局、市商务委、重庆海关、重庆边检总站、重庆机场集团）"}, {"docId": 2097637762685849602, "chunkIndex": 7, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "六、进一步深化国际交往合作", "text": "制造研发平台，拓展生产作业、公共服务、旅游观光等应用场景。支持飞机采购租赁使用人民币结算。（责任单位：市经济信息委、市发展改革委、市交通运输委、人行重庆市分行）\n（十）提质升级临空经济。加快完善重庆临空经济示范区基础设施，建设航空制造、维修、租赁、培训等特色产业孵化载体，打造先进制造业核心区和现代服务业集聚区。大力发展航空租赁、航空维修、航空培训产业，培育百亿级“保税+租赁”新业态，打造中西部领先的一站式航空综合维修基地和航空人才培训基地。加强航空材料、航空发动机、机载系统等领域的研发与核心技术攻关。积极引进楼宇经济、商业综合体等高端商务项目，统筹江北机场及周边区域商业的一体化发展。加快建设中新（重庆）航空产业园、新加坡航空（重庆）保税航材分拨中心、木耳航空物流园等项目，加强项目落地服务保障。高质量编制重庆新机场临空经济区产业发展规划，加强与国土空间、综合交通、市政基础设施、生态建设等规划协同。更大力度吸引和利用外资，探索与空中丝绸之路共建城市开展国际产业合作。（责任单位：两江新区区政府、璧山区政府、市发展改革委、市经济信息委、市规划自然资源局、市商务委、重庆海关、重庆机场集团）\n\n六、进一步深化国际交往合作"}], "source": {"pairId": "p-02", "policyDocId": 2097637762685849602, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进空中丝绸之路建设实施方案》的通知", "interpretDocId": 2097637772185948161, "interpretTitle": "《重庆市推进空中丝绸之路建设实施方案》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2025〕64号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "五个部分、14条", "answerQuote": "《实施方案》围绕统筹推进民航基础设施“硬联通”、规则标准“软联通”和人文交流“心联通”，提出五个部分、14条工作举措", "candidateChunks": [1, 0, 5, 10, 2, 4, 7, 9, 8, 6, 3], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案概括了方案全貌（14条举措），但当前标注的证据段落仅覆盖了部分章节，缺失了关于提升航空客运/货运能级、通关便利化具体细节、航空装备制造及国际经贸合作等关键内容的原文支撑。", "suggestion": "补充标注段落 [3] (提升航空客运/货运能级), [5] (提高通关便利水平), [6] (发展低空物流/航空装备), [8] (深化国际经贸往来), [9] (促进文旅/智库交流)。这些段落共同构成了答案中提到的“五个部分14条举措”的具体内容依据。", "suggest": [{"chunkIndex": 3, "text": "运营人加大运力投入，拓展空中丝绸之路航线网络，强化机务、维修等后勤保障。（责任单位：市交通运输委、市政府口岸物流办、重庆机场集团）\n\n三、进一步提升互联互通水平\n（三）提升航空客运能级。加快构建辐射全球的国际客运航线网络，高频次通达伦敦、巴黎、马德里等欧洲主要城市，加密我市至新加坡、吉隆坡、曼谷等区域全面经济伙伴关系协定（RCEP）成员国家首都和大城市航线，稳定与迪拜、多哈等西亚重点城市的航线连接，探索建立与中东、北非等新兴市场的航线网络。打造东南亚—重庆—欧洲、华东—重庆—欧洲、华北—重庆—东南亚三大国际客运中转通道，优化东部沿海重点客源地区航线与欧洲航线衔接，织密通达新疆、西藏、云南等西部地区重点省市的航线网络，创新江北机场“5E+”（宜购、怡游、易行、壹宿、逸享）中转服务产品，提升国际中转保障效能。推动支线机场与枢纽机场协同发展，进一步发挥支线机场通航功能。（责任单位：市政府口岸物流办、市交通运输委、重庆机场集团）\n\n（四）拓展货运通道网络。打造“东南亚3小时、欧洲10小时、全球主要节点24小时”航空物流圈，以欧洲、东南亚等方向为重点，加密阿姆斯特丹、法兰克福等货运航线，争取开通布达佩斯、多伦多等货运航线，拓展北美、非洲等货运航线，提高国际客运航班腹舱载运率。结合生鲜冷链、电子产品等重点适航货物运输需求，布局国际货运航线网络，以“东南亚—重庆—欧美”为核心进一步提升航空物流中转效能。（责任单位：市政府口岸物流办、重庆机场集团）"}, {"chunkIndex": 5, "text": "疫监管、突发公共卫生事件应对等领域联防联控，完善口岸应急处置措施及程序。（责任单位：市政府口岸物流办、市公安局、市商务委、重庆海关、重庆边检总站、重庆机场集团）\n（七）提高通关便利水平。持续优化监管流程，实施机坪“空空直转”“空侧直通”等措施，强化“7×24小时”通关保障，开通特殊进口商品绿色通道，实现快验快放。积极对接国际通行规则，强化航空口岸高效通关制度创新。与空中丝绸之路共建城市在跨境数字人民币结算、离岸贸易、通关物流数据共享等方面开展合作。加快推进口岸智慧旅检建设，深入实施入境游口岸签“一网通办”。（责任单位：市政府口岸物流办、市公安局、市商务委、市文化旅游委、人行重庆市分行、重庆海关、重庆边检总站、重庆机场集团）\n\n五、进一步壮大航空产业集群\n\n（八）加快发展航空物流产业。深化与物流企业、货运航空公司的战略合作，打造覆盖航空快运、跨境电商、保税物流、高端冷链等产业的国际航空物流枢纽。探索在永川、万盛等地布局城市航空货站。鼓励引导货代企业、物流企业、跨境电商平台协同合作，提升高新技术设备及原材料、特定药品、生物制品、超大超重件等特殊货物运输服务能力。推动定制重庆始发、中转的航空运输服务，探索发展以重庆为供应链组织中心的“跨航司换单中转”“通单中转”等物流模式。强化支线机场货运集散功能，逐步释放支线机场低空物流潜力，探索开通大载重无人机货运示范航线。（责任单位：市政府口岸物流办、市交通运输委、重庆海关、重庆机场集团）"}, {"chunkIndex": 6, "text": "。强化支线机场货运集散功能，逐步释放支线机场低空物流潜力，探索开通大载重无人机货运示范航线。（责任单位：市政府口岸物流办、市交通运输委、重庆海关、重庆机场集团）\n（九）大力发展航空装备制造业。发展壮大先进金属材料、航空发动机、无人机整机、新型直升机、卫星应用产业，引进一批航电系统、机电系统、整机工装等领域的制造企业，推动航空制造与卫星互联网、电子信息等产业融合发展。加快发展低空经济，培育壮大通用航空器、无人机、eVTOL（电动垂直起降飞行器）等航空器及零部件产业集群，建设试飞试验基地、通用航空器整机制造研发平台，拓展生产作业、公共服务、旅游观光等应用场景。支持飞机采购租赁使用人民币结算。（责任单位：市经济信息委、市发展改革委、市交通运输委、人行重庆市分行）"}, {"chunkIndex": 8, "text": "产业合作。（责任单位：两江新区区政府、璧山区政府、市发展改革委、市经济信息委、市规划自然资源局、市商务委、重庆海关、重庆机场集团）\n\n六、进一步深化国际交往合作\n（十一）深化国际经贸往来。大力支持跨境电商发展，推广“跨境电商+产业带”模式，持续推进在德国杜伊斯堡、泰国罗勇府、老挝万象等地布局海外仓，培育具有行业竞争力影响力的跨境电商产业集群。大力发展“航空+消费”模式，升级江北机场消费环境，改善离境退税和外币兑换环境，鼓励开展“即买即退”等便利化服务，支持江北机场口岸进境免税店扩容。结合国际货运中转通道，深化笔电、汽车零部件、生鲜水果、服装等产业链和供应链上下游跨境协同合作。鼓励开展民航领域技术出口、对外投资和境外项目建设。（责任单位：市商务委、市经济信息委、重庆海关、重庆机场集团）\n\n（十二）促进科技人才交流。鼓励在渝机构联合外籍专家团队实施科技创新攻关项目，加快建设国家级“一带一路”联合实验室。探索与空中丝绸之路共建城市搭建创新合作服务平台，提供技术研发、成果转化与推广、人才培训与交流等服务。支持有条件的在渝高校设立航空领域学科专业，鼓励开展中外合作办学、高校师生交流互访，积极吸引国际人才来渝发展。鼓励打造空中丝绸之路国际智库，加强智库对话合作和经验交流。（责任单位：市科技局、市教委、市人力社保局）"}, {"chunkIndex": 9, "text": "中外合作办学、高校师生交流互访，积极吸引国际人才来渝发展。鼓励打造空中丝绸之路国际智库，加强智库对话合作和经验交流。（责任单位：市科技局、市教委、市人力社保局）\n（十三）促进文旅产业发展。鼓励旅行社与航空公司合作开通出入境旅游航线，积极开发“航空+游轮”“航空+自驾”等旅游产品，吸引海外游客来渝“入境游”“中转游”。提升文旅场所开放度，丰富“非遗”商品、文化创意产品、国货“潮品”等供给，积极承办国际节会展会、体育赛事、文艺演出等活动。加强旅游品牌海外宣传，持续提升国际影响力。充分发挥澜湄旅游城市合作联盟总部牵引作用，深化与联盟成员国的交流合作。推进与空中丝绸之路共建城市开展旅游合作，互办文物展览。（责任单位：市文化旅游委、市委宣传部、市商务委、市体育局、市政府口岸物流办）\n\n（十四）搭建交流合作平台。探索与阿姆斯特丹、法兰克福、吉隆坡、河内等城市缔结友好城市关系，将航空合作纳入友好城市地方合作议程。促进与空中丝绸之路共建城市开展高层互访，邀请其政商界领袖来渝参加国际展会活动，鼓励企业主体、高校智库、行业协会等多方参与空中丝绸之路建设，共同拓展合作成果。积极融入中国民航“一带一路”合作平台、中欧航空安全年会、中国—东盟民航合作论坛、澜湄航空发展合作联盟等民航合作平台，推进国际交流合作，争取承办民航领域国际会议、论坛等活动。（责任单位：市政府外办、市交通运输委、市政府口岸物流办）\n\n七、组织实施"}], "suggestDocId": 2097637762685849602, "fixable": true, "hint": ""}}, {"id": "A-p-02-2", "category": "pair", "question": "重庆在货物通关方面有哪些具体的便利化措施和时间保障？", "answer": "实施“空空直转”“空侧直通”让货物在机坪跨航班转运；强化“7×24小时”通关保障；开通生鲜等特殊进口商品绿色通道，实现快验快放。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 5, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "实施机坪“空空直转”“空侧直通”等措施，强化“7×24小时”通关保障，开通特殊进口商品绿色通道，实现快验快放。", "text": ": "A-p-03-1", "category": "pair", "question": "重庆市推进城市全域数字化转型行动计划主要包含哪几个部分？", "answer": "该计划共7个部分，包括总体要求、数字底座能力提升行动、智能中枢能力提升行动、六大系统能力提升行动、基层智治体系能力提升行动、适数生态能力提升行动以及组织实施。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "二、数字底座能力提升行动", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 7, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "五、基层智治体系能力提升行动", "text": "代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。\n（二十）全面构建数字经济系统体系能力。聚焦产业集群培育、企业成长服务、产业创新生态系统重塑、产业发展质效提升、现代化产业治理等，持续深化梳理迭代数字经济系统五级核心业务体系。迭代建设产业一链通、数智金融服务、智汇攻关、数字陆海新通道等数字化应用，加快构建产业培育、科技创新、企业服务等五级联动业务承接体系，推动数智赋能新质生产力发展和现代化产业体系建设。\n\n（二十一）全面构建数字社会系统体系能力。聚焦投资于人、消费提档、民生改善等，持续优化完善数字社会系统五级核心业务体系。迭代建设惠学生、智慧医保、救助通、渝你同行、信用等数字化应用，有效提升五级联动业务承接能力，赋能构建更加优质均衡的公共服务体系。\n\n（二十二）全面构建数字文化系统体系能力。聚焦主流价值、主流舆论、主流文化等，持续优化完善数字文化系统五级核心业务体系。迭代建设春风满巴渝、巴渝文物、惠游重庆等数字化应用，加快构建数字文化系统五级联动业务承接体系，全面推动数智赋能新时代文化强市建设。\n\n（二十三）全面构建数字法治系统体系能力。聚焦维护国家政治安全、确保社会大局稳定、促进社会公平正义、保障人民安居乐业等，持续优化完善数字法治系统五级核心业务体系。迭代情指行、全民反诈、重庆调解在线、“执法+监督”等数字化应用，加快构建数字法治系统五级联动业务承接体系。\n\n五、基层智治体系能力提升行动"}, {"docId": 2097637763906392065, "chunkIndex": 6, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "四、六大系统能力提升行动", "text": "方案优化完善、线上精细化智能预案各跑道全覆盖，打造全媒体传播大脑、智慧文旅等综合场景，全面提升舆论引导精准度、文化服务普惠度、文明素养浸润度，营造良好文化氛围。\n（十六）加快集成生态景观防治协同支撑能力。聚焦空气环境、固废与土壤环境、自然资源等领域，推动生态景观板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造污染防治攻坚战智管、中心城区“四山”管理等综合场景，加快构建生态环境数字治理新形态。\n\n（十七）加快集成高品质生产生活服务支撑能力。聚焦医疗、教育、就业、养老等领域，推动生产生活服务板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造15分钟高品质生活服务圈、“三医”协同、高质量就业综合智服等综合场景。\n\n四、六大系统能力提升行动\n\n（十八）全面构建数字党建系统体系能力。聚焦推动党的领导一贯到底、纵深推进全面从严治党、深化全过程人民民主市域实践等，持续深化梳理迭代数字党建系统五级核心业务体系。迭代建设八张报表、八张问题清单、突发事件直报快响、渝才荟、人大代表全渝通、青春重庆等数字化应用，持续提升数字党建五级联动业务承接能力，加快完善党建统领整体智治工作格局。\n\n（十九）全面构建数字政务系统体系能力。聚焦全生命周期服务、全要素决策发展、全链条本质安全、全域协同治理等，持续深化梳理迭代数字政务系统五级核心业务体系。迭代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。"}, {"docId": 2097637763906392065, "chunkIndex": 3, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "三、智能中枢能力提升行动", "text": "模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。\n（五）推进感知可用。强化感知资源“一本账”管理，推进感知盲区补点、接入，构建融通智联感知体系。鼓励社会主体感知资源接入，推进感知资源与体征指标、风险点、智能预案等深度关联。提升AI赋能视频感知资源利用率、共享率、复用率，强化城市基础设施数字化改造。\n\n（六）推进空间孪生。建设空间数据体系，迭代国土空间数据综合信息系统，深化“多规合一”专题图，构建“挂图作战”智能体系，加快自然空间、人造空间向数字空间全量孪生。聚焦产业升级、科技创新等发展行为，应急调度、风险排查等治理行为，教育就业、卫生健康等服务行为，推动行为（活动）向数字空间映射。推动先进文化向数字空间孪生。\n\n（七）优化“两端”入口。迭代升级“渝快政”，开展信创化改造和客户端适配。升级“渝快办”，深化线上全程网办、线下全渝通办和一站式服务。\n\n（八）抓实数据安全。建设数据灾备中心，加强数字重庆人工智能底座保密防护和管理。落实数据分类分级保护制度，完善风险监测预警、安全审查监管等机制。\n\n三、智能中枢能力提升行动"}], "source": {"pairId": "p-03", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637772248862722, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "7个部分", "answerQuote": "《行动计划》主要为7个部分。", "candidateChunks": [1, 0, 7, 6, 3, 9, 4, 8, 10, 5, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失", "证据无关"], "reason": "标准答案准确概括了政策结构，但当前标注的证据段落（★）严重缺失关键章节标题（如智能中枢、基层智治等），且包含大量与‘主要部分’这一宏观问题无关的具体执行细节。", "suggestion": "1. 补充标注：必须将包含各一级标题的段落标为证据，即 [1] (总体要求/数字底座), [4] (智能中枢), [6] (六大系统), [8] (基层智治), [9] (适数生态)。注意：[0]是元数据通常不作为正文证据，但若需覆盖全文可酌情处理，核心是正文标题段。\n2. 删除冗余：移除 [3] 和 [6] 中关于具体应用场景（如AI模型、 会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}], "source": {"pairId": "p-03", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637772248862722, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "新培育数据企业", "answerQuote": "新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "candidateChunks": [1, 7, 4, 0, 10, 9, 5, 3, 2, 8, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 5, "naturalness": 5}, "issues": [], "reason": "问题清晰自然，标准答案完全忠实于原文段落[1]中的具体指标，且该段落已正确标注为证据，无需修改。", "suggestion": "", "suggest": [], "suggestDocId": 2097637763906392065, "fixable": false, "hint": ""}}, {"id": "A-p-04-1", "category": "pair", "question": "重庆市支持食品及农产品加工产业高质量发展新十条政策主要涵盖哪些方面的支持措施？", "answer": "主要包括支持农业一二三产业融合发展、财政常态化帮扶资金用于产业发展、企业贷款贴息、降低担保费率、种养业主农业保险保费补贴、冷链物流体系建设以及企业数字化智能化转型等七个方面。", "expectRefusal": false, "gold": [{"docId": 2097637763717648386, "chunkIndex": 1, "why": "重庆市支持食品及农产品加工产业高质量发展新十条政策", "quote": "一、支持农村一二三产业融合发展", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 1, "why": "重庆市支持食品及农产品加工产业高质量发展新十条政策", "quote": "二、支持财政常态化帮扶资金用于食品及农产品加工业发展", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 1, "why": "重庆市支持食品及农产品加工产业高质量发展新十条政策", "quote": "三、支持对食品及农产品加工企业贷款贴息", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工 主要涵盖哪些财政/金融支持措施”），否则当前答案相对于“新十条”政策而言是不完整的。", "suggest": [{"chunkIndex": 2, "text": "\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。\n牵头单位：市财政局\n\n责任单位：市农业农村委\n\n五、支持对种养业主农业保险保费补贴\n\n支持符合条件的食品及农产品加工原辅料基地种养业主依法依规参与政策性农业保险，给予最高不超过85%的保费补贴。\n\n牵头单位：市财政局\n\n责任单位：市农业农村委、重庆金融监管局\n\n六、支持冷链物流体系建设\n\n支持区域冷链物流基地标准化、智慧化改造及配套设施设备投入，按照不超过实际有效投资额40%的标准，给予金额最高不超过1000万元的补助。支持农村冷链物流资源整合利用，提升运营效益。对家庭农场、农民合作社、供销合作社、邮政快递企业、产业化龙头企业在农村建设的冷链物流仓储设施用电执行农业生产用电价格。支持布局农村冷链物流揽货点、前置仓，有效降低食品及农产品加工产业冷链物流成本。\n\n牵头单位：市政府口岸物流办\n\n责任单位：市商务委、市农业农村委、市发展改革委\n\n七、支持企业数字化、智能化转型"}, {"chunkIndex": 3, "text": "\n牵头单位：市政府口岸物流办\n\n责任单位：市商务委、市农业农村委、市发展改革委\n\n七、支持企业数字化、智能化转型\n支持食品及农产品加工企业实施数字化、智能化改造，对符合条件的项目，依法依规给予不超过建设项目实际设备投资额10%的补助，总额不超过100万元；支持企业建设先进级智能工厂，依法依规给予不超过项目实际投资额（不含税）10%的补助，最高不超过300万元；支持企业建设未来工厂，依法依规给予不超过项目实际投资额（不含税）10%的补助，最高不超过500万元。支持食品安全数字化管理，建设阳光工厂，采用先进的质量管理体系，提升企业智能制造水平和质量安全控制能力。\n\n牵头单位：市经济信息委\n\n责任单位：市农业农村委、市市场监管局\n\n八、支持对企业技术改造贷款贴息\n\n支持食品及农产品加工企业进行技术改造，按照企业项目实际支出贷款利率的50%，给予最高不超过贷款金额2%的贴息，对单个企业项目每年贴息不超过1000万元；支持食品及农产品加工企业通过直接融资租赁方式购置设备推动实施技术改造，对符合条件的融资租赁直租业务（含“直转回”），依法依规给予2%的贴息，对单个企业项目每年贴息不超过500万元；支持食品及农产品加工企业投保技改项目费用损失保险，按照实际投保年度保费的80%进行补贴，最高不超过100万元。\n\n牵头单位：市经济信息委\n\n责任单位：市委金融办、市财政局、人行重庆市分行、重庆金融监管局\n\n九、用好食品及农产品加工产业生态基金"}, {"chunkIndex": 4, "text": "\n牵头单位：市经济信息委\n\n责任单位：市委金融办、市财政局、人行重庆市分行、重庆金融监管局\n\n九、用好食品及农产品加工产业生态基金\n用好目标规模100亿元的食品及农产品加工产业生态基金。坚持市场化原则，采用“子基金+直投”的分类投资策略支持产业引育。加强市与区县联动，积极引导产业项目落地。\n\n牵头单位：市国资委\n\n十、支持宣传推广和品牌建设\n\n支持办好中国西部国际投资贸易洽谈会、中国西部（重庆）国际农产品交易会、重庆市食品及农产品加工产业高质量发展产业生态大会等重大展会和行业促销活动，对入选综合形象馆等指定区域参展的企业给予不低于20%的展位费减免。对参加纳入“百团千企”国际市场开拓计划目录的境外参展企业给予展位费和人员费奖补。支持培育打造及宣传推广农产品区域公用品牌、地理标志产品，对新获批地理标志产品认定的申请人，给予最高不超过20万元的一次性补助。支持“爆品”打造计划，支持企业创品牌、创名牌，对新获评的国家级非物质文化遗产、中华老字号称号的企业，按不同标准依法依规给予最高不超过200万元的奖励。\n\n牵头单位：市商务委\n\n责任单位：市农业农村委、市知识产权局、市文化旅游委\n\n以上政策自2026年1月1日起实施，有效期至2028年12月31日止。"}], "suggestDocId": 2097637763717648386, "fixable": true, "hint": ""}}, {"id": "A-p-04-2", "category": "pair", "question": "申请重庆市食品及农产品加工企业贷款贴息时，最高能享受多少金额的补贴？", "answer": "单户享 以及加强监督等内容。", "expectRefusal": false, "gold": [{"docId": 2097637763990278145, "chunkIndex": 4, "why": "重庆市国有投资基金管理暂行办法", "quote": "第三章  基金的运作和风险控制", "text": "委会同行业主管部门，充分发挥布局规划和投向指导作用，结合相关产业产能利用情况，引导各区县围绕当地产业发展实际调整政府投资基金布局，防止产能过剩和低水平重复建设。\n第七条  国有投资基金出资方应当按照现行法律法规，根据不同的组织形式，制定投资基金公司章程、有限合伙协议、合同等（以下统称章程），明确投资基金的设立目标、基金规模、存续期限、出资方案、投资领域、决策机制、基金管理机构、风险防范、投资退出、管理费用和收益分配等。\n\n第八条  国有投资基金出资人应结合基金设立情况和自身承受能力，合理确定出资规模、比例和时间安排。其中，政府对政府投资基金的出资应按规定纳入财政预算管理，财政部门要结合政府投资基金投资进展和结余资金情况合理安排出资，防止资金闲置。\n\n第九条  国有投资基金出资人原则上应当采取市场化方式遴选确定基金管理人、基金托管人。\n\n基金管理人应具备私募基金管理人资质，按照基金章程规定，履行基金的募资、投资、管理、退出等运行工作。基金托管人为具有基金托管业务资质的金融机构，按照协议约定对基金进行托管。\n\n第三章  基金的运作和风险控制\n\n第十条  国有投资基金应当按照“定位清晰、市场运作、科学决策、防范风险”的原则进行投资运作。\n\n第十一条  国有投资基金募资、投资、投后管理、清算、退出等采取市场化运作方式，政府及所属部门不得以行政手段干预基金的日常管理事务和具体项目的投资决策。"}, {"docId": 2097637763990278145, "chunkIndex": 7, "why": "重庆市国有投资基金管理暂行办法", "quote": "第四章  基金的终止和退出", "text": "府投资基金风险防范，严禁地方政府通过违法违规举债融资进行出资，不得新增地方政府隐性债务，不得强制要求国有企业、金融机构出资或垫资。\n\n第四章  基金的终止和退出\n第十八条  国有投资基金一般应当在存续期满后终止。确需延长存续期限的，政府投资基金应当报经同级政府批准，国企投资基金应当按照国有资产监督管理机构要求履行程序，与其他出资方按章程约定的程序办理。\n\n第十九条  国有投资基金终止后，应当在出资人监督下组织清算，其中政府出资额和应归属政府的收益，按照财政国库管理制度有关规定及时足额上缴国库。\n\n第二十条  国有投资基金中的国有出资部分一般应在投资基金存续期满后退出。存续期未满如达到预期目标，可通过股权回购机制、份额转让等方式适时退出。\n\n第二十一条  基金管理人应建立基金退出管理制度，制定退出方案。政府投资基金应科学合理确定退出期，并在章程中明确退出条件。国有出资从投资基金退出时，应当按照章程约定的条件退出；章程中没有约定的，应依法依规进行评估，采取市场化方式确定转让价格。\n\n第五章  基金的监督管理\n\n第二十二条  国有投资基金应当按照管理关系，定期向财政部门或国有资产监督管理机构报告基金运行情况、资产负债情况、投资损益情况及其他可能影响投资者权益的其他重大情况，按季编制并向财政部门或国有资产监督管理机构报送资产负债表、损益表及现金流量表等报表。\n\n第二十三条  财政部门、国有资产监督管理机构应分别对政府投资基金、国企投资基金开展绩效考核评价，评价结果作为基金存续、增资扩股、提前终止及计提管理费的重要依据。"}, {"docId": 2097637763990278145, "chunkIndex": 7, "why": "重庆市国有投资基金管理暂行办法", "quote": "第五章  基金的监督管理", "text": "府投资基金风险防范，严禁地方政府通过违法违规举债融资进行出资，不得新增地方政府隐性债务，不得强制要求国有企业、金融机构出资或垫资。\n\n第四章  基金的终止和退出\n第十八条  国有投资基金一般应当在存续期满后终止。确需延长存续期限的，政府投资基金应当报经同级政府批准，国企投资基金应当按照国有资产监督管理机构要求履行程序，与其他出资方按章程约定的程序办理。\n\n第十九条  国有投资基金终止后，应当在出资人监督下组织清算，其中政府出资额和应归属政府的收益，按照财政国库管理制度有关规定及时足额上缴国库。\n\n第二十条  国有投资基金中的国有出资部分一般应在投资基金存续期满后退出。存续期未满如达到预期目标，可通过股权回购机制、份额转让等方式适时退出。\n\n第二十一条  基金管理人应建立基金退出管理制度，制定退出方案。政府投资基金应科学合理确定退出期，并在章程中明确退出条件。国有出资从投资基金退出时，应当按照章程约定的条件退出；章程中没有约定的，应依法依规进行评估，采取市场化方式确定转让价格。\n\n第五章  基金的监督管理\n\n第二十二条  国有投资基金应当按照管理关系，定期向财政部门或国有资产监督管理机构报告基金运行情况、资产负债情况、投资损益情况及其他可能影响投资者权益的其他重大情况，按季编制并向财政部门或国有资产监督管理机构报送资产负债表、损益表及现金流量表等报表。\n\n第二十三条  财政部门、国有资产监督管理机构应分别对政府投资基金、国企投资基金开展绩效考核评价，评价结果作为基金存续、增资扩股、提前终止及计提管理费的重要依据。"}, {"docId": 2097637763990278145, "chunkIndex": 2, "why": "重庆市国有投资基金管理暂行办法", "quote": "第二章 基金的设立", "text": "企业出资等方式。政府采取注资国有企业方式设立基金，明确相关资金专项用于对基金出资的，原则上按照政府出资有关要求管理。\n\n国企投资基金是指国有企业出资的投资基金。\n第三条  财政部门负责政府投资基金的管理，履行政府出资人职责。国有资产监督管理机构负责国企投资基金的管理。发展改革部门负责政府投资基金的信用建设和信用信息登记，会同行业主管部门加强对政府投资基金投向的指导评价。审计部门负责对国有投资基金进行审计监督。证券监督管理机构负责对基金的业务活动实施监督管理，联合市级有关部门开展综合研判会商。地方金融管理部门参与综合研判会商，指导基金的设立和规范发展。\n\n第二章  基金的设立\n\n第四条  国有投资基金设立应履行相应的审批程序。市级和区级政府投资基金应报同级人民政府批准，其中区级政府投资基金还应报市政府备案；县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。除上述情形外，全市党政机关、事业单位不得以财政拨款或自有收入新设政府投资基金，已经设立的按照政府投资基金管理要求统一规范管理。国有企业发起设立或出资参与基金，原则上作为“三重一大”事项履行集团决策程序，并按要求报送国有资产监督管理机构。"}], "source": {"pairId": "p-05", "policyDocId": 2097637763990278145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市国有投资基金管理暂行办法》的通知", "interpretDocId": 2097637772387274754, "interpretTitle": "重庆市财政局关于《重庆市国有投资基金管理暂行办法》的政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕4号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "6章26条", "answerQuote": "《暂行办法》分为总则、基金的设立、基金的运作和风险控制、基金的终止和退出、基金的监督管理、附则共6章26条", "candidateChunks": [4, 1, 7, 5, 0, 2, 6, 8, 3], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案是对全文结构的宏观概括（章节、条数、核心内容），但当前标注的证据段落仅覆盖了部分细节，缺失了包含总则定义、设立程序、运作原则、终止退出及监督管理等关键章节起始或核心条款的段落，导致无法从现有证据中完整推导出‘共6章26条’及涵盖所有五个主要方面的结论。", "suggestion": "需补充标注段落 [1] (含第一章总则及第二条定义)、[3] (含第二章基金设立具体条款)、[5] (含第三章运作和风险控制具体条款)、[6] (含第四章终止和退出具体条款)、[8] (含第五章监督管理具体条款)，以覆盖政策全文结构，支撑标准答案中的宏观概括。", "suggest": [{"chunkIndex": 1, "text": "\n重庆市人民政府办公厅\n\n2026年2月1日\n\n（此件公开发布）\n\n重庆市国有投资基金管理暂行办法\n\n第一章  总    则\n第一条  为推动我市国有投资基金高质量发展，规范基金的设立、运行与监管，根据《中华人民共和国预算法》、《中华人民共和国企业国有资产法》、《私募投资基金监督管理条例》和《国务院办公厅关于促进政府投资基金高质量发展的指导意见》（国办发〔2025〕1号）、《财政部关于印发〈政府投资基金暂行管理办法〉的通知》（财预〔2015〕210号）等法律、法规和文件规定，结合我市实际，制定本办法。\n\n第二条  本办法所称国有投资基金，指由市、区县人民政府和各级国有企业出资设立的投资基金，分为政府投资基金和国企投资基金。\n\n政府投资基金是市、区县人民政府通过预算安排，单独出资或与社会资本共同出资设立，采用股权投资等市场化方式，引导各类社会资本支持相关产业和领域发展及创新创业的投资基金。政府出资主要包括通过预算直接出资、安排资金并委托国有企业出资等方式。政府采取注资国有企业方式设立基金，明确相关资金专项用于对基金出资的，原则上按照政府出资有关要求管理。\n\n国企投资基金是指国有企业出资的投资基金。"}, {"chunkIndex": 3, "text": "，已经设立的按照政府投资基金管理要求统一规范管理。国有企业发起设立或出资参与基金，原则上作为“三重一大”事项履行集团决策程序，并按要求报送国有资产监督管理机构。\n第五条  政府投资基金主要投向市委、市政府确定的重大战略、重点领域和市场不能充分发挥作用的薄弱环节，分为产业投资类基金和创业投资类基金。产业投资类基金着力引领带动产业发展，围绕完善现代化产业体系，支持改造提升传统产业、培育壮大新兴产业、布局建设未来产业，重点投资产业链关键环节和延链补链强链项目。创业投资类基金围绕发展新质生产力，支持科技创新，着力投早、投小、投长期、投硬科技。\n\n国企投资基金应当立足国有企业主责主业进行投资。\n\n第六条  同一区县政府原则上不在同一行业或领域重复设立政府投资基金。未足额保障“三保”、债务付息等必保支出的区县，不得安排资金新设政府投资基金。\n\n市政府结合国家发展规划及国家专项规划、区域规划等，统筹管理全市政府投资基金，加强对区县政府设立基金的指导，制定重点投资领域清单，明确对区县政府设立基金的审批或备案要求，防止重复投资和无序竞争；市发展改革委会同行业主管部门，充分发挥布局规划和投向指导作用，结合相关产业产能利用情况，引导各区县围绕当地产业发展实际调整政府投资基金布局，防止产能过剩和低水平重复建设。"}, {"chunkIndex": 5, "text": "\n第十一条  国有投资基金募资、投资、投后管理、清算、退出等采取市场化运作方式，政府及所属部门不得以行政手段干预基金的日常管理事务和具体项目的投资决策。\n第十二条  政府投资基金可采取母子基金或直投项目方式进行投资，鼓励创业投资类基金采取母子基金方式。子基金原则上以直投项目方式进行投资，控制基金层级，防止多层嵌套影响目标实现。\n\n第十三条  健全国有投资基金治理结构，建立科学规范的运作管理和投资决策机制，明确股东会、合伙人会议、董事会、投资决策委员会等主体在投资决策、投后管理、项目退出等环节的职责权限。\n\n政府部门可通过监督投向、跟踪投资进度、委派观察员等方式，促进政府投资基金合规运作。母基金应加强对子基金投向、运作、财务等情况的监督，强化尽职调查责任。优化投资项目选择机制，防止偏离政策目标、与民争利。\n\n第十四条  国有投资基金应围绕自身定位和设立目标，构建科学化、差异化、可量化的绩效指标体系，重点关注目标综合实现情况。国有投资基金出资人要科学论证基金管理费，一般应以实缴出资或实际投资金额为计费基础，合理确定计提标准。综合采取调整管理费、超额收益分配等措施加强绩效考核结果应用，体现激励约束。\n\n第十五条  国有投资基金各出资方应当按照“利益共享、风险共担”的原则，在基金章程中明确约定收益处理和亏损负担方式。政府投资基金的亏损应由出资方共同承担，国有出资人应以出资额为限承担有限责任。"}, {"chunkIndex": 6, "text": "方应当按照“利益共享、风险共担”的原则，在基金章程中明确约定收益处理和亏损负担方式。政府投资基金的亏损应由出资方共同承担，国有出资人应以出资额为限承担有限责任。\n更好发挥政府投资基金引导作用，政府可适当让利，但不得向其他出资人承诺投资本金不受损失，不得承诺最低收益，对于归属政府的投资收益和利息等，除明确约定继续用于政府投资基金滚动使用外，应按照财政国库管理制度有关规定及时足额上缴国库。\n\n第十六条  国有投资基金容忍正常投资风险，鼓励建立以尽职合规责任豁免为核心的容错机制，完善免责认定标准和流程。\n\n更好发挥政府投资基金耐心资本作用。合理确定基金存续期，优化全链条、全生命周期考核评价体系。不简单以单个项目或单一年度盈亏作为考核依据，对创业投资类基金给予更高的风险容忍度。\n\n第十七条  国有投资基金要强化内控管理，依法保障出资人权益。基金管理人应建立健全关联交易管理制度，健全廉政风险防控体系，不得以基金财产与关联方进行不正当交易或利益输送，不得从事法律法规或行业规章禁止的业务。加强国有投资基金从业人员法律法规及职业道德教育、培训和管理。规范财务绩效管理，真实、准确反映基金财务状况，严防财务造假。\n\n加强政府投资基金风险防范，严禁地方政府通过违法违规举债融资进行出资，不得新增地方政府隐性债务，不得强制要求国有企业、金融机构出资或垫资。\n\n第四章  基金的终止和退出"}, {"chunkIndex": 8, "text": "第二十三条  财政部门、国有资产监督管理机构应分别对政府投资基金、国企投资基金开展绩效考核评价，评价结果作为基金存续、增资扩股、提前终止及计提管理费的重要依据。\n国有企业应当加大对国企投资基金的内部审计力度，对重点投资项目、重要项目决策、重大风险防控和基金经营运作合规情况等进行常态化审计监督。\n\n第二十四条  财政部门、国有资产监督管理机构会同有关部门应分别加强对政府投资基金、国企投资基金运作情况的监督检查，对发现的问题按照相关法律法规及有关规定处理。基金从业人员玩忽职守、滥用职权、徇私舞弊或者利用职务便利索取或收受他人财物的，依规依纪依法给予处理处分；构成犯罪的，依法追究刑事责任。\n\n第二十五条  审计部门依法对国有投资基金运行情况进行审计监督。\n\n第六章  附    则\n\n第二十六条  本办法自印发之日起实施。"}], "suggestDocId": 2097637763990278145, "fixable": true, "hint": ""}}, {"id": "A-p-05-2", "category": "pair", "question": "县级政府新设国有投资基金需要报谁审批？", "answer": "考虑到县级的资源禀赋与财力实际，《暂行办法》要求县级政府新设基金提级报市政府审批。而市级和区级政府投资基金应报同级人民政府批准，区级还需报市政府备案。", "expectRefusal": false, "gold": [{"docId": 2097637763990278145, "chunkIndex": 2, "why": "重庆市国有投资基金管理暂行办法", "quote": "县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。", "text": "企业出资等方式。政府采取注资国有企业方式设立基金，明确相关资金专项用于对基金出资的，原则上按照政府出资有关要求管理。\n\n国企投资基金是指国有企业出资的投资基金。\n第三条  财政部门负责政府投资基金的管理，履行政府出资人职责。国有资产监督管理机构负责国企投资基金的管理。发展改革部门负责政府投资基金的信用建设和信用信息登记，会同行业主管部门加强对政府投资基金投向的指导评价。审计部门负责对国有投资基金进行审计监督。证券监督管理机构负责对基金的业务活动实施监督管理，联合市级有关部门开展综合研判会商。地方金融管理部门参与综合研判会商，指导基金的设立和规范发展。\n\n第二章  基金的设立\n\n第四条  国有投资基金设立应履行相应的审批程序。市级和区级政府投资基金应报同级人民政府批准，其中区级政府投资基金还应报市政府备案；县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。除上述情形外，全市党政机关、事业单位不得以财政拨款或自有收入新设政府投资基金，已经设立的按照政府投资基金管理要求统一规范管理。国有企业发起设立或出资参与基金，原则上作为“三重一大”事项履行集团决策程序，并按要求报送国有资产监督管理机构。"}], "source": {"pairId": "p-05", "policyDocId": 2097637763990278145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市国有投资基金管理暂行办法》的通知", "interpretDocId": 2097637772387274754, "interpretTitle": "重庆市财政局关于《重庆市国有投资基金管理暂行办法》的政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕4号"} cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202604/t20260407_15592081.html\r\nmetadataId: 15592081\r\nchannelId: 121935\r\nsubcat: 881\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅关于\n\n印发《重庆市2026年度优化营商环境\n\n工作任务清单》的通知\n\n渝府办发〔2026〕18号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市2026年度优化营商环境工作任务清单》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年4月1日\n\n（此件公开发布）\n\n重庆市2026年度优化营商环境工作任务清单\n\n序号\n\n2026年度工作任务\n\n牵头单位\n\n一、对标先进优化提升专项行动\n\n（一）市场准入\n\n1"}, {"docId": 2097637766162927617, "chunkIndex": 17, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "七、打造“信用重庆”升级版专项行动", "text": "“渝金通”数智金融服务平台实战实效能力，迭代升级民营小微金融、通道金融等特色场景，不断健全“股、贷、保、担”全生命周期金融产品服务体系。\n\n市委金融办\n\n126\n引导金融机构将金融服务嵌入“人工智能（AI）+产业”等数字化场景，围绕重大项目、重点企业和重要产业链，加强场景聚合、生态对接，实现“一站式”金融服务，优化信贷审批流程，缩短信贷审批时间。\n\n人行重庆市分行、市经济信息委、重庆金融监管局\n\n七、打造“信用重庆”升级版专项行动\n\n（一）加强政府守信践诺\n\n127\n\n持续归集、受理、处置政府机构在政府采购、项目建设、招商引资等领域不履行约定义务的失信线索，督导政府机构纠正失信行为。\n\n市发展改革委\n\n128\n\n持续开展地方政府公共信用综合评价，加强评价结果运用，对失信情况严重的政府机构督促整改。\n\n市发展改革委\n\n129\n\n推动被纳入失信被执行人的政府机构及时履行法院生效判决，修复信用状况，确保我市涉政府机构失信被执行人动态清零。\n\n市发展改革委、市高法院\n\n130\n\n建立涉政府机构未自动履行生效法律文书专项督促工作机制，督促涉政府机构被执行人及时履行法院生效判决。\n\n市发展改革委、市高法院\n\n131\n\n推广政府合同履约监管系统，持续打造“信用+政府合同履约”应用场景。\n\n市发展改革委\n\n（二）优化市场信用环境\n\n132\n\n制定《重庆市公共信用评价管理办法》，规范公共信用评价。\n\n市发展改革委\n\n133\n\n动态更新失信惩戒措施清单，推动依法依规实施失信惩戒措施。\n\n市发展改革委\n\n134"}, {"docId": 2097637766162927617, "chunkIndex": 12, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "五、提升创新环境专项行动", "text": "\n市市场监管局\n\n85\n\n深化整治“内卷式”竞争，推动形成优质优价、良性竞争的市场秩序。\n市市场监管局\n\n（三）规范公共资源交易监管\n\n86\n\n规范评标专家管理，加强评标专家履职监管，推行评标专家聘期制，依法查处评标专家在评标活动中的违规违法行为。\n\n市发展改革委\n\n87\n\n抓好招标投标突出问题整治，严肃查处招标投标领域违规违纪违法行为。\n\n市发展改革委\n\n88\n\n制定《重庆市工程建设项目招标投标活动异议和投诉处理实施细则（修订）》。\n\n市发展改革委\n\n（四）推动经营主体发展壮大\n\n89\n\n深入开展个体工商户分型判定和分类申报认定工作，持续完善差异化帮扶措施。\n\n市市场监管局\n\n90\n\n做好做优个体工商户培育公共服务平台，推进实施政策智配、创业导览、一码融资等功能，提升个体工商户政策获取便利度。\n\n市市场监管局\n\n91\n\n实施个体工商户“优型提质”成长计划，建立“个转企”培育库，按行业（批零、餐饮、文创、居民服务、科技服务等）分类建档，全覆盖建立沟通联系机制，点对点进行指导帮扶。\n\n市市场监管局\n\n92\n\n加强优质企业梯度培育，在市场开拓、资金融通、人才引育等方面为经营主体提供精准服务，推动经营主体加快成长。\n\n市经济信息委\n\n93\n\n深入实施“龙头引领”行动，培育一批民营龙头企业、行业领军企业、产业链主企业。\n\n市工商联、市发展改革委、市经济信息委\n\n五、提升创新环境专项行动\n\n（一）加速集聚高端创新资源\n\n94"}, {"docId": 2097637766162927617, "chunkIndex": 18, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "八、助企暖企护航成长专项行动", "text": "\n市发展改革委\n\n133\n\n动态更新失信惩戒措施清单，推动依法依规实施失信惩戒措施。\n\n市发展改革委\n\n134\n推广信用修复“一件事”办事场景，优化办理流程，减免证明材料，快速办理符合条件的信用修复诉求。\n\n市发展改革委\n\n（三）推进社会信用建设\n\n135\n\n持续推进专用信用报告代替企业有无违法违规证明，按照“应替尽替”原则，将替代领域拓展至47个。\n\n市发展改革委\n\n136\n\n持续优化“全国融资信用服务平台（重庆站）”服务功能，创新以信用评价为基础的融资增信模式，推广产业链信用融资，帮助无抵押、无担保的小微企业以信用资产换取融资便利，融资授信规模达到3000亿元。\n\n市发展改革委\n\n137\n\n持续打造信用赋能超大城市治理场景矩阵，大力推动守信激励“信用+”场景建设，实现信用激励在更多行业应用。\n\n市发展改革委\n\n八、助企暖企护航成长专项行动\n\n（一）建立健全政企沟通服务机制\n\n138\n\n打造“政企同心·渝商渝好”“亲清服务 渝悦发展”“年轻一代民营经济人士‘十百千万’培育工程”工作品牌，定期召开政企沟通座谈会，常态化开展政策宣讲、政策解读、产融对接、项目推介等服务活动。\n\n市委统战部、市发展改革委、市工商联\n\n139\n\n推动构建市政府领导和市级部门负责同志与民营企业沟通交流的“双会”制度，围绕强链延链补链融链，开展民营经济沟通交流专题活动。\n\n市发展改革委\n\n140\n\n开展民营企业大调研大走访专项行动，主动问需、问困、问计于民营企业。\n\n市委统战部、市工商联\n\n141"}], "source": {"pairId": "p-07", "policyDocId": 2097637766162927617, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市2026年度优化营商环境工作任务清单》的通知", "interpretDocId": 2097637772496326658, "interpretTitle": "《重庆市2026年度优化营商环境工作任务清单》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕18号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "九大专项行动", "answerQuote": "《任务清单》围绕九大专项行动提出2026年度工作任务158条。", "candidateChunks": [0, 1, 20, 17, 6, 12, 18, 14, 5, 9, 11, 19], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案概括了清单的九大专项行动及具体方面，但当前标注的证据段落（★）仅覆盖了部分行动（如市场、创新、信用、助企等），严重缺失‘对标先进’、‘政务环境’、‘法治环境’等关键章节的原文依据，导致无法从现有证据中完整推导出答案。", "suggestion": "需补充标注涵盖其余专项行动的段落作为证据：[1]（对标先进-市场准入）、[7]（对标先进-破产/政务开头）、[8][9]（政务环境）、[10][11]（法治环境）、[13][14]（创新环境细节）、[15][16]（要素保障）、[19]（助企暖企细节）、[20]（正面典型）。", "suggest": [{"chunkIndex": 1, "text": "\n重庆市2026年度优化营商环境工作任务清单\n\n序号\n\n2026年度工作任务\n\n牵头单位\n\n一、对标先进优化提升专项行动\n\n（一）市场准入\n\n1\n提升“渝悦易企办”全生命周期服务体系效能，推进“渝企在线”建设，强化人工智能（AI）赋能，探索打造“申请智填”“审核智研”“风险智判”“数据智统”等智能体，着力提升申、审、用三端质效。\n\n市市场监管局\n\n2\n\n持续深化注册资本认缴登记制度改革，完善改革配套措施，稳步推进存量公司调整出资期限、注册资本异常公司调整出资额，引导新设公司理性出资。\n\n市市场监管局\n\n3\n\n深化登记注册全渝通办改革，优化企业开办、变更、注销等“高效办成一件事”闭环管理，推进市场监管领域内许可事项“联办联变联销”。\n\n市市场监管局\n\n4\n\n完善强制注销、强制清算、批量吊销、另册管理制度，推动长期未经营或停止经营的企业和个体工商户市场退出，提升资源配置效率。\n\n市市场监管局\n\n5\n\n健全登记制度规范，制定经营主体住所（经营场所）登记管理办法，降低经营主体创业成本。\n\n市市场监管局\n\n（二）获取经营场所\n\n6\n\n推动制定建设工程图纸数字化管理标准，推进工程建设项目施工图全过程数字化管理，减少经营主体跑动次数。\n\n市住房城乡建委\n\n7\n\n推行工程建设项目“多图联审”模式，实现“一窗受理、网上流转、联合审图、数字交付”，全面提升图纸审查效率。\n\n市住房城乡建委\n\n8"}, {"chunkIndex": 7, "text": "\n47\n\n开展破产管理人工作评估，强化履职监督，加强业务培训，完善援助资金管理机制，提升管理人履职能力，保障企业破产程序规范高效运行。\n\n市高法院\n\n48\n强化跨部门信息共享，深化企业破产处置府院联动，积极推动市级层面府院协调机制常态化运行，提升破产案件审理效率。\n\n市高法院\n\n二、提升政务环境专项行动\n\n（一）全面加强政务服务渠道建设\n\n49\n\n持续深化政务服务事项线上全程网办、线下“全渝通办”和“一站式”服务，健全市、区县、乡镇（街道）全面通办的政务服务体系。\n\n市政府办公厅、市大数据发展局\n\n50\n\n开展政务服务事项精细化梳理，推动事项名称通俗化表述，优化办事指南展示方式，上线简洁版办事指南。\n\n市政府办公厅、市大数据发展局\n\n51\n\n推动更多政务服务事项向区县、乡镇（街道）下沉，实现就近办理。\n\n市政府办公厅、市大数据发展局\n\n52\n\n迭代建设“民呼我为”应用，打造人工智能（AI）+企业群众诉求闭环处置综合场景，完善“接、派、办、评、督、治”全链条工作机制，推动未诉先办，持续提升服务质效。\n\n市政府办公厅\n\n（二）全面深化政务服务模式创新\n\n53\n\n持续完善“高效办成一件事”重点事项常态化推进机制，结合经营主体经营发展等高频需求，新增一批“一件事一次办”，强化已上线重点事项成效评价反馈，完善“一件事”服务场景。\n\n市政府办公厅\n\n54\n\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55"}, {"chunkIndex": 8, "text": "\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55\n加强省际间基本公共服务标准协同，推动川渝通办提质增效，实现基本公共服务同城化便利共享。\n\n市政府办公厅\n\n（三）全面强化政务服务数字赋能\n\n56\n\n优化“渝快办”平台服务体验，安全稳妥有序推进人工智能（AI）大模型运用，优化智能问答、智能搜索、智能导办、智能预审、智能分析、智能推荐等功能，整体提升政务服务智能化水平。\n\n市大数据发展局\n\n57\n\n深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。\n\n市大数据发展局\n\n58\n\n通过“渝快办”平台、“12345”热线联通全市各级政务服务窗口服务信息，开通线上预约、电话预约等服务，实现即到即办。\n\n市政府办公厅、市大数据发展局\n\n59\n\n优化“渝快办”一窗综办受理系统，上线统一预约、统一叫号、统一登记、统一收件、统一分发、统一出证、统一物流、统一查询等功能，支撑跨地域、跨层级通办。\n\n市大数据发展局\n\n60\n\n深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。\n\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61"}, {"chunkIndex": 9, "text": "\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61\n持续优化惠企政策申请、受理、审核、兑现等全流程服务，推动惠企惠民政策文件和事项应上尽上、一站汇聚、精准查询、按需订阅，普惠性政策原则上全部纳入“免申即享”。\n\n市政府办公厅\n\n62\n\n推进企业之家建设，提供政策服务、法律服务、金融服务、人才服务、科创服务、国际贸易服务等增值化服务。\n\n各区县政府\n\n63\n\n持续开展“我陪群众走流程”“政务服务体验员”工作，对政务服务开展质效评价，优化企业群众感知促进效能提升。\n\n市政府办公厅\n\n三、提升法治环境专项行动\n\n（一）深入开展综合行政执法体制改革\n\n64\n\n修订《重庆市行政执法监督条例》。\n\n市司法局\n\n65\n\n修订《重庆市行政执法人员管理办法》。\n\n市司法局\n\n66\n\n打造“信用+”赋能超大城市治理综合场景矩阵，打通信用系统与专业执法、综合执法一体关联，迭代优化“信用+风险”监管模式，完善分级分类执法监管机制。\n\n市司法局、市发展改革委\n\n（二）加强涉企执法监督\n\n67\n\n迭代升级“执法+监督”数字平台，一体推进执法标准统一、流程规范、三级贯通、智慧辅助，全流程实现行政检查计划统筹、任务归并、扫码入企、监督评价，提升涉企执法规范化与透明度。\n\n市司法局\n\n68\n\n发布行政复议监督规范涉企行政执法典型案例，为规范涉企行政执法提供示范指引。\n\n市司法局\n\n（三）依法保护民营企业产权和企业家权益\n\n69"}, {"chunkIndex": 10, "text": "\n市司法局\n\n68\n\n发布行政复议监督规范涉企行政执法典型案例，为规范涉企行政执法提供示范指引。\n\n市司法局\n\n（三）依法保护民营企业产权和企业家权益\n\n69\n开展防范和打击侵害企业合法权益经济犯罪专项工作，依法惩治职务侵占、挪用资金、非国家工作人员受贿等民营经济组织内部腐败犯罪行为。\n\n市高法院、市检察院、市公安局\n\n70\n\n深入推进违规异地执法和趋利性执法司法专项监督，强化对涉企刑事案件强制措施适用的监督。\n\n市检察院\n\n71\n\n规范诉讼保全行为，严禁超权限、超范围、超数额、超时限查封、扣押、冻结财产，依法采用“活封活扣”方式，最大限度减少对涉案民营企业正常经营的影响。\n\n市高法院\n\n（四）加强知识产权保护\n\n72\n\n制定《重庆市知识产权保护中心分中心管理办法（试行）》，启动区县知识产权保护分中心建设，2026年支持3个有条件的区县建成知识产权保护分中心，缩短创新主体维权周期。\n\n市知识产权局\n\n73\n\n加强川渝知识产权行政保护合作，开展川渝知识产权保护联合执法行动，推动两地保护标准统一。\n\n市知识产权局\n\n74\n\n开展打击非正常专利申请和商标恶意注册专项行动，加大专利、商标等知识产权保护力度。\n\n市知识产权局\n\n75\n\n推动开发知识产权信息分析报告、风险预警简报等跨境信息公共服务产品，降低企业参与国际竞争的信息获取成本及风险。\n\n市知识产权局\n\n（五）提升法律服务水平\n\n76\n\n完善公益法律服务体系，常态化开展送法进企活动，举办专题培训、法治体检等系列活动200场次以上。\n\n市司法局\n\n77"}, {"chunkIndex": 11, "text": "\n（五）提升法律服务水平\n\n76\n\n完善公益法律服务体系，常态化开展送法进企活动，举办专题培训、法治体检等系列活动200场次以上。\n\n市司法局\n\n77\n深化“产业链+法律服务”活动，聚焦重点产业编制合规指引等法律服务产品，助力经营主体合规经营。\n\n市司法局\n\n78\n\n完善涉外法律综合服务，举办“渝法护航渝企出海”主题系列活动，加强企业“走出去”风险提示，提升企业抵御风险能力。\n\n市司法局\n\n79\n\n启动第二轮公证行业菁英人才培养计划，遴选公证人才进行分类培养，提升公证服务能力。\n\n市司法局\n\n80\n\n制定《重庆市培育中国特色的国际一流仲裁机构工作方案》，加快培育形成具有全国影响力的西部国际商事仲裁服务高地。\n\n市司法局\n\n四、提升市场环境专项行动\n\n（一）全面实施市场准入负面清单管理\n\n81\n\n全面落实《市场准入负面清单（2025年版）》，更新市场准入效能评估指标体系，全覆盖开展2025年度市场准入效能评估。\n\n市发展改革委\n\n82\n\n开展市场准入壁垒清理整治工作，进一步健全线索归集、核实整改、案例通报等长效机制，对照15类重点整治情形，常态化开展问题线索核查整改。\n\n市发展改革委\n\n（二）破除隐性门槛和不合理限制\n\n83\n\n制定《重庆市公平竞争审查条例》，建立健全公平竞争审查抽查机制。\n\n市市场监管局\n\n84\n\n深入开展民生领域反垄断执法与整治滥用行政权力排除、限制竞争专项行动，强化非理性竞争行为综合整治，曝光典型案例，维护市场秩序。\n\n市市场监管局\n\n85\n\n深化整治“内卷式”竞争，推动形成优质优价、良性竞争的市场秩序。"}, {"chunkIndex": 13, "text": "\n市工商联、市发展改革委、市经济信息委\n\n五、提升创新环境专项行动\n\n（一）加速集聚高端创新资源\n\n94\n提质建设明月湖科创园总部园区，复制推广明月湖科创园“教育+人才+科创+产业”模式，新建1个特色园区，为企业科技创新提供平台支撑。\n\n市科技局\n\n95\n\n持续支持有条件的大学建设前沿技术交叉研究院，实现研究院科研人员规模达到100人以上，培育科教融合、产教融合平台，赋能企业创新发展。\n\n市科技局\n\n（二）健全创新服务体系\n\n96\n\n提质推进高新技术企业和科技型企业“双倍增”行动计划，深入实施企业科技攻关联合行动计划、企业科技特派员团服务行动，力争新增高新技术企业1200家、科技型企业1万家。\n\n市科技局\n\n97\n\n全面推进职务科技成果单列管理、先使用后付费、以权代股、转化收益分配、技术转移职称评聘等“五项机制”改革，推动科研人员参与成果转化收益分配比例不低于70%。\n\n市科技局\n\n98\n\n支持高校师生通过科技成果转化进行创业，探索职务科技成果通过许可方式授权中小微企业使用，推动科技成果应用转化。\n\n市科技局\n\n99\n\n打造高水平科技型企业孵化器，推动科技成果孵化载体建成面积达到500万平方米以上，入驻初创企业和团队2万个以上，为更多企业提供创新服务。\n\n市科技局\n\n100\n\n提质发展大学科技园和环大学创新创业生态圈，引育创新创业企业500家，带动创新创业5000人。\n\n市科技局\n\n（三）加大科技投入力度\n\n101"}, {"chunkIndex": 14, "text": "\n100\n\n提质发展大学科技园和环大学创新创业生态圈，引育创新创业企业500家，带动创新创业5000人。\n\n市科技局\n\n（三）加大科技投入力度\n\n101\n组织实施2026年人工智能、生物医药等重大（重点）专项，加大财政资金支持力度，推动科技创新企业突破一批关键核心技术。\n\n市科技局\n\n102\n\n推广运用“创新积分制”，引导各类金融资源向科技型企业集聚，实现通过创新积分制服务企业1000家。\n\n市科技局\n\n103\n\n深化知识产权质押融资“高效办成一件事”服务，实现需求发布、银企对接、价值评估等“一站式”线上办理，推进质押融资扩面增量。\n\n市知识产权局\n\n（四）健全高素质人才梯次引育体系\n\n104\n\n持续实施“留创计划”，吸引留学人员来渝留渝创业就业，力争实现择优资助“留创计划”项目100个。\n\n市人力社保局\n\n105\n\n优化完善职称申报评审系统，全面实现职称申报、审核、评审、查询和领证等全流程线上办理，为申报人员提供便捷服务。\n\n市人力社保局\n\n106\n\n持续开展新重庆引才计划优秀青年专项工作，全年实现新认定120人以上。\n\n市人力社保局\n\n107\n\n持续开展国际技能认证，为中企海外雇员、赴境外就业人员、国外院校学生、国内职业院校留学生等群体认证发证500人次以上。\n\n市人力社保局\n\n108\n\n推动国际技能认证标准互通互认，开发共建国际技能标准5个。\n\n市人力社保局\n\n六、提升要素保障环境专项行动\n\n（一）强化能源保障\n\n109\n\n推进天然气大用户市场化交易试点，探索年用气量在1000万立方米以上大用户与上游供气企业开展直购直销。"}, {"chunkIndex": 15, "text": "\n（一）强化能源保障\n\n109\n\n推进天然气大用户市场化交易试点，探索年用气量在1000万立方米以上大用户与上游供气企业开展直购直销。\n市能源局\n\n110\n\n制定油气基础设施公平开放监管实施细则，持续推动管道和销售业务分离，强化油气基础设施自然垄断环节监管。\n\n市能源局\n\n111\n\n持续提升电力保障能力和供电可靠性，加快电力用户外线接入工程规划建设，优化完善220千伏及以下配电网，支撑企业新增用电需求。\n\n市能源局\n\n112\n\n加大企业新增绿电供给，制定出台绿电直连实施细则，科学推动风、光等新能源开发利用，力争新增新能源装机50万千瓦。\n\n市能源局\n\n（二）强化用地保障\n\n113\n\n聚焦“33618”现代制造业集群体系建设，对重大产业项目用地应保尽保，实现重大产业项目用地保障率达到100%。\n\n市规划自然资源局\n\n114\n\n支持工业企业采取长期租赁、先租后让、弹性年期出让等方式拿地，降低企业用地成本。\n\n市规划自然资源局\n\n115\n\n进一步简化用地用林用草审批环节涉及初步设计审查的事项，缩短建设用地报批前期组卷时间。\n\n市规划自然资源局\n\n（三）压减物流成本\n\n116\n\n深入落实《重庆市有效降低全社会物流成本若干措施》，推动社会物流总费用与地区生产总值的比率不高于13.3%。\n\n市政府口岸物流办\n\n117\n\n聚焦经营主体物流需求，以“量价捆绑”等形式为经营主体制定差异化综合物流解决方案。\n\n市政府口岸物流办\n\n118\n\n稳定开行西部陆海新通道江铁海联运班列，高效衔接“千里轻舟”，推动降低班列运行费用15%左右。"}, {"chunkIndex": 16, "text": "\n市政府口岸物流办\n\n118\n\n稳定开行西部陆海新通道江铁海联运班列，高效衔接“千里轻舟”，推动降低班列运行费用15%左右。\n市政府口岸物流办\n\n119\n\n推动实现大宗散货水运物流全链条信息实时共享，提升运输效率，降低经营主体运营成本。\n\n市政府口岸物流办\n\n（四）加强劳动力供给\n\n120\n\n发挥“渝悦就业”重点群体就业帮扶应用场景作用，落实就业援助政策，开展就业公共服务，全年促进登记失业人员就业15万人以上、就业困难人员就业8万人以上。\n\n市人力社保局\n\n121\n\n开展“百日千万招聘专项行动”“青年就业服务攻坚行动”等公共就业服务活动，确保离校未就业毕业生年底就业率达到90%以上。\n\n市人力社保局\n\n122\n\n依托全市初、中、高级创业导师队伍资源，通过开展进校园、访园区、扶项目等各类创业活动，为创业者提供针对性指导服务，全年服务创业者2万人次以上。\n\n市人力社保局\n\n123\n\n聚焦企业需求，大力开展民营企业服务月等就业公共服务专项活动，常态化服务企业用工，全年举办各类线上线下供需对接1000场次以上。\n\n市人力社保局\n\n（五）完善融资服务体系\n\n124\n\n加大对符合条件的企业上市融资和挂牌服务力度，充分发挥科创债作用，支持企业获得更多融资，推动新增上市挂牌企业5家。\n\n市委金融办、重庆证监局\n\n125\n\n提升“渝金通”数智金融服务平台实战实效能力，迭代升级民营小微金融、通道金融等特色场景，不断健全“股、贷、保、担”全生命周期金融产品服务体系。\n\n市委金融办\n\n126"}, {"chunkIndex": 19, "text": "\n市发展改革委\n\n140\n\n开展民营企业大调研大走访专项行动，主动问需、问困、问计于民营企业。\n\n市委统战部、市工商联\n\n141\n完善渝商e服务应用，优化“民企直通”应用场景，提高民企困难诉求办结率至95%以上。\n\n市委统战部、市工商联\n\n（二）常态化做好涉企服务\n\n142\n\n迭代建设“人工智能（AI）+企业码上服务”综合场景应用功能，实现政策精准推送与兑现、企业诉求智能响应与解决、企业发展智能赋能与服务，全方位精准、高效服务企业。\n\n市经济信息委\n\n143\n\n持续深化“服务企业专员”制度，加强“服务企业专员”队伍建设，将服务力量下沉到企业一线，变“企业找服务”为“服务找企业”。\n\n市经济信息委\n\n144\n\n持续优化中小企业公共服务平台，集聚专业服务机构，为经营主体提供全方位、专业化的第三方服务支持。\n\n市经济信息委\n\n145\n\n动态更新重庆市减轻企业负担政策措施清单，持续降低企业生产经营成本。\n\n市经济信息委\n\n（三）防范化解拖欠中小企业账款问题\n\n146\n\n健全防范和化解拖欠账款协同共治机制，开展清理拖欠企业账款专项行动，化解存量拖欠账款。\n\n市经济信息委\n\n147\n\n严格执行《保障中小企业款项支付条例》，提升拖欠中小企业账款维权投诉线索办理质效。\n\n市经济信息委\n\n九、正面典型推广和反面典型通报专项行动\n\n（一）大力宣传正面典型\n\n148\n\n发布《重庆市营商环境发展报告（2026）》，展示我市营商环境各领域进展成效。\n\n市发展改革委\n\n149"}, {"chunkIndex": 20, "text": "\n（一）大力宣传正面典型\n\n148\n\n发布《重庆市营商环境发展报告（2026）》，展示我市营商环境各领域进展成效。\n\n市发展改革委\n\n149\n总结改革成效、经验做法和典型案例，编制优化营商环境政策集和案例集，形成一批可复制、可推广的改革经验。\n\n市发展改革委\n\n150\n\n围绕《重庆市民营经济促进条例》开展系列宣传活动，常态化开展政策宣讲、政策解读、产融对接、项目推介等服务活动。\n\n市发展改革委\n\n151\n\n强化典型培树，发布重庆年度民营企业、制造业民营企业、民营企业科技创新指数等百强榜单。\n\n市工商联、市发展改革委、市经济信息委\n\n152\n\n持续开展“优化营商环境”“信用重庆”“打造民营经济发展高地”等主题宣传活动。\n\n市发展改革委\n\n（二）开展反面典型归集通报\n\n153\n\n通过区县自查、部门协查、第三方评估等方式，常态化归集扰乱市场公平竞争、政务服务不到位、涉企执法监管不规范、惠企政策落实不到位、政企沟通不顺畅等损害营商环境的问题线索。\n\n市发展改革委\n\n154\n\n完善损害营商环境问题核实机制，定期对问题整改情况进行通报，打通优化营商环境的堵点难点。\n\n市发展改革委\n\n（三）常态化开展损害营商环境的腐败和作风问题整治\n\n155\n\n聚焦行政审批、执法司法、招标投标等服务事项集中的重点行业、领域、部门，严查公职人员以权谋私、贪污受贿、权力寻租、利益输送、吃拿卡要等破坏营商环境的不正之风和腐败问题，通报曝光一批典型案例。\n\n市纪委监委机关\n\n156"}], "suggestDocId": 2097637766162927617, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 12 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-07-2", "category": "pair", "question": "在提升政务环境方面，重庆2026年有什么具体的数字化服务举措？", "answer": "提出建立个人和企业全生命周期数字档案，并深化全域无证明城市建设，推进“数据多跑路、群众少跑腿”，相关优化措施共15条。", "expectRefusal": false, "gold": [{"docId": 2097637766162927617, "chunkIndex": 8, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。", "text": "\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55\n加强省际间基本公共服务标准协同，推动川渝通办提质增效，实现基本公共服务同城化便利共享。\n\n市政府办公厅\n\n（三）全面强化政务服务数字赋能\n\n56\n\n优化“渝快办”平台服务体验，安全稳妥有序推进人工智能（AI）大模型运用，优化智能问答、智能搜索、智能导办、智能预审、智能分析、智能推荐等功能，整体提升政务服务智能化水平。\n\n市大数据发展局\n\n57\n\n深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。\n\n市大数据发展局\n\n58\n\n通过“渝快办”平台、“12345”热线联通全市各级政务服务窗口服务信息，开通线上预约、电话预约等服务，实现即到即办。\n\n市政府办公厅、市大数据发展局\n\n59\n\n优化“渝快办”一窗综办受理系统，上线统一预约、统一叫号、统一登记、统一收件、统一分发、统一出证、统一物流、统一查询等功能，支撑跨地域、跨层级通办。\n\n市大数据发展局\n\n60\n\n深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。\n\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61"}, {"docId": 2097637766162927617, "chunkIndex": 8, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。", "text": "\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55\n加强省际间基本公共服务标准协同，推动川渝通办提质增效，实现基本公共服务同城化便利共享。\n\n市政府办公厅\n\n（三）全面强化政务服务数字赋能\n\n56\n\n优化“渝快办”平台服务体验，安全稳妥有序推进人工智能（AI）大模型运用，优化智能问答、智能搜索、智能导办、智能预审、智能分析、智能推荐等功能，整体提升政务服务智能化水平。\n\n市大数据发展局\n\n57\n\n深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。\n\n市大数据发展局\n\n58\n\n通过“渝快办”平台、“12345”热线联通全市各级政务服务窗口服务信息，开通线上预约、电话预约等服务，实现即到即办。\n\n市政府办公厅、市大数据发展局\n\n59\n\n优化“渝快办”一窗综办受理系统，上线统一预约、统一叫号、统一登记、统一收件、统一分发、统一出证、统一物流、统一查询等功能，支撑跨地域、跨层级通办。\n\n市大数据发展局\n\n60\n\n深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。\n\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61"}], "source": {"pairId": "p-07", "policyDocId": 2097637766162927617, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市2026年度优化营商环境工作任务清单》的通知", "interpretDocId": 2097637772496326658, "interpretTitle": "《重庆市2026年度优化营商环境工作任务清单》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕18号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "全生命周期数字档案", "answerQuote": "提出建立个人和企业全生命周期数字档案、深化全域无证明城市建设推进“数据多跑路、群众少跑腿”等优化措施15条。", "candidateChunks": [8, 1, 3, 9, 2, 10, 4, 14, 12, 15, 18, 17], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 5, "naturalness": 5}, "issues": ["其他"], "reason": "标准答案中提到的“相关优化措施共15条”在提供的原文段落中无直接依据（原文仅列出序号56-60等具体任务，未统计总数），属于轻微外推或基于外部知识的补充，但核心事实（数字档案、无证明城市、数据多跑路）均有强证据支持且标注完整。", "suggestion": "", "suggest": [], "suggestDocId": 2097637766162927617, "fixable": false, "hint": ""}}, {"id": "A-p-08-1", "category": "pair", "question": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）主要包含哪些重点任务？", "answer": "包括现代化产业体系建设、科技创新能力突破、现代基础设施网络巩固提升、重点领域关键环节集成深化改革、欧亚大陆综合枢纽共建、西部金融中心建设提质、巴蜀特色国际消费目的地焕彩、高品质宜居生活悦享、“人工智能+”全要素支撑体系强基、西部引领和战略协同等十项行动。", "expectRefusal": false, "gold": [{"docId": 2097637766913708033, "chunkIndex": 7, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（三）实施现代基础设施网络巩固提升行动", "text": "术开展集中攻关，力争在量子科技、脑机接口、工业智能体等领域取得标志性原创成果。协同四川共建成渝绵“科技创新三角”、成渝中线科创走廊，打造国家重要的科研备份基地。\n5．强化科技创新和产业创新深度融合。健全“产业出题、科技答题”攻关体系，力争“416”科技创新成果数量实现翻番。协同四川建设一批概念验证中心、制造业中试平台，构建成渝地区共享型“中试+”服务网络。全面推广“教育+人才+科创+产业”模式，提质发展环大学创新创业生态圈，加快建设“模力高地”人工智能创新孵化生态社区。深化实施高新技术企业和科技型企业“双倍增”行动、科技领军企业培育行动，推动创新资源和要素向企业集聚。\n\n6．塑造教育科技人才一体化发展新格局。完善高水平研究型大学科技创新体系，提升教育部重庆高等研究院等融合创新平台效能。优化重大科技创新组织机制，推行“揭榜挂帅”等项目组织方式。加力实施“渝跃行动”和“新重庆引才计划”，加快集聚海外战略科学家、科技领军人才，完善新重庆人才服务等支持保障体系。探索职务科技成果权属制度改革，全面推行职务科技成果单列管理。加快全国高校区域技术转移转化中心（成渝地区）建设，会同四川推动全国科技成果在渝转化、重庆科技成果就地转化。\n\n（三）实施现代基础设施网络巩固提升行动\n\n构建系统完备、高效实用、智能绿色、安全可靠的现代基础设施网络，推动传统基础设施更新和数智化改造。到2030年，重庆高速公路通车里程达5700公里、高等级航道里程超1300公里，外电入渝能力达2600万千瓦，新增规模以上水利工程年供水能力14亿立方米，川渝铁路网里程达1.3万公里。"}, {"docId": 2097637766913708033, "chunkIndex": 14, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（七）实施巴蜀特色国际消费目的地焕彩行动", "text": "业及制造业中长期贷款增长。建立资产证券化工作机制，联合探索国有非公益性资产证券化的标准化路径与跨市场发行，推动建立基础设施REITs“首发+扩募”双轮驱动机制。\n19．提升金融服务实体经济能力。完善“股贷债保”“募投管退”科技金融综合服务体系，撬动耐心资本投早、投小、投长期、投硬科技。深化绿色金融改革创新试验区建设，推动产业绿色低碳转型与绿色金融、转型金融协同发展。强化对普惠小微、涉农、消费和民生领域金融服务供给，完善银担风险分担政策。推动养老金融赋能银发经济。迭代“渝金通”等数字金融系统，加快金融机构数字化转型。联合构建跨境金融服务体系，创新发展供应链金融和贸易融资。推进大宗商品期货交割库建设。完善金融支持加快西部陆海新通道建设细化措施，发挥通道金融服务中心、通道金联体等平台作用，提升金融服务大通道、大物流、大产业、大市场能力。\n\n（七）实施巴蜀特色国际消费目的地焕彩行动\n\n以推动巴蜀文化旅游走廊特色发展为重点，着力建设国际消费中心城市，基本建成具有全球吸引力的巴蜀特色国际消费目的地。到2030年，全市文化产业、旅游产业增加值占地区生产总值的比重均达5%，国内游客总花费达7700亿元，双城经济圈社会消费品零售总额达5.2万亿元。"}, {"docId": 2097637766913708033, "chunkIndex": 19, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（十）实施西部引领和战略协同行动", "text": "作模式。面向企业、高校、科研机构等发行算力券，探索开展跨区域用券合作。组建人工智能产业子基金，鼓励川渝企业联合打造开源社区。\n\n（十）实施西部引领和战略协同行动\n优化市域超大城市空间形态，持续完善特色鲜明、布局合理、集约高效的“双城”空间格局。高效联动重点城市群，深度对接国家区域重大战略，构建联结西南西北、带动新时代西部大开发的战略枢纽。到2030年，重庆主城都市区地区生产总值占双城经济圈的比重提升到30%，川渝两省市地区生产总值占全国的比重持续提升。\n\n30．优化双城经济圈协同发展格局。做强中心城区产业引领、科技创新等核心功能，推动两江新区地区生产总值突破8000亿元、西部科学城重庆高新区研发经费投入强度达5.8%。深化重庆成都双核联动联建，推动重庆都市圈与成都都市圈协同互动，共建成渝主轴经济走廊，一体推进资源要素整合、基础设施布局、特色产业发展。加力实施先进制造业发展“渝西跨越计划”。推动万州建设重要城市副中心、永川建设城市副中心、黔江建设区域中心城市，分类推进川渝毗邻地区合作。\n\n31．联动周边做强西部增长极。加强与西部省区交流互动，高水平共建西部陆海新通道，深化在能源、物流、产业等领域的合作。深化与关中平原、兰州—西宁等城市群联动，推动中欧班列（成渝）和中欧班列（西安）联动发展，引导航空航天、新型储能、电子信息等领域创新成果在渝转化。加强与黔中、滇中、北部湾城市群合作，推动渝桂出海大通道扩能提速，构建联结西南五省市的产业链供应链中心。深化与遵义、安康等联结型城市合作。"}, {"docId": 2097637766913708033, "chunkIndex": 4, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（一）实施现代化产业体系建设跨越行动", "text": "\n＜2\n\n＜1\n\n14\n\n川渝货物贸易进出口总额（万亿元）\n\n2\n\n2.2\n\n15\n\n中欧班列（成渝）开行量（列）\n\n4800\n\n以上\n\n4800\n以上\n\n16\n\n重庆经西部陆海新通道3种主要运输组织方式货运量（万标箱）\n\n41.5\n\n50\n\n17\n\n双城经济圈常住人口城镇化率（%）\n\n67.3\n\n68.5\n\n18\n\n双城经济圈（重庆规划范围内）全体居民人均可支配收入（万元）\n\n4.93\n\n5.39\n\n19\n\n“15分钟高品质生活服务圈”新建成数量（个）\n\n150\n\n300\n\n注：标“#”为其中的主要项。\n\n二、重点任务\n\n（一）实施现代化产业体系建设跨越行动\n\n加快构建以先进制造业为骨干、以生产性服务业为支撑的现代化产业体系，以“产业大脑+未来工厂”新模式牵引“四侧”协同、促进“四链”融合，迭代“33618”现代制造业集群体系，成渝地区形成高度集聚、高效分工、高度开放的区域产业生态。到2030年，重庆规上工业增加值年均增长6%左右，生产性服务业增加值占服务业增加值比重达60%左右。"}], "source": {"pairId": "p-08", "policyDocId": 2097637766913708033, "policyTitle": "重庆市人民政府关于印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》的通知", "interpretDocId": 2097637772546658306, "interpretTitle": "《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "十项重点任务", "answerQuote": "一是实施现代化产业体系建设跨越行动……二是实施科技创新能力突破行动……三是实施现代基础设施网络巩固提升行动……四是实施重点领域关键环节集成深化改革行动……五是实施欧亚大陆综合枢纽共建行动……六是实施西部金融中心建设提质行动……七是实施巴蜀特色国际消费目的地焕彩行动……八是实施高品质宜居生活悦享行动……九是实施“人工智能+”全要素支撑体系强基行动……十是实施西部引领和战略协同行动。", "candidateChunks": [7, 1, 14, 19, 0, 4, 16, 10, 2, 9, 17, 15], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失", "证据无关"], "reason": "标准答案列举了十项行动，但当前标注的证据段落（★）仅覆盖了部分行动的具体内容或指标表格，严重缺失其他行动的标题及核心描述段落，且包含大量与‘主要任务’宏观概括无关的细枝末节。", "suggestion": "需重新标注证据：应选取包含各行动标题（如“二、重点任务”、“（一）实施...”至“（十）实施...”）的段落作为核心证据。若文档结构为每个行动单独成段，则需确保所有十个行动的起始段落均被标为★；若文档将多个行动合并在少数段落中，则需覆盖这些合并段落。当前★4仅为指标表后半部分，★7/14/19仅为个别行动内部细节，无法支撑完整答案。", "suggest": [{"chunkIndex": 1, "text": "\n重庆市人民政府\n\n2026年4月26日\n\n（此件公开发布）\n\n重庆市推动成渝地区\n\n双城经济圈发展能级提升行动方案\n\n（2026—2030年）\n为深入学习贯彻习近平总书记关于推动成渝地区双城经济圈建设重要讲话重要指示批示精神，加快落实党中央关于“提升成渝地区双城经济圈发展能级”的战略部署，全面落实市委六届八次全会精神，在推动成渝地区双城经济圈建设中干出新业绩，特制定本行动方案。\n\n一、总体要求\n\n（一）指导思想\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平总书记视察重庆重要讲话重要指示精神，紧扣“两中心两地”战略定位和“三中心一走廊”部署要求，将成渝地区双城经济圈建设作为推进现代化新重庆建设的重大战略支撑，坚持全市域融入、全方位推进，着力打造更多“西部领先、全国进位和重庆辨识度”的标志性成果，推动成渝地区双城经济圈发展能级整体跃升，加快建设带动全国高质量发展重要增长极和新的动力源。\n\n（二）发展目标\n\n锚定到2030年高质量建成全国区域发展“第四极”的总体目标，全面增强成渝地区双城经济圈经济承载和辐射带动、创新资源集聚和转化、改革集成和开放门户、人口吸纳和综合服务功能，双城经济圈综合实力大幅提升，加快迈入具有国际影响力的现代化城市群行列。\n\n——综合经济实力实现争先进位。重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。"}, {"chunkIndex": 5, "text": "系，成渝地区形成高度集聚、高效分工、高度开放的区域产业生态。到2030年，重庆规上工业增加值年均增长6%左右，生产性服务业增加值占服务业增加值比重达60%左右。\n1．加速打造万亿级产业集群。提质建设具有全国影响力的智能网联新能源汽车之都，推进整车、零部件、后市场产业链生态重塑升级，巩固自动驾驶技术领先地位，促进产业品牌价值跃升，协同四川共建“氢走廊”“电走廊”“智行走廊”。巩固新一代电子信息制造业竞争优势，推出人工智能终端爆品20款以上。加快推动智能制造及装备成套、主机、零部件创新及应用。加快先进基础材料迭代、关键战略材料引育和前沿新材料开发，打造具有全国影响力的特色先进材料产业基地。加大特色食品研发力度，形成30个销售额过亿的食农产品。协同四川加速打造电子信息、智能网联新能源汽车、装备制造、先进材料、消费品、软件信息服务、食品及农产品加工等万亿级产业集群。\n\n2．培育新兴产业和未来产业爆发式增长点。加速标志性产品产业化，拓展城市治理、低空物流等“低空+”应用场景，低空产业规模突破500亿元，川渝低空经济形成领跑态势。加快发展以卫星互联网为引领的空天信息产业，以北斗规模应用试点城市建设带动时空信息产业高质量发展，协同四川打造世界领先的空天产业集群。围绕新消费热点培育新型人工智能终端，构建机器人全产业链生态，建成西部具身智能机器人产业高地。推动创新药研发，加强高端医疗器械等技术转化应用。协同四川推动脑机接口及脑科学、量子技术、沉浸技术等未来产业发展取得实质性突破，共建未来产业先导区。"}, {"chunkIndex": 6, "text": "器人产业高地。推动创新药研发，加强高端医疗器械等技术转化应用。协同四川推动脑机接口及脑科学、量子技术、沉浸技术等未来产业发展取得实质性突破，共建未来产业先导区。\n3．推动生产性服务业向专业化和价值链高端延伸。积极争取先进制造业与现代服务业融合发展试点，加速打造金融服务、现代物流、软件信息、设计咨询、科技研发服务5大优势产业集群。协同四川共建国际物流枢纽，保持社会物流成本占地区生产总值的比重低于全国平均水平。迭代软件和信息服务业“满天星”行动，加强汽车、卫星互联网等领域软件和智能体开发应用。加强工业设计大模型开发应用，培育市级工业设计中心350家以上。建强国家检验检测高技术服务业集聚区（重庆），打通“研发设计—中试验证—产业落地”科技研发服务链条。\n\n（二）实施科技创新能力突破行动\n\n以优化“416”科技创新布局为牵引，提升成渝综合性科学中心原始创新和关键技术研发能力，基本建成具有全国影响力的科技创新中心。到2030年，科创走廊体系全面构建，教育科技人才一体发展格局基本形成，重庆综合科技创新水平全国排名实现进位。\n\n4．增强成渝科技创新策源聚集能力。创建精密位移测量等领域全国重点实验室，推动金凤、嘉陵江、明月湖等重庆实验室提质增效，建成一批高能级科研机构和创新平台。围绕基础研究、颠覆性技术、关键核心技术开展集中攻关，力争在量子科技、脑机接口、工业智能体等领域取得标志性原创成果。协同四川共建成渝绵“科技创新三角”、成渝中线科创走廊，打造国家重要的科研备份基地。"}, {"chunkIndex": 8, "text": "路通车里程达5700公里、高等级航道里程超1300公里，外电入渝能力达2600万千瓦，新增规模以上水利工程年供水能力14亿立方米，川渝铁路网里程达1.3万公里。\n7．建设强赋能、深融合、高智能的新型基础设施。加快双千兆网络向双万兆网络演进升级，推广视联网等新型网络技术，适时启动6G网络商用。用好工业互联网标识解析国家顶级节点（重庆），工业互联网二级节点（西部）累计超60个。建设区块链数字基础设施，打造国家区块链网络西南枢纽。加强北斗导航增强系统建设，加大信关站、卫星互联网测运控中心等地面设施建设力度，推动商业卫星组网。推进一体化低空智能网联系统、低空经济智算中心建设。\n\n8．提质建设国家综合立体交通“第四极”。加快建设干支联动、客货并举的成渝世界级机场群，完善“一大四支”机场服务功能，推进重庆新机场前期工作。共建轨道上的双城经济圈，建成成渝中线、渝西、成达万、宜涪等出渝出川高铁，开工建设渝贵高铁，推进符合条件的城际铁路和市域（郊）铁路规划建设，推动开行高铁货运班列，提速建设轨道交通第四期项目。完善级配合理的公路体系，建成成渝高速改扩建等高速公路，开工建设沿江南线高速公路二期等项目，升级普通国省干线公路。构建“千里轻舟”多式联运集疏运体系，打通长江干线、嘉陵江、乌江、涪江等航道瓶颈，建设智慧航运平台。深化低空空域协同管理改革试点，新建功能型起降场、航空飞行营地和低空综合试验基地。"}, {"chunkIndex": 9, "text": "式联运集疏运体系，打通长江干线、嘉陵江、乌江、涪江等航道瓶颈，建设智慧航运平台。深化低空空域协同管理改革试点，新建功能型起降场、航空飞行营地和低空综合试验基地。\n9．建设现代化水网和新型能源体系。推进川渝东北一体化水资源配置、长征渠引水等跨流域、跨区域输配水通道工程前期工作，实施大中型灌区续建配套与现代化改造。建设长江上游干流防洪达标治理工程及防洪控制性水库，健全流域控制性水工程联合调度机制。开工建设疆电（南疆）送电川渝、川渝1000千伏特高压交流加强工程，完工渝黔背靠背联网工程，推动澜沧江上游水电基地送电入渝、成渝负荷中心特高压环网工程建设。建成川气东送二线工程，布局西南地区百亿立方米级天然气储气库群，共建川渝天然气千亿立方米产能基地。\n\n（四）实施重点领域关键环节集成深化改革行动\n\n坚持以经济体制改革为重点，协调推进各方面改革，打造更多首创性、差别化改革成果。到2030年，全市国资国企创新力控制力竞争力全面提升，民营经济活力充分激发，千亿级开发区达13个，民营经济增加值达2.5万亿元。\n\n10．加快推进区域市场一体化。落实全国统一的市场准入负面清单，迭代市场准入效能评估体系，强化竞争政策与产业政策协同。构建覆盖各类主体的社会信用体系，推动“信用成渝”建设。深化全市域要素市场化配置综合改革试点，构建要素配置数字化平台，建立要素“一本账”“一组库”，推进“准入—场景—要素”一体化改革，支持在园区开发区、生产性服务业集聚区等布局打造一批要素创新性配置场景，建设引领西部、服务全国、畅通内外的要素综合枢纽。"}, {"chunkIndex": 10, "text": "库”，推进“准入—场景—要素”一体化改革，支持在园区开发区、生产性服务业集聚区等布局打造一批要素创新性配置场景，建设引领西部、服务全国、畅通内外的要素综合枢纽。\n11．增强市场主体活力。深化国资国企改革，加大对央企来川渝发展的支持力度，打造具有全国影响力的知名企业品牌16个，推动市属国有企业资产总额年均增长5%左右。深化“亩均论英雄”改革，支持符合条件的开发区申创国家级经开区。持续实施新时代渝商培养计划，培育一批优秀民营企业家，壮大一批高成长性“超级个体·未来星”OPC企业。深化营商环境创新试点城市建设，完善民营企业参与重大项目建设长效机制，擦亮“投资川渝”品牌。协同四川建立场景联动机制，开放一批跨区域、跨领域综合性场景。\n\n12．深化经济区与行政区适度分离改革。协同四川探索建立统一编制、共同实施的规划管理体制，依规跨省统筹建设用地指标，优化税收分享等利益共享机制，推动机场、港口等领域企业采取共同出资、互相持股等方式促进高效运营。支持能源、电信等行业提供跨行政区服务，推进川渝电力市场一体化建设。有序向川渝高竹新区下放行政管理权限，推进经济事务一体化。优化市场准入“异地同标”、公平竞争审查等跨区域协作机制。\n\n（五）实施欧亚大陆综合枢纽共建行动\n\n健全以西部陆海新通道为牵引的多元化开放通道体系，成渝地区基本建成贯通欧洲—中国—东盟三大市场产业链供应链和物流贸易的枢纽。到2030年，全市货物进出口总额突破9000亿元，服务贸易进出口总额占西部地区的比重达10%，重庆自贸试验区累计新增自主培育重点制度创新成果247个。"}, {"chunkIndex": 11, "text": "易的枢纽。到2030年，全市货物进出口总额突破9000亿元，服务贸易进出口总额占西部地区的比重达10%，重庆自贸试验区累计新增自主培育重点制度创新成果247个。\n13．建强立体高效开放通道体系。提升西部陆海新通道物流和运营组织中心功能，提质建设数字陆海新通道，常态化开行中老泰全程时刻表班列，拓展中新、中老、中缅通道，积极参与中越“两廊一圈”建设，推动西部陆海新通道货物中转率超过50%。做强中欧（亚）班列集结中心，打造中欧班列—陆海新通道“东盟快班”品牌。完善铁水联运、江海直达运输服务体系，高效运行长江集装箱班轮航线。加快打造区位门户复合型国际航空枢纽，加力争取重点稀缺航权。\n\n14．建设内陆领先的高能级开放平台集聚区。以枢纽港产业园为重点，协同“五型”国家物流枢纽，加快打造物流枢纽经济区，探索以“多国多园”模式与东南亚国家共建跨境园区。增强中新互联互通项目辐射带动能力，打造数字经济、绿色发展、人工智能等新兴领域标志性合作成果。加快经开区、口岸、综合保税区等平台提级释能，推动各类开放平台设施互通、产业联动、功能叠加。推进川渝自贸试验区协同开放，加快建设西部国际邮政快递枢纽。"}, {"chunkIndex": 12, "text": "性合作成果。加快经开区、口岸、综合保税区等平台提级释能，推动各类开放平台设施互通、产业联动、功能叠加。推进川渝自贸试验区协同开放，加快建设西部国际邮政快递枢纽。\n15．打造制度赋能的向西向南国际经贸合作中心。探索陆上贸易规则体系建设，推动产权保护、政府采购、金融、科技等领域规则标准对接。优化货物贸易结构，推动渝车等渝品出口，加大大宗商品进口储备力度，争取打造大宗商品资源配置枢纽。培育数字、服务、离岸、绿色等贸易新增长点，实现服务贸易年均增长6%。实施外资提质增效计划，健全重大外资项目“直通车”制度。升级“百团千企”国际市场开拓计划，开展“侨助出海”行动，推动渝企有序布局海外市场。\n\n16．提升中西部国际交往中心全球影响力。深度融入共建“一带一路”，推动空中丝绸之路建设提质增效。打造服务国家总体外交的国际会客厅和面向“一带一路”的重要参访点，完善多元特色国际交往机制，争取国家主场外交活动、重大国际会议在渝举办，国际友好城市增至60对以上。加强川渝领馆事务合作，探索涉外证照颁发、文书领事认证等互办互认。优化涉外服务体系，吸引一批国际联盟、涉外机构落户，做强“留学重庆”品牌。提质建设西部国际传播中心，办好“陆海之约”“渝见世界”等活动。\n\n（六）实施西部金融中心建设提质行动\n\n迭代实施“智融惠畅”工程，做好金融“五篇大文章”，完善现代化产业链金融服务体系，全面构建区域数字金融运行体系。到2030年，重庆金融资产总额增长至12万亿元，跨境人民币结算规模扩大至4500亿元。"}, {"chunkIndex": 13, "text": "五篇大文章”，完善现代化产业链金融服务体系，全面构建区域数字金融运行体系。到2030年，重庆金融资产总额增长至12万亿元，跨境人民币结算规模扩大至4500亿元。\n17．推动成渝金融市场互联互通。推进资本要素市场化配置综合改革，优化数智化金融服务，探索资产联合挂牌与跨市场流转。完善同城化金融服务体系，促进两地金融信息归集、共享和应用。布局建设全国性交易平台交易系统，推动重庆石油天然气交易中心成为全国重要油气交易、定价、结算和资讯中心，加大对金融机构来川渝发展的支持力度。发挥成渝金融法院作用，完善金融纠纷多元化解机制。\n\n18．打造多层次资本市场体系。深化企业上市“千里马”行动，积极搭建并购重组对接平台。建立全生命周期股权投资基金体系，支持区域性股权市场开展“认股权+”业务模式创新，提高直接融资比重，发挥产业投资基金作用，鼓励企业及制造业中长期贷款增长。建立资产证券化工作机制，联合探索国有非公益性资产证券化的标准化路径与跨市场发行，推动建立基础设施REITs“首发+扩募”双轮驱动机制。"}, {"chunkIndex": 15, "text": "际消费目的地。到2030年，全市文化产业、旅游产业增加值占地区生产总值的比重均达5%，国内游客总花费达7700亿元，双城经济圈社会消费品零售总额达5.2万亿元。\n20．擦亮巴蜀文化旅游走廊“金名片”。做靓“雄奇山水·新韵重庆”文旅品牌，升级成渝古道和长江上游文化旅游带，打造两江四岸、自然遗产、红色记忆等精品线路。活化巴蜀文明标识，保护利用好川渝石窟寺、宋元山城防御体系、蜀道等文化遗址群，推进白鹤梁—埃及尼罗尺联合申遗，合力创建巴蜀文化生态保护区。实施入境旅游促进计划，升级“渝进蓉出”“蓉进渝出”联程线路，打造东南亚入境游首选地。\n\n21．推动商品消费和服务消费共生跃迁。积极发展购物旅游、赛事演艺、数字创意、智慧健康、养老家政等新模式新业态，做强“爱尚重庆·愉悦消费”等品牌，建成一批“山城后巷”“江崖街洞天”等消费新场景，鼓励传统商圈智慧化改造和闲置商业空间升级。大力发展智能原生技术、产品和服务体系。协同四川集聚壮大首发经济，鼓励“渝伴礼”“天府优选”等特色商品入驻免税店。\n\n22．推进国际化消费环境建设。深化国际消费中心城市建设，对消费载体新产业、新业态用地执行差异化供地价格，优化活动审批和安全许可流程。提升入境消费便利化水平，打造一批国际消费集聚区和入境消费友好型地标商圈。支持企业在渝开展国际物流分拨业务，按规定开辟通关服务绿色通道。加快形成退换货、质量追溯、明码标价、监管、评价的放心消费制度闭环。协同四川一体推进法治监管、信用监管、智慧监管，联合举办城市营销活动。\n\n（八）实施高品质宜居生活悦享行动"}, {"chunkIndex": 16, "text": "换货、质量追溯、明码标价、监管、评价的放心消费制度闭环。协同四川一体推进法治监管、信用监管、智慧监管，联合举办城市营销活动。\n\n（八）实施高品质宜居生活悦享行动\n推动公共服务共建共享、生态环境共保共治，建成包容和谐、美丽宜居、充满魅力的高品质生活区。到2030年，城市治理精细化智慧化水平明显提升，优质公共服务更加便利可及。重庆PM2.5浓度不超过国家下达标准、跨界河流国控断面优良水体比例达到国家考核要求。\n\n23．提升数智赋能“双城”超大城市治理水平。迭代一体化智能化公共数据平台，综合集成智能模块、算法模型等高频刚需组件。推动三级数字化城市运行和治理中心主轴功能全板块全跑道贯通实战，持续提升全域感知预警、数据高效支撑的底座能力。创新“大综合一体化”城市治理体制机制，迭代国土空间数据综合信息系统，完善“人工智能+城市更新规建运治一体化”实施路径。协同成都探索“双城”超大城市现代化治理新路子，构建跨区域城市智慧大脑和“双城”数字孪生体。\n\n24．提质扩面川渝公共服务便利共享。推动“15分钟高品质生活服务圈”全覆盖全市城市建成区，建设“渝邻汇”社区综合服务体。协同四川动态更新基本公共服务保障标准，完善基本公共服务与常住人口挂钩机制，推进以社会保障卡为载体的居民服务“一卡通”。协同四川建设国家临床重点专科群，拓宽医疗机构医学检验结果互认通道，争创国家区域公共卫生中心，扩大住房公积金转移接续和跨域使用受益群体，研究出台推动人口高质量发展的政策举措。"}, {"chunkIndex": 17, "text": "国家临床重点专科群，拓宽医疗机构医学检验结果互认通道，争创国家区域公共卫生中心，扩大住房公积金转移接续和跨域使用受益群体，研究出台推动人口高质量发展的政策举措。\n25．加快建设美丽中国先行区。坚持以“九治”为牵引，深入推进污染防治攻坚和生态系统优化。持续落实长江十年禁渔，开展长江沿线1公里化工腾退地块土壤污染专项治理。强化废动力电池等“新三样”固体废物循环利用，加快国家特殊危险废物区域处置中心建设。加快建立碳排放双控管理制度体系，推动非化石能源消费占比完成国家确定目标。协同四川持续推进川渝河长制联防联控联治，深化“六江”生态廊道建设，推动固体废物利用处置设施共享和跨省市协同应急处置。\n\n（九）实施“人工智能+”全要素支撑体系强基行动\n\n推动人工智能和“数字成渝”双向赋能，探索川渝算力、数据、应用场景、政策生态等关键要素协同联动，支撑成渝地区人工智能技术研发、应用和产业化。到2030年，成渝算力枢纽节点智能算力规模达10万P，全市建成10个以上人工智能行业应用中试基地，培育具有全国影响力的20个垂类大模型、5个重大项目，日均词元调用量西部领先。\n\n26．建强全国一体化算力网络成渝国家枢纽节点。打造“东数西算”核心承载区，以重庆数据中心集群为重点，推动本地高性能智能算力基础设施建设。提质扩容重庆（新疆）算力基地，迭代国家（西部）算力调度平台，实现多元异构算力灵活调度和统一服务。强化“疆电入渝”“疆算入渝”联动，推动数据设施绿电直供，新建算力设施绿色算力资源占比达80%，加快应用绿色节能和源网荷储等技术。"}, {"chunkIndex": 18, "text": "多元异构算力灵活调度和统一服务。强化“疆电入渝”“疆算入渝”联动，推动数据设施绿电直供，新建算力设施绿色算力资源占比达80%，加快应用绿色节能和源网荷储等技术。\n27．强化大模型开发利用。开放数字重庆人工智能底座，为模型研发与应用提供支持。聚焦智能网联新能源汽车、智能制造、低空经济等重点领域，协同开展行业大模型与垂类智能体关键技术攻关与产品研发。聚焦优势领域培育一批人工智能应用中试基地，加快建设人力资源国家人工智能应用中试基地，开展垂类大模型创新研发、性能评测、安全标准制定、产业化验证、规模化应用推广。\n\n28．以“数字成渝”建设丰富数据要素供给。健全“数字成渝”共建机制，构建覆盖政务服务、城市治理等重点领域的高质量数据集。鼓励市场主体参与公共数据授权运营，探索公共数据产品在统一市场规则下入场交易模式，完善数据产品上架挂牌、交付结算、交易存证等制度。加快建设可信数据空间，探索建立数据交易平台与可信数据空间协同机制、数据中介服务机构资质认证和服务质量评价体系。\n\n29．优化应用发展环境。做强重庆人工智能学院、重庆通用人工智能研究院、重庆信息与智慧医学研究院等平台，高起点建设重庆人工智能湾区，协同四川探索共建创新联合体、开发联盟等合作模式。面向企业、高校、科研机构等发行算力券，探索开展跨区域用券合作。组建人工智能产业子基金，鼓励川渝企业联合打造开源社区。\n\n（十）实施西部引领和战略协同行动"}], "suggestDocId": 2097637766913708033, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 13 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-08-2", "category": "pair", "question": "根据《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》，到2030年重庆的经济总量目标是多少？", "answer": "通过5年的努力，重庆经济总量超4万亿元，川渝两省市经济总量占全国比重持续提升。", "expectRefusal": false, "gold": [{"docId": 2097637766913708033, "chunkIndex": 1, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。", "text": "\n重庆市人民政府\n\n2026年4月26日\n\n（此件公开发布）\n\n重庆市推动成渝地区\n\n双城经济圈发展能级提升行动方案\n\n（2026—2030年）\n为深入学习贯彻习近平总书记关于推动成渝地区双城经济圈建设重要讲话重要指示批示精神，加快落实党中央关于“提升成渝地区双城经济圈发展能级”的战略部署，全面落实市委六届八次全会精神，在推动成渝地区双城经济圈建设中干出新业绩，特制定本行动方案。\n\n一、总体要求\n\n（一）指导思想\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平总书记视察重庆重要讲话重要指示精神，紧扣“两中心两地”战略定位和“三中心一走廊”部署要求，将成渝地区双城经济圈建设作为推进现代化新重庆建设的重大战略支撑，坚持全市域融入、全方位推进，着力打造更多“西部领先、全国进位和重庆辨识度”的标志性成果，推动成渝地区双城经济圈发展能级整体跃升，加快建设带动全国高质量发展重要增长极和新的动力源。\n\n（二）发展目标\n\n锚定到2030年高质量建成全国区域发展“第四极”的总体目标，全面增强成渝地区双城经济圈经济承载和辐射带动、创新资源集聚和转化、改革集成和开放门户、人口吸纳和综合服务功能，双城经济圈综合实力大幅提升，加快迈入具有国际影响力的现代化城市群行列。\n\n——综合经济实力实现争先进位。重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。"}, {"docId": 2097637766913708033, "chunkIndex": 2, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。", "text": "\n——综合经济实力实现争先进位。重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。\n——世界级先进制造业集群优势加快形成。重庆智能网联新能源汽车之都、人工智能应用高地、低空经济创新发展强市成势见效，形成一批具有全球市场影响力的领军企业、主流产品、高端品牌。\n\n——高水平区域创新中心领跑突破。重庆综合科技创新水平指数、研发经费投入强度保持西部第1，突破关键核心技术和培育重大产业技术创新产品数量实现倍增，成渝地区创新能力从参与跟跑向面上提速竞跑、点上主动领跑跃升。\n\n——链接欧亚大陆经济走廊的战略枢纽基本建成。重庆成为集聚配置全球高端要素的重要承载地，成渝地区外贸进出口占西部比重达45%。基本建成西部陆海新通道投融资和结算体系，打造立足西部、面向东亚和东南亚、南亚，服务共建“一带一路”国家的西部金融中心。\n\n——进一步全面深化改革红利加速释放。加快探索超大城市现代化治理新路子，数智赋能城市发展服务安全治理水平走在全国前列。川渝统一大市场基本建成，营商环境达到全国一流水平。\n\n——生态宜居水平和人口集聚力居中西部前列。成渝地区双城经济圈人口吸纳能力持续增强，主要环境指标优于全国平均水平，成为具有显著吸引力的高品质生活宜居地，重庆在世界城市体系中的排名持续上升。\n\n——打造区域高水平协作样板。川渝“一体两核多点”区域发展聚合效应加速释放，构建以成渝地区为中心联接西南西北、带动新时代西部大开发的战略枢纽，支撑形成东南西北四极牵引、内陆沿海互促共进的区域发展新格局。"}], "source": {"pairId": "p-08", "policyDocId": 2097637766913708033, "policyTitle": "重庆市人民政府关于印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》的通知", "interpretDocId": 2097637772546658306, "interpretTitle": "《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕8号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "经济总量超4万亿元", "answerQuote": "重庆经济总量超4万亿元，川渝两省市经济总量占全国比重持续提升。", "candidateChunks": [1, 2, 0, 3, 19, 4, 13, 14, 20, 15, 9, 12], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 4, "naturalness": 5}, "issues": ["证据无关"], "reason": "答案准确且可答，但标注的证据段落[1]为文件头/前言，与具体经济总量数据无直接关联，属于冗余标注；核心证据在段落[2]。", "suggestion": "", "suggest": [], "suggestDocId": 2097637766913708033, "fixable": false, "hint": ""}}, {"id": "A-p-09-1", "category": "pair", "question": "重庆市推动经济稳中向好若干政策举措主要包含哪些方面的支持措施？", "answer": "该政策涉及促进消费、扩大投资、产业升级、经营主体、就业创业5个方面，共32项具体举措。", "expectRefusal": false, "gold": [{"docId": 2097637767136006145, "chunkIndex": 0, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "重庆市推动经济稳中向好若干政策举措", "text": "---\r\ntitle: \"重庆市人民政府办公厅关于印发《重庆市推动经济稳中向好若干政策举措》的通知\"\r\nfileNum: \"渝府办发〔2026〕22号\"\r\npubDate: 2026-04-30 18:26:39\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/xzgfxwj/szfbgt/202604/t20260430_15650406.html\r\nmetadataId: 15650406\r\nchannelId: 142846\r\nsubcat: 893\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅\n\n关于印发《重庆市推动经济稳中向好\n\n若干政策举措》的通知\n\n渝府办发〔2026〕22号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市推动经济稳中向好若干政策举措》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年4月30日\n\n（此件公开发布）\n\n重庆市推动经济稳中向好若干政策举措\n\n为深入贯彻党的二十届四中全会和习近平总书记视察重庆重要讲话重要指示精神，全面落实市委经济工作会议部署，着力稳预期、强信心、增活力，进一步巩固全市经济稳中向好态势，确保“十五五”开好局起好步，制定以下政策举措。\n\n一、挖掘释放消费潜力"}, {"docId": 2097637767136006145, "chunkIndex": 13, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "五、加力推进就业创业", "text": "精特新优势团队、高校院所科技成果转化项目等各类团队和企业申报市级种子基金。（责任单位：市财政局、市发展改革委、市委金融办、市科技局、重庆证监局、人行重庆市分行）\n29﹒支持企业信用修复。对已补报年报、已变更住所或名称的失信经营主体实行“免申即修”，推行多元“信用预警”提示服务，多项失信事项“并联修复、一次办结”，辅助材料欠缺或存在轻微瑕疵的书面承诺补齐后“容缺受理”，实施关联企业联动信用修复。（责任单位：市市场监管局）\n\n五、加力推进就业创业\n\n30﹒深入推进重点群体稳岗就业。延续实施促进农民工就业补贴政策，新招用返乡农民工并依法依规缴纳城镇职工养老保险的企业，可享受一次性补贴。延续实施县域大学生就业补贴政策，对到城口县、丰都县、忠县、垫江县、云阳县、奉节县、巫山县、巫溪县、石柱县、秀山县、酉阳县、彭水县等12个县的企业就业，签订劳动合同并缴纳社会保险费的毕业年度高校毕业生和离校5年内的高校毕业生（离校时间以毕业年度的7月1日起算），按照学历层次进行补贴，补贴时间最长3年。持续扩大“稳岗贷”与创业担保贷款联动组合贷款支持范围与支持额度，支持政府性融资担保机构进一步下调“稳岗贷”担保费率，从原则上不高于0.8%下调到0.6%，2026年力争发放“稳岗贷”280亿元。（责任单位：市人力社保局、市财政局、人行重庆市分行、重庆金融监管局）"}, {"docId": 2097637767136006145, "chunkIndex": 1, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "一、挖掘释放消费潜力", "text": "全面落实市委经济工作会议部署，着力稳预期、强信心、增活力，进一步巩固全市经济稳中向好态势，确保“十五五”开好局起好步，制定以下政策举措。\n\n一、挖掘释放消费潜力\n1﹒用好国家以旧换新政策。在国家明确的支持范围内重点支持促进优质供给、推进绿色低碳生产的优质消费产品，对个人消费者实施汽车报废更新、汽车置换更新、6类家电产品（冰箱、洗衣机、电视、空调、电脑、热水器）以旧换新、4类数码和智能产品（手机、平板、智能手表手环、智能眼镜）购新、智能家居产品（含适老化产品）购新补贴。（责任单位：市发展改革委、市商务委；各单位按职责分工负责，下同）\n\n2﹒实施汽车家电消费补贴。2026年5月1日—12月31日期间，按照“总额控制、先报先得、用完即止”原则，对在参与消费补贴活动的汽车经销商购买乘用车新车的个人消费者，按购车价格分档给予补贴；对在参与消费补贴活动的二手车经销企业购买二手车的个人消费者给予一定补贴；对个人消费者购买吸油烟机、家用灶具、净水器、洗碗机、微波炉、电饭煲等1级能效（水效）产品给予一定补贴。以上政策与国家消费品以旧换新政策不重复享受。（责任单位：市商务委、市财政局）\n\n3﹒实施“渝悦消费”主题消费促进活动。以“购在中国·爱尚重庆”为主题，举办“中国（重庆）国际消费节”“不夜重庆生活节”“精品消费月”“火锅美食文化节”等主题消费促进活动，重点围绕零售、餐饮、住宿等领域，向个人消费者发放满减、代金、折扣消费券。鼓励各级工会组织创新会员福利实现形式，推出面向职工及家人的文旅体产品，用好职工福利经费。（责任单位：市商务委、市财政局、市总工会）"}, {"docId": 2097637767136006145, "chunkIndex": 8, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "三、加快现代产业体系优化升级", "text": "目全周期”应用功能，通过数据共享避免重复提交，将全流程办理时限压缩至50个工作日以内。（责任单位：市发展改革委、市大数据发展局）\n\n三、加快现代产业体系优化升级\n17﹒培育未来产业标志性产品和应用场景。鼓励企业加大重点领域关键核心技术攻关，对开发培育未来产业标志性产品的企业，依法依规给予50万元支持。鼓励企业加快场景培育和开放，推动新场景大规模应用，对建设“工业母机+”“机器人+”“低空装备+”“农机装备+”等应用场景的企业，依法依规给予最高50万元支持，每个企业年度累计获得的支持资金最高不超过100万元。（责任单位：市经济信息委、市科技局、市财政局）\n\n18﹒深入实施“人工智能+”行动。对开展人工智能大模型训练推理、数据标注、数据分析等算力应用的并在相关算力调度平台或与之联通的第三方平台购买智能算力服务的企业、高等院校、科研机构等，依法依规给予算力补贴，每个单位每年补贴最高不超过100万元。对高质量数据集项目依法依规给予最高不超过50万元的奖励。对可信数据空间项目依法依规给予最高不超过100万元的奖励。（责任单位：市大数据发展局、市科技局、市财政局）\n\n19﹒推动食品及农产品加工业高质量发展。对有实际生产经营活动的食品及农产品加工企业及新型农业经营主体的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。对符合农产品初加工用电政策执行范围的，执行农业生产用电价格。（责任单位：市农业农村委）"}], "source": {"pairId": "p-09", "policyDocId": 2097637767136006145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推动经济稳中向好若干政策举措》的通知", "interpretDocId": 2097637772605378562, "interpretTitle": "重庆市推动经济稳中向好若干政策举措政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕22号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "5个方面32项", "answerQuote": "《政策举措》涉及促进消费、扩大投资、产业升级、经营主体、就业创业5个方面、32项具体举措", "candidateChunks": [0, 13, 10, 1, 3, 8, 11, 4, 14, 5, 12, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案准确概括了政策五大方面及32项举措，但当前标注的证据段落（★0, ★1, ★8, ★13）仅覆盖了部分章节标题或中间内容，严重缺失‘二、扩大有效投资’和‘四、帮助经营主体降本增效’的起始标题段落，导致无法从证据中完整推导出‘5个方面’这一核心结论。", "suggestion": "补充标注包含各主要章节标题的段落作为证据。具体需增加：[1]（含‘一、挖掘释放消费潜力’标题）、[8]（含‘三、加快现代产业体系优化升级’标题）、[13]（含‘五、加力推进就业创业’标题）。同时，必须找到并标注包含‘二、扩大有效投资’和‘四、帮助经营主体降本增效’标题的段落（根据原文结构推测可能在未标★的段落中，如[6]附近或[11]附近，需人工核对确切编号后加入gold list），以确保所有5个方面的标题均有据可查。", "suggest": [{"chunkIndex": 1, "text": "全面落实市委经济工作会议部署，着力稳预期、强信心、增活力，进一步巩固全市经济稳中向好态势，确保“十五五”开好局起好步，制定以下政策举措。\n\n一、挖掘释放消费潜力\n1﹒用好国家以旧换新政策。在国家明确的支持范围内重点支持促进优质供给、推进绿色低碳生产的优质消费产品，对个人消费者实施汽车报废更新、汽车置换更新、6类家电产品（冰箱、洗衣机、电视、空调、电脑、热水器）以旧换新、4类数码和智能产品（手机、平板、智能手表手环、智能眼镜）购新、智能家居产品（含适老化产品）购新补贴。（责任单位：市发展改革委、市商务委；各单位按职责分工负责，下同）\n\n2﹒实施汽车家电消费补贴。2026年5月1日—12月31日期间，按照“总额控制、先报先得、用完即止”原则，对在参与消费补贴活动的汽车经销商购买乘用车新车的个人消费者，按购车价格分档给予补贴；对在参与消费补贴活动的二手车经销企业购买二手车的个人消费者给予一定补贴；对个人消费者购买吸油烟机、家用灶具、净水器、洗碗机、微波炉、电 768713064450, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市全面深化零基预算改革实施方案》的通知", "interpretDocId": 2097637772659904513, "interpretTitle": "重庆市全面深化零基预算改革实施方案", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕32号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "三个部分主要内容", "answerQuote": "《实施方案》包括三个部分内容：（一）总体要求……（二）主要举措。可归纳为“四统、四立、四严、四强化”。（三）组织保障。", "candidateChunks": [1, 0, 2, 10, 3, 6, 4, 9, 5, 7, 8], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案准确概括了政策全文结构（三部分）及核心举措（四统四立等），但当前仅标注了第1段作为证据，严重缺失支撑‘主要举措’具体内容和‘组织保障’存在的其他关键段落。", "suggestion": "需将包含方案整体结构、主要举措详细条目（如统一预算分配权、创新预算编制方式等）以及组织保障内容的段落全部补充为 gold 证据。建议标注 [0] (标题/通知), [1] (总体要求/目标), [2]-[9] (主要举措各分项), [10] (组织保障)。", "suggest": [{"chunkIndex": 0, "text": "---\r\ntitle: \"重庆市人民政府办公厅关于印发《重庆市全面深化零基预算改革实施方案》的通知\"\r\nfileNum: \"渝府办发〔2026〕32号\"\r\npubDate: 2026-07-22 17:54:29\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202607/t20260722_15842955.html\r\nmetadataId: 15842955\r\nchannelId: 121935\r\nsubcat: 881\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅\n\n关于印发《重庆市全面深化零基预算改革\n\n实施方案》的通知\n\n渝府办发〔2026〕32号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市全面深化零基预算改革实施方案》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年7月20日\n\n（此件公开发布）\n\n重庆市全面深化零基预算改革实施方案\n\n为全面贯彻党的二十届三中全会关于深化零基预算改革的部署，深入推进财政科学管理，提高财政资源配置效率和资金使用效益，根据《中华人民共和国预算法》及其实施条例精神，结合我市实际，制定本方案。\n\n一、总体要求"}, {"chunkIndex": 1, "text": "算改革的部署，深入推进财政科学管理，提高财政资源配置效率和资金使用效益，根据《中华人民共和国预算法》及其实施条例精神，结合我市实际，制定本方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届历次全会精神，深入贯彻习近平总书记视察重庆重要讲话重要指示精神，围绕市委、市政府关于加快构建现代预算制度、全面深化零基预算改革工作要求，在全市范围内全面深化零基预算改革，与加强中期财政规划管理、建立健全政府综合财务报告制度、推进省以下财政体制改革有机融合、协同推进，创新预算管理方式，打破支出固化格局，构建事财匹配、全量统筹、突出重点、厉行节约、讲求绩效的预算分配机制，增强财政可持续高质量发展能力，为奋力谱写中国式现代化重庆篇章提供有力支撑。\n\n到2026年底，市级部门和区县全面深化零基预算改革，在统一预算分配权、统筹财政资源、统管支出政策、统揽大事要事保障等方面取得显著进展，基本完成数字赋能建设任务，财政支出结构得到实质性优化。\n\n到2027年底，零基预算改革各项机制进一步健全，预算编审决策更加科学，财政支出结构更加优化，支出标准体系、预算绩效管理、财会监督等配套改革措施基本完备，财政科学管理水平全面提升。\n\n二、主要举措\n\n（一）明确重点改革任务"}, {"chunkIndex": 2, "text": "更加科学，财政支出结构更加优化，支出标准体系、预算绩效管理、财会监督等配套改革措施基本完备，财政科学管理水平全面提升。\n\n二、主要举措\n\n（一）明确重点改革任务\n1﹒统一预算分配权。坚持党委、政府当家理财，财政部门组织保障，各部门参与实施，确保预算安排与党委、政府决策部署保持一致。严禁出台溯及以前年度的增支政策，新的增支政策原则上通过以后年度预算安排。确需当年安排新增支出预算的，应优先整合本领域资金。部门在向同级政府提出新增支出政策、新设专项资金、提标扩围、加大财政投入等建议前，需经财政部门确认。重大涉财事项，严格按照市委、市政府“三重一大”事项决策程序，报市委、市政府决策。进一步细化年初预算，压减代编预算规模，减少年度中二次分配。推动跨部门资金统筹整合，对目标相近、内容类同的财政资金明确牵头主管部门和配合部门，实现目标共商、政策共定、项目共管。\n\n2﹒统筹财政资源。加强政府性资源统筹，将依托行政权力、政府信用、国有资源（资产）获取的收入等全面纳入预算管理，健全国有资本收益上交机制，扩大收缴范围、提高收取时效。加强政府预算统筹，加大政府性基金预算、国有资本经营预算与一般公共预算的统筹力度，强化转移支付与本级资金、地方政府债务资金有机衔接。加强财政拨款与非财政拨款的统筹，强化非财政拨款资金监管，优先使用事业收入、经营收入等非财政拨款安排支出，在非财政拨款可以满足支出需求时，原则上不再安排财政拨款。加强存量资金资产统筹，有计划、分批次盘活各类结转结余资金，以及通过财政资金投入形成的各类资产。"}, {"chunkIndex": 3, "text": "安排支出，在非财政拨款可以满足支出需求时，原则上不再安排财政拨款。加强存量资金资产统筹，有计划、分批次盘活各类结转结余资金，以及通过财政资金投入形成的各类资产。\n3﹒统管支出政策。全面清理规范各类财政支出政策，建立权责清晰、规范统一、动态管理的财政支出政策库（以下简称政策库）。对地方存量支出政策逐项开展评估，提出延续、调整、退出三类意见，严格控制政策提标、扩围、延期。从严控制新增支出政策，新增支出政策严格履行合理性、相关性、一致性评估程序，未通过评估的支出政策，不得安排预算资金。结合年度预算编审，建立健全财政支出政策评估与动态调整、退出机制，重点清理已到期、不符合发展需要、低效无效、交叉重复的支出政策。压实部门主体责任，坚持“谁出台、谁清理、谁负责”，规范清理流程，完善政策库。\n\n4﹒统揽大事要事保障。建立“清单—政策—项目—资金”贯通衔接机制。围绕党中央、国务院决策部署和市委、市政府重点工作安排，制定全市统一的大事要事财政保障清单（以下简称清单），定期评估、动态更新。立足清单，全面梳理清单对应政策，并根据有关政策编制预算项目，让大事要事精准落实到具体可执行的项目上。财政部门和发展改革等行业主管部门要做好项目对接工作，按照项目具体情况筹集匹配资金来源，实施全生命周期管理，确保大事要事财政保障到位。\n\n（二）创新预算编制方式"}, {"chunkIndex": 4, "text": "。财政部门和发展改革等行业主管部门要做好项目对接工作，按照项目具体情况筹集匹配资金来源，实施全生命周期管理，确保大事要事财政保障到位。\n\n（二）创新预算编制方式\n5﹒立新除旧取消资金分配基数。打破部门预算基数，取消支出固化盘子，所有部门预算安排根据其承担的重点任务、履职任务、基本需求重新核定，国家法律对经费投入增长有明确规定的除外。打破重点专项基数，所有重点专项按照年度实际支付需求或年度申报核准金额据实编制，不再预留额度，将财力向成熟度高的优质项目倾斜。打破转移支付基数，以战略部署、区县发展需求、财力状况为核心依据，科学合理测算分配额度，动态调整预算安排。\n\n6﹒立制建章实施支出分类管理。根据支出性质和用途，合理划分支出类别、厘清支出边界。基本支出，用于保障运转，分为人员经费和公用经费，根据支出标准定额编制。一般性项目，用于保障履职工作，按共性、通用类别动态划分，确保同类可比、标准统一，重点推进对编外聘用人员、政府购买服务等领域支出的管控。重点专项，用于保障党中央、国务院重大决策部署和市委、市政府重点工作安排，分为社会民生类、产业发展类和城乡建设及运行类等3类，其中社会民生类坚持兜牢底线、产业发展类坚持引导撬动、城乡建设及运行类坚持项目驱动，进一步突出重点专项资金的基础性、公益性、普惠性，进一步明确区分财政保障范围和市场自主调节领域，规范财政补贴政策。"}, {"chunkIndex": 5, "text": "展类坚持引导撬动、城乡建设及运行类坚持项目驱动，进一步突出重点专项资金的基础性、公益性、普惠性，进一步明确区分财政保障范围和市场自主调节领域，规范财政补贴政策。\n7﹒立序择优明确支出轻重缓急。坚持量入为出，科学测算财力限额，对应支出排序精准安排，一次性收入原则上不能用于安排经常性支出。基本支出，按照支出标准足额保障，确保各部门正常运转。一般性项目，结合支出标准和党政机关过紧日子要求从严从紧安排，大力压减非刚性、非急需支出。重点专项，优先保障基本民生、债务还本付息、延续性政策及项目等重点支出。其余各项支出需求，依据政策层级、标准完善度、项目成熟度、绩效评价和监督检查结果等，进行科学排序。前序支出未足额保障的，不得安排后序支出。\n\n8﹒立规严审强化财政预算评审。在支出分类管理和排序的基础上，坚持“先评审后安排预算”。强化智能初评，依托数字财政综合应用，进行支出标准、历史数据比对，注重绩效评价、监督检查等结果运用。优化公开评审，一般性项目分类拉通评审，重点关注同类项目跨部门支出标准核定和应用，推动降本增效；重点专项强化前置政策审核，重点关注与大事要事衔接情况，推动预算统筹整合。完善联评联审机制，引入第三方机构评审，重点听取人大、政协、审计机关等对财政政策清理、预算编制的意见建议；完善财政与发展改革等行业主管部门项目联评联审机制，强化评审结果运用。\n\n（三）硬化预算刚性约束"}, {"chunkIndex": 6, "text": "重点听取人大、政协、审计机关等对财政政策清理、预算编制的意见建议；完善财政与发展改革等行业主管部门项目联评联审机制，强化评审结果运用。\n\n（三）硬化预算刚性约束\n9﹒严格规范预算执行。严格按照规定做好预算批复、下达、公开工作，确保按时限要求落实到位。压实预算管理向末梢延伸的责任链条，强化部门和单位预算管理主体责任。健全预算执行常态化监督机制，对收支进度、合规性、绩效目标完成情况实行监测，持续提升预算执行的规范性与严肃性。落实问题“感知预警、决策处置、监督评价、复盘改进”闭环机制，重点整治虚报冒领、挤占挪用、违规使用等问题，以及发现问题不及时、协同整改不到位等现象。\n\n10﹒严控预算执行变更。严格执行人大批准的预算，预算非经法定程序不得调整，严禁超预算、无预算安排支出、配置资产或开展政府采购。严控预算追加，年度执行中原则上不追加预算，确需追加的在规定时间内履行规范程序集中办理。严格预算调剂，严控调剂事项，规范调剂审核机制，将调剂频次及金额情况与次年预算安排衔接。严格预算收回，每年6月底前仍未细化分配的资金一律收回统筹，年底未执行完的部门预算，继续实施“零结转”收回。"}, {"chunkIndex": 7, "text": "调剂审核机制，将调剂频次及金额情况与次年预算安排衔接。严格预算收回，每年6月底前仍未细化分配的资金一律收回统筹，年底未执行完的部门预算，继续实施“零结转”收回。\n11﹒严守过紧日子要求。严格贯彻落实中央八项规定及其实施细则精神，坚持勤俭办一切事业，推动党政机关习惯过紧日子成为常态。从严核定部门运转经费，持续严控会议费、培训费、差旅费、劳务费、委托业务费等一般性支出，“三公”经费只减不增。从严控制楼堂馆所建设、维修改造及信息化项目建设成本，严格执行、持续完善通用与专用资产配置标准，规范政府采购与政府购买服务。强化资产配置审核，推动行政事业单位国有资产跨部门、跨层次、跨地区调剂共享。建立投资项目审批与建设管控机制，严禁脱离实际建设“形象工程”“政绩工程”，坚决遏制过度举债搞建设、超财政承受能力上项目等行为。\n\n12﹒严明激励约束机制。深化预算编制质量、预算执行进度、预算追加和预算调剂事由分析，推动年度预算安排与预算编制、预算执行、资金管理情况、绩效评价结果以及巡视、审计、财会监督等发现问题挂钩。原则上优先保障执行效果好、资金管理强、绩效评价优、监督检查问题少的项目，压减或取消预算执行率低、绩效较差、发现问题较多的项目，体现预算奖优罚劣导向。强化区县财政运行质效评价分析，将评价结果作为市对区县转移支付分配的参考因素。\n\n（四）系统推进配套改革"}, {"chunkIndex": 8, "text": "率低、绩效较差、发现问题较多的项目，体现预算奖优罚劣导向。强化区县财政运行质效评价分析，将评价结果作为市对区县转移支付分配的参考因素。\n\n（四）系统推进配套改革\n13﹒强化支出标准建设。分类分步推进支出标准体系建设，强化支出标准动态精细管理，建立全市支出标准共享库。公用经费支出标准，实行综合定额和单项定额相结合的方式，按照地区经济社会发展水平和单位履职需要，分级次、分事项科学核定。一般性项目支出标准，按照支出分类体系，分年度全覆盖构建，逐步实现一般性项目预算编制“按类定项、按项定标、按标编报、按标审核”。重点专项支出标准，分社会民生类、产业发展类、城乡建设及运行类三大领域，健全“3+N”标准体系，支撑重点专项预算编制按“政策清单—标准体系—预算安排”落实。\n\n14﹒强化预算绩效管理。健全绩效管理制度体系，将预算收支全面纳入绩效管理，建立覆盖部门、政策、项目，贯穿事前评估、目标管理、绩效监控和绩效评价全过程的管理制度。加快建设覆盖市与区县“共性+行业”绩效指标体系。加力绩效运行双监控，实现项目实施风险预警纠偏，建立项目支出“调慢补快”机制。深化实施“部门自评+重点评价+综合评价”多维立体评价体系，探索构建“事前评估+预算评审+绩效评价”全程闭环联动机制，强化绩效结果应用刚性约束。"}, {"chunkIndex": 9, "text": "“调慢补快”机制。深化实施“部门自评+重点评价+综合评价”多维立体评价体系，探索构建“事前评估+预算评审+绩效评价”全程闭环联动机制，强化绩效结果应用刚性约束。\n15﹒强化监督检查管理。推进行政事业单位财务管理“三基一化”建设，推广数智报账系统，完善“五元一体”财会监督体系，压实财政部门主责监督、有关部门依责监督、各单位内部监督、中介机构执业监督、行业协会自律监督等各方责任。持续开展财会监督质效提升行动、地方财经纪律专项整治，严肃查处违反财经纪律的行为。加强财会监督与纪检监察监督、巡视巡察监督、人大监督、审计监督等贯通协调，推动重点监督协同、重大事项会商、线索移交移送、整改共促、结果共用。\n\n16﹒强化数字财政赋能。以数字财政改革为牵引，全链条重构收入管理、预算编制、预算执行、绩效评价等四大预算管理核心业务，强化运行监测，推动协同处置，促进“制度+技术”深度融合。收入管理全口径归集，形成各类收入大统筹的一本账格局；预算编制全要素评估，强化政策项目评审，从源头防范低效无效支出，提高资金配置效率；预算执行全过程穿透，实现每笔资金来源可溯去向可追；绩效评价全闭环反馈，构建常态化监测体系，实现全流程数字化，结果自动反馈。\n\n三、组织保障"}, {"chunkIndex": 10, "text": "出，提高资金配置效率；预算执行全过程穿透，实现每笔资金来源可溯去向可追；绩效评价全闭环反馈，构建常态化监测体系，实现全流程数字化，结果自动反馈。\n\n三、组织保障\n加强组织领导，定期调度改革工作，按程序审定零基预算编制方案、预决算草案及有关重大事项，强化改革成效结果运用。各区县、各部门要切实提高政治站位，树牢零基预算理念，建立工作机制，强化责任担当，密切协调配合，形成工作合力。各级财政部门要发挥牵头抓总作用，加强业务指导，完善制度机制。各级预算单位要落实落细各项改革任务，切实推动预算管理提质增效。"}], "suggestDocId": 2097637768713064450, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 11 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-10-2", "category": "pair", "question": "在重庆零基预算改革中，新增财政支出政策需要满足什么条件才能安排预算资金？", "answer": "新增政策必须严格履行合理性、相关性、一致性评估程序。如果未通过评估，不得安排预算资金。同时需建立权责清晰、规范统一、动态管理的支出政策库。", "expectRefusal": false, "gold": [{"docId": 2097637768713064450, "chunkIndex": 3, "why": "重庆市全面深化零基预算改革实施方案", "quote": "新增支出政策严格履行合理性、相关性、一致性评估程序，未通过评估的支出政策，不得安排预算资金。", "text": "安排支出，在非财政拨款可以满足支出需求时，原则上不再安排财政拨款。加强存量资金资产统筹，有计划、分批次盘活各类结转结余资金，以及通过财政资金投入形成的各类资产。\n3﹒统管支出政策。全面清理规范各类财政支出政策，建立权责清晰、规范统一、动态管理的财政支出政策库（以下简称政策库）。对地方存量支出政策逐项开展评估，提出延续、调整、退出三类意见，严格控制政策提标、扩围、延期。从严控制新增支出政策，新增支出政策严格履行合理性、相关性、一致性评估程序，未通过评估的支出政策，不得安排预算资金。结合年度预算编审，建立健全财政支出政策评估与动态调整、退出机制
