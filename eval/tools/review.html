证据，以支撑答案中关于‘6个方面’及其具体内容的描述。建议将段落 [3] (一、积极扩大有效需求), [16] (三、增强科技创新体系化攻关能力...注：此处原文编号跳跃，需确认二、强产业对应段落，根据上下文推断应为[9-15]区间或类似位置，但为简化操作，通常标注各一级标题所在段落即可。观察原文，[3]是一级标题，[16]是三级标题？不，看原文结构：[3]开头是“一、积极扩大有效需求”，[16]开头是“三、增强科技创新...”，中间缺了“二、...”。仔细检查原文：[3]后接具体措施，直到[15]结束。[16]开始是“三、...”。那么“二、...”在", "suggest": [{"chunkIndex": 3, "text": "\n为深入贯彻党中央、国务院有关会议精神，着力稳就业、稳企业、稳市场、稳预期，推动经济持续向新向优向好发展，制定以下政策举措。\n\n一、积极扩大有效需求\n1﹒系统推进“六张网”规划建设。支持基础设施安全屏障建设，对符合规划要求、前期工作成熟的“六张网”项目，纳入重点项目清单，依法依规给予前期工作经费支持。及时做好用地、用能、环评审批保障，对具备条件的项目推行“拿地即开工”。支持通过特许经营等模式吸引社会资本参与，加大新型政策性金融工具配套融资支持力度。推行水网投建运管一体化全生命周期模式，深化水利工程水价改革，建立涉水全链条收益反哺机制。对算力网、新型电网等能耗密集型项目，按规定统筹保障能耗指标，支持新增负荷参与绿电直连试点，推广源网荷储电力协同运行模式，完善算力互联互通管理规则，支持老旧小散数据中心开展节能降碳改造。支持社会资本参与新一代通信网络建设运营，提升园区、企业和重点项目网络接入服务能力。支持社会资本参与城市地下管网和综合管廊建设运营，推进入廊收费机制改革。鼓励金融机构设立物流网建设专项贷款，增加物流网建设项目混合用地供给。（责任单位：市发展改革委、市经济信息委、市财政局、市规划自然资源局、市生态环境局、市商务委、市文化旅游委、市住房城乡建委、市城市管理局、市交通运输委、市水利局、市大数据发展局、市政府口岸物流办、市能源局、市广电局、重庆通信管理局等，各区县；政策举措均需区县落实，不再列出）"}, {"chunkIndex": 16, "text": "，各环节补助之和不超过130元/亩，财政补助比例不超过社会公允价格的40%。（责任单位：市农业农村委、市供销合作社、市财政局）\n\n三、增强科技创新体系化攻关能力\n22﹒支持引导企业加大研发投入。引导有条件的科技企业参与设立自然科学基金创新发展联合基金，共同支持基础研究、应用基础研究和前沿技术研究。鼓励企业开展科技攻关，对企业自主实施的科技攻关项目，研发投入额度达到200万元并且技术创新性达到同类科技计划标准的，视为市级科技计划项目。支持科技型中小企业加大研发投入、提升创新能力，鼓励企业打造和开放应用场景、联合高校科研院所围绕综合场景应用需求开展技术攻关。加快实施企业科技攻关联合行动计划，市级与区县共同出资、联合实施科技攻关项目，区县与市级财政资金投入的比例原则上不低于1∶1。（责任单位：市科技局、市财政局）\n\n23﹒支持创新创业综合平台和品牌活动。对环大学创新创业生态圈根据评估情况给予最高300万元补助支持。支持区县承办市级及以上的创新创业大赛、项目路演、供需对接、技术培训、新品发布等活动，按实际投入的一定比例给予区县补助，单个活动最高30万元。对具有重大影响力的品牌活动，可实行事前预算管理。（责任单位：市科技局、市财政局）"}, {"chunkIndex": 18, "text": "动社会资本加大对科技创新等重点领域的投资。（责任单位：市财政局、市委金融办、市科技局、市经济信息委、市发展改革委、重庆证监局）\n\n四、营造公平有序的市场竞争环境\n26﹒提升个体工商户与新业态相关经营主体服务质效。在“渝快办”上线个体工商户政策服务专区，对符合条件的扶持事项实行“免申即享”。支持“发展型”个体工商户择优纳入“名特优新”培育库和“个转企”储备库。迭代升级“渝个贷”，推动“金融大脑”对接渝企在线个体工商户服务专区，鼓励金融机构创新个体工商户信用评价指标，建立“渝个贷2.0”产品超市，为个体工商户提供“一键测额”服务。推进柔性执法，对新业态相关经营主体中的低风险主体优先采取风险提示、合规指引、指导约谈等监管方式。全面推行“扫码入企”制度。支持平台企业参与标准化工作，加快直播电商等新产业新业态标准的研究制定。（责任单位：市市场监管局、市商务委、市公安局、市人力社保局、市发展改革委、市委金融办、人行重庆市分行、重庆市税务局、市司法局）"}, {"chunkIndex": 20, "text": "提前开展受理、调查、评审等相关业务，实现无缝对接。（责任单位：市人力社保局、人行重庆市分行、市财政局、市委金融办、重庆金融监管局）\n\n五、拓展双向经贸合作新空间\n29﹒完善跨境电商与海外仓服务体系。支持企业借助跨境电商和海外仓加快出海，建设跨境电商线下“一站式”服务平台，对相关建设费用依法依规给予补助，单个项目最高300万元/年。支持企业在“一带一路”共建国家共建、共用、共享海外仓，对单个项目最高补助150万元/年。（责任单位：市商务委、市政府口岸物流办、市委金融办、市财政局）\n\n30﹒支持物流枢纽经济区和综合保税区提质增效。支持中间品贸易枢纽发展，依法依规给予一定补助。支持中间品供应链企业建设供应链组织、物流协同等服务项目，依法依规给予单个企业最高100万元/年补助。支持企业以重点产业进出口物流需求为切入，通过新产品、新技术、新模式应用搭建应用场景，推动口岸物流转型升级。对建设临空、临铁、临港等补链强链重大场景的经营主体，单个场景最高补助3000万元。支持打造产业链供应链协同平台或第三方专业服务平台，对单个平台最高补助500万元。提升集装箱调度组织能力，对进行无水港标准化、系统化建设的企业给予最高60万元补助，对开展集装箱箱池建设的物流企业给予最高50万元补助，对新设外贸集装箱提还箱点的物流企业给予最高20万元补助。（责任单位：市商务委、市政府口岸物流办、市委金融办、市财政局）"}, {"chunkIndex": 23, "text": "生的法律、财税、技术及商务咨询费等相关费用，按不超过50%的比例给予一次性补助，单个项目最高100万元。（责任单位：市发展改革委、市商务委）\n\n六、加强民生保障\n35﹒支持新就业形态人员就业。将网约配送、即时配送、网约车驾驶等新就业形态纳入就业困难人员灵活就业社会保险补贴范围，对依法依规缴纳社会保险费的，养老保险补贴按照补贴年度我市社会保险缴费基数下限缴费的2/3计算，医疗保险补贴按照补贴年度我市最低档缴费的2/3计算。补贴年限最长不超过3年，对距法定退休年龄不足5年的可延长至退休（以初次核定其享受社会保险补贴时年龄为准）。（责任单位：市人力社保局、市医保局、市财政局）\n\n36﹒强化脱贫人口稳岗创业信贷支持。对发展生产和开展经营的防止返贫致贫对象、继续帮扶的脱贫人口，符合条件的最高可申请10万元帮扶小额信贷，并给予贷款贴息补助，支持其稳定增收。（责任单位：重庆金融监管局、市农业农村委、市财政局、人行重庆市分行）\n\n37﹒提升普惠养老服务补贴。支持养老服务机构扩大普惠供给、提升专业服务能力。对经认定的普惠养老机构，按照实际收住老年人床位数给予每张床位每月100元运营补贴。对中度以上失能老年人给予养老服务消费补贴，入住机构养老服务消费抵扣比例为40%，居家上门养老服务消费抵扣比例为50%，月最高补贴额度为800元。对持有职业技能等级证书，符合相关条件的养老护理员，按职业技能等级分档给予职业技能等级补贴，最高3万元。（责任单位：市民政局、市财政局）"}], "suggestDocId": 2097637770462089218, "fixable": true, "hint": ""}}, {"id": "A-p-18-2", "category": "pair", "question": "重庆住房公积金提取频次有什么新变化？具体实施时间是多久？", "answer": "2026年9月至2027年8月期间，符合条件的偿还商业性个人住房贷款的住房公积金提取频次，由一年一次放宽至每月一次，以减轻群众购房还贷压力。", "expectRefusal": false, "gold": [{"docId": 2097637770462089218, "chunkIndex": 8, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "缴存人及其配偶在本市行政区域内使用商业性个人住房贷款购买自住住房，符合我市住房公积金提取条件的，提取频次限制由一年提取一次放宽为一个月提取一次。", "text": "纪机构提供涉税政策前置辅导、全市通办服务。（责任单位：市商务委、市文化旅游委、市委宣传部、市农业农村委、市委网信办、市财政局、市体育局、市广电局、重庆市税务局）\n6﹒培育壮大汽车后市场消费。推广机动车改装备案业务全程网办，推行机动车改装分级分类管理。优化房车上路通行管理政策，以及房车营地用地审批流程。迭代升级“渝悦修车”“安心购车”线上平台。支持区县打造汽车全生命周期消费场景，对举办汽车赛事的，给予最高30万元/场活动补助；对举办二手车展销、汽车改装文化节、房车体验季等主题活动的，给予最高20万元/场活动补助。（责任单位：市商务委、市公安局、市规划自然资源局、市交通运输委、市文化旅游委、市体育局、市财政局）\n\n7﹒进一步加大公积金惠民力度。支持提高公积金贷款额度，2026年9月至2027年8月期间，住房公积金个人最高贷款额度从80万元提高到100万元，参贷后家庭最高贷款额度从120万元提高到200万元；多子女家庭个人最高贷款额度从100万元提高到120万元，参贷后家庭最高贷款额度从160万元提高到240万元。提升公积金提取频次，缴存人及其配偶在本市行政区域内使用商业性个人住房贷款购买自住住房，符合我市住房公积金提取条件的，提取频次限制由一年提取一次放宽为一个月提取一次。对可通过数据协查核实还款金额的，提取金额为上月已实际偿还的贷款本息额。（责任单位：市住房城乡建委、市财政局）"}, {"docId": 2097637770462089218, "chunkIndex": 9, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "的，提取频次限制由一年提取一次放宽为一个月提取一次。", "text": "的，提取频次限制由一年提取一次放宽为一个月提取一次。对可通过数据协查核实还款金额的，提取金额为上月已实际偿还的贷款本息额。（责任单位：市住房城乡建委、市财政局）\n8﹒接续实施有奖发票活动。2026年9—12月期间，在零售、餐饮、住宿等行业（涵盖吃、住、游、购、娱等消费场景）接续开展有奖发票活动，个人消费者消费后取得票面金额不低于100元的有效数电发票，可参与即时和集中抽奖，最高奖励1万元。（责任单位：市商务委、市财政局、重庆市税务局）\n\n二、加快现代化产业体系建设\n\n9﹒支持汽车产业新能源化智能化转型。对汽车企业承担国家科研项目给予一定配套支持。对整车企业量产上市的新能源全新车型，给予最高8000万元研发补助。推动自动驾驶汽车应用场景发展，对整车企业自主开发或与智驾企业组建联合体开发的智能驾驶系统平台，给予最高1000万元补助。对整车企业获得出口目标国家（地区）认证的产品认证检测费用，给予最高2000万元补助。对汽车专项融资租赁产品、优化新能源商用车商业车险产品给予一定支持。（责任单位：市经济信息委、市商务委、市财政局）"}], "source": {"pairId": "p-18", "policyDocId": 2097637770462089218, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市进一步推动经济稳中向好若干政策举措》的通知", "interpretDocId": 2097637773083529218, "interpretTitle": "《重庆市进一步推动经济稳中向好若干政策举措》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕43号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "提取频次放宽至每月一次", "answerQuote": "将符合条件的偿还商业性个人住房贷款的住房公积金提取频次，由一年一次放宽至每月一次", "candidateChunks": [8, 9, 4, 23, 2, 6, 5, 18, 17, 19, 3, 0], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 5, "naturalness": 5}, "issues": ["其他"], "reason": "标准答案将原文‘一个月提取一次’概括为‘每月一次’，语义等价且更通顺；证据段落[8]完整覆盖了频次变化及实施时间（结合上下文语境），标注准确。", "suggestion": "", "suggest": [], "suggestDocId": 2097637770462089218, "fixable": false, "hint": ""}}, {"id": "A-p-19-1", "category": "pair", "question": "重庆市“十五五”文化旅游发展规划主要部署了哪些重点任务？", "answer": "规划从12个方面系统部署任务，包括提升巴蜀文化旅游走廊能级、推动文艺攀峰、促进文脉传承、健全公共文化服务、构筑广电体系、构建现代文旅产业、培塑旗舰产品、促进消费升级、做靓国际品牌、增强主体竞争力、数智赋能及强化综合治理。", "expectRefusal": false, "gold": [{"docId": 2097637770155905026, "chunkIndex": 1, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市", "text": "\n重庆市人民政府办公厅\n\n2026年8月5日\n\n（本文有删减）\n\n重庆市“十五五”文化旅游发展规划\n\n（2026—2030年）\n为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五”规划》（文旅资源发〔2026〕42号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，全面落实习近平总书记视察重庆重要讲话重要指示精神，紧扣做实“两大定位”、发挥“三个作用”，坚持以文塑旅、以旅彰文，突出创新引领、数智赋能、改革突破、开放协同，持续做靓“雄奇山水 新韵重庆”品牌，加快打造巴蜀文化旅游走廊标志性成果，提质建设具有国际范、中国韵、重庆味的文化旅游强市，为奋力谱写中国式现代化重庆篇章注入强劲文旅动能。到2030年，文化旅游强市建设取得显著进展，文化旅游惠民生、扩内需、增动能综合效能全面释放，赋能经济社会高质量发展铸就新篇章。\n\n——巴蜀文化旅游走廊建设实现新提升。平台联通、标准互认、品牌同塑、项目共建等协同联动机制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。"}, {"docId": 2097637770155905026, "chunkIndex": 12, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "七、构建现代文旅产业体系", "text": "行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业\n推动创意设计、数字内容产业向全链条渗透、向高价值链攀升、向体验式升级。创意设计产业重点应用AI（人工智能）生成式设计，发展“文创+工业设计”“文创+在地文化”等融合模式，培育文博IP联名开发、非遗跨界设计等新业态，打造“创意重庆”品牌，建设西部创意产业集聚区。数字内容产业重点培育AI内容生产、虚拟拍摄、云端制作等新业态，推动微短剧、短视频、网络直播等细分领域繁荣发展，搭建内容孵化、开发制作一体化服务平台。\n\n（二）壮大特色品牌产业"}, {"docId": 2097637770155905026, "chunkIndex": 3, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "二、提升巴蜀文化旅游走廊牵引带动能级", "text": "\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局\n强化“世界山水都市旅游核”引领，丰富商务差旅、会展团建、赛事主题、文化交流等特色产品，开发“滨水+”体育、艺术、科技、美食等多元业态，迭代升级“江崖街洞天”“桥隧轨梯廊”等特色文旅场景，优化交通接驳和轻旅居配套服务，打造都市商文旅体展综合圈、滨江休闲带、休闲旅居线。提升“三大高品质文旅景观带”主轴支撑力，活化利用渝西片区历史古镇、非物质文化遗产（以下简称非遗）街区、文化遗址，升级打造渝东北三峡游轮、峡谷风光等经典产品，挖掘放大渝东南“山水林泉洞”“武陵民族风”资源优势，提质千年成渝古道、壮美长江三峡、多彩风情武陵文旅景观带。加快“九大精品旅游线路”全域贯通，谋划打造一批特色旅游支线，加快建设节点串联、业态互补、场景共建的立体旅游网络。\n\n（二）扩面提质建设川渝文旅统一大市场\n\n完善川渝协同共建机制，做强“宽洪大量”“点石成金”“资足常乐”等特色文旅IP（知识产权），优化“渝进蓉出、蓉进渝出”客流共享模式，做实巴蜀文化旅游走廊产业联盟，创新实施“畅游巴蜀”“旅游一卡通”等文旅惠民措施。深化“惠游重庆”“智游天府”平台互联互通，推动两地景区、文博场馆实现“一键预约、一网通办、一码通用”，提升跨区域文旅公共服务便捷度、智慧化水平。健全川渝文旅市场联合执法、案件协查协办、线索移送共享、监管信息互通机制，强化跨区域市场秩序协同整治，打造公平公正、开放有序、诚信守法的川渝文旅市场环境。"}, {"docId": 2097637770155905026, "chunkIndex": 11, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "（三）强化科技产业引领和行业治理", "text": "绕共建“一带一路”等主题，创新推出电视剧、纪录片、动画片等国际传播内容，实施“长江遇见”系列合拍项目，推动优质视听内容“出海”。\n\n（二）提升内容生产和服务能力\n完善广电视听精品创作生产组织工作机制，开展“登高攀峰”行动，实施“剧美中国·新韵重庆”电视剧繁荣等创作计划，聚焦建军100周年等重要节点，打造一批精品影视剧。加强政策扶持引导，培育更具活力的内容创作生态。深化广电公共服务，迭代完善应急广播体系，推进“智慧广电+公共服务”建设，实施广电视听服务和体验“双提升”工程，推动高清超高清电视公共服务全民共享，构建贯通区县、乡镇（街道）、村（社区）三级的基层广电服务网络。\n\n（三）强化科技产业引领和行业治理\n\n加快数智广电和新型广电网络建设，推动基础设施网络优化升级。完善广电视听产业统筹引导机制，构建市、区县两级政策联动体系，推动广电视听产业补链、强链、延链。强化广播电视安全播出，加强关键信息基础设施保护，推进老旧设备更新换代，防范网络攻击等新型安全风险。加强广电行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业"}], "source": {"pairId": "p-19", "policyDocId": 2097637770155905026, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市“十五五”文化旅游发展规划（2026—2030年）》的通知", "interpretDocId": 2097637773297438722, "interpretTitle": "《重庆市“十五五”文化旅游发展规划（2026—2030年）》解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕41号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "12个方面", "answerQuote": "《规划》聚焦提质建设具有国际范、中国韵、重庆味的文化旅游强市，从12个方面系统部署任务。", "candidateChunks": [1, 2, 12, 0, 3, 11, 25, 13, 22, 10, 23, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案概括了规划全文的12个主要任务章节，但提供的证据段落（★）仅覆盖了其中约一半的内容，大量关键章节（如文艺、文脉、公共文化、广电、消费、品牌、主体、数智等）的起始段落未被标注为证据，导致RAG检索时可能无法召回完整信息。", "suggestion": "需补充标注以下段落作为证据：[1]（总体要求/背景）、[3]（二、巴蜀走廊）、[5]（三、文艺攀峰）、[6]（四、文脉传承）、[8]（五、公共文化）、[10]（六、广电体系）、[12]（七、现代文旅产业）、[14]（八、旗舰产品）、[17]（九、消费升级）、[20]（十、国际品牌）、[22]（十一、主体竞争力）、[23]（十二、数智赋能）。注意：原文中“强化综合治理”对应的是第十三章，若答案包含此项，还需补充[23]或[24]附近的段落；当前答案列出的12项与上述章节标题基本对应。", "suggest": [{"chunkIndex": 1, "text": "\n重庆市人民政府办公厅\n\n2026年8月5日\n\n（本文有删减）\n\n重庆市“十五五”文化旅游发展规划\n\n（2026—2030年）\n为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五”规划》（文旅资源发〔2026〕42号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，全面落实习近平总书记视察重庆重要讲话重要指示精神，紧扣做实“两大定位”、发挥“三个作用”，坚持以文塑旅、以旅彰文，突出创新引领、数智赋能、改革突破、开放协同，持续做靓“雄奇山水 新韵重庆”品牌，加快打造巴蜀文化旅游走廊标志性成果，提质建设具有国际范、中国韵、重庆味的文化旅游强市，为奋力谱写中国式现代化重庆篇章注入强劲文旅动能。到2030年，文化旅游强市建设取得显著进展，文化旅游惠民生、扩内需、增动能综合效能全面释放，赋能经济社会高质量发展铸就新篇章。\n\n——巴蜀文化旅游走廊建设实现新提升。平台联通、标准互认、品牌同塑、项目共建等协同联动机制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。"}, {"chunkIndex": 3, "text": "\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局\n强化“世界山水都市旅游核”引领，丰富商务差旅、会展团建、赛事主题、文化交流等特色产品，开发“滨水+”体育、艺术、科技、美食等多元业态，迭代升级“江崖街洞天”“桥隧轨梯廊”等特色文旅场景，优化交通接驳和轻旅居配套服务，打造都市商文旅体展综合圈、滨江休闲带、休闲旅居线。提升“三大高品质文旅景观带”主轴支撑力，活化利用渝西片区历史古镇、非物质文化遗产（以下简称非遗）街区、文化遗址，升级打造渝东北三峡游轮、峡谷风光等经典产品，挖掘放大渝东南“山水林泉洞”“武陵民族风”资源优势，提质千年成渝古道、壮美长江三峡、多彩风情武陵文旅景观带。加快“九大精品旅游线路”全域贯通，谋划打造一批特色旅游支线，加快建设节点串联、业态互补、场景共建的立体旅游网络。\n\n（二）扩面提质建设川渝文旅统一大市场\n\n完善川渝协同共建机制，做强“宽洪大量”“点石成金”“资足常乐”等特色文旅IP（知识产权），优化“渝进蓉出、蓉进渝出”客流共享模式，做实巴蜀文化旅游走廊产业联盟，创新实施“畅游巴蜀”“旅游一卡通”等文旅惠民措施。深化“惠游重庆”“智游天府”平台互联互通，推动两地景区、文博场馆实现“一键预约、一网通办、一码通用”，提升跨区域文旅公共服务便捷度、智慧化水平。健全川渝文旅市场联合执法、案件协查协办、线索移送共享、监管信息互通机制，强化跨区域市场秩序协同整治，打造公平公正、开放有序、诚信守法的川渝文旅市场环境。"}, {"chunkIndex": 5, "text": "实施新时代创作引导计划，健全文艺创作生产和服务智治体系，探索推行重点创作项目“揭榜挂帅”制度，构建策划、创排、打磨、储备良性循环格局。\n\n（二）培塑特色文艺品牌\n搭建特色文艺活动品牌矩阵，参与承办国家级艺术节展活动，力争有1项国家级文艺奖项评选活动在渝常年举办。办好市级主题艺术活动，持续培育重庆辨识度演艺品牌，鼓励文旅驻场演艺提升市场影响力。实施“重庆好戏”优质文化资源直达基层项目，鼓励发展新大众文艺创演品牌。实施美术“添彩”计划，夯实油画、雕塑等传统美术发展基础，拓展数字艺术、公共艺术、设计等应用美术内涵。引入沉浸式展览、艺术市集等新业态，打造艺术社区街区、演艺综合体、特色剧场和文艺名家工作室。鼓励文艺单位开辟线上“第二舞台”，孵化网络文艺新品牌。\n\n（三）涵养文艺发展生态\n\n改进艺术管理工作，推进创作机制改革。深化国有文艺院团“一团一策”改革，扶持基层文艺院团发展，形成“国有+民营”协同发展新格局。鼓励市内艺术类院校加强文艺理论研究，与文艺院团、美术馆开展产学研合作。完善人才选育管用全链条机制，优化全国领军、青年拔尖、后备人才队伍，加强编剧导演、经营管理、数字技术等专业人才培养。健全文艺评论常态化引导机制。\n\n四、促进巴渝文脉薪火相传\n\n（一）强化文化遗产系统性保护"}, {"chunkIndex": 6, "text": "青年拔尖、后备人才队伍，加强编剧导演、经营管理、数字技术等专业人才培养。健全文艺评论常态化引导机制。\n\n四、促进巴渝文脉薪火相传\n\n（一）强化文化遗产系统性保护\n加强文物、非遗、历史文化名城名镇名村、历史文化街区、传统村落系统保护和活态传承，推动城市更新、乡村振兴与文化保护传承协同发展。加强文物资源管理，完善不可移动文物资源、博物馆藏品、古籍等数据库。加强文化遗产统一监管，强化文物卫星遥感监测和防灾减灾，加大文物督察执法检查力度，严厉打击文物犯罪行为。\n\n（二）加强文物保护和活化利用\n\n全面落实“先考古、后出让”“先调查、后建设”制度。实施红岩革命文物保护传承工程，着力构建红岩革命文物保护传承体系。加强三峡文物保护利用，争创三峡国家考古遗址公园。推进川渝石窟寺系统性保护，构建全要素展示体系，高水平共建川渝石窟寺国家遗址公园。系统推进工业遗产、“三线建设”遗产等的保护利用。加快推进涪陵白鹤梁题刻与埃及罗达岛尼罗尺联合申报世界文化遗产。活化利用涉外文物旧址及抗战遗址，串珠成链打造文旅精品线路。提档升级历史、革命、抗战、工业、自然博物馆集群，创新沉浸式展览、数字人导览、全息展示等形式，打造一批主题鲜明的文物外展精品。\n\n（三）深化文明探源与价值阐释"}, {"chunkIndex": 8, "text": "作。实施青年非遗传承人培育行动，强化非遗保护专家人才队伍建设，推动形成梯次合理的非遗传承体系。\n\n五、健全现代公共文化服务体系\n\n（一）推动公共文化服务改革创新\n兼顾城乡差异、人口均衡，推动“15分钟高品质文化生活圈”市域全覆盖，打造群众“家门口”的文化服务站。构建公共文化资源供需对接平台，推进精准供给与质效提升。完善社会力量参与公共文化服务机制，探索合作共建、公建民营等模式，创新发展文化志愿者服务。深化公共文化机构改革，健全一馆多址、总分馆建设运营机制，探索有偿提供普惠性非基本公共文化服务，分级分类稳步推进公共文化设施所有权和使用权分置改革试点。\n\n（二）实施公共文化服务提质增效行动\n\n扩容提质图书、文博、艺术等重大文化设施，补齐功能性文化设施短板，补强基层弱项，健全市—区县—乡镇（街道）—村社“四级”网络，打造主题场馆。融入城市更新，用好存量资源，实施新型公共文化空间培育计划，制定出台运营服务地方标准。推动优质文化资源直达基层，常态化开展流动文化进基层活动，培育基层文化服务“百强”品牌，探索建立基层文化指导员制度。\n\n（三）深入推进文化惠民"}, {"chunkIndex": 10, "text": "强化部门联动，推行分众化精准文化服务，面向重点群体构建无障碍、陪伴式、友好型公共文化服务保障体系。\n\n六、构筑新型广电大视听体系\n\n（一）推进广电媒体系统性变革\n深化新型主流媒体建设，做强“第1眼TV”，迭代升级“台、网、端、号、屏、夜空”六维一体传播体系，构建“电视+移动端+新媒体平台”立体传播矩阵。推动广电媒体深度融合发展，优化频率频道部署，整合配置地面电视频道资源，促进频道专业化特色化发展。实施广播电视内容焕新计划，强化新闻立台，创新民生节目，拓展“广电+”行动，丰富多元化内容。体系化推进重庆4K超高清频道建设。依托IPTV（交互式网络电视）、有线网络渠道，联动头部平台，深化台网融合。加强区县广电媒体节目制作和播出，推动区县融媒体中心特色化发展。做强西部视听译制出海中心，完善西部国际传播中心事业产业协同运行机制，增强国际传播效能。支持优秀视听创作机构做强海外传播平台，围绕共建“一带一路”等主题，创新推出电视剧、纪录片、动画片等国际传播内容，实施“长江遇见”系列合拍项目，推动优质视听内容“出海”。\n\n（二）提升内容生产和服务能力"}, {"chunkIndex": 12, "text": "行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业\n推动创意设计、数字内容产业向全链条渗透、向高价值链攀升、向体验式升级。创意设计产业重点应用AI（人工智能）生成式设计，发展“文创+工业设计”“文创+在地文化”等融合模式，培育文博IP联名开发、非遗跨界设计等新业态，打造“创意重庆”品牌，建设西部创意产业集聚区。数字内容产业重点培育AI内容生产、虚拟拍摄、云端制作等新业态，推动微短剧、短视频、网络直播等细分领域繁荣发展，搭建内容孵化、开发制作一体化服务平台。\n\n（二）壮大特色品牌产业"}, {"chunkIndex": 14, "text": "，打造“行走的阅读”“跟着赛事去旅行”等一批文旅新业态，引导各区县找准细分赛道，培育新增长点。\n\n八、培塑文旅旗舰产品集群\n\n（一）提质“红岩精神”红色旅游产品\n构建红岩文化育人体系，支持革命旧址、文化场馆建设爱国主义教育基地，推动革命文物深度融入“大思政课”，提升“红岩思政”等品牌影响力。加强八路军重庆办事处旧址、歌乐山“中美合作所”集中营旧址等红岩革命旧址保护利用，迭代升级重点红色剧目，推动红岩文化公园建设承载红色记忆、赓续红色血脉的重要阵地。统筹綦江、城口、酉阳革命文物连片保护、整体展示，联合打造“重走长征路”主题徒步线路。\n\n（二）做强“潮玩重庆”都市休闲产品\n\n实施“城市更新+文旅”提质工程，对老城肌理、工业遗存、背街小巷等存量空间实施“微改造、精提升”，打造一批都市文旅街区。推动国际国内资本合作，谋划建设具有重庆在地文化特色的主题公园。强化洪崖洞、磁器口、长江索道等的国际化服务功能，聚力打造燕子岩—飞机码头等一批新锐项目，孵化情绪消费、青春经济、电竞经济等新兴业态。推动艺术、文博资源与都市休闲深度融合，做强川美“开放的六月”等艺术展览品牌，增加高品质文博展览供给。升级打造重庆马拉松、渝超联赛等城市精品赛事IP，培育“都市+赛事”新亮点。丰富夜间消费场景，常态化运营城市灯光秀、交响音乐会、江畔演艺、潮玩主题季等精品活动。\n\n（三）打造“文景交融”精品旅游景区产品"}, {"chunkIndex": 17, "text": "牌，打造工业主题旅游线路，串联工业遗存、科创场景与赛事活动，让游客充分感知“重庆造”硬核实力。\n\n九、促进文旅消费提质升级\n\n（一）做靓“渝味360碗”美食品牌\n聚力建设国际美食名城，引育国内“八大菜系”代表性名店、国际知名餐饮品牌首店，引进“米其林”星级、“黑珍珠”钻级等品牌餐饮，高标准发布精品美食线路和指南。培塑丰富多元的渝味圈层，构建“渝味360碗”美食体验店、旗舰店、美食街区矩阵。提升一批魅力菜品，创新发展小面、酸辣粉等名小吃“大单品”，以菜品标准牵引本土食材培育、非遗厨艺活化、文创伴手礼全链条开发，培育一批美食名节名街、名厨名宴。\n\n（二）打造巴渝文旅消费品牌集群\n\n做优“巴渝美宿”住宿品牌，引进培育国内外知名酒店品牌及新概念首店，引导住宿行业龙头企业整合资源培育知名住宿品牌，推出一批云端民宿、江景酒店、森林树屋，培育情景式住宿体系，打造绿色饭店、未来酒店。升级“重庆好礼”购物品牌，培育国货“潮牌”“潮品”，建设一批文旅商体展综合体。打响“重庆好剧”文娱品牌，推动重庆大剧院、国泰艺术中心等场馆设立常态化驻场精品项目，提升一批非遗实景体验，升级重庆奥体中心、龙兴足球场等文体展演地标，引入带动性强的演唱会、音乐节。\n\n（三）丰富拓展新兴消费场景"}, {"chunkIndex": 20, "text": "事，支持境外机构在渝举办人文交流活动，擦亮“四季新韵·感知重庆”“你好！重庆”“渝见”等交流品牌。\n\n十一、增强经营主体综合竞争力\n\n（一）壮大龙头骨干文旅企业\n实施文旅龙头企业“领航”计划，大力招引国内外知名文旅总部企业与研发机构，综合运用并购重组、业态拓展等方式，培育一批链主型文旅企业，争创中国旅游集团20强、全国文化企业30强。开展文旅企业上市梯次培育，推动优质龙头文旅企业加速上市。鼓励龙头骨干文旅企业拓展海外市场，全面提升国际竞争力。\n\n（二）培育新锐成长文旅企业\n\n实施新锐成长文旅企业“倍增”计划，建立“发现一批、培育一批、壮大一批”动态培育机制，重点扶持文化科技、内容原创类企业，引导传统企业向数据资产运营商、技术服务商转型。优化文旅企业梯度培育体系，聚焦数字内容、人工智能应用、创意设计等细分赛道，强化融资、场景、平台多维赋能。推进专精特新文旅企业“育苗”计划，培育“种子企业—专精特新—隐形冠军”成长梯队，引导文旅企业攻坚内容创意、非遗活化、研学体验等领域，培育一批营收过亿“小巨人”文旅企业。依托文化科技孵化器、产业园区集聚创新资源，助力文旅企业“上云用数赋智”。\n\n（三）育优小微特色文旅主体"}, {"chunkIndex": 22, "text": "行、旅游目的地游客接待情况、文旅全量消费等统计分析，搭建高效互通的文旅数据共享平台，构建全行业、全内容、全链路数据分析应用模式。\n\n（二）营造数智文旅服务新生态\n迭代“惠游重庆”“巴渝文物”“高品质文化生活”等数字化应用，丰富线上线下文旅综合服务场景。集成开发文旅AI智能体，做优全域全链智慧旅游服务，升级行前规划、行中伴游、行后分享等智慧功能。实施数字博物馆建设工程，持续推进“重庆云上博物馆”建设。实施“数智非遗计划”，运用VR、AI等技术推动技艺复刻、线上传习与数字文创开发。探索AI辅助艺术创作新路径，创新“数字融合+演艺互动”新模式。鼓励经营主体运用数字技术，打造一批具有科技感、未来感的文旅新空间。加快智慧景区建设，创新推广AI客流预警、智能预约、无感通行等应用场景，实现一屏统管、全域智控。\n\n（三）促进文旅科技创新转化\n\n争创部级文旅科技创新平台，搭建市级重点实验室、技术创新中心梯度培育体系。强化文物保护、艺术创作、文旅装备、智慧旅游等领域关键技术攻关和集成转化，推动文旅科技项目纳入市级重大（重点）科技专项。发布文旅科技需求清单，加强知识产权保护与资产规范化运营。\n\n十三、强化超大城市现代化文旅综合治理\n\n（一）提升文旅综合服务品质"}, {"chunkIndex": 23, "text": "项目纳入市级重大（重点）科技专项。发布文旅科技需求清单，加强知识产权保护与资产规范化运营。\n\n十三、强化超大城市现代化文旅综合治理\n\n（一）提升文旅综合服务品质\n提升“一干四支”沿线旅游码头泊位能级，强化交通接驳、智能调度等功能，拓展两江游、三峡游主题游线。深化实施“城景通”“城乡通”“景景通”工程，构建“快旅慢游”交通体系。布局建设“市级旅游集散中心+区县旅游集散点+重点景区驿站”三级服务体系，优化旅游便民服务体系，打造“一站式”服务平台，完善旅游国际化标识，推进旅游厕所质量提升工程，改造提升适老适幼和无障碍旅游公共服务设施，加强与市政、交通设施的统筹衔接，推广随身穿戴式“AI导游”。实施旅游服务质量提升工程，开展服务质量分级分类评价，深入推行服务承诺、先行赔付等制度。\n\n（二）增强文旅市场综合监管效能\n\n深化“大综合一体化”行政执法改革，强化中心城区一体化治理。创新市场监管方式，建设应用文化市场非现场监管系统，推广移动执法、电子取证，推动数智执法应用场景建设。完善旅游投诉纠纷闭环响应机制，加强对导游乱象、强制消费等重点问题的整治。推进文旅市场信用体系建设，推出文旅企业“诚信主体公示榜”“失信主体曝光台”。打造多跨协同综合监管场景，提升突发状况应对能力。\n\n（三）筑牢文旅发展安全屏障"}], "suggestDocId": 2097637770155905026, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 12 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-20-2", "category": "pair", "question": "重庆空中丝绸之路建设到2030年的具体量化目标是什么？", "answer": "到2030年，重庆在飞国际（地区）航线达70条以上，年国际（地区）旅客吞吐量达到500万人次，货邮吞吐量达到30万吨，空中丝绸之路建设取得实质性进展。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 1, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。", "text": "\n（此件公开发布）\n\n重庆市推进空中丝绸之路建设实施方案\n\n为奋力打造内陆开放综合枢纽，加快推进重庆空中丝绸之路建设，制定本实施方案。\n\n一、总体目标\n深入对接六大国际经济合作走廊，以新亚欧大陆桥经济走廊、中国—中南半岛经济走廊为重点，推进我市与阿姆斯特丹、法兰克福、布达佩斯、新加坡、吉隆坡、曼谷、河内等重点城市共建空中丝绸之路，完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作，为深度融入共建“一带一路”高质量发展、加快打造内陆开放综合枢纽提供重要支撑。\n\n到2027年，重庆空中丝绸之路建设取得阶段性成果，重点领域合作实现突破，国际航空枢纽功能显著提升，在飞国际（地区）航线达到60条，年国际（地区）旅客、货邮吞吐量分别达到330万人次、22万吨。到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素"}, {"docId": 2097637762685849602, "chunkIndex": 2, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。", "text": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素\n（一）完善机场基础设施。有序推进重庆江北国际机场（以下简称江北机场）西区提质改造，持续推进数字孪生机场建设，加强航空口岸指定监管场地硬件设施建设，实现前置拦截、查验作业、检疫处理、冷链暂存等环节标准化、信息化、智能化升级。推进重庆新机场项目前期工作。推动与空中丝绸之路共建城市的机场集团开展战略合作，促进规划建设、口岸环境、安全 s": ["证据缺失"], "reason": "标准答案中关于‘市内每消费2度电就有1度是清洁电’（即清洁能源占比50%）的依据位于段落[177]，但该段落未被标注为证据；且段落[125]仅提供了外电入渝能力数据，未提供全市装机规模及清洁电比例的具体目标数值。", "suggestion": "将段落 [177] 补充标记为 ★ 证据段落。", "suggest": [{"chunkIndex": 177, "text": "\n全面加强能源产供储销体系建设，持续提高新能源供给比重，推进化石能源安全可靠有序替代，不断强化能源安全保供。\n\n第一节 提升清洁能源供给能力\n大力发展清洁能源。深入开展控煤减煤工作，力争全社会新增用电量主要由新增清洁能源电量覆盖，实现煤炭和成品油消费达峰，单位地区生产总值能源消耗降低完成经国家审核衔接后确定的目标。推进“千乡万村驭风行动”和分布式光伏建设，推动地热能、氢能等多能互补融合发展，因地制宜发展垃圾焚烧、沼气发电等生物质发电，新能源装机达到1100万千瓦。科学布局清洁高效煤电项目，实施高耗能、高污染存量机组“上大压小”项目。加快乌江白马等航电枢纽建设。提速建设川渝千亿方油气生产基地，推动老气田稳产，加快新区块产能释放，实现页岩油规模开发。\n\n提升市内能源输配能力。推动“双环六链”市内500千伏主网架建设，分层分区完善220千伏及以下配电网，巩固提升农村电网，建设适应新型电力系统的智慧电网。持续完善市内“四环二射”油气管网，推动国家干网和市级管道互联互通，加快推进老旧油气长输管道停运和改造，天然气管道年输送能力达到500亿立方米。\n\n第二节 构建灵活高效的能源储备调峰体系"}], "suggestDocId": 2097637764095135745, "fixable": true, "hint": ""}}, {"id": "A-p-22-1", "category": "pair", "question": "重庆市加快场景培育和开放推动新场景大规模应用行动方案主要有哪些支持措施？", "answer": "该方案打造5方面21个领域重点场景，每年打造20个重大场景；政府投资项目预留不低于5%预算用于新场景建设；探索空天等新型要素流动；提供“沙盒监管”包容性环境。", "expectRefusal": false, "gold": [{"docId": 2097637767454773249, "chunkIndex": 11, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "在政府投资项目中预留不低于5%的预算用于新场景建设", "text": "研金用”协同生态。支持市场化机构开展场景供需对接服务，提升场景服务专业化能力。（责任单位：市发展改革委、市科技局、市经济信息委、市委金融办、市国资委，有关区县）\n（六）强化政策协同配合。推动各类政策协同配合，将支持场景培育和开放与制定产业、科技、人才、资金等各类政策体系以及编制各类规划相结合。发挥政府采购作用，鼓励场景搭建单位依法依规采用单一来源采购、订购首购等方式，支持首台（套）装备、首批次材料、首版次软件推广应用。在政府投资项目中预留不低于5%的预算用于新场景建设，对新建投资项目立项备案前开展新场景应用评估，支持使用市级重大项目前期研究工作经费推动场景创新工作。通过场景培育和开放与各类改革试点检验验证等方式，支持提升制度设计水平，推动完善与新场景新技术新产品相配套的政策机制、标准体系、法规规章。（责任单位：市发展改革委、市财政局、市科技局、市经济信息委、市人力社保局、市委金融办、市司法局、市市场监管局、市国资委、市委改革办等）"}, {"docId": 2097637767454773249, "chunkIndex": 13, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "为新技术、新产品、新领域在真实场景中的测试、验证、应用提供“沙盒监管”等包容性环境", "text": "等存量政策支持场景建设。（责任单位：市发展改革委、市市场监管局、市科技局、市委金融办、市规划自然资源局、市大数据发展局、市人力社保局、市国资委、市生态环境局等）\n（八）完善场景资源配置规则。健全公平竞争制度，促进各类主体公平高效参与场景资源配置和开发利用。进一步发挥信用制度作用，鼓励各类主体在场景建设中应用信用数据与产品，提高场景资源配置效率，降低制度性交易成本。探索场景使用权、收益权等权益分配机制创新，强化场景创新和知识产权保护。推动管理规则、监管体系等方面的创新供给，在严守安全底线的前提下，为新技术、新产品、新领域在真实场景中的测试、验证、应用提供“沙盒监管”等包容性环境。加强劳动者数字技能培养和技术适应性培训，积极引导劳动者深度融入新模式新业态新场景。（责任单位：市市场监管局、市发展改革委、市知识产权局、市人力社保局等）\n\n四、组织实施\n\n建立市领导牵头的跨部门场景工作协调机制，统筹解决场景培育和开放中的重大问题。各区县要强化协同配合，加大场景培育和开放力度，因地制宜制定场景创新支持政策，结合实际抓好贯彻落实。市级有关部门要围绕重点行业领域，不断完善相关标准体系，探索尽职免责管理模式，营造应用场景建设的“软环境”。事业单位和国有企业要强化工作引领，主动开放自身资源和能力。市发展改革委要加强指导和协调，统筹推进场景培育和开放，深化场景建设管理制度创新，构建综合性重大场景“需求监测—技术响应—复盘评估—迭代优化”闭环管理机制，及时总结经验，做好宣传推广，营造良好氛围。重大事项及时请示报告。"}, {"docId": 2097637767454773249, "chunkIndex": 1, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "每年打造20个具有重庆辨识度的综合性重大场景", "text": "\n重庆市人民政府办公厅\n\n2026年5月9日\n\n（本文有删减）\n\n重庆市加快场景培育和\n\n开放推动新场景大规模应用行动方案\n为贯彻落实国务院办公厅《关于加快场景培育和开放推动新场景大规模应用的实施意见》（国办发〔2025〕37号），扩大场景有效供给，促进场景资源开放和公平高效配置，加快培育发展新质生产力，结合我市实际，制定本行动方案。\n\n一、总体要求\n\n立足重庆“山城”“江城”“智慧名城”特色优势，坚持创新引领、改革推动、因地制宜、安全有序、系统推进、融合发展，健全场景培育和开放的制度机制和政策体系，全面优化政府引导、多方参与、高效协同的场景创新生态，持续提升场景供给能力和驱动作用，每年打造20个具有重庆辨识度的综合性重大场景，举办场景供需对接活动200场以上，开放有效场景机会2000项以上，推动形成场景应用催生高水平创新、场景需求驱动高质量供给的良性循环，基本建成“开放包容、活力迸发、特色鲜明、治理增效”的场景创新活力之城，推动“场景重庆”成为全国场景创新的响亮品牌。\n\n二、重点领域\n\n（一）新领域新赛道应用场景\n\n1﹒数字经济领域。迭代实施“满天星”行动计划，加快推动软件和信息服务业应用场景培育开放。丰富数据产品和服务，探索元宇宙、虚拟现实、智能算力在办公、社交、消费、娱乐等领域的场景应用，推动实体经济和数字经济深度融合。（责任单位：市发展改革委、市经济信息委、市大数据发展局）"}, {"docId": 2097637767454773249, "chunkIndex": 12, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "探索建立引导空天、频谱轨道等新型要素向新质生产力顺畅流动的机制", "text": "机制、标准体系、法规规章。（责任单位：市发展改革委、市财政局、市科技局、市经济信息委、市人力社保局、市委金融办、市司法局、市市场监管局、市国资委、市委改革办等）\n（七）加大要素保障力度。做好要素市场化配置综合改革试点工作，充分发挥技术、土地、数据、人才、资源环境等要素保障作用，探索建立引导空天、频谱轨道等新型要素向新质生产力顺畅流动的机制，以要素整体性协同化配置赋能综合性场景建设。加大金融要素支持力度，建立“多方参与、风险共担”责任机制，支持金融机构开发“场景贷”“场景保险”等金融产品。鼓励引导国有投资基金、社会投资基金等支持场景创新，完善场景基金考核、容错免责机制。围绕技术研发、中试验证、建设落地等环节，用好融资、贴息、保险补贴、超长期特别国债、地方政府专项债券等存量政策支持场景建设。（责任单位：市发展改革委、市市场监管局、市科技局、市委金融办、市规划自然资源局、市大数据发展局、市人力社保局、市国资委、市生态环境局等）"}], "source": {"pairId": "p-22", "policyDocId": 2097637767454773249, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市加快场景培育和开放推动新场景大规模应用行动方案》的通知", "interpretDocId": 2097637775092600834, "interpretTitle": "《重庆市加快场景培育和开放推动新场景大规模应用行动方案》例行政策吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2026〕24号"}, "permission": null 系能力全面增强。\n\n——改革赋能乡村发展实现新跃升。以深化改革促进乡村“五个振兴”的机制更加健全、支撑常态化帮扶的体系全面构建，区域农合联服务农户占比达到90%以上。"}], "source": {"pairId": "p-23", "policyDocId": 2097637768968916993, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”农业农村现代化规划（2026—2030年）》的通知", "interpretDocId": 2097637775176486914, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”农业农村现代化规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕16号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "四个方面", "answerQuote": "“十五五”时期，我们重点在四个方面统筹发力，力争到2030年全市农业农村现代化达到西部领先的水平。", "candidateChunks": [1, 0, 2, 28, 31, 11, 13, 5, 7, 10, 6, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 1, "naturalness": 4}, "issues": ["证据缺失"], "reason": "标准答案中的“城市带动力”和“农村内动力”等关键表述在已标注的证据段落[★1]中完全不存在，仅出现在未标注的段落[29]（涉及城乡融合、市场带动）及隐含逻辑中，导致当前证据无法支撑答案。", "suggestion": "将段落 [29] 补充为 gold evidence；同时建议检查是否遗漏了专门阐述“两条跑道”、“两个动力”的总括性段落（若原文有专门的‘总体部署’章节而未截取，需补全该章节段落）。", "suggest": [{"chunkIndex": 29, "text": "、渝西地区、渝东南武陵山区高质量发展。深化主城都市区与山区库区协同发展机制，迭代民族地区、革命老区支持政策。加快推进以区县城和中心镇为重要载体的新型城镇化建设。\n（二）强化超大城市市场带动。打造城乡供需紧密衔接的消费市场，建立稳定直供基地，发展订单农业，常态化开展绿色优质农产品进商圈、进街区、进景区等活动。拓展城乡高效对接的线上市场，实施农村电商高质量发展工程，推进县域直播园区和跨境电商综试区建设，打造智慧电商云仓，推进数商兴农行动，壮大农产品电商直播新业态。升级打造重庆双福国际农贸城，建设一批国家农产品骨干冷链物流重点县、农产品产地冷链集配中心，布局冷链产地仓、田间保鲜仓，创新低空配送等模式，依托“千里轻舟”等大力开拓东部地区和海外市场。\n\n（三）强化超大城市产业带动。精准布局劳动密集型产业承接区、农产品产地初加工连接区、农文旅融合发展引领区。推动农文旅深度融合，放大“雄奇山水 新韵重庆”文旅品牌效应，深度挖掘巴渝农耕文化、非遗美食、红色文化等特色资源，串珠成链构建都市游、三峡游、武陵游、乡村游品牌矩阵。深入实施乡村休闲旅游精品工程，迭代升级“乡游悠”乡村休闲AI平台，推出一批市县级乡村休闲旅游精品线路，开展“渝见四季·沃野生辉”农文旅融合主题活动。推进“乡村+”多元融合发展，推动乡村产业与文化、旅游、康养等领域深度融合。"}], "suggestDocId": 2097637768968916993, "fixable": true, "hint": ""}}, {"id": "A-p-23-2", "category": "pair", "question": "重庆“十五五”期间对农村自来水普及率和规模化供水工程覆盖比例有什么具体目标？", "answer": "到“十五五”末，全市农村自来水普及率将达到98%，规模化供水工程覆盖农村人口比例将达到80%，集中供水工程县域统管率达100%。", "expectRefusal": false, "gold": [{"docId": 2097637768968916993, "chunkInde ": null, "meta": {"qType": "detail", "evidenceKey": "自来水普及率", "answerQuote": "到“十五五”末，全市农村自来水普及率将达到98%，规模化供水工程覆盖农村人口比例将达到80%，集中供水工程县域统管率达100%。", "candidateChunks": [2, 1, 0, 3, 22, 5, 21, 28, 16, 15, 14, 24], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 3, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案中的“集中供水工程县域统管率达100%”这一关键指标在已标注的证据段落[★3]和[★22]中均未直接出现，仅出现在未标注的段落[23]中（原文为“推动37个区县供水县域统管”，结合上下文及规划目标隐含全覆盖或需明确依据），导致忠实性存疑且证据链不完整。", "suggestion": "将段落 [23] 补充标记为 ★ 证据段落，以支撑答案中关于“县域统管率”的具体数值或政策要求；若原文[23]仅提及“推动37个区县...”，而答案称“达100%”，需核实是否有其他段落明确该百分比，若无则需修正答案表述以严格贴合原文。", "suggest": [{"chunkIndex": 23, "text": "供水能力3.44亿立方米。因地制宜推进集中供水规模化和小型供水规范化，迭代升级“农村供水保障”数字应用，建设农村供水工程1569处，推动37个区县供水县域统管。\n深化城乡教育共同体建设：推动城区优质学校与农村学校组建教育共同体，加快农村乡镇（街道）中心校与城区优质学校结对，实现课程共享、教师互派、教研联动。开展“教师轮岗交流”行动，其中城区、优质学校优秀教师向农村、薄弱学校交流轮岗的比例占符合交流条件教师比例的10%以上。优化农村学校布局，改善办学条件，补齐体育、艺术、实验等教学设施短板。\n\n乡村治理效能提升：深化实施“头雁领航·强村富民”工程，分级分类开展基层干部和网格员常态化培训，不断提升基层党建规范化水平。全域推进清廉村居建设，推进村级事务阳光工程。深化法律明白人“1+N”培养行动，累计培育人数达到8万名以上。促进民主法治示范村（社区）和“法律之家”等示范阵地提质扩面。推进平安法治乡村建设，加强农村最小应急处置单元建设，建成率、管事率达到100%。\n\n八、促进农民稳定增收致富\n\n（一）强化产业发展联农带农。深入推进千万农民增收致富促进行动。实施县域经济优势产业培育工程，打造各具特色的工业大县、农业强县和旅游名县。实施新型农业经营主体提质增效带动小农户增收行动，健全新型农业经营主体扶持政策同带动农户增收挂钩机制，支持新型农业经营主体通过订单生产、最低价收购、保底分红、入股参股、服务带动等方式，让农民分享更多增值收益。"}], "suggestDocId": 2097637768968916993, "fixable": true, "hint": ""}}, {"id": "A-p-24-1", "category": "pair", "question": "重庆市“十五五”现代服务业发展规划里提到的“9611”体系具体是指什么？", "answer": "“9”指打造数智信息等9大优势生产性服务业；“6”指培育养老托育等6大特色生活性服务业；“11”指擦亮软件“满天星”等11张服务业品牌“金名片”。", "expectRefusal": false, "gold": [{"docId": 2097637769312849921, "chunkIndex": 2, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "数智信息等9大优势生产性服务业、养老托育等6大特色生活性服务业发展质效跃升，以软件“满天星”等11张“金名片”为代表的服务业品牌矩阵加快构建，优质高效的“9611”现代服务业体系持续完善", "text": "优质高效的现代服务业新体系，形成一批西部领先、全国进位和具有重庆辨识度的服务业标志性成果，全面打响“重庆服务”品牌，为奋力谱写中国式现代化重庆篇章提供强劲支撑。\n到2030年，全市服务业综合实力和竞争力进一步增强 大做强。鼓励领军企业、链主企业开放创新要素、共享产能资源，与上下游中小企业建立稳定合作关系，充分发挥行业协会沟通服务功能，构建新型产业协作生态。深化央企、市属国企、民企、外企“四企”联动协同，带动各类主体融通发展。"}], "suggestDocId": 2097637769312849921, "fixable": true, "hint": ""}}, {"id": "A-p-25-1", "category": "pair", "question": "重庆长期护理保险制度实施方案主要包含哪些核心内容？", "answer": "核心内容是“两个扩面、三个明确”。即参保人群和护理项目扩面；明确职工居民筹资标准、待遇保障规则及管理服务要求。", "expectRefusal": false, "gold": [{"docId": 2097637769677754370, "chunkIndex": 1, "why": "重庆市建立健全长期护理保险制度实施方案", "quote": "逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系", "text": "\n为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大和二十届历次全会精神，全面贯彻落实习近平总书记视察重庆重要讲话重要指示精神，认真贯彻落实市委六届历次全会精神，逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系，加快建立与重庆经济社会发展相协调的覆盖全民、统筹城乡、公平统一、安全规范、可持续的长期护理保险制度。2026年，我市长期护理保险继续覆盖参保职工，并启动居民长期护理保险筹资，与居民医保集中筹资同步。2027年，按国家规定调整职工筹资标准和待遇标准，城乡居民按规定开始享受长期护理保险待遇。2028年及以后，不断健全责任共担的资金筹集机制、公平适度的待遇保障机制和科学规范的管理运行机制，更好满足失能人员长期护理基本保障需求，不断增强人民群众的获得感、幸福感、安全感。\n\n二、参保筹资\n\n职工和居民参加基本医疗保险时同步参加长期护理保险，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资"}, {"docId": 2097637769677754370, "chunkIndex": 3, "why": "重庆市建立健全长期护理保险制度实施方案", "quote": "享受长期护理保险待遇对象为，按规定参保缴费且失能状态原则上持续6个月以上，经申请通过评估认定的人员。", "text": "分担。18周岁以下居民跟随父母或其他法定抚养人等参保，不单独筹资，符合待遇享受条件的，按居民待遇标准享受待遇；孤儿、事实无人抚养儿童等无法跟从参保的，视同参保。\n2．政府对符合条件的困难人群个人缴费部分予以分类资助。对特困人员给予全额资助，对低保对象、符合条件的防止返贫致贫对象给予定额资助。具体资助办法由市医保局商市级有关部门确定。\n\n三、待遇保障\n\n（一）待遇对象。享受长期护理保险待遇对象为，按规定参保缴费且失能状态原则上持续6个月以上，经申请通过评估认定的人员。职工参保人员2026年按现行政策人员范围享受待遇。居民参保人员从2027年起按规定享受待遇，起步阶段待遇享受对象为重度失能人员，并根据国家统一规定逐步扩大保障范围。\n\n（二）待遇标准。待遇享受不设起付标准，根据参保类别、失能等级、服务提供方式等实行差别化待遇保障政策。符合规定的长期护理服务费用，按居民筹资政策参保缴费的，基金支付比例为50%左右；按职工筹资政策参保缴费的，基金支付比例为70%左右。居民和职工年度最高支付限额原则上不超过全市上年度城乡居民人均可支配收入的50%。鼓励发展居家和社区护理服务，在支付比例上给予适当倾斜。探索建立社区护理待遇享受标准。2027年起按国家统一规定逐步调整，根据不同服务方式实行差异化待遇享受标准。\n\n待遇享受标准由市医保局会同市财政局根据本市经济发展水平、基金运行情况、长期护理服务项目变化、长期照护师服务能力等因素研究确定。调整待遇享受标准应按国家有关规定程序办理。"}], "source": {"pairId": "p-25", "policyDocId": 2097637769677754370, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建立健全长期护理保险制度实施方案》的通知", "interpretDocId": 2097637775340064769, "interpretTitle": "《重庆市建立健全长期护理保险制度实施方案》政策例行吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2026〕36号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "两个扩面、三个明确", "answerQuote": "《实施方案》的核心内容概括起来，就是两个扩面、三个明确。", "candidateChunks": [1, 0, 3, 4, 9, 6, 5, 7, 8, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "drop", "scores": {"answerability": 2, "faithfulness": 1, "sufficiency": 1, "naturalness": 4}, "issues": ["答案编造", "证据缺失", "数字或文号错误"], "reason": "标准答案中的核心概括“两个扩面、三个明确”在提供的政策原文中完全不存在，属于严重幻觉；且文档日期为2026年（未来时间），内容疑似虚构或测试数据异常，无法基于给定文本回答。", "suggestion": "", "suggest": [], "suggestDocId": 2097637769677754370, "fixable": false, "hint": ""}}, {"id": "A-p-26-1", "category": "pair", "question": "重庆市“十五五”交通物流规划主要包含哪些方面的重大任务？", "answer": "规划重点谋划了5个方面重大任务：一是织密全要素现代化综合交通10张网；二是打造四港联动的国际性综合交通枢纽集群；三是建成“人享其行”的高品质出行服务体系；四是建成“物畅其流”的现代物流和供应链体系；五是推动交通物流高质量转型。", "expectRefusal": false, "gold": [{"docId": 2097637769740668930, "chunkIndex": 7, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "（一）高质量建设全要素现代化综合交通10张网", "text": "\n3．“千里轻舟”全国标志性品牌。“千里轻舟”成为江海直达、铁海联运、“亚欧快线”的衔接纽带，累计货运量突破5000万吨。\n4．“一核三带三环”全国精品旅游公路。形成精品旅游公路超1100公里，成为全国自驾游重要目的地。\n\n5．亚欧快线。建立“亚欧快线”品牌矩阵，打造“一次委托、一单到底、一箱到底、一码贯通”的多式联运集成服务场景，“亚欧快线”货运量年均增长15%。\n\n6．可转让货物单证公共服务平台。一纸单证通全球，单证签发流转时间从2天压缩至2小时，货物周转与贸易资金流转效率大幅提升，制度型开放优势稳步扩大。\n\n7．数智交通走廊。建成“三轴贯双圈、一廊联江海”数智通道3800公里，推动大山区大库区交通基础设施数字化转型升级。\n\n8．大山区大库区“空天地”多源立体监测感知网。建成基础设施监测预警系统，实现桥梁、边坡、隧道等重点结构物以及风险路段感知网全覆盖。通过人工智能模型分析，协同路网监测、一路多方体系，灾害事件应急救援能力持续提升。\n\n9．长江上游绿色交通示范引领。新建200艘新能源清洁能源船舶，全域实现船舶水污染物全接收、零排放，岸基供电全覆盖、全使用，靠港船舶岸电使用量内河领先，支撑重庆在长江经济带绿色发展中发挥示范作用‌。\n\n到2035年，全面建成现代化高水平交通强市和国际性综合交通枢纽城市，全面实现“人享其行、物畅其流”美好愿景。\n\n二、建设链接全球的全国交通极，支撑内陆开放综合枢纽能级整体跃升\n\n（一）高质量建设全要素现代化综合交通10张网"}, {"docId": 2097637769740668930, "chunkIndex": 18, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "（二）打造四港联动的国际性综合交通枢纽集群", "text": "，因地制宜推进13个老旧长途客运站增设物流快递等设施，提高快递业干线运输规模化水平，拓展支线运输网络化覆盖面。推进城市末端智能收投终端、标准化末端服务设施建设。\n打造畅安舒美的绿道网。打造“山城绿道”特色品牌体系，实现“30分钟入山林、15分钟亲水岸、10分钟进公园”。深入实施山城步道“成网”计划，有序推动山城步道连线成片。建设路景融合的美丽绿色交通廊道，推动高速公路、普通公路路域环境洁化、绿化、美化，打造一批绿色廊道工程。深化“美丽农村路”建设，力争每个区县累计建成1—2条“美丽农村路”，助力打造巴渝和美乡村。建设生态美丽航道，形成航旅融合的巴渝文化水上风景线。\n\n专栏12  绿道网建设重大工程\n\n1．山城绿道。中心城区累计建成“三级六类”山城绿道1000公里以上。\n\n2．山城步道。开工建设云碚映象步道等项目；建成塔子山滨江步道等项目，山城步道里程达到1000公里以上。\n\n3．美丽绿色交通廊道。打造旅游绿色廊道1100公里以上、“美丽农村路”1000公里以上、生态美丽航道170公里以上。\n\n统筹推动10张网高效衔接。坚持“多规合一”，构建全量交通“一张图”，强化通道线位资源、岸线资源、土地资源、空域资源、水域资源节约集约利用，推动铁路、轨道、道路、管道等线位统筹，促进通道由单一向综合、由平面向立体发展。推动多层次轨道交通融合发展，拓展跨线运营覆盖面。强化高速公路、干线公路与城市道路标准匹配、建设同步，推动城市绿道、公共交通、慢行交通一体融合。\n\n（二）打造四港联动的国际性综合交通枢纽集群"}, {"docId": 2097637769740668930, "chunkIndex": 24, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "三、建成高品质“人享其行”的现代出行服务体系，打造更高水平人民满意交通", "text": "绸之路经济带通道，丰富拓展渝满俄通道，研究重庆衔接北极航线的国际贸易新路径，构建贯通欧洲—中国—东盟跨欧亚大陆的超级走廊，支撑重庆成为我国南向西向开放战略高地。\n支撑构建市域高质量发展新格局。推动中心城区强核提能级，提升两江新区空港型、港口型国家物流枢纽全球连通度与区域辐射力，支持北碚打造北部门户枢纽。提升永川城市副中心综合交通发展能级，协同打造渝西国际开放枢纽，构建渝西地区“半小时交通圈”。支持渝东新城共建长江上游大宗商品供应链组织枢纽。以万州重要城市副中心为引领打造万达开云全国性综合交通枢纽，构建渝东北“1小时交通圈”。提升黔江区域中心城市交通发展能级，服务渝东南武陵山区高质量发展。\n\n三、建成高品质“人享其行”的现代出行服务体系，打造更高水平人民满意交通\n\n（四）优化提升多层次出行服务品质\n\n提升国际出行服务水平。加快构建航班波，江北国际机场飞机年起降达到52万架次，国际地区旅客吞吐量达到500万人次。提升入境游便利化水平，升级打造入境游口岸签“一网通办”应用，提供“零延时”通关服务。构建以机场为主体的跨航司中转平台，提升跨航司、跨地服代理、跨航站楼“三跨中转”效率，完善“5E+”中转服务，联合在线旅游信息服务商（OTA）开发航线中转产品，丰富空空、空铁等联运产品供给，提升综合服务品质。"}, {"docId": 2097637769740668930, "chunkIndex": 28, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "四、建成高质量“物畅其流”的现代物流和供应链体系，服务现代化产业体系迭代升级", "text": "旅游、亲子旅游、红色旅游等特色旅游产品，探索发展游艇经济，创新低空文旅消费融合发展模式。聚焦节假日等客流高峰时段，加密旅游专线、定制客运班次，保障游客便捷出行。\n四、建成高质量“物畅其流”的现代物流和供应链体系，服务现代化产业体系迭代升级\n\n（六）全面提升通道运营组织能力\n\n增强“双主轴”运营组织能力。集成做优陆路主轴“亚欧快线”产品矩阵，推动中新、中缅、中老通道拓网提质，建立西部陆海新通道沿线“13+2”省区市项目、政策、改革、平台联动机制，搭建“跨区域综合运营平台+专业化子公司+海外机构”的跨区域运营体系。优化南通道班列开行，探索“班列集运+海外仓前置”一体化模式，提升中欧（亚）班列发展能级。强化西部陆海新通道和中欧班列高效衔接，创新集装箱共享调拨机制。统筹推动长江水路主轴降本增效，整合口岸通关、保税仓储、航运物流、智慧信息管理等综合服务功能，提升港口一体化运营服务能级与长江水运通道整体运行效能。开发“新三样”货物江铁海联运班列产品，联动长江沿线港口城市强化航线网络等资源集成，实现降本增效。"}], "source": {"pairId": "p-26", "policyDocId": 2097637769740668930, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》的通知", "interpretDocId": 2097637775440728066, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕18号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "5个方面重大任务", "answerQuote": "规划重点谋划了5个方面重大任务：一是织密全要素现代化综合交通10张网。", "candidateChunks": [2, 43, 7, 18, 24, 6, 8, 19, 20, 28, 32, 21], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失", "证据无关"], "reason": "标准答案概括了规划的五大任务，但当前标注的证据段落（★7, ★18, ★24, ★28）严重错位：★7和★18仅涉及具体指标或局部细节，无法支撑‘10张网’、‘四港联动’等宏观任务标题；而真正包含这五个一级标题的段落（[8]、[19]、[24]、[28]部分、[33]）未被完整标注。特别是[28]虽标星但主要讲物流体系，前四个任务的标题依据缺失。", "suggestion": "重新标注证据段落以覆盖所有五个任务的标题来源：\n1. 保留/新增 [8]：对应“一、织密全要素现代化综合交通10张网”（见段落末尾小标题）。\n2. 保留/新增 [19]：对应“二、打造四港联动的国际性综合交通枢纽集群”（见段落开头小标题）。\n3. 保留/新增 [24]：对应“三、建成高品质‘人享其行’的现代出行服务体系”（见段落中间小标题）。\n4. 保留 [28]：对应“四、建成高质量‘物畅其流’的现代物流和供应链体系”（见段落开头小标题）。\n5. 保留/新增 [33]：对应“五、推动交通物流高质量转型”（见段落开头小标题）。\n6. 移除 ★7 和 ★18，因为它们不包含上述宏观任务的定义性文", "suggest": [{"chunkIndex": 8, "text": "\n二、建设链接全球的全国交通极，支撑内陆开放综合枢纽能级整体跃升\n\n（一）高质量建设全要素现代化综合交通10张网\n加力贯通国家“3轴2廊1通道”主骨架。加速贯通重庆至京津冀、长三角、粤港澳大湾区的3条国家交通主轴，形成综合性、多通道、立体化、大容量、快速化的交通主骨架。深化与东部地区的战略协同，有力支撑重庆链条式、集群化承接东部地区重点产业转移。全力畅通重庆衔接西部陆海、成渝昆2条走廊，加强与兰州—西宁、宁夏沿黄、天山北坡及黔中、滇中、北部湾等城市群的协同联动，更好服务新时代西部大开发。加快提升厦渝蓉通道能力，打通联动海峡西岸经济区东西大动脉。\n\n补强便捷高效的铁路网。基本建成“米”字型高铁网，全面建成“2小时重庆”交通圈，形成中心城区至渝东北350公里时速高铁3通道，加快实现渝东南高铁全覆盖。拓展区域联络线，加快推动渝东北与渝东南高铁直联。推动普速铁路成环成网，加快建设“两环十一干线多联线”普速铁路网，全市区县铁路覆盖率从86%提升至97%。完善铁路枢纽提升联络线，实施中心城区“一场四站”枢纽铁路直联工程，谋划重庆新机场“X”型联络线，加快实现枢纽互联融通。\n\n专栏3  铁路网建设重大工程\n\n1．高速铁路。开工建设黔江至吉首高铁、渝贵高铁等项目；建成成渝中线高铁、渝西高铁、渝万高铁、成达万高铁、宜涪高铁等项目；推进重庆至遂宁铁路、万州至黔江铁路等项目前期工作；开展兰渝高铁、涪陵至武隆铁路等项目前期研究。"}, {"chunkIndex": 19, "text": "拓展跨线运营覆盖面。强化高速公路、干线公路与城市道路标准匹配、建设同步，推动城市绿道、公共交通、慢行交通一体融合。\n\n（二）打造四港联动的国际性综合交通枢纽集群\n加快建成高能级国际陆港。构建贯通欧亚的铁路枢纽，完善“1+4+N”铁路货运枢纽布局，强化铁路与港口枢纽联动，一体打造西部陆海新通道物流和运营组织中心、中欧班列集结中心、长江上游航运中心，提升服务“亚欧快线”集货的能力。建成“四主多辅”铁路客运枢纽体系，打造枢纽综合体，发展枢纽经济。提升国际公路物流枢纽开放功能，依托重庆公路物流基地，统筹布局国际集散分拨中心、中转集拼中心、大宗商品储运基地，增强国家冷链骨干基地功能，提升面向东盟地区的辐射能级。\n\n全力打造全国内河一流水港。构建以中心城区果园、万州新田、涪陵龙头、江津珞璜四大战略性港口为核心的多式联运枢纽集群，实施万吨级货运港口泊位改造提升工程，建设一批江海直达集散港，推动存量中小港口提档升级，港口年通过能力提升3000万吨，周边地区到重庆港的货物中转比例达到55%。实施港口高质量发展行动，建成投用航运服务业集聚区，提升内河航运综合服务效能。有序推进港口资源整合和港产城融合发展，壮大临港经济。在新疆、四川、云南等地合作共建内陆无水港，优化水运开放口岸布局，形成辐射西部、联通全球的航运开放枢纽。"}, {"chunkIndex": 24, "text": "绸之路经济带通道，丰富拓展渝满俄通道，研究重庆衔接北极航线的国际贸易新路径，构建贯通欧洲—中国—东盟跨欧亚大陆的超级走廊，支撑重庆成为我国南向西向开放战略高地。\n支撑构建市域高质量发展新格局。推动中心城区强核提能级，提升两江新区空港型、港口型国家物流枢纽全球连通度与区域辐射力，支持北碚打造北部门户枢纽。提升永川城市副中心综合交通发展能级，协同打造渝西国际开放枢纽，构建渝西地区“半小时交通圈”。支持渝东新城共建长江上游大宗商品供应链组织枢纽。以万州重要城市副中心为引领打造万达开云全国性综合交通枢纽，构建渝东北“1小时交通圈”。提升黔江区域中心城市交通发展能级，服务渝东南武陵山区高质量发展。\n\n三、建成高品质“人享其行”的现代出行服务体系，打造更高水平人民满意交通\n\n（四）优化提升多层次出行服务品质\n\n提升国际出行服务水平。加快构建航班波，江北国际机场飞机年起降达到52万架次，国际地区旅客吞吐量达到500万人次。提升入境游便利化水平，升级打造入境游口岸签“一网通办”应用，提供“零延时”通关服务。构建以机场为主体的跨航司中转平台，提升跨航司、跨地服代理、跨航站楼“三跨中转”效率，完善“5E+”中转服务，联合在线旅游信息服务商（OTA）开发航线中转产品，丰富空空、空铁等联运产品供给，提升综合服务品质。"}, {"chunkIndex": 33, "text": "\n五、推动交通物流高质量转型，全面构建可持续发展新格局\n\n（八）强化科技创新赋能交通物流转型\n推动数智化提质增效。推进交通基础设施更新和数智化改造，建设智能综合立体交通网，打造“三轴贯双圈、一廊联江海”数智通道。推进枢纽场站一体智治，实施铁路枢纽、机场、港口、邮政枢纽、公交轨道站场、物流园区数智化改造。强化运输装备智能化升级，推广智能客货运车辆、智能轨道装备、智能船舶、智能装卸等装备运用。\n\n打造标志性引领性新业态新场景。依托渝湘复线巴南至彭水段等高速公路，建设多元化自动驾驶测试基地。建设非收费快速物流通道“自动驾驶+编队运输”路段约80公里。实施“人工智能+交通运输”行动，创建“渝享行”品牌，推广高速公路“手机+”无卡便捷通行服务，建设“人工智能+数字陆海新通道”综合场景。\n\n专栏17  “人工智能+交通运输”重大工程\n\n1．公路水路基础设施数智化升级。建成1970公里智慧高速公路、830公里智慧国道、1000公里智慧航道、136个高速公路智慧服务区。重点开展G5001、G42、G50、G65、G75、G5013、G93、G5021等高速公路，国道G210、G319等普通公路，长江、嘉陵江、乌江等干支航道基础设施数智化改造。"}], "suggestDocId": 2097637769740668930, "fixable": true, "hint": ""}}, {"id": "A-p-26-2", "category": "pair", "question": "到2030年，重庆新能源重卡的渗透率目标是多少？", "answer": "根据规划，重庆将深入推动新能源重卡规模化应用，力争到2030年新能源重卡渗透率达到40%。", "expectRefusal": false, "gold": [{"docId": 2097637769740668930, "chunkIndex": 38, "why": "重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）", "quote": "深入推进大规模设备更新行动，促进新能源重卡规模化应用", "text": "，常态化推进城市道路、桥梁、隧道风险隐患排查整治，加强地下空洞探测与土体疏松治理，分类推进危旧桥隧整治加固，对承载力不足、抗灾性能落后的设施实施改造或有序更新。\n7．能源管道养护。规范油气管道竣工测量图管理，确保管道路由清晰、中心线定位精准，标志桩、警示牌科学规范。基于内检测数据对老旧管道开展完整性评估，根据评估结果实施缺陷整治。\n\n（十）描绘绿色低碳交通新画卷\n\n推广绿色设施设备。建设“零碳运输通道”，新建加氢站15座以上，建成超充重卡场站100座以上，开展高速公路服务区、景区等充电设施提升行动，力争高速公路服务区超充设施覆盖率达到100%，打造成渝地区双城经济圈和西部陆海新通道“氢走廊”“电走廊”。建设“零碳枢纽”，推广绿电、绿证在客货枢纽运营使用，推进枢纽场站和邮政快递分拨中心、网点、仓储设施绿色化改造，加快场站内部作业设备电动化替代，争创3—5个“零碳枢纽”示范工程。深入推进大规模设备更新行动，促进新能源重卡规模化应用，引导中心城区新增及更新公交车、巡游出租车使用新能源车；推广应用电动、液化天然气、甲醇等新能源、清洁能源船舶，打造“千里轻舟”新能源船队，完善补能设施布局。\n\n持续深化运输结构调整。加快推进大宗物资中长距离运输“公转铁”“公转水”，大力发展铁水联运、江海联运、水水中转，支持“散改集”运输，推动铁水联运量占港口吞吐量的比重达到12%，有效降低公路运输比重。推广卡车航班、高铁快运等模式，推动联程运输一体化。"}], "source": {"pairId": "p-26", "policyDocId": 2097637769740668930, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》的通知", "interpretDocId": 2097637775440728066, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”现代综合交通运输体系和物流发展规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕18号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "新能源重卡渗透率", "answerQuote": "深入推动新能源重卡规模化应用，到2030年新能源重卡渗透率达到40%。", "candidateChunks": [38, 15, 39, 34, 17, 20, 2, 21, 16, 22, 37, 24], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案中的核心数据“40%”在标★的段落[38]中仅提及“深入推进大规模设备更新行动，促进新能源重卡规模化应用”，未直接给出具体渗透率数值。该数值实际位于文档开头的指标表（段落[3]）中，因此证据标注不完整。", "suggestion": "将段落 [3] 补充为 gold evidence，因为其中包含明确的量化指标表格，是回答“目标是多少”的直接依据；或者修改问题为定性描述（如“重庆对新能源重卡有何规划？”），但鉴于政务问答通常追求精确数据，建议补全证据。", "suggest": [{"chunkIndex": 3, "text": "\n物流发展规划主要指标\n\n序号\n\n类型\n\n指标名称\n\n单位\n\n2025年\n\n2030年\n\n属性\n\n1\n\n现代化综合立体交通网\n国家综合立体交通网主骨架建成率\n\n%\n\n92\n\n98\n\n预期性\n\n2\n\n高速铁路通车里程\n\n公里\n\n1356\n\n2100\n\n预期性\n\n3\n\n轨道交通运营里程\n\n公里\n\n582\n\n800\n\n预期性\n\n4\n\n高速公路 护。严格湿地用途管控，完善湿地分级分类管理体系，推进国家重要湿地等保护修复。科学推进国土绿化，开展森林质量精准提升，全市森林覆盖率保持在55%以上。\n\n3﹒强化重要生态区域监管。加快自然保护地整合优化成果落地，推进自然保护地勘界立标，加强国家级自然保护区能力建设，自然保护地占国土面积的比例不低于13.55%。严格落实生态保护红线监管制度，持续实施“绿盾”自然保护地生态环境问题排查专项行动，推动国家级自然保护区重点生态破坏问题动态清零，全市生态保护红线面积不低于1.92万平方公里。\n\n（二）精心治岸塑造美丽岸线\n\n1﹒建设绿色生态水域廊道。统筹实施长江岸线保护和利用，严格河道水域岸线分区分类管控。纵深推进河湖“清四乱”常态化规范化，重点清理整治警戒水位以下的违法违规建筑设施。一体打造山水、建筑、滩涂、桥梁、灯光景观，有序推进河湖水域岸线空间开放共享，做靓现代化国际大都市滨江风景线。"}, {"docId": 2097637769845526529, "chunkIndex": 6, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "（二）精准治气，守护美丽蓝天", "text": "态流量监测预警机制，重点河湖基本生态流量保障率保持在90%以上。巩固城市饮用水水源地保护成效，开展乡镇水源地达标治理和规范化建设，实施提升农村饮水质量专项行动。\n3﹒推动水生态修复。编制水生态评价技术指南，探索开展水生态调查评估。因地制宜实施水系连通、河道清淤疏浚等工程，推进长江、嘉陵江、乌江等重点流域、城市河段及其他重要水体河湖生态缓冲带建设。推进长江三峡库区（重庆段）水华重点区域预警与安全监控能力建设，加强湖库富营养化综合治理，逐步解决湖库水生态失衡问题。建立完善美丽河湖、幸福河湖综合评价和管理体系。\n\n（二）精准治气，守护美丽蓝天\n\n1﹒强化重点行业深度治理。推进水泥、垃圾焚烧等重点行业及燃煤锅炉超低排放改造，实施玻璃、有色金属、铸造等工业炉窑及殡葬行业废气深度治理，加强低效失效大气污染治理设施排查整治。推进烧结砖瓦行业整合升级，实施铸造、家具等传统产业集群整治。推动汽车供应链集群整治，加强低（无）挥发性有机物（VOCs）原辅材料源头替代和全流程治理。持续健全以大气环境绩效分级为导向的管理体系，开展绩效等级提升行动。\n\n2﹒强化移动源污染防治。开展油品储运销深度治理，深化机动车年检机构监管执法，推进新生产柴油货车系族检查全覆盖。加强重型货车路检路查和入户检查，严厉打击拆除尾气后处理装置、破坏或篡改车载诊断系统等违法行为。优化调整柴油货车限行区域，严查冒黑烟车辆上路行驶。开展非道路移动机械、船舶清洁化发展攻坚行动，基本实现靠港船舶岸电使用常态化，鼓励使用新能源或国四及以上排放标准的非道路移动机械。"}, {"docId": 2097637769845526529, "chunkIndex": 15, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "四、协同治城治乡，塑造全市域整体大美风貌\n\n（一）聚力治城做靓美丽城市", "text": "化主要支流和中小河流岸线治理，完成130公顷生态缓冲带保护与修复。治理水土流失面积6000平方公里。完成1500公顷废弃矿山生态修复，建成绿色矿山120座以上。\n3﹒生物多样性保护。科学规范开展增殖放流，每年放流水生生物1500万尾以上，其中珍贵濒危物种比例不低于10%，推动“三江”干流重点水域水生生物资源监测实现全覆盖。开展保护鸟类活动和打击非法捕猎贩卖鸟类专项行动。建成高标准野生植物资源库（圃）不少于10个，保存野生植物资源5万份以上。生物多样性观测站点基本覆盖全市自然保护地和典型生态系统。\n\n四、协同治城治乡，塑造全市域整体大美风貌\n\n（一）聚力治城做靓美丽城市\n\n1﹒整治群众反映强烈的城市环境问题。实施城市噪声综合治理，开展声环境功能区划成效评估，完善数智化噪声地图。加强新建餐饮服务项目选址管控，推进公共机构食堂和特色餐饮油烟深度治理。开展工业、市政等领域恶臭异味重点源排查治理，建立长效巩固机制。完善公众生态环境监督和举报反馈机制，加强网络热点环境污染问题监控分析，及时解决群众急难愁盼问题，生态环境公众满意度稳定在93%左右。\n\n2﹒提升国际化大都市风貌品质。实施城市更新行动，推进现代化都市风貌展示区、城市“美丽廊道”等建设，塑造区县城特色风貌名片，持续擦亮“山城夜景”品牌。实施中心城区第五立面治理提升行动。推进城市绿地微更新，实施“增绿添园”，推动山城绿道建设，打造具有国际风范的“立体绿城”。\n\n（二）纵深治乡建设美丽乡村"}], "source": {"pairId": "p-27", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 2097637775600111618, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”美丽重庆建设规划（2026—2030年）》解读 新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "7个方面重点任务", "answerQuote": "安排了美丽河湖、美丽蓝天、美丽净土、美丽山川、美丽岸线、美丽城市、美丽乡村等7个方面重点任务", "candidateChunks": [2, 0, 1, 32, 4, 5, 12, 26, 6, 15, 11, 13], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失", "证据无关"], "reason": "标准答案中的核心信息（7个方面、22项指标等）主要概括自文档的‘总体要求’和‘总体布局’部分（段落1-2），但当前标注的证据段落（4,6,12,15）仅包含具体的任务细节或指标表格片段，无法直接推导出‘聚焦...7个方面重点任务’这一宏观总结句；且标注了过多与宏观概括无关的具体执行细节。", "suggestion": "将 gold 证据段落修改为 [1, 2]。段落1和2包含了规划的背景、目标以及‘各美其美的美丽城市和美丽乡村’等总体布局描述，结合全文结构可支撑答案中关于重点任务和整体架构的概括。若需保留具体任务佐证，可补充包含‘二、深化实施...’标题的段落5，但段落1-2对于回答‘主要包含哪些方面’更为关键。", "suggest": [{"chunkIndex": 1, "text": "设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深学笃行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，认真落实习近平总书记视察重庆重要讲话重要指示精神，按照市委六届历次全会工作部署，紧扣做实“两大定位”、发挥“三个作用”，牢固树立和践行“绿水青山就是金山银山”理念，全面落实精准科学依法治污方针，协同推进降碳、减污、扩绿、增长，以“九治”为牵引推进污染防治攻坚和生态系统优化，深化改革创新和数智赋能双轮驱动，推动经济社会发展全面绿色转型，提供更多优质生态产品以满足人民日益增长的美好生活需要，为奋力谱写中国式现代化重庆篇章提供有力支撑。\n\n到2030年，美丽重庆建设取得新的重大进展，川渝地区美丽中国先行区基本建成。长江干流重庆段水质稳定保持在Ⅱ类，城乡黑臭水体保持动态清零，细颗粒物（PM2.5）浓度持续下降，基本消除重污染天气，主要污染物排放总量持续减少，生态系统多样性稳定性持续性不断提升，山水都市风貌整体大美全面彰显，碳达峰目标如期实现，绿色生产生活方式基本形成，适应美丽重庆建设的生态环境治理体系不断健全，打造一批“西部领先、全国进位和重庆辨识度”的标志性成果，全面筑牢长江上游重要生态屏障。到2035年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。"}, {"chunkIndex": 2, "text": "5年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。\n“十五五”时期建设省域美丽中国先行区的总体布局：\n\n——加快建设各美其美的美丽城市和美丽乡村。以绿色低碳、环境优美、生态宜居、安全健康、智慧高效为导向，差异化、特色化推进美丽城市建设，塑造都市风貌展示区、美丽廊道、区县城特色风貌名片，纳入市级美丽城市培育的区县占比达到60%。立足农村人居环境改善、农业绿色低碳发展、乡村风貌品质提升，梯次分类推进具有巴渝韵味的美丽乡村建设，美丽乡村整县建成比例达到60%。\n\n——全面推进“美丽系列”建设。加快实施美丽河湖保护与建设行动，推进幸福河湖建设，建成美丽河湖45个（段）、幸福河湖400条（个）。深化生态文明建设示范区、“绿水青山就是金山银山”实践创新基地和生态工业园区、零碳园区、零碳工厂建设，提质建设全域“无废城市”。鼓励园区、企业、社区、学校、医院等开展“美丽+”特色模式探索。\n\n专栏1  “十五五”美丽重庆建设主要指标\n\n序号\n\n类别\n\n指标\n\n单位\n\n2025年\n\n2030年\n\n目标值\n\n指标\n\n属性\n\n1\n\n环境质量改善\n\n63个地表水国控断面优良水体比例\n\n%\n\n85.7\n\n93.7\n\n约束性\n\n2\n\n63个地表水国控断面达到或优于Ⅲ类水质比例\n\n%\n\n93.7\n\n96.8\n\n预期性\n\n3\n\n中心城区城市生活污水集中收集率\n\n%\n\n88.3\n\n≥90.0\n\n预期性\n\n4\n\n细颗粒物（PM2.5）浓度\n\n微克/立方米\n\n33.5*"}], "suggestDocId": 2097637769845526529, "fixable": true, "hint": ""}}, {"id": "A-p-27-2", "category": "pair", "question": "到2030年，重庆在绿色工厂和绿色园区建设方面有什么具体目标？", "answer": "到2030年，累计建成绿色工厂500个、绿色园区36个。这是产业结构绿色低碳转型的重要指标，旨在建立绿色低碳循环产业体系。", "expectRefusal": false, "gold": [{"docId": 2097637769845526529, "chunkIndex": 21, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年）", "quote": "培育壮大绿色制造体系，累计建成绿色工厂500个、绿色园区36个。", "text": "升气候风险防范能力，完善自然灾害综合风险图和防治区划图，优化灾害应急响应救援扁平化组织指挥模式。深化国家气候适应型城市建设试点，开展气候变化适应能力和成效评估。\n3﹒深入践行绿色低碳生活方式。有序实施消费品以旧换新政策，积极发展绿色消费新模式和新业态，组织开展绿色智能家电以旧换新、新能源汽车置换等促进绿色消费活动。持续开展节约型机关建设，严格执行政府绿色采购政策，引导企业执行绿色采购指南。接续开展国际生物多样性日、世界环境日、全国生态日、全国低碳日等宣传活动，倡导简约适度、绿色低碳、文明健康的生活理念和消费方式。\n\n专栏5  绿色低碳转型重大事项\n\n1﹒产业绿色低碳转型。培育壮大绿色制造体系，累计建成绿色工厂500个、绿色园区36个。实施钢铁、石化等行业节能节水降碳改造升级，加大报废汽车、废动力电池、再生金属等再生资源回收利用力度，全市主要再生资源年循环利用量达到1100万吨。\n\n2﹒构建清洁低碳能源体系。大力发展清洁能源，建成川渝千亿立方米国家油气生产基地，建设百亿立方米储气库群，全市新能源装机达到1100万千瓦，清洁能源装机占比达到50%。实施高耗能、高污染存量机组“上大压小”项目，有序推动老旧煤电机组关停淘汰或退役转备用，煤炭消费比重降至39%，实现煤炭、成品油消费达峰。\n\n3﹒交通运输绿色转型。推进交通运输大规模设备更新，推动新能源重型卡车规模化应用，重点大宗货物清洁运输比例达到90%以上，中心城区公交车和巡游出租车纯电动化占比达到80%以上。推进“零碳枢纽”建设，实施3—5个绿色港口建设工程。"}], "source": {"pairId": "p-27", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 2097637775600111618, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”美丽重庆建设规划（2026—2030年）》解读 新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "绿色工厂500个", "answerQuote": "到2030年，累计建成绿色工厂500个、绿色园区36个", "candidateChunks": [21, 18, 17, 2, 1, 14, 31, 19, 28, 24, 9, 5], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 5, "naturalness": 5}, "issues": ["其他"], "reason": "标准答案中的核心数据（绿色工厂500个、绿色园区36个）在标★段落[21]中完全对应，问题自然且可答。但答案后半句‘这是产业结构绿色低碳转型的重要指标...’属于对原文语境的概括性解读，虽无事实错误，但在严格忠实性上略有外推（原文仅列为专栏事项），不过不影响整体合格判定。", "suggestion": "", "suggest": [], "suggestDocId": 2097637769845526529, "fixable": false, "hint": ""}}, {"id": "A-p-28-1", "category": "pair", "question": "重庆市推进城市全域数字化转型行动计划主要部署了哪几方面的能力提升行动？", "answer": "该计划部署了五大核心能力提升行动，覆盖数字底座、智能中枢、六大系统、基层智治、适数生态等方面。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "二、数字底座能力提升行动", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 7, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "五、基层智治体系能力提升行动", "text": "代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。\n（二十）全面构建数字经济系统体系能力。聚焦产业集群培育、企业成长服务、产业创新生态系统重塑、产业发展质效提升、现代化产业治理等，持续深化梳理迭代数字经济系统五级核心业务体系。迭代建设产业一链通、数智金融服务、智汇攻关、数字陆海新通道等数字化应用，加快构建产业培育、科技创新、企业服务等五级联动业务承接体系，推动数智赋能新质生产力发展和现代化产业体系建设。\n\n（二十一）全面构建数字社会系统体系能力。聚焦投资于人、消费提档、民生改善等，持续优化完善数字社会系统五级核心业务体系。迭代建设惠学生、智慧医保、救助通、渝你同行、信用等数字化应用，有效提升五级联动业务承接能力，赋能构建更加优质均衡的公共服务体系。\n\n（二十二）全面构建数字文化系统体系能力。聚焦主流价值、主流舆论、主流文化等，持续优化完善数字文化系统五级核心业务体系。迭代建设春风满巴渝、巴渝文物、惠游重庆等数字化应用，加快构建数字文化系统五级联动业务承接体系，全面推动数智赋能新时代文化强市建设。\n\n（二十三）全面构建数字法治系统体系能力。聚焦维护国家政治安全、确保社会大局稳定、促进社会公平正义、保障人民安居乐业等，持续优化完善数字法治系统五级核心业务体系。迭代情指行、全民反诈、重庆调解在线、“执法+监督”等数字化应用，加快构建数字法治系统五级联动业务承接体系。\n\n五、基层智治体系能力提升行动"}, {"docId": 2097637763906392065, "chunkIndex": 6, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "四、六大系统能力提升行动", "text": "方案优化完善、线上精细化智能预案各跑道全覆盖，打造全媒体传播大脑、智慧文旅等综合场景，全面提升舆论引导精准度、文化服务普惠度、文明素养浸润度，营造良好文化氛围。\n（十六）加快集成生态景观防治协同支撑能力。聚焦空气环境、固废与土壤环境、自然资源等领域，推动生态景观板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造污染防治攻坚战智管、中心城区“四山”管理等综合场景，加快构建生态环境数字治理新形态。\n\n（十七）加快集成高品质生产生活服务支撑能力。聚焦医疗、教育、就业、养老等领域，推动生产生活服务板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造15分钟高品质生活服务圈、“三医”协同、高质量就业综合智服等综合场景。\n\n四、六大系统能力提升行动\n\n（十八）全面构建数字党建系统体系能力。聚焦推动党的领导一贯到底、纵深推进全面从严治党、深化全过程人民民主市域实践等，持续深化梳理迭代数字党建系统五级核心业务体系。迭代建设八张报表、八张问题清单、突发事件直报快响、渝才荟、人大代表全渝通、青春重庆等数字化应用，持续提升数字党建五级联动业务承接能力，加快完善党建统领整体智治工作格局。\n\n（十九）全面构建数字政务系统体系能力。聚焦全生命周期服务、全要素决策发展、全链条本质安全、全域协同治理等，持续深化梳理迭代数字政务系统五级核心业务体系。迭代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。"}, {"docId": 2097637763906392065, "chunkIndex": 3, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "三、智能中枢能力提升行动", "text": "模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。\n（五）推进感知可用。强化感知资源“一本账”管理，推进感知盲区补点、接入，构建融通智联感知体系。鼓励社会主体感知资源接入，推进感知资源与体征指标、风险点、智能预案等深度关联。提升AI赋能视频感知资源利用率、共享率、复用率，强化城市基础设施数字化改造。\n\n（六）推进空间孪生。建设空间数据体系，迭代国土空间数据综合信息系统，深化“多规合一”专题图，构建“挂图作战”智能体系，加快自然空间、人造空间向数字空间全量孪生。聚焦产业升级、科技创新等发展行为，应急调度、风险排查等治理行为，教育就业、卫生健康等服务行为，推动行为（活动）向数字空间映射。推动先进文化向数字空间孪生。\n\n（七）优化“两端”入口。迭代升级“渝快政”，开展信创化改造和客户端适配。升级“渝快办”，深化线上全程网办、线下全渝通办和一站式服务。\n\n（八）抓实数据安全。建设数据灾备中心，加强数字重庆人工智能底座保密防护和管理。落实数据分类分级保护制度，完善风险监测预警、安全审查监管等机制。\n\n三、智能中枢能力提升行动"}], "source": {"pairId": "p-28", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637779450482689, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》印发 到2027年 数字重庆体系能力全面建成", "interpretSection": "媒体视角", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", 快集成高质量经济发展支撑能力。聚焦经济调节、企业培育、科技创新、金融服务等领域，推动经济发展板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造“AI+企业码上服务”、数字财政、国资穿透式智能监管体系、“产业大脑+未来工厂”等综合场景，推动数据贯通赋能生产、分配、流通、消费各环节。"}, {"chunkIndex": 8, "text": "系统五级核心业务体系。迭代情指行、全民反诈、重庆调解在线、“执法+监督”等数字化应用，加快构建数字法治系统五级联动业务承接体系。\n\n五、基层智治体系能力提升行动\n（二十四）加快形成党建统领基层智治体系。健全镇街带村社带网格工作机制，构建全过程、多维度效能评价体系。赋权扩能基层党组织运行、干部履职效能闭环监测与智能预警，打造党建统领基层智治实践范例。\n\n（二十五）加快形成风险隐患闭环智控体系。综合承接应急、消防、公安、气象等贯通应用，强化多源风险数据融合与智能分析，延展市、区县、镇街三级风险监测预警网络，提升全域风险防控能力。全面支撑革新多跨数字应急预案、重构数字化应急指挥体系，推动重点人员协同共管、应急抢险联动处置、多跨事件高效办理。\n\n（二十六）加快形成矛盾纠纷综合化解体系。承接“矛盾纠纷多元化解”等应用融合贯通，健全“网格排查、部门联动、提级管控”协同化解机制，探索建立重点领域矛盾纠纷动态监测与预警模型，强化婚恋家庭、邻里关系、欠资欠薪、涉法涉诉等隐患前端感知能力，构建基层矛盾治理新格局。\n\n（二十七）加快形成助企兴业集成优服体系。建立健全“千企万户大走访”常态化走访机制，承接贯通“信用+金融”“信用+监管”等综合场景，构建企业精准画像与健康度评估体系，强化涉企数据共享与业务协同，推动惠企政策智能匹配、精准推送、直达快享。\n\n（二十八）加快形成民呼我为精细服务体系。健全“网格吹哨、部门报到”联动机制，用好民呼我为、15分钟高品质生活服务圈等数字化应用，精准识别群众高频需求与急难愁盼问题，智能匹配、精准投放养老、托育、医疗等服务资源。"}, {"chunkIndex": 9, "text": "吹哨、部门报到”联动机制，用好民呼我为、15分钟高品质生活服务圈等数字化应用，精准识别群众高频需求与急难愁盼问题，智能匹配、精准投放养老、托育、医疗等服务资源。\n六、适数生态能力提升行动\n\n（二十九）壮大适数主体。加快培育数据资源、数据技术、数据服务等多元市场主体，引育公共数据经营主体、可信数据空间运营主体。加强对数据产权登记机构及公共数据授权运营机构和实施机构的规范管理，加快培育数据标注、治理、交易服务及第三方专业服务机构。全面实施“人工智能+”行动，引导算力、数据、算法等企业共建人工智能赋能城市治理合作生态。\n\n（三十）优化要素配置。摸清要素资源底数，打造要素配置数字化平台。推动供数、治数、用数等主体接入数据基础设施。建成公共数据资源登记和授权管理系统，支持市场主体参与公共数据授权运营。推进数据产品“一地上架、全国互认”，推动公共数据产品和服务进入西部数据交易中心交易。建立公共数据跨区域共享规则，推动成渝地区双城经济圈公共数据共享、场景互通。优化数据跨境流通机制，深化“数据要素×”行动，打造一批数据要素赋能场景。\n\n（三十一）发展数字经济。推进数字技术与一二三产业深度融合，深化数智赋能“33618”现代制造业集群体系建设。围绕数据采集汇聚、计算存储、流通交易、数据基础设施建设及服务等领域，大力培育数据产业。支持两江新区等建设数据产业集聚区，加快培育低空经济、无人驾驶、具身智能、软件和信息服务业、空天信息、平台经济等产业集群。强化数智赋能内陆开放综合枢纽建设，大力发展数字贸易。"}], "suggestDocId": 2097637763906392065, "fixable": true, "hint": ""}}, {"id": "A-p-28-2", "category": "pair", "question": "到2027年，重庆在数据企业培育和数字经济占比方面有什么具体指标？", "answer": "到2027年，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}], "source": {"pairId": "p-28", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637779450482689, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》印发 到2027年 数字重庆体系能力全面建成", "interpretSection": "媒体视角", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "1000家", "answerQuote": "新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。", "candidateChunks": [1, 4, 7, 10, 0, 9, 3, 5, 2, 8, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 5, "naturalness": 5}, "issues": [], "reason": "问题清晰自然，标准答案完全忠实于原文且无遗漏，证据段落标注精准覆盖了所有关键指标。", "suggestion": "", "suggest": [], "suggestDocId": 2097637763906392065, "fixable": false, "hint": ""}}, {"id": "A-p-29-1", "category": "pair", "question": "重庆市突发事件总体应急预案主要涵盖了哪些方面的内容？", "answer": "该预案全文共5个部分，从组织指挥体系、运行机制、应急保障等方面，对突发事件应急管理全链条、全流程工作进行了规范。", "expectRefusal": false, "gold": [{"docId": 2097637768146833409, "chunkIndex": 0, "why": "重庆市突发事件总体应急预案", "quote": "《重庆市突发事件总体应急预案》主要内容如下。", "text": "---\r\ntitle: \"市委、市政府印发《重庆市突发事件总体应急预案》\"\r\nfileNum: \"\"\r\npubDate: 2026-06-16 09:28:12\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/swygwj/202606/t20260616_15755690.html\r\nmetadataId: 15755690\r\nchannelId: 418672\r\nsubcat: 884\r\nbodyShort: false\r\n---\n\n近日，市委、市政府印发了《重庆市突发事件总体应急预案》，并发出通知，要求各地、各部门结合实际认真贯彻落实。《重庆市人民政府关于实施重庆市突发公共事件总体应急预案的决定》（渝府发〔2007〕87号）同时废止。\n\n《重庆市突发事件总体应急预案》主要内容如下。\n\n为有效防范化解重大安全风险、应对本市突发事件，保护人民群众生命财产安全，维护国家安全和社会稳定，依据《国家突发事件总体应急预案》《中华人民共和国突发事件应对法》等法律法规和有关规定，制定本预案。\n\n1 总则\n\n1.1 总体要求"}, {"docId": 2097637768146833409, "chunkIndex": 2, "why": "重庆市突发事件总体应急预案", "quote": "2 组织指挥体系", "text": "\n本预案所称突发事件是指突然发生，造成或可能造成严重社会危害，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。\n自然灾害主要包括连晴高温、冰冻雨雪、局部大风、强降雨、地震、地质灾害和森林草原火灾等；事故灾难主要包括工矿商贸等生产经营单位的各类生产安全事故，交通运输、燃气、化工、公共设施和设备事故，高层建筑火灾、生态环境、网络安全事件等；公共卫生事件主要包括传染病疫情、群体性不明原因疾病、群体性中毒，食品安全事故、药品安全事件、动物疫情等；社会安全事件主要包括刑事案件和恐怖、群体性、民族宗教事件等。\n\n自然灾害、事故灾难、公共卫生事件分为特别重大、重大、较大、一般4级，其种类和分级标准按照国家有关规定执行，作为突发事件信息报送和分级处置的依据。社会安全事件分级按照国家相关规定另行明确。\n\n1.4 应急预案体系\n\n突发事件应急预案体系包括市、区县党委和政府及其有关部门、基层组织、企事业单位、社会团体等制定的各类突发事件应急预案以及相关支撑性文件。市、区县党委和政府应急预案由总体应急预案、专项应急预案、部门应急预案组成。\n\n2 组织指挥体系\n\n2.1 市级层面指挥体制\n\n2.1.1 指挥机构\n\n设立重庆市突发事件应急总指挥部（以下简称市总指挥部），统一指挥协调全市突发事件应对工作。市总指挥部总指挥由市委书记、市政府市长担任，副总指挥由市委副书记、市委常委和市政府副市长担任，成员由市级有关部门主要负责人，以及重庆警备区、武警重庆总队相关负责人组成。市治理中心为市总指挥部提供指挥平台支撑。"}], "source": {"pairId": "p-29", "policyDocId": 2097637768146833409, "policyTitle": "市委、市政府印发《重庆市突发事件总体应急预案》", "interpretDocId": 2097637783007252482, "interpretTitle": "《重庆市突发事件总体应急预案》出台 规范突发事件应急管理全链条全流程工作", "interpretSection": "媒体视角", "docNumber": ""}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "组织指挥体系", "answerQuote": "全文共5个部分，从组织指挥体系、运行机制、应急保障等方面，对突发事件应急管理全链条、全流程工作进行了规范。", "candidateChunks": [0, 2, 1, 4, 14, 15, 3, 8, 12, 13, 6, 11], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案概括了预案的5个部分及主要涵盖内容（组织指挥、运行机制、应急保障等），这需要覆盖全文结构的多个段落作为证据，当前仅标注了定义和体系片段，严重缺失支撑‘全链条’概括的证据。", "suggestion": "将段落 [1] (总则/总体要求), [3]-[15] (涵盖组织指挥体系、运行机制、应急保障、监督管理等章节标题或核心内容) 全部补充为 gold evidence，以支撑答案中关于‘5个部分’及‘全链条规范’的概括性描述。", "suggest": [{"chunkIndex": 1, "text": "安全，维护国家安全和社会稳定，依据《国家突发事件总体应急预案》《中华人民共和国突发事件应对法》等法律法规和有关规定，制定本预案。\n\n1 总则\n\n1.1 总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻总体国家安全观和习近平总书记视察重庆重要讲话重要指示精神，认真落实市委、市政府工作部署，坚持和加强党的全面领导，坚持人民至上、生命至上，坚持底线思维、极限思维，坚持预防为主、预防与应急相结合，坚持统筹发展和安全，坚持多跨协同、整体智治，锚定“不死人、少伤人、少损失”目标，以三级数字化城市运行和治理中心（以下简称三级治理中心）为支撑，以深化“大综合一体化”城市综合治理体制机制建设为牵引，建立统一指挥、专常兼备、反应灵敏、上下联动的应急管理体制和综合协调、分类管理、分级负责、属地管理为主的工作体系，健全应急预案体系和应急保障体系，深入推进应急管理体系和能力现代化，高水平建设安全韧性的现代化人民城市，持续提升超大城市本质安全水平。\n\n1.2 适用范围\n\n本预案适用于市委、市政府应对在全市行政区域内发生的特别重大、重大突发事件工作，指导全市突发事件应对工作。\n\n1.3 突发事件分类分级\n\n本预案所称突发事件是指突然发生，造成或可能造成严重社会危害，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。"}, {"chunkIndex": 3, "text": "指挥由市委副书记、市委常委和市政府副市长担任，成员由市级有关部门主要负责人，以及重庆警备区、武警重庆总队相关负责人组成。市治理中心为市总指挥部提供指挥平台支撑。\n市级有关部门按照职责分工组织协调指导本领域突发事件应对处置工作。其中，自然灾害和安全生产类突发事件应急处置的组织指导协调由市应急管理局负责；社会安全类突发事件的协调处置由市公安局负责；卫生应急工作由市卫生健康委负责；突发生态环境事件应急工作的协调处置由市生态环境局负责；网络安全、网络数据安全与信息安全类突发事件的协调处理由市委网信办负责。交通、建设、燃气、电力、危险化学品、石油天然气长输管道等重点行业、领域的事故灾难由负有安全生产监督管理职责的部门牵头应对处置。\n\n2.1.2 专项指挥机构\n\n市总指挥部根据需要设立相关市级专项指挥机构，具体组织、协调、指挥有关突发事件应对工作。三级治理中心为全市提供纵向贯通、横向联动、多跨协同的指挥平台支撑。\n\n2.1.3 现场指挥部\n\n突发事件发生后，可视情设立现场指挥部，负责统一组织指挥现场应急处置与救援。现场指挥部实行指挥长负责制，按照应急预案确定指挥长、副指挥长，根据需要设立综合协调、抢险救援、医疗救治、秩序维护、舆情导控、后勤保障、善后处置、调查评估等工作组。\n\n2.2 区县层面指挥体制\n\n区县可参照市级设立本级指挥体制。\n\n2.3 基层指挥体制"}, {"chunkIndex": 4, "text": "\n2.2 区县层面指挥体制\n\n区县可参照市级设立本级指挥体制。\n\n2.3 基层指挥体制\n乡镇（街道）健全“141”基层智治体系，开发区、工业园区、港区、风景区等应当完善本区域应急管理组织体系，明确专门工作力量，细化应急预案。村（社区）应当增强监测预警、信息报告、先期处置和组织动员能力，依法健全应急工作机制，做好本区域应急管理相关工作。\n\n相邻地区应当建立信息共享和应急联动机制，共同做好区域性、流域性、关联性强的突发事件防范应对工作。\n\n2.4 专家组\n\n市、区县部门建立相关专业人才库，根据需要聘请有关专家组成专家组，为应急管理提供决策建议和技术支持；建立技术指挥官制度，根据有关指挥机构指令，指定技术指挥官负责突发事件现场处置的技术指挥工作。\n\n3 运行机制\n\n3.1 风险防控\n\n市、区县党委和政府应当健全风险防范化解机制，强化系统治理、依法治理、综合治理、源头治理和专项治理。有关部门按规定对各类危险源、危险区域、传染病疫情及生物安全风险等开展调查、评估与登记，加强对高层建筑、学校、养老院、大型商超等场所和化工、燃气等领域的风险隐患排查，建立重点区域风险管控清单并在三级治理中心落图，健全安全风险分级管控和隐患排查治理双重预防、跨部门风险信息共享与协同防控等机制。乡镇（街道）和村（社区）利用“141”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警"}, {"chunkIndex": 5, "text": "”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警\n3.2.1 监测\n\n市、区县及其有关部门应当根据自然灾害、事故灾难、公共卫生事件、社会安全事件的种类和特点，完善监测网络，科学划分监测区域、确定监测点、明确监测项目，建立健全基础信息数据库，加强情报信息综合监测，推动专业监测和群测群防深度融合，推动行业感知设备与数据资源接入三级治理中心，构建统一的全域监测网络与信息共享平台，加强综合分析研判，及早发现可能引发突发事件的苗头性信息，提出预警和处置措施建议。\n\n3.2.2 预警\n\n本市预警级别分为一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示，一级为最高级。市、区县政府或者其授权的部门、应急指挥机构按照本市规定，通过政府突发事件预警信息发布系统，发布本行政区域各级别预警信息。乡镇（街道）负责接收传递预警信息，落实不同行业（领域）、重点部位临灾针对性预警“叫应”措施。预警级别的具体划分标准依据国家相关规定执行。\n\n（1）预警信息发布。对可预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，及时发布相应级别预警信息，决定并宣布有关地区进入预警期，同时向有关方面通报，并根据事态发展及时作出调整。预警信息应当采用统一规范的格式。"}, {"chunkIndex": 6, "text": "或者发生的可能性增大时，及时发布相应级别预警信息，决定并宣布有关地区进入预警期，同时向有关方面通报，并根据事态发展及时作出调整。预警信息应当采用统一规范的格式。\n（2）预警信息传播。综合利用三级治理中心和广播、电视、手机、“双网格”、大喇叭等方式，及时将预警信息传播给各级各部门和公众；对特殊人群、特殊场所、警报盲区和特殊时段，落实直达网格责任人的预警“叫应”机制。\n\n（3）预警响应措施。预警信息发布后，持续加密监测频次，及时组织分析评估，依法采取转移疏散人员、预置应急力量和物资、保障公共设施安全运行等措施。必要时，依法采取封控有关区域、暂停公共场所活动、错峰上下班或者停课、停业、停工、停产、停运以及其他防范性、保护性措施。\n\n（4）预警解除或者启动应急响应。突发事件危险已经解除的，及时解除预警，终止预警期，停止预警响应措施。突发事件已经发生或者研判将要发生的，立即启动应急响应。\n\n3.3 处置与救援\n\n3.3.1 先期处置\n\n突发事件发生后，涉事单位应当立即采取措施控制事态发展，开展应急处置与救援。乡镇（街道）立即按照相关应急预案组织人员转移疏散，做好现场管控，控制事态发展。村（社区）应当立即组织群众开展自救互救，协助维护社会秩序，组织人员参加应急处置工作。\n\n3.3.2 信息报告\n\n各级党委和政府应当建立健全突发事件信息报告工作机制，及时、客观、真实向上级党委和政府报送突发事件信息，不得迟报、谎报、瞒报、漏报，不得压制、阻挠报送紧急信息。"}, {"chunkIndex": 7, "text": "各级党委和政府应当建立健全突发事件信息报告工作机制，及时、客观、真实向上级党委和政府报送突发事件信息，不得迟报、谎报、瞒报、漏报，不得压制、阻挠报送紧急信息。\n（1）发挥“突发事件直报快响”应用紧急信息报送主渠道作用，依托三级治理中心建立本市突发事件信息统一接报处置体系。突发事件发生后，涉事单位、专业机构、监测网点和负有信息报告职责的人员等应当立即向所在地党委、政府或者相关部门报告，并根据事态发展变化情况及时续报。各级党委和政府及其相关部门应当加强突发事件信息获取、核实、研判，按规定报告。任何单位和个人在获悉突发事件后，均应通过110接处警电话或者其他渠道报告。对于特别重大、重大突发事件，应当立即报告，不受突发事件分级标准限制。\n\n（2）报告内容主要包括时间、地点、信息来源、事件性质、影响范围及损害程度、人员伤（病）亡和失联情况、发展趋势、已经采取的措施等。\n\n3.3.3 响应分级\n\n市级层面应急响应级别，按照突发事件的性质、特点、可能造成的危害程度和影响范围等因素，分为一级、二级、三级和四级，一级为最高级别。具体启动条件和程序在市级专项应急预案中予以明确。\n\n区县、乡镇（街道）应当结合本行政区域实际进一步细化应急响应制度，在突发事件应急预案中确定应急响应级别及启动条件和程序。\n\n突发事件发生后，相关党委和政府或者有关应急指挥机构、部门应立即按照应急预案启动应急响应，并根据事态发展情况及时调整响应级别。对于小概率、高风险、超常规的极端事件要果断提级响应，确保快速有效控制事态发展。\n\n3.3.4 指挥协调"}, {"chunkIndex": 8, "text": "应急预案启动应急响应，并根据事态发展情况及时调整响应级别。对于小概率、高风险、超常规的极端事件要果断提级响应，确保快速有效控制事态发展。\n\n3.3.4 指挥协调\n本市突发事件实行分级指挥和专业指挥相结合的指挥机制，依托三级治理中心开展指挥调度。\n\n初判发生特别重大或者重大突发事件的，原则上由市委、市政府组织指挥应对工作。初判发生较大或者一般突发事件的，原则上由区县党委和政府组织指挥应对工作。\n\n涉及跨区县的，由有关区县联合应对或者由市委和市政府组织指挥应对。超出区县应对能力的，由市委、市政府提供响应支援或者指挥协调应对工作。\n\n在突发事件应对中，所有进入现场的应急力量、装备、物资等服从现场指挥机构统一调度，其中相关应急力量按规定的指挥关系和指挥权限实施行动，确保相互衔接、配合顺畅。\n\n3.3.5 处置措施\n\n突发事件发生后，相关区县党委和政府应迅速组织力量、调集资源，按照有关规定和实际情况开展人员搜救、抢险救灾、医疗救治、疏散转移、临时安置、应急救助、监测研判、损失评估、封控管控、维护秩序、应急保障等工作，采取与突发事件可能造成的社会危害的性质、程度和范围相适应的措施。必要时可依法征收、征用应急物资，市级有关部门给予支援支持。具体处置措施，应当在相关应急预案中予以进一步明确。\n\n市级层面启动一级或者二级应急响应时，在市总指挥部统筹下，市级专项指挥机构主要采取以下措施。\n\n（1）按照相关应急预案成立指挥部；\n\n（2）开展会商研判，科学制定处置方案和技战术措施；\n\n（3）组织协调相关应急资源参与应急处置与救援；"}, {"chunkIndex": 9, "text": "\n（1）按照相关应急预案成立指挥部；\n\n（2）开展会商研判，科学制定处置方案和技战术措施；\n\n（3）组织协调相关应急资源参与应急处置与救援；\n（4）研究需要协调解决的重要问题，作出工作部署；\n\n（5）组织开展应急处置与救援、社会秩序维护等工作；\n\n（6）及时向市总指挥部报告工作进展情况；\n\n（7）统一对外发布信息，引导社会舆论；\n\n（8）组织开展善后处置、事件调查等工作。\n\n市级层面启动三级或者四级应急响应时，牵头处置部门主要采取以下措施。\n\n（1）联合市级有关部门成立工作组，指导事发地区县开展应急处置与救援；\n\n（2）研究决定事发地区县提出的请求事项，组织协调有关应急资源参与应急处置与救援，重要事项报市委、市政府决策；\n\n（3）及时向市委、市政府报告工作进展情况；\n\n（4）研究处理其他事项。\n\n3.3.6 信息发布\n\n突发事件发生后，有关党委和政府及其有关部门应当按规定及时向社会发布突发事件简要信息，随后发布初步核实情况、已采取的应对措施等，并根据事件处置情况做好后续发布工作。\n\n发生特别重大、重大突发事件，造成重大人员伤亡或较大社会影响的，市级专项指挥机构或者市委宣传部会同市级牵头处置部门应当在24小时内举行首场新闻发布会。较大、一般突发事件由事发地区县党委和政府负责发布信息。\n\n3.3.7 舆论引导\n\n做好宣传、舆论引导等工作，对虚假或者不完整信息应当及时予以澄清。\n\n3.3.8 应急结束"}, {"chunkIndex": 10, "text": "\n3.3.7 舆论引导\n\n做好宣传、舆论引导等工作，对虚假或者不完整信息应当及时予以澄清。\n\n3.3.8 应急结束\n突发事件应对处置工作结束，或相关威胁危害得到控制、消除后，按照“谁启动、谁终止”的原则，由相关党委和政府或者有关应急指挥机构、部门宣布应急结束，并及时撤销现场指挥部，逐步停止有关应对处置措施，有序撤离应急队伍和工作人员。同时，采取必要措施，防止发生次生、衍生事件或突发事件复发。\n\n3.4 事后恢复与重建\n\n3.4.1 善后处置\n\n市、区县党委和政府应当组织做好救助、补偿、抚慰、抚恤、安置、理赔等工作，对受突发事件影响的群众提供心理援助和法律服务，加强疫病防治和环境污染治理。对征用财产可以返还部分及时返还，财产被征收、征用或者征用后毁损、灭失的，按规定给予补偿。有关部门应当及时快速核拨救助资金和物资。\n\n3.4.2 调查与评估\n\n市、区县党委和政府应当及时组织对突发事件造成的影响和损失进行调查与评估，并做好相关资料的收集、整理和归档工作。其中，重大、较大突发事件，由市委、市政府派出调查组或者授权有关部门牵头组织，调查评估结果向市委、市政府报告，并按照有关规定向社会公开，相关结论作为灾害救助、损害赔偿、恢复重建、责任追究的依据。国务院派出调查组或者有关部委牵头组织调查时，市级有关部门应当协助开展工作。\n\n3.4.3 复盘改进\n\n市、区县、乡镇（街道）应当组织对本行政区域上一年度发生的突发事件进行总结评估。探索依托三级治理中心开展突发事件应对工作复盘分析，及时总结经验教训，补齐短板。"}, {"chunkIndex": 11, "text": "\n市、区县、乡镇（街道）应当组织对本行政区域上一年度发生的突发事件进行总结评估。探索依托三级治理中心开展突发事件应对工作复盘分析，及时总结经验教训，补齐短板。\n3.4.4 恢复重建\n\n恢复重建工作原则上由区县政府负责。需要市政府支持的，由区县政府提出请求，市级有关部门提出解决建议或者意见，报经市政府批准后组织实施。需要国家援助或者统筹协调的，按有关规定办理。\n\n4 应急保障\n\n4.1 人力资源\n\n市消防救援局应当加强本市国家综合性消防救援力量体系建设管理。宣传、网信、经济信息、公安、规划自然资源、生态环境、住房城乡建设、交通运输、水利、农业农村、文化旅游、卫生健康、应急管理、语言文字、能源、国防科工、移民、林业、铁路、民航、中医药、疾控、人民防空、红十字会等部门和单位根据职责分工和实际需要，依托现有资源，加强本行业领域专业应急力量建设。\n\n乡镇（街道）、开发区、工业园区、港区、风景区等应当单独或者整合属地有关力量组建专兼职应急救援队伍，增强基层风险防范、先期处置和自救互救能力。\n\n各级各有关部门应当制定相关政策措施，鼓励支持推动社会应急力量发展，面向公众开展急救知识技能普及培训，加强应急救护志愿者队伍建设，健全参与应急救援现场协调机制，引导规范有序参与应急处置与救援行动。\n\n各级各类应急救援队伍应当加强共训共练、资源共享共用和联勤联演，做好安全防护，推进技术交流、能力融合与战法协同，形成整体合力。\n\n4.2 财力支持"}, {"chunkIndex": 12, "text": "\n各级各类应急救援队伍应当加强共训共练、资源共享共用和联勤联演，做好安全防护，推进技术交流、能力融合与战法协同，形成整体合力。\n\n4.2 财力支持\n市、区县政府按照财政事权和支出责任划分原则，将基层应急管理工作、突发事件防范和应对工作所需经费纳入本级财政预算。财政和审计部门应当对应急保障资金的使用和效果进行监督和评估。\n\n发挥商业保险作用，发展巨灾保险，推行保障民生类相关保险和安全生产责任保险等，鼓励单位和公民参加保险。各级各有关部门和单位应当为应急救援、传染病疫情防控等人员购买人身意外伤害保险，并配备必要的防护装备和器材，减少安全风险。\n\n鼓励公民、法人和其他组织进行捐赠和援助，有关部门和单位要加强对捐赠款物分配、使用的管理。\n\n4.3 物资保障\n\n市应急管理局会同发展改革、经济信息、公安、商务、卫生健康、国资、市场监管、粮食和储备、疾控、药监等市级部门构建应急物资保障体系，建立重要应急物资目录，优化物资品种和储备布局，完善应急物资补充更新相关工作机制和应急预案，确保所需应急物资特别是生活必需品、药品等及时供应。\n\n市、区县政府应当根据本地区的实际情况和突发事件应对工作的需要，依法与有条件的企业签订协议，保障应急救援物资、生活必需品和应急处置装备的生产、供给。加强应急避难场所、应急救援基地等基础设施和“平急两用”公共设施规划建设。鼓励公民、法人和其他组织储备基本的应急自救物资和生活必需品。\n\n4.4 数字化保障"}, {"chunkIndex": 13, "text": "供给。加强应急避难场所、应急救援基地等基础设施和“平急两用”公共设施规划建设。鼓励公民、法人和其他组织储备基本的应急自救物资和生活必需品。\n\n4.4 数字化保障\n加强三级治理中心平台体系建设，推动典型应用场景贯通到乡镇（街道）、村（社区），建立完善基础数据信息采集、维护、更新长效机制，强化跨部门、跨层级数据汇聚融合、互联互通、资源共享。推进立体化监测预警网络、大数据支撑、智慧应急、智能应急预案等数字化能力建设，完善突发事件监测预警、应急值守、信息报送、视频会商、辅助决策、指挥协调、资源调用、预案管理和应急演练等功能，加强云计算、人工智能等现代技术手段运用，强化综合实战能力。\n\n4.5 通信电力保障\n\n建立健全应急通信网络，提升公众通信网络防灾抗毁能力和应急服务能力，推进应急指挥通信体系建设，强化“三断”条件下应急通信保障。建立健全应急广播体系，完善建立多形式“叫应”渠道，强化灾害预警信息的通达覆盖能力。建立健全电力应急保障体系，加强电力安全运行监控与应急保障，提升重要输电通道运行安全保障能力。\n\n4.6 交通运输保障\n\n依法开展紧急情况下应急交通工具的优先安排、优先调度、优先放行，通过高铁、航空构建应急力量、物资、装备等快速输送系统。依法建立紧急情况下社会交通运输工具的征用程序，确保抢险救灾人员和物资能够及时安全送达。\n\n根据应急处置需要，按规定对现场及相关通道实行交通管制，健全运力调用调配、应急绿色通道和应急救援车辆高速公路免费通行机制。\n\n4.7 科技支撑"}, {"chunkIndex": 14, "text": "\n根据应急处置需要，按规定对现场及相关通道实行交通管制，健全运力调用调配、应急绿色通道和应急救援车辆高速公路免费通行机制。\n\n4.7 科技支撑\n加强应急管理基础科学、重点行业领域关键核心技术的研究，注重将新技术、新设备、新手段和新药品等应用于监测、预警、应急处置与救援工作。鼓励、扶持有条件的教学科研机构、企业培养应急管理人才和科技人才，鼓励支持应急产业发展。\n\n市级有关部门应当根据职责分工，加强突发事件相关应急保障机制建设，完善保障预案，指导督促区县健全应急保障机制和快速反应联动机制，确保突发事件发生后能够快速高效应对。\n\n5 预案管理\n\n5.1 预案编制\n\n市、区县总体应急预案由本级应急管理部门组织编制，专项应急预案、部门应急预案由行业主管部门或突发事件牵头处置部门组织编制。各地各部门负责建立健全本地本系统应急预案体系。重要基础设施保护、重大活动保障和区域性、流域性应急预案纳入专项或者部门应急预案管理。\n\n5.2 预案衔接\n\n各级各类应急预案应当做到上下协调、左右衔接，防止交叉、避免矛盾。应急管理部门负责综合协调应急预案衔接工作，指导应急预案体系建设。专项应急预案报批前，牵头编制部门按程序商本级应急管理部门协调衔接。各级各部门做好相关应急预案衔接工作。\n\n5.3 预案演练\n\n各级各部门、有关单位应当制定应急演练计划，定期组织演练。专项应急预案、部门应急预案每3年至少进行一次演练。\n\n5.4 预案评估与修订"}, {"chunkIndex": 15, "text": "\n5.3 预案演练\n\n各级各部门、有关单位应当制定应急演练计划，定期组织演练。专项应急预案、部门应急预案每3年至少进行一次演练。\n\n5.4 预案评估与修订\n各级各部门、有关单位应当定期组织对相关应急预案进行评估和修订，增强应急预案的针对性、实用性和可操作性。应急预案原则上每3年评估一次。\n\n5.5 宣传与培训\n\n本预案实施后，市应急管理局应当会同有关部门做好宣传、解读和培训工作。各级各部门、有关单位应当通过多种方式开展突发事件应急预案的宣传和培训，加强公众应急知识技能宣传和教育培训，针对领导干部、应急救援和管理人员开展培训，提高其应急能力。\n\n5.6 责任与奖惩\n\n突发事件应急处置与救援工作按规定实行地方党政领导负责制和责任追究制，纳入对有关党政领导干部的监督内容。对在突发事件应急处置与救援中作出突出贡献的集体和个人，按照有关规定给予表彰和奖励；对存在违法违规行为的，依照有关法律法规和党内法规追究责任；对未按规定编制修订突发事件应急预案、未定期组织应急预案演练的，依照有关规定追究责任。"}], "suggestDocId": 2097637768146833409, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 14 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-29-2", "category": "pair", "question": "重庆在突发事件监测预警方面，对数据接入和重点区域风险管控有什么具体要求？", "answer": "明确行业感知设备与数据资源全量接入三级治理中心，重点区域建立风险管控清单并全量落图，构建统一的全域监测网络与信息共享平台。", "expectRefusal": false, "gold": [{"docId": 2097637768146833409, "chunkIndex": 5, "why": "重庆市突发事件总体应急预案", "quote": "推动行业感知设备与数据资源接入三级治理中心，构建统一的全域监测网络与信息共享平台", "text": "”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警\n3.2.1 监测\n\n市、区县及其有关部门应当根据自然灾害、事故灾难、公共卫生事件、社会安全事件的种类和特点，完善监测网络，科学划分监测区域、确定监测点、明确监测项目，建立健全基础信息数据库，加强情报信息综合监测，推动专业监测和群测群防深度融合，推动行业感知设备与数据资源接入三级治理中心，构建统一的全域监测网络与信息共享平台，加强综合分析研判，及早发现可能引发突发事件的苗头性信息，提出预警和处置措施建议。\n\n3.2.2 预警\n\n本市预警级别分为一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示，一级为最高级。市、区县政府或者其授权的部门、应急指挥机构按照本市规定，通过政府突发事件预警信息发布系统，发布本行政区域各级别预警信息。乡镇（街道）负责接收传递预警信息，落实不同行业（领域）、重点部位临灾针对性预警“叫应”措施。预警级别的具体划分标准依据国家相关规定执行。\n\n（1）预警信息发布。对可预警的自然灾害、事故灾难或者公共卫生事件即将发生或者发生的可能性增大时，及时发布相应级别预警信息，决定并宣布有关地区进入预警期，同时向有关方面通报，并根据事态发展及时作出调整。预警信息应当采用统一规范的格式。"}, {"docId": 2097637768146833409, "chunkIndex": 4, "why": "重庆市突发事件总体应急预案", "quote": "建立重点区域风险管控清单并在三级治理中心落图", "text": "\n2.2 区县层面指挥体制\n\n区县可参照市级设立本级指挥体制。\n\n2.3 基层指挥体制\n乡镇（街道）健全“141”基层智治体系，开发区、工业园区、港区、风景区等应当完善本区域应急管理组织体系，明确专门工作力量，细化应急预案。村（社区）应当增强监测预警、信息报告、先期处置和组织动员能力，依法健全应急工作机制，做好本区域应急管理相关工作。\n\n相邻地区应当建立信息共享和应急联动机制，共同做好区域性、流域性、关联性强的突发事件防范应对工作。\n\n2.4 专家组\n\n市、区县部门建立相关专业人才库，根据需要聘请有关专家组成专家组，为应急管理提供决策建议和技术支持；建立技术指挥官制度，根据有关指挥机构指令，指定技术指挥官负责突发事件现场处置的技术指挥工作。\n\n3 运行机制\n\n3.1 风险防控\n\n市、区县党委和政府应当健全风险防范化解机制，强化系统治理、依法治理、综合治理、源头治理和专项治理。有关部门按规定对各类危险源、危险区域、传染病疫情及生物安全风险等开展调查、评估与登记，加强对高层建筑、学校、养老院、大型商超等场所和化工、燃气等领域的风险隐患排查，建立重点区域风险管控清单并在三级治理中心落图，健全安全风险分级管控和隐患排查治理双重预防、跨部门风险信息共享与协同防控等机制。乡镇（街道）和村（社区）利用“141”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警"}], "source": {"pairId": "p-29", "policyDocId": 2097637768146833409, "policyTitle": "市委、市政府印发《重庆市突发事件总体应急预案》", "interpretDocId": 2097637783007252482, "interpretTitle": "《重庆市突发事件总体应急预案》出台 规范突发事件应急管理全链条全流程工作", "interpretSection": "媒体视角", "docNumber": ""}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "全量接入", "answerQuote": "明确行业感知设备与数据资源全量接入三级治理中心，重点区域建立风险管控清单并全量落图", "candidateChunks": [5, 4, 1, 3, 13, 7, 6, 8, 11, 10, 0, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案中关于“重点区域建立风险管控清单并全量落图”的内容主要依据段落[4]（3.1 风险防控），但当前仅标注了段落[5]（3.2 监测与预警）为证据，导致部分答案缺乏直接对应的已标注证据支持。", "suggestion": "将段落[4]补充标记为证据（★）。", "suggest": [{"chunkIndex": 4, "text": "\n2.2 区县层面指挥体制\n\n区县可参照市级设立本级指挥体制。\n\n2.3 基层指挥体制\n乡镇（街道）健全“141”基层智治体系，开发区、工业园区、港区、风景区等应当完善本区域应急管理组织体系，明确专门工作力量，细化应急预案。村（社区）应当增强监测预警、信息报告、先期处置和组织动员能力，依法健全应急工作机制，做好本区域应急管理相关工作。\n\n相邻地区应当建立信息共享和应急联动机制，共同做好区域性、流域性、关联性强的突发事件防范应对工作。\n\n2.4 专家组\n\n市、区县部门建立相关专业人才库，根据需要聘请有关专家组成专家组，为应急管理提供决策建议和技术支持；建立技术指挥官制度，根据有关指挥机构指令，指定技术指挥官负责突发事件现场处置的技术指挥工作。\n\n3 运行机制\n\n3.1 风险防控\n\n市、区县党委和政府应当健全风险防范化解机制，强化系统治理、依法治理、综合治理、源头治理和专项治理。有关部门按规定对各类危险源、危险区域、传染病疫情及生物安全风险等开展调查、评估与登记，加强对高层建筑、学校、养老院、大型商超等场所和化工、燃气等领域的风险隐患排查，建立重点区域风险管控清单并在三级治理中心落图，健全安全风险分级管控和隐患排查治理双重预防、跨部门风险信息共享与协同防控等机制。乡镇（街道）和村（社区）利用“141”基层智治平台，开展日常巡查、风险隐患排查等工作，强化跨区域、跨层级协同联动治理。各地应当定期组织开展公共安全形势分析，必要时向社会通报。\n\n3.2 监测与预警"}], "suggestDocId": 2097637768146833409, "fixable": true, "hint": ""}}, {"id": "A-p-30-1", "category": "pair", "question": "重庆市十五五社会发展规划主要包含哪些重点任务？", "answer": "规划围绕构建全龄友好型社会、建设教育强市、实施就业优先战略、推进健康中国行动、优化住房供应、健全社会保障、建设体育强市及改善民生等八大方面明确重点任务。", "expectRefusal": false, "gold": [{"docId": 2097637769459650561, "chunkIndex": 25, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "七、健全社会保障体系，夯实共同富裕基石", "text": "系。培育“好房子”建造企业，推动建造模块化、装修定制化、全屋智能化，探索推广装配式建筑、绿色建材等。建立房屋安全体检、安全管理资金、质量安全保险等安全管理制度。\n积极推进“好小区”建设。稳步推进城中村和城市危旧房改造，鼓励依托新工艺、新技术、新材料、新设备改造老旧住宅，改善群众居住生活条件。持续推进完整社区建设，补齐“一老一小”、停车充电等服务设施短板。实施物业服务质量提升行动，探索“物业服务+生活服务”模式，鼓励有条件的物业企业提供养老、托幼、家政等服务。\n\n（三）探索房地产发展新模式\n\n“一区（县）一策”支持刚性和改善性住房需求，着力稳定房地产市场。加强商品房开发、融资、销售全链条监管，严格落实房地产开发项目公司制和房地产融资主办银行制，支持房地产企业合理融资需求，有序推进现房销售。培育规模化、专业化租赁企业，规范发展住房租赁市场，推动租购住房享有同等公共服务权利。深化住房公积金制度改革，推动公积金向新市民、青年人、灵活就业等群体广覆盖。分类施策推进“久供未建、久建未完”项目处置。\n\n专栏15  保障高水平住有所居重点事项\n\n优化保障性住房供给。实施城镇老旧小区改造，改造老旧小区2000个。公租房入住率保持在92%以上，新筹集保障性租赁住房2.5万套（间）。\n\n实施房屋品质提升工程。推动政府建设的保障性住房率先实现“好房子”“好小区”全覆盖。稳步推进存量城市危旧房改造2.85万户。\n\n七、健全社会保障体系，夯实共同富裕基石\n\n（一）健全社会保险制度"}, {"docId": 2097637769459650561, "chunkIndex": 18, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "五、推进健康中国重庆行动，增进全民健康福祉", "text": "\n提升就业创业服务。打造“青来渝州”就业创业综合体10个。建设青年就业驿站50个。实施“就业公共服务进校园百日行动”。\n开展就业能力培训。实施青年群体技能培训专项计划，每年培训4万人次。支持应届毕业生参加职业技能培训。\n\n（三）大力支持自主创业、灵活就业\n\n完善创业带动就业扶持体系。推进“渝创渝新”创业扶持工程，健全创业培训、孵化、服务等联动机制，提质发展环大学创新创业生态圈等平台。完善创业担保贷款体系，用好风险补偿资金池，健全银担风险熔断机制。分类培育科技、产业等“+创业”新模式，拓展人工智能赋能创新创业创意空间，推动OPC（一人公司）集聚发展。支持企业走出去带动海外就业。\n\n推动灵活就业和新就业形态健康发展。促进平台经济健康发展，挖掘人工智能应用就业岗位，妥善应对人工智能对就业的影响。实施支持多渠道灵活就业行动计划，发展夜间经济、小店经济、上门经济等，鼓励个体经营发展，建设零工市场、零工驿站、线上零工平台。探索建立新职业观测站，开展新职业培育、认定和评价。\n\n专栏11  新就业形态劳动者就业质量提升计划\n\n开展专项技能培训。新就业形态职业技能培训每年1万人次。\n\n加强公共服务保障。扩围新就业形态人员职业伤害保障试点，推动在就业地平等纳入保障性住房、子女教育等基本公共服务保障范围。\n\n实施暖心关爱保障工程。建成新就业群体友好阵地7500个以上。\n\n五、推进健康中国重庆行动，增进全民健康福祉\n\n（一）保障超大城市公共卫生安全"}, {"docId": 2097637769459650561, "chunkIndex": 24, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "六、优化住房供应体系，实现更高水平住有所居", "text": "病专科等医疗合作，探索开展省级医检互认信息化平台协作。深化鲁渝合作，强化医疗援藏、援疆。\n\n六、优化住房供应体系，实现更高水平住有所居\n\n（一）提高住房保障水平\n优化保障性住房供给和服务。坚持货币与实物、配租与配售相结合，通过存量改造、收购转化等方式优化保障性住房供给。试点开展房源统筹使用，增加配租型保障性住房供应。建立配售型保障性住房封闭体系流转机制，支持有条件的家庭申购配售型保障性住房。强化保障性住房政策向城镇低收入家庭、新市民、青年人和多子女家庭倾斜。优化租赁补贴申请流程，适时适度调整补贴标准。\n\n推动超大体量公租房可持续发展。强化公租房小区教育、医疗、养老、托育、商业等配套功能，有序推进电梯、管网、健身等设施设备更新改造。完善公租房小区物业服务评价和维护保养管理机制，引导居民参与设施维护、环境美化。探索发展保障性住房不动产投资信托基金，鼓励社会力量参与建设运营。打造住房保障综合服务平台，迭代升级公租房智慧化管理。\n\n（二）大力建设“好房子”“好小区”\n\n建设安全舒适绿色智慧的“好房子”。实施房屋品质提升工程，全产业链打造“好房子”，健全支持政策、技术导则和评价体系。培育“好房子”建造企业，推动建造模块化、装修定制化、全屋智能化，探索推广装配式建筑、绿色建材等。建立房屋安全体检、安全管理资金、质量安全保险等安全管理制度。"}, {"docId": 2097637769459650561, "chunkIndex": 15, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "四、实施就业优先战略，促进高质量充分就业", "text": "智能通识教育指南，实施人工智能赋能教师发展行动，探索打造“人工智能+”未来学校等。推动“高效办成一件事”，开发“惠学生”“数智强师”“数智校园”等综合应用场景。\n深化教育综合改革。推行中小学生全学段成长性评价，持续巩固“双减”成果，加强对“掐尖”“小升初”违规考试招生等问题的治理。稳妥推进中考改革，探索普通高中多元化录取机制。深化高考综合改革，实施高等职业教育对口招生考试改革。弘扬践行教育家精神，健全新时代师德师风建设长效机制，强化待遇保障。深入实施教师教育能力提升工程，培育一批巴渝优师，突出教师教书育人实绩考核。引导规范民办教育高质量发展。\n\n推动高水平教育开放合作。推动新加坡南洋理工大学、新西兰奥克兰大学等知名高校来渝合作，建设高水平中外合作办学机构和项目20个以上。推进“留学重庆”品牌建设，迭代升级市长奖学金“丝路项目”，推动来渝留学规模质量双提升。举办一批境外办学机构和项目，支持职教出海。推动西部陆海新通道沿线地区重点城市教育协同发展。\n\n四、实施就业优先战略，促进高质量充分就业\n\n（一）健全就业促进体制机制\n\n强化宏观政策就业协同。健全高质量充分就业指标体系，力争培育全国高质量充分就业示范地区5个以上。健全就业影响评估和监测预警机制，探索建立就业岗位调查制度，动态调整就业政策和储备应急政策，防范化解规模性失业风险。实施就业稳岗扩容提质行动，拓展数字经济、低空经济等就业新空间，实施中小微企业就业支持计划，促进城镇新增就业325万人以上。"}], "source": {"pairId": "p-30", "policyDocId": 2097637769459650561, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”社会发展规划（2026—2030年）》的通知", "interpretDocId": 2097637785519640577, "interpretTitle": "《重庆市“十五五”社会发展规划（2026—2030年）》印发 加强普惠性、基础性、兜底性民生建设，着力缩小地区差距、城乡差别", "interpretSection": "媒体视角", "docNumber": "渝府发〔2026〕17号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "重点任务", "answerQuote": "规划还明确了一系列重点任务——围绕构建全龄友好型社会、促进人口长期均衡发展，要共筑生育友好型社会，打造青年圆梦之城，建设老年友好型社会；围绕建设新时代教育强市、办好人民满意的教育，要实施新时代立德树人工程，促进基础教育公平优质发展，加快高等教育突破跃升，推动职业教育提质领跑，构筑高质量教育发展生态；围绕实施就业优先战略、促进高质量充分就业，要健全就业促进体制机制，更大力度促进重点群体就业，大力支持自主创业、灵活就业；围绕推进健康中国重庆行动、增进全民健康福祉，要保障超大城市公共卫生安全，加强优质高效智慧医疗服务供给，深化医药卫生体制改革，推进中医药传承创新发展，深化区域医疗开放合作；围绕优化住房供应体系、实现更高水平住有所居，要提高住房保障水平，大力建设“好房子”“好小区”，探索房地产发展新模式；围绕健全社会保障体系、夯实共同富裕基石，要健全社会保险制度，构建多层次医疗保障体系，完善社会救助与社会服务体系，加强退役军人服务保障，强化残疾人发展保障；围绕建设现代化体育强市、推动体育事业全面进步，要开展全民健身行动，提升竞技体育水平，丰富体育服务供给；围绕持续在发展中改善民生、增强公共服务均衡性和可及性，要稳步推进基本公共服务均等化，全域打造高品质生活服务圈，推进公共服务数智化改革，加强公共服务多元化保障。", "candidateChunks": [25, 18, 24, 26, 23, 15, 33, 8, 32, 19, 30, 34], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 4}, "issues": ["证据缺失", "证据无关"], "reason": "标准答案概括了规划全文的八大章节标题，但当前标注的证据段落（★）仅覆盖了部分章节或具体细节，严重缺失其他章节的总领性段落；同时部分标注段落为具体执行措施而非章节标题依据。", "suggestion": "需补充标注各主要章节的起始段落作为证据：[1]（总体要求/全龄友好）、[9]（教育强市）、[18]（就业优先）、[19]（健康中国）、[26]（社会保障）、[32]（体育强市）、[34]（改善民生）。移除与“重点任务”宏观概括关联度较低的细节段落如[15]、[24]，或保留但确保上述核心章节标题段落被标记。", "suggest": [{"chunkIndex": 1, "text": "\n为更好推动全市社会事业发展，根据《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等，制定本规划。\n\n一、总体要求\n全面贯彻习近平新时代中国特色社会主义思想，全面贯彻党的二十大和二十届历次全会精神，深入落实习近平总书记视察重庆重要讲话重要指示精神，聚焦做实“两大定位”、发挥“三个作用”，坚持人民至上，坚持发展必须致力于共同富裕，尽力而为、量力而行，深化数字赋能改革增效，加强普惠性、基础性、兜底性民生建设，着力缩小地区差距、城乡差别，统筹推动社会事业高质量发展，推动人的全面发展、全体人民共同富裕迈出坚实步伐。\n\n到2030年，覆盖全人群、全生命周期的人口服务体系更加健全，高质量充分就业取得新进展，居民收入达到全国平均水平，中等收入群体规模占比明显提升，城乡居民收入和生活水平差距显著缩小，重点群体社会民生兜底保障更加公平，城乡区域基本公共服务更加优质均衡，基础民生服务更加普惠可及，人民生活品质持续提高，人的全面发展、全体人民共同富裕取得明显进展。\n\n专栏1  “十五五”时期重庆市社会发展主要指标\n\n类别\n\n序号\n\n指    标\n\n单位\n\n2025年\n\n2030年\n\n指标\n\n属性\n\n公平性\n\n1\n\n城镇调查失业率\n\n%\n\n5.3\n\n不超过\n\n国家控\n\n制标准\n\n预期性\n\n2\n\n在地高校毕业生留渝率\n\n%\n\n54.47\n\n60\n\n预期性\n\n3\n\n基本医疗保险参保率\n\n%\n\n≥98\n\n95左右\n\n约束性\n\n4\n\n职工养老保险参保人数占基本养老保险总人数比例\n\n%\n\n58\n\n60\n\n预期性\n\n5"}, {"chunkIndex": 9, "text": "知障碍专业照护机构。深化养老服务类专业公费培养试点，新增持证养老护理员5000名。\n\n三、建设新时代教育强市，办好人民满意的教育\n\n（一）实施新时代立德树人工程\n加强和改进思想政治教育。坚持不懈用习近平新时代中国特色社会主义思想铸魂育人，一体打造党的创新理论主课堂。深入推进大中小学思政课一体化改革创新，实施新时代高校思政课课程方案，打造“红岩思政”育人品牌。统筹推进各类实践课程和课程实践，建立中小学校红色研学和国情研学制度。\n\n健全德智体美劳全面培养体系。实施中小学德育高质量发展行动计划。提高科技教育水平，加强科学教师和实验设备配备。实施“逐光成长”学生心理健康促进工程、学生体质强健计划和美育浸润行动，开设劳动、综合实践活动等课程。健全学校家庭社会协同育人机制。推行中小学春秋假。完善终身教育服务体系，建设学习型城市、学习型社会。\n\n专栏5  新时代立德树人工程\n\n实施“红岩思政”育人品牌建设工程。“红岩思政”研学线路达200条，“大思政课”实践教学中心达150个。\n\n实施“逐光成长”学生心理健康促进工程。中小学安排心理健康教育课每学期不少于10课时、普通高校开设心理健康必修课不低于2个学分。\n\n实施中小学生体质强健计划。确保中小学生每天综合体育活动时间不低于2小时，学生体质健康优良率达60%，“小眼镜”、“小胖墩”、脊柱侧弯等问题有效缓解。\n\n实施学校美育浸润行动。力争累计培育国家级美育类示范性特色学校和基地150个。\n\n实施学生劳动教育素养提升计划。学校劳动实践场所配套使用率达100%，打造市级特色劳动实践场所50个。"}, {"chunkIndex": 18, "text": "\n提升就业创业服务。打造“青来渝州”就业创业综合体10个。建设青年就业驿站50个。实施“就业公共服务进校园百日行动”。\n开展就业能力培训。实施青年群体技能培训专项计划，每年培训4万人次。支持应届毕业生参加职业技能培训。\n\n（三）大力支持自主创业、灵活就业\n\n完善创业带动就业扶持体系。推进“渝创渝新”创业扶持工程，健全创业培训、孵化、服务等联动机制，提质发展环大学创新创业生态圈等平台。完善创业担保贷款体系，用好风险补偿资金池，健全银担风险熔断机制。分类培育科技、产业等“+创业”新模式，拓展人工智能赋能创新创业创意空间，推动OPC（一人公司）集聚发展。支持企业走出去带动海外就业。\n\n推动灵活就业和新就业形态健康发展。促进平台经济健康发展，挖掘人工智能应用就业岗位，妥善应对人工智能对就业的影响。实施支持多渠道灵活就业行动计划，发展夜间经济、小店经济、上门经济等，鼓励个体经营发展，建设零工市场、零工驿站、线上零工平台。探索建立新职业观测站，开展新职业培育、认定和评价。\n\n专栏11  新就业形态劳动者就业质量提升计划\n\n开展专项技能培训。新就业形态职业技能培训每年1万人次。\n\n加强公共服务保障。扩围新就业形态人员职业伤害保障试点，推动在就业地平等纳入保障性住房、子女教育等基本公共服务保障范围。\n\n实施暖心关爱保障工程。建成新就业群体友好阵地7500个以上。\n\n五、推进健康中国重庆行动，增进全民健康福祉\n\n（一）保障超大城市公共卫生安全"}, {"chunkIndex": 19, "text": "\n实施暖心关爱保障工程。建成新就业群体友好阵地7500个以上。\n\n五、推进健康中国重庆行动，增进全民健康福祉\n\n（一）保障超大城市公共卫生安全\n加强传染病监测防控救治。实施新一轮公共卫生能力提升行动，积极争创国家区域公共卫生中心。建设市级区域疾控中心5个，推进区县疾控机构标准化建设，建成三甲疾控中心10个以上。加快国家重大传染病防治基地、国家中医疫病防治基地建设，提升传染病定点医院防治能力。建立健全联防联控、群防群控机制，迭代升级“疫智防控”应用。\n\n强化公共卫生应急保障。建成国家紧急医学救援基地，完善三级紧急医学救援体系，建强各级各类卫生应急队伍。健全医疗应急救治机制，推进“平急两用”公共基础设施建设和平急转换使用。推动院前医疗急救网络与医院、部门信息联动共享，“120”电话10秒接听率、3分钟内出车率达99%以上。加强血液安全保障，争创国家区域血液安全中心。\n\n推进全生命周期健康服务。健全健康促进政策制度体系，深入推进爱国卫生运动。推进居民健康素养监测干预，成人肥胖率控制在30%以下。加强慢性病防治康管全链条服务，重大慢性病过早死亡率低于10.5%。强化严重精神障碍患者管理和救助救治，扩大社区精神障碍康复服务供给，规范化建设心理、睡眠门诊。加强职业病、艾滋病防治。加强各级妇幼保健机构和儿科门诊建设，提升国家儿童区域医疗中心服务能力，争创国家儿童医学中心。拓展创新药物、辅助器具等临床科研和产品应用，培育多元健康服务新业态。\n\n专栏12  超大城市公共卫生安全建设"}, {"chunkIndex": 26, "text": "建设的保障性住房率先实现“好房子”“好小区”全覆盖。稳步推进存量城市危旧房改造2.85万户。\n\n七、健全社会保障体系，夯实共同富裕基石\n\n（一）健全社会保险制度\n夯实社会保险制度基础。落实基本养老保险全国统筹制度，健全城乡居民基本养老保险缴费筹资和待遇水平提升机制。加快发展多层次、多支柱养老保险体系，扩大企业年金覆盖范围，持续推进职业年金计划分类管理改革。完善失业保险待遇确定和调整机制，健全超龄人员等特殊人群参加工伤保险的政策体系，探索建立补充工伤保险制度。\n\n推动社会保险精准扩面。实施社保高质量参保行动，推进“漏保”“脱保”“断保”人员参保缴费，有序提高城镇就业人员参加职工基本养老保险比例。健全多缴多得激励机制，引导有条件的城乡居民基本养老保险参保人员提高缴费档次。建立健全职业伤害保障制度，扩大失业、工伤保险覆盖面，推动工程建设项目工伤保险参保实现应保尽保。\n\n强化社会保险经办服务和风险防控。动态优化社会保险业务流程，完善社会保险信息共享机制，推进社会保险关系转移接续便捷办理。推进居民待遇权益资格综合认证改革。构建“一本账”基金财务数字化管理体系，加快推进“基金智管”共建共用，强化全险种业务大管控。优化社保基金长效筹集、统筹调剂、保值增值和安全监管机制，推进社保基金持续平稳运行，强化年金基金合规管理，严厉打击骗取套取违法行为。加强社保规划师队伍建设。\n\n（二）构建多层次医疗保障体系"}, {"chunkIndex": 32, "text": "疾子女”家庭照护单元设置覆盖率达90%以上，落实重度残疾人托养照护服务消费券补贴要求。\n\n八、建设现代化体育强市，推动体育事业全面进步\n\n（一）开展全民健身行动\n加强全民健身场地设施建设利用。盘活城市闲置空间资源，因地制宜建设体育公园、体育服务综合体、健身步道等设施。实施乡镇健身广场、农民体育健身工程。提升公共体育场馆使用效率，鼓励公共体育场馆、全民健身中心向社会免费或低收费开放，有序推进学校体育场馆向社会开放。推进体育场地设施智慧化改造，建立数字化场地设施管理服务平台。\n\n打造惠民体育品牌赛事。加快构建全域全龄的全民健身赛事体系，鼓励“一区（县）一品”打造特色赛事活动。办好市第八届运动会、城市足球超级联赛，每年举办市级及以上群众体育赛事活动不少于100场次，国民体质优良率达32.5%。健全体育社会组织网络，每千人拥有社会体育指导员人数达到3.8人。深化国际国内体育组织合作，力争川渝共同举办国际性、全国性重大体育赛事，每年承办国际国内赛事10场次以上。\n\n（二）提升竞技体育水平\n\n全方位构建竞赛训练体系。全力备战亚运会、青奥会、奥运会、全国运动会及冬运会等重大赛事。建立竞技体育项目动态调整机制，推进足球、篮球、排球、网球等职业体育发展，提升田径、游泳、体操、举重、羽毛球、摔跤等竞技水平。完善运动员选拔、教练员考核机制，加强复合型团队建设。建立“核心—接棒—预备”三级竞训梯队，构建体育后备人才小初高全周期贯通培养和选拔体系。实施体校转型发展行动，创新体校、传统学校、体育俱乐部协同培养模式。"}, {"chunkIndex": 34, "text": "育训练中心田径训练馆、体操训练馆，市射击射箭训练中心室内训练馆，市奥体中心综合馆、冰上运动馆等设施建设。\n\n九、持续在发展中改善民生，增强公共服务均衡性和可及性\n（一）稳步推进基本公共服务均等化\n\n优化基本公共服务供给体系。健全基本公共服务标准动态调整机制，根据经济社会发展水平、国家政策调整和财政保障能力，将涉及群众切实利益的增量服务事项纳入保障范畴。探索建立市级标准统筹、区县统一执行的基本公共服务标准体系。合理提高基本公共服务支出占财政支出的比重，科学划分市、区（县）两级事权及支出责任分担比例。优化城镇建设用地配置，推动土地混合开发、功能转换，盘活闲置房屋和低效用地用于紧缺基本公共服务。\n\n缩小基本公共服务人群差距。加强人口统计监测预测，适应人口结构变化和流动趋势，优化公共服务设施布局。深化户籍管理制度改革，规范基于居住时长的基本公共服务梯度供应机制，逐步扩大居住证享有基本公共服务事项范围。有序推进农业转移人口市民化，加强对未落户常住人口的基本公共服务保障。健全跨省域流动人口基本公共服务享有资格转移接续、异地互认制度。\n\n缩小基本公共服务城乡差距。统筹推进以区县城为重要载体的新型城镇化和乡村全面振兴，加强城乡基本公共服务制度一体设计，推动城镇优质服务向农村基层延伸。加大财政转移支付向薄弱区县倾斜的力度，支持补齐建强基本公共服务软硬件短板弱项。对人员居住分散的偏远农村地区集中布局服务设施，通过人员技术下沉、创新巡回服务模式，增强服务覆盖能力。"}], "suggestDocId": 2097637769459650561, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 7 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "A-p-30-2", "category": "pair", "question": "重庆十五五规划里人均预期寿命和基层诊疗量占比目标是多少？", "answer": "人均预期寿命达80.5岁，基层医疗卫生机构诊疗量占比预期不低于60%。", "expectRefusal": false, "gold": [{"docId": 2097637769459650561, "chunkIndex": 2, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "基层医疗卫生机构诊疗量占比\n% \n54.38\n≥60\n预期性", "text": "\n3\n\n基本医疗保险参保率\n\n%\n\n≥98\n\n95左右\n\n约束性\n\n4\n\n职工养老保险参保人数占基本养老保险总人数比例\n\n%\n\n58\n\n60\n\n预期性\n\n5\n失业保险参保人数\n\n万人\n\n672\n\n677\n\n预期性\n\n6\n\n残疾人两项补贴覆盖率\n\n%\n\n100\n\n100\n\n约束性\n\n均衡性\n\n7\n\n城乡居民人均可支配收入比\n\n—\n\n2.21∶1\n\n2.1∶1\n\n左右\n\n预期性\n\n8\n\n城乡居民最低生活保障平均标准比\n\n—\n\n1.22\n\n≤1.2\n\n预期性\n\n9\n\n义务教育优质均衡发展区县比例\n\n%\n\n24.32\n\n100\n\n约束性\n\n10\n\n保障性租赁住房保障新市民、青年人人数\n\n万人\n\n39\n\n50\n\n预期性\n\n普惠性\n\n11\n\n劳动年龄人口平均受教育年限\n\n年\n\n11.5\n\n12.1\n\n约束性\n\n12\n\n个人卫生支出占卫生总费用的比重\n\n%\n\n26.71\n\n≤26\n\n预期性\n\n13\n\n每千人口拥有执业（助理）医师数\n\n人\n\n3.51\n\n3.7\n\n预期性\n\n14\n\n基层医疗卫生机构诊疗量占比\n\n%\n\n54.38\n\n≥60\n\n预期性\n\n15\n\n老年友好型社区覆盖率\n\n%\n\n2\n\n60\n\n预期性\n\n16\n\n养老机构护理型床位占比\n\n%\n\n71.4\n\n80\n\n预期性\n\n17\n\n二级及以上综合性医院老年医学科设立比例\n\n%\n\n84.85\n\n≥90\n\n预期性\n\n18\n\n0—3岁婴幼儿入托率\n\n%\n\n12.3\n\n18.3\n\n预期性\n\n高品质\n\n19\n\n全员劳动生产率\n\n万元/人\n\n19.99\n\n25\n\n预期性\n\n20\n\n居民人均可支配收入增速"}, {"docId": 2097637769459650561, "chunkIndex": 3, "why": "重庆市“十五五”社会发展规划（2026—2030年）", "quote": "人均预期寿命\n岁\n79.85\n80.5\n预期性", "text": "\n%\n\n12.3\n\n18.3\n\n预期性\n\n高品质\n\n19\n\n全员劳动生产率\n\n万元/人\n\n19.99\n\n25\n\n预期性\n\n20\n\n居民人均可支配收入增速\n%\n\n4.7\n\n与地区生产总值增长同步\n\n预期性\n\n21\n\n全市与全国居民人均可支配收入比值\n\n—\n\n0.96\n\n1左右\n\n预期性\n\n22\n\n人均预期寿命\n\n岁\n\n79.85\n\n80.5\n\n预期性\n\n23\n\n人均体育场地面积\n\n平方米\n\n3.37\n\n4\n\n预期性\n\n注：本规划所列指标，仅作发展方向引导
