kIndex": 19, "why": "重庆市地震应急预案", "quote": "当震中距离我市行政边界300公里范围内发生7.0级以上地震，或震中距离我市行政边界100公里范围内发生6.0级以上地震，或震中距离我市行政边界50公里范围内发生5.0级以上地震时", "text": "\n国网重庆电力加强电力基础设施、电力调度系统建设，保障抢险救援现场应急装备的临时供电需求和灾区电力供应。\n市公安局、市交通运输委、重庆海事局、重庆铁路办事处、民航重庆监管局等部门（单位）协调建立公路、铁路、航空、水运应急运输保障体系，加强统一指挥调度，并采取必要的交通管制措施，建立应急救援“绿色通道”机制。\n\n7  其他地震事件的应急处置\n\n7.1  强有感地震事件应急处置\n\n当我市行政区域内发生强有感地震事件并可能产生较大社会影响时，重庆地震局加强震情趋势研判，提出应对处置建议；震中所在区县政府或其抗震救灾指挥机构负责组织应对处置工作，市地指办指导、协调相关工作。主要采取以下措施：\n\n（1）重庆地震局及时向市委、市政府报告地震速报信息，并通报市应急管理局和有关部门（单位）。\n\n（2）市地指办收集相关情况报告市政府，并通报有关部门（单位）。\n\n（3）区县政府或其抗震救灾指挥机构组织做好信息收集、群众安抚、信息发布等工作，维护社会稳定。\n\n7.2  行政区域外地震事件应急处置\n\n当震中距离我市行政边界300公里范围内发生7.0级以上地震，或震中距离我市行政边界100公里范围内发生6.0级以上地震，或震中距离我市行政边界50公里范围内发生5.0级以上地震时，市地指组织应对。主要采取以下措施：\n\n（1）重庆地震局分析地震对我市的影响程度，研判我市境内最高地震烈度，及时报告市委、市政府，并通报市应急管理局和有关部门（单位）。"}], "source": {"pairId": "p-01", "policyDocId": 2097637762580992002, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市地震应急预案》的通知", "interpretDocId": 2097637772127227906, "interpretTitle": "《重庆市地震应急预案》文字解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2025〕66号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "响应研判条件", "answerQuote": "邻省发生地震距离我市行政边界300公里范围内发生7.0级以上地震...作为响应研判条件", "candidateChunks": [19, 7, 10, 11, 8, 9, 18, 13, 2, 5, 1, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-02-1", "category": "pair", "question": "重庆市推进空中丝绸之路建设实施方案主要包含哪些方面的支持措施？", "answer": "方案围绕民航基础设施“硬联通”、规则标准“软联通”和人文交流“心联通”，提出五个部分14条举措，涵盖提升运行效率、构建综合交通体系、提高通关便利化、壮大航空产业集群及促进国际经贸合作与人文交流。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 1, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作", "text": "\n（此件公开发布）\n\n重庆市推进空中丝绸之路建设实施方案\n\n为奋力打造内陆开放综合枢纽，加快推进重庆空中丝绸之路建设，制定本实施方案。\n\n一、总体目标\n深入对接六大国际经济合作走廊，以新亚欧大陆桥经济走廊、中国—中南半岛经济走廊为重点，推进我市与阿姆斯特丹、法兰克福、布达佩斯、新加坡、吉隆坡、曼谷、河内等重点城市共建空中丝绸之路，完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作，为深度融入共建“一带一路”高质量发展、加快打造内陆开放综合枢纽提供重要支撑。\n\n到2027年，重庆空中丝绸之路建设取得阶段性成果，重点领域合作实现突破，国际航空枢纽功能显著提升，在飞国际（地区）航线达到60条，年国际（地区）旅客、货邮吞吐量分别达到330万人次、22万吨。到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素"}, {"docId": 2097637762685849602, "chunkIndex": 2, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "二、进一步完善基础资源要素", "text": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素\n（一）完善机场基础设施。有序推进重庆江北国际机场（以下简称江北机场）西区提质改造，持续推进数字孪生机场建设，加强航空口岸指定监管场地硬件设施建设，实现前置拦截、查验作业、检疫处理、冷链暂存等环节标准化、信息化、智能化升级。推进重庆新机场项目前期工作。推动与空中丝绸之路共建城市的机场集团开展战略合作，促进规划建设、口岸环境、安全服务、运营管理等领域交流。探索与海外机场互设海外航空货站。（责任单位：重庆机场集团、市发展改革委、市交通运输委、市政府口岸物流办、重庆海关）\n\n（二）优化资源要素供给。深化空域资源动态利用，以数字化、智能化手段提升运行效率，强化多主体协同，实现“空域—地面—机场”联动。利用大数据、人工智能技术优化机场运行管理，实现对航班调度、资源分配的智能决策。积极推动江北机场增量时刻投入使用，适时启动新一轮时刻容量评估。围绕重点国际客货运中转通道，积极争取扩大“第五航权”覆盖范围。深化与航空枢纽运营人合作，创新战略协同机制，引导航空枢纽运营人加大运力投入，拓展空中丝绸之路航线网络，强化机务、维修等后勤保障。（责任单位：市交通运输委、市政府口岸物流办、重庆机场集团）\n\n三、进一步提升互联互通水平"}, {"docId": 2097637762685849602, "chunkIndex": 4, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "四、进一步提升口岸通关效能", "text": "链、电子产品等重点适航货物运输需求，布局国际货运航线网络，以“东南亚—重庆—欧美”为核心进一步提升航空物流中转效能。（责任单位：市政府口岸物流办、重庆机场集团）\n（五）构建综合交通运输体系。大力发展“民航+铁路”旅客运输服务，用好铁路枢纽东环线运力，研究论证将渝宜高铁引入江北机场，加快西渝高铁、渝宜高铁、渝万高铁项目建设，形成辐射广安、恩施等周边城市的综合交通网络。完善“民航+轨道”市内便捷出行体系，加快建设轨道交通15号线，畅通江北机场与重庆北站、重庆西站、重庆东站、科学城站的轨道交通连接。织密“民航+公路”运输网络，完善长途客运、旅游巴士等地面接驳服务体系。推动空中丝绸之路与西部陆海新通道、中欧班列、长江黄金水道协同构建“铁公水空”多式联运体系。（责任单位：市交通运输委、市发展改革委、市政府口岸物流办）\n\n四、进一步提升口岸通关效能\n\n（六）提升口岸服务能力。优化口岸营商环境，进一步发挥进境肉类、水果、食用水生动物、冰鲜水产品、植物种苗、药品等口岸功能，扩大与空中丝绸之路共建城市的进出口业务规模。积极实施外国人过境免签和外籍商务人员专项签证便利政策，启用贴纸式临时入境许可。推进江北机场口岸公共卫生核心能力建设，强化卫生检疫监管、突发公共卫生事件应对等领域联防联控，完善口岸应急处置措施及程序。（责任单位：市政府口岸物流办、市公安局、市商务委、重庆海关、重庆边检总站、重庆机场集团）"}, {"docId": 2097637762685849602, "chunkIndex": 7, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "六、进一步深化国际交往合作", "text": "制造研发平台，拓展生产作业、公共服务、旅游观光等应用场景。支持飞机采购租赁使用人民币结算。（责任单位：市经济信息委、市发展改革委、市交通运输委、人行重庆市分行）\n（十）提质升级临空经济。加快完善重庆临空经济示范区基础设施，建设航空制造、维修、租赁、培训等特色产业孵化载体，打造先进制造业核心区和现代服务业集聚区。大力发展航空租赁、航空维修、航空培训产业，培育百亿级“保税+租赁”新业态，打造中西部领先的一站式航空综合维修基地和航空人才培训基地。加强航空材料、航空发动机、机载系统等领域的研发与核心技术攻关。积极引进楼宇经济、商业综合体等高端商务项目，统筹江北机场及周边区域商业的一体化发展。加快建设中新（重庆）航空产业园、新加坡航空（重庆）保税航材分拨中心、木耳航空物流园等项目，加强项目落地服务保障。高质量编制重庆新机场临空经济区产业发展规划，加强与国土空间、综合交通、市政基础设施、生态建设等规划协同。更大力度吸引和利用外资，探索与空中丝绸之路共建城市开展国际产业合作。（责任单位：两江新区区政府、璧山区政府、市发展改革委、市经济信息委、市规划自然资源局、市商务委、重庆海关、重庆机场集团）\n\n六、进一步深化国际交往合作"}], "source": {"pairId": "p-02", "policyDocId": 2097637762685849602, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进空中丝绸之路建设实施方案》的通知", "interpretDocId": 2097637772185948161, "interpretTitle": "《重庆市推进空中丝绸之路建设实施方案》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2025〕64号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "五个部分、14条", "answerQuote": "《实施方案》围绕统筹推进民航基础设施“硬联通”、规则标准“软联通”和人文交流“心联通”，提出五个部分、14条工作举措", "candidateChunks": [1, 0, 5, 10, 2, 4, 7, 9, 8, 6, 3], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-02-2", "category": "pair", "question": "重庆在货物通关方面有哪些具体的便利化措施和时间保障？", "answer": "实施“空空直转”“空侧直通”让货物在机坪跨航班转运；强化“7×24小时”通关保障；开通生鲜等特殊进口商品绿色通道，实现快验快放。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 5, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "实施机坪“空空直转”“空侧直通”等措施，强化“7×24小时”通关保障，开通特殊进口商品绿色通道，实现快验快放。", "text": "疫监管、突发公共卫生事件应对等领域联防联控，完善口岸应急处置措施及程序。（责任单位：市政府口岸物流办、市公安局、市商务委、重庆海关、重庆边检总站、重庆机场集团）\n（七）提高通关便利水平。持续优化监管流程，实施机坪“空空直转”“空侧直通”等措施，强化“7×24小时”通关保障，开通特殊进口商品绿色通道，实现快验快放。积极对接国际通行规则，强化航空口岸高效通关制度创新。与空中丝绸之路共建城市在跨境数字人民币结算、离岸贸易、通关物流数据共享等方面开展合作。加快推进口岸智慧旅检建设，深入实施入境游口岸签“一网通办”。（责任单位：市政府口岸物流办、市公安局、市商务委、市文化旅游委、人行重庆市分行、重庆海关、重庆边检总站、重庆机场集团）\n\n五、进一步壮大航空产业集群\n\n（八）加快发展航空物流产业。深化与物流企业、货运航空公司的战略合作，打造覆盖航空快运、跨境电商、保税物流、高端冷链等产业的国际航空物流枢纽。探索在永川、万盛等地布局城市航空货站。鼓励引导货代企业、物流企业、跨境电商平台协同合作，提升高新技术设备及原材料、特定药品、生物制品、超大超重件等特殊货物运输服务能力。推动定制重庆始发、中转的航空运输服务，探索发展以重庆为供应链组织中心的“跨航司换单中转”“通单中转”等物流模式。强化支线机场货运集散功能，逐步释放支线机场低空物流潜力，探索开通大载重无人机货运示范航线。（责任单位：市政府口岸物流办、市交通运输委、重庆海关、重庆机场集团）"}], "source": {"pairId": "p-02", "policyDocId": 2097637762685849602, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进空中丝绸之路建设实施方案》的通知", "interpretDocId": 2097637772185948161, "interpretTitle": "《重庆市推进空中丝绸之路建设实施方案》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2025〕64号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "7×24小时", "answerQuote": "强化“7×24小时”通关保障，开通生鲜等特殊进口商品绿色通道，实现快验快放", "candidateChunks": [5, 3, 4, 2, 1, 8, 6, 9, 0, 10, 7], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-03-1", "category": "pair", "question": "重庆市推进城市全域数字化转型行动计划主要包含哪几个部分？", "answer": "该计划共7个部分，包括总体要求、数字底座能力提升行动、智能中枢能力提升行动、六大系统能力提升行动、基层智治体系能力提升行动、适数生态能力提升行动以及组织实施。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "二、数字底座能力提升行动", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 7, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "五、基层智治体系能力提升行动", "text": "代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。\n（二十）全面构建数字经济系统体系能力。聚焦产业集群培育、企业成长服务、产业创新生态系统重塑、产业发展质效提升、现代化产业治理等，持续深化梳理迭代数字经济系统五级核心业务体系。迭代建设产业一链通、数智金融服务、智汇攻关、数字陆海新通道等数字化应用，加快构建产业培育、科技创新、企业服务等五级联动业务承接体系，推动数智赋能新质生产力发展和现代化产业体系建设。\n\n（二十一）全面构建数字社会系统体系能力。聚焦投资于人、消费提档、民生改善等，持续优化完善数字社会系统五级核心业务体系。迭代建设惠学生、智慧医保、救助通、渝你同行、信用等数字化应用，有效提升五级联动业务承接能力，赋能构建更加优质均衡的公共服务体系。\n\n（二十二）全面构建数字文化系统体系能力。聚焦主流价值、主流舆论、主流文化等，持续优化完善数字文化系统五级核心业务体系。迭代建设春风满巴渝、巴渝文物、惠游重庆等数字化应用，加快构建数字文化系统五级联动业务承接体系，全面推动数智赋能新时代文化强市建设。\n\n（二十三）全面构建数字法治系统体系能力。聚焦维护国家政治安全、确保社会大局稳定、促进社会公平正义、保障人民安居乐业等，持续优化完善数字法治系统五级核心业务体系。迭代情指行、全民反诈、重庆调解在线、“执法+监督”等数字化应用，加快构建数字法治系统五级联动业务承接体系。\n\n五、基层智治体系能力提升行动"}, {"docId": 2097637763906392065, "chunkIndex": 6, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "四、六大系统能力提升行动", "text": "方案优化完善、线上精细化智能预案各跑道全覆盖，打造全媒体传播大脑、智慧文旅等综合场景，全面提升舆论引导精准度、文化服务普惠度、文明素养浸润度，营造良好文化氛围。\n（十六）加快集成生态景观防治协同支撑能力。聚焦空气环境、固废与土壤环境、自然资源等领域，推动生态景观板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造污染防治攻坚战智管、中心城区“四山”管理等综合场景，加快构建生态环境数字治理新形态。\n\n（十七）加快集成高品质生产生活服务支撑能力。聚焦医疗、教育、就业、养老等领域，推动生产生活服务板块线下工作方案优化完善、线上精细化智能预案各跑道全覆盖，打造15分钟高品质生活服务圈、“三医”协同、高质量就业综合智服等综合场景。\n\n四、六大系统能力提升行动\n\n（十八）全面构建数字党建系统体系能力。聚焦推动党的领导一贯到底、纵深推进全面从严治党、深化全过程人民民主市域实践等，持续深化梳理迭代数字党建系统五级核心业务体系。迭代建设八张报表、八张问题清单、突发事件直报快响、渝才荟、人大代表全渝通、青春重庆等数字化应用，持续提升数字党建五级联动业务承接能力，加快完善党建统领整体智治工作格局。\n\n（十九）全面构建数字政务系统体系能力。聚焦全生命周期服务、全要素决策发展、全链条本质安全、全域协同治理等，持续深化梳理迭代数字政务系统五级核心业务体系。迭代“一件事一次办”、民呼我为、危岩地灾风险管控、渣土治理、渝畅停等数字化应用，加快构建数字政务系统五级联动业务承接体系，推动形成数字化、智能化的政府运行新形态。"}, {"docId": 2097637763906392065, "chunkIndex": 3, "why": "重庆市推进城市全域数字化转型行动计划", "quote": "三、智能中枢能力提升行动", "text": "模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。\n（五）推进感知可用。强化感知资源“一本账”管理，推进感知盲区补点、接入，构建融通智联感知体系。鼓励社会主体感知资源接入，推进感知资源与体征指标、风险点、智能预案等深度关联。提升AI赋能视频感知资源利用率、共享率、复用率，强化城市基础设施数字化改造。\n\n（六）推进空间孪生。建设空间数据体系，迭代国土空间数据综合信息系统，深化“多规合一”专题图，构建“挂图作战”智能体系，加快自然空间、人造空间向数字空间全量孪生。聚焦产业升级、科技创新等发展行为，应急调度、风险排查等治理行为，教育就业、卫生健康等服务行为，推动行为（活动）向数字空间映射。推动先进文化向数字空间孪生。\n\n（七）优化“两端”入口。迭代升级“渝快政”，开展信创化改造和客户端适配。升级“渝快办”，深化线上全程网办、线下全渝通办和一站式服务。\n\n（八）抓实数据安全。建设数据灾备中心，加强数字重庆人工智能底座保密防护和管理。落实数据分类分级保护制度，完善风险监测预警、安全审查监管等机制。\n\n三、智能中枢能力提升行动"}], "source": {"pairId": "p-03", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 2097637772248862722, "interpretTitle": "《重庆市推进城市全域数字化转型行动计划》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "7个部分", "answerQuote": "《行动计划》主要为7个部分。", "candidateChunks": [1, 0, 7, 6, 3, 9, 4, 8, 10, 5, 2], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-03-2", "c 产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 1, "why": "重庆市支持食品及农产品加工产业高质量发展新十条政策", "quote": "二、支持财政常态化帮扶资金用于食品及农产品加工业发展", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 1, "why": "重庆市支持食品及农产品加工产业高质量发展新十条政策", "quote": "三、支持对食品及农产品加工企业贷款贴息", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农 出资，防止资金闲置。\n\n第九条  国有投资基金出资人原则上应当采取市场化方式遴选确定基金管理人、基金托管人。\n\n基金管理人应具备私募基金管理人资质，按照基金章程规定，履行基金的募资、投资、管理、退出等运行工作。基金托管人为具有基金托管业务资质的金融机构，按照协议约定对基金进行托管。\n\n第三章  基金的运作和风险控制\n\n第十条  国有投资基金应当按照“定位清晰、市场运作、科学决策、防范风险”的原则进行投资运作。\n\n第十一条  国有投资基金募资、投资、投后管理、清算、退出等采取市场化运作方式，政府及所属部门不得以行政手段干预基金的日常管理事务和具体项目的投资决策。"}, {"docId": 2097637763990278145, "chunkIndex": 7, "why": "重庆市国有投资基金管理暂行办法", "quote": "第四章  基金的终止和退出", "text": "府投资基金风险防范，严禁地方政府通过违法违规举债融资进行出资，不得新增地方政府隐性债务，不得强制要求国有企业、金融机构出资或垫资。\n\n第四章  基金的终止和退出\n第十八条  国有投资基金一般应当在存续期满后终止。确需延长存续期限的，政府投资基金应当报经同级政府批准，国企投资基金应当按照国有资产监督管理机构要求履行程序，与其他出资方按章程约定的程序办理。\n\n第十九条  国有投资基金终止后，应当在出资人监督下组织清算，其中政府出资额和应归属政府的收益，按照财政国库管理制度有关规定及时足额上缴国库。\n\n第二十条  国有投资基金中的国有出资部分一般应在投资基金存续期满后退出。存续期未满如达到预期目标，可通过股权回购机制、份额转让等方式适时退出。\n\n第二十一条  基金管理人应建立基金退出管理制度，制定退出方案。政府投资基金应科学合理确定退出期，并在章程中明确退出条件。国有出资从投资基金退出时，应当按照章程约定的条件退出；章程中没有约定的，应依法依规进行评估，采取市场化方式确定转让价格。\n\n第五章  基金的监督管理\n\n第二十二条  国有投资基金应当按照管理关系，定期向财政部门或国有资产监督管理机构报告基金运行情况、资产负债情况、投资损益情况及其他可能影响投资者权益的其他重大情况，按季编制并向财政部门或国有资产监督管理机构报送资产负债表、损益表及现金流量表等报表。\n\n第二十三条  财政部门、国有资产监督管理机构应分别对政府投资基金、国企投资基金开展绩效考核评价，评价结果作为基金存续、增资扩股、提前终止及计提管理费的重要依据。"}, {"docId": 2097637763990278145, "chunkIndex": 7, "why": "重庆市国有投资基金管理暂行办法", "quote": "第五章  基金的监督管理", "text": "府投资基金风险防范，严禁地方政府通过违法违规举债融资进行出资，不得新增地方政府隐性债务，不得强制要求国有企业、金融机构出资或垫资。\n\n第四章  基金的终止和退出\n第十八条  国有投资基金一般应当在存续期满后终止。确需延长存续期限的，政府投资基金应当报经同级政府批准，国企投资基金应当按照国有资产监督管理机构要求履行程序，与其他出资方按章程约定的程序办理。\n\n第十九条  国有投资基金终止后，应当在出资人监督下组织清算，其中政府出资额和应归属政府的收益，按照财政国库管理制度有关规定及时足额上缴国库。\n\n第二十条  国有投资基金中的国有出资部分一般应在投资基金存续期满后退出。存续期未满如达到预期目标，可通过股权回购机制、份额转让等方式适时退出。\n\n第二十一条  基金管理人应建立基金退出管理制度，制定退出方案。政府投资基金应科学合理确定退出期，并在章程中明确退出条件。国有出资从投资基金退出时，应当按照章程约定的条件退出；章程中没有约定的，应依法依规进行评估，采取市场化方式确定转让价格。\n\n第五章  基金的监督管理\n\n第二十二条  国有投资基金应当按照管理关系，定期向财政部门或国有资产监督管理机构报告基金运行情况、资产负债情况、投资损益情况及其他可能影响投资者权益的其他重大情况，按季编制并向财政部门或国有资产监督管理机构报送资产负债表、损益表及现金流量表等报表。\n\n第二十三条  财政部门、国有资产监督管理机构应分别对政府投资基金、国企投资基金开展绩效考核评价，评价结果作为基金存续、增资扩股、提前终止及计提管理费的重要依据。"}, {"docId": 2097637763990278145, "chunkIndex": 2, "why": "重庆市国有投资基金管理暂行办法", "quote": "第二章 基金的设立", "text": "企业出资等方式。政府采取注资国有企业方式设立基金，明确相关资金专项用于对基金出资的，原则上按照政府出资有关要求管理。\n\n国企投资基金是指国有企业出资的投资基金。\n第三条  财政部门负责政府投资基金的管理，履行政府出资人职责。国有资产监督管理机构负责国企投资基金的管理。发展改革部门负责政府投资基金的信用建设和信用信息登记，会同行业主管部门加强对政府投资基金投向的指导评价。审计部门负责对国有投资基金进行审计监督。证券监督管理机构负责对基金的业务活动实施监督管理，联合市级有关部门开展综合研判会商。地方金融管理部门参与综合研判会商，指导基金的设立和规范发展。\n\n第二章  基金的设立\n\n第四条  国有投资基金设立应履行相应的审批程序。市级和区级政府投资基金应报同级人民政府批准，其中区级政府投资基金还应报市政府备案；县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。除上述情形外，全市党政机关、事业单位不得以财政拨款或自有收入新设政府投资基金，已经设立的按照政府投资基金管理要求统一规范管理。国有企业发起设立或出资参与基金，原则上作为“三重一大”事项履行集团决策程序，并按要求报送国有资产监督管理机构。"}], "source": {"pairId": "p-05", "policyDocId": 2097637763990278145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市国有投资基金管理暂行办法》的通知", "interpretDocId": 2097637772387274754, "interpretTitle": "重庆市财政局关于《重庆市国有投资基金管理暂行办法》的政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕4号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "6章26条", "answerQuote": "《暂行办法》分为总则、基金的设立、基金的运作和风险控制、基金的终止和退出、基金的监督管理、附则共6章26条", "candidateChunks": [4, 1, 7, 5, 0, 2, 6, 8, 3], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-05-2", "category": "pair", "question": "县级政府新设国有投资基金需要报谁审批？", "answer": "考虑到县级的资源禀赋与财力实际，《暂行办法》要求县级政府新设基金提级报市政府审批。而市级和区级政府投资基金应报同级人民政府批准，区级还需报市政府备案。", "expectRefusal": false, "gold": [{"docId": 2097637763990278145, "chunkIndex": 2, "why": "重庆市国有投资基金管理暂行办法", "quote": "县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。", "text": "企业出资等方式。政府采取注资国有企业方式设立基金，明确相关资金专项用于对基金出资的，原则上按照政府出资有关要求管理。\n\n国企投资基金是指国有企业出资的投资基金。\n第三条  财政部门负责政府投资基金的管理，履行政府出资人职责。国有资产监督管理机构负责国企投资基金的管理。发展改革部门负责政府投资基金的信用建设和信用信息登记，会同行业主管部门加强对政府投资基金投向的指导评价。审计部门负责对国有投资基金进行审计监督。证券监督管理机构负责对基金的业务活动实施监督管理，联合市级有关部门开展综合研判会商。地方金融管理部门参与综合研判会商，指导基金的设立和规范发展。\n\n第二章  基金的设立\n\n第四条  国有投资基金设立应履行相应的审批程序。市级和区级政府投资基金应报同级人民政府批准，其中区级政府投资基金还应报市政府备案；县级政府应严格控制新设基金，如确需发起设立基金，应提级报市政府审批。除上述情形外，全市党政机关、事业单位不得以财政拨款或自有收入新设政府投资基金，已经设立的按照政府投资基金管理要求统一规范管理。国有企业发起设立或出资参与基金，原则上作为“三重一大”事项履行集团决策程序，并按要求报送国有资产监督管理机构。"}], "source": {"pairId": "p-05", "policyDocId": 2097637763990278145, ks": [1, 3, 0, 2, 9, 8, 10, 7, 6, 4, 5, 11], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-07-1", "category": "pair", "question": "重庆市2026年度优化营商环境工作任务清单主要包含哪些方面的支持措施？", "answer": "该清单围绕九大专项行动提出158条任务，涵盖对标先进优化提升、提升政务/法治/市场/创新/要素保障环境、打造“信用重庆”升级版、助企暖企护航成长以及正面典型推广和反面典型通报等方面。", "expectRefusal": false, "gold": [{"docId": 2097637766162927617, "chunkIndex": 0, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "一、对标先进优化提升专项行动", "text": "---\r\ntitle: \"重庆市人民政府办公厅关于印发《重庆市2026年度优化营商环境工作任务清单》的通知\"\r\nfileNum: \"渝府办发〔2026〕18号\"\r\npubDate: 2026-04-07 10:51:07\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202604/t20260407_15592081.html\r\nmetadataId: 15592081\r\nchannelId: 121935\r\nsubcat: 881\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅关于\n\n印发《重庆市2026年度优化营商环境\n\n工作任务清单》的通知\n\n渝府办发〔2026〕18号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市2026年度优化营商环境工作任务清单》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年4月1日\n\n（此件公开发布）\n\n重庆市2026年度优化营商环境工作任务清单\n\n序号\n\n2026年度工作任务\n\n牵头单位\n\n一、对标先进优化提升专项行动\n\n（一）市场准入\n\n1"}, {"docId": 2097637766162927617, "chunkIndex": 17, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "七、打造“信用重庆”升级版专项行动", "text": "“渝金通”数智金融服务平台实战实效能力，迭代升级民营小微金融、通道金融等特色场景，不断健全“股、贷、保、担”全生命周期金融产品服务体系。\n\n市委金融办\n\n126\n引导金融机构将金融服务嵌入“人工智能（AI）+产业”等数字化场景，围绕重大项目、重点企业和重要产业链，加强场景聚合、生态对接，实现“一站式”金融服务，优化信贷审批流程，缩短信贷审批时间。\n\n人行重庆市分行、市经济信息委、重庆金融监管局\n\n七、打造“信用重庆”升级版专项行动\n\n（一）加强政府守信践诺\n\n127\n\n持续归集、受理、处置政府机构在政府采购、项目建设、招商引资等领域不履行约定义务的失信线索，督导政府机构纠正失信行为。\n\n市发展改革委\n\n128\n\n持续开展地方政府公共信用综合评价，加强评价结果运用，对失信情况严重的政府机构督促整改。\n\n市发展改革委\n\n129\n\n推动被纳入失信被执行人的政府机构及时履行法院生效判决，修复信用状况，确保我市涉政府机构失信被执行人动态清零。\n\n市发展改革委、市高法院\n\n130\n\n建立涉政府机构未自动履行生效法律文书专项督促工作机制，督促涉政府机构被执行人及时履行法院生效判决。\n\n市发展改革委、市高法院\n\n131\n\n推广政府合同履约监管系统，持续打造“信用+政府合同履约”应用场景。\n\n市发展改革委\n\n（二）优化市场信用环境\n\n132\n\n制定《重庆市公共信用评价管理办法》，规范公共信用评价。\n\n市发展改革委\n\n133\n\n动态更新失信惩戒措施清单，推动依法依规实施失信惩戒措施。\n\n市发展改革委\n\n134"}, {"docId": 2097637766162927617, "chunkIndex": 12, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "五、提升创新环境专项行动", "text": "\n市市场监管局\n\n85\n\n深化整治“内卷式”竞争，推动形成优质优价、良性竞争的市场秩序。\n市市场监管局\n\n（三）规范公共资源交易监管\n\n86\n\n规范评标专家管理，加强评标专家履职监管，推行评标专家聘期制，依法查处评标专家在评标活动中的违规违法行为。\n\n市发展改革委\n\n87\n\n抓好招标投标突出问题整治，严肃查处招标投标领域违规违纪违法行为。\n\n市发展改革委\n\n88\n\n制定《重庆市工程建设项目招标投标活动异议和投诉处理实施细则（修订）》。\n\n市发展改革委\n\n（四）推动经营主体发展壮大\n\n89\n\n深入开展个体工商户分型判定和分类申报认定工作，持续完善差异化帮扶措施。\n\n市市场监管局\n\n90\n\n做好做优个体工商户培育公共服务平台，推进实施政策智配、创业导览、一码融资等功能，提升个体工商户政策获取便利度。\n\n市市场监管局\n\n91\n\n实施个体工商户“优型提质”成长计划，建立“个转企”培育库，按行业（批零、餐饮、文创、居民服务、科技服务等）分类建档，全覆盖建立沟通联系机制，点对点进行指导帮扶。\n\n市市场监管局\n\n92\n\n加强优质企业梯度培育，在市场开拓、资金融通、人才引育等方面为经营主体提供精准服务，推动经营主体加快成长。\n\n市经济信息委\n\n93\n\n深入实施“龙头引领”行动，培育一批民营龙头企业、行业领军企业、产业链主企业。\n\n市工商联、市发展改革委、市经济信息委\n\n五、提升创新环境专项行动\n\n（一）加速集聚高端创新资源\n\n94"}, {"docId": 2097637766162927617, "chunkIndex": 18, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "八、助企暖企护航成长专项行动", "text": "\n市发展改革委\n\n133\n\n动态更新失信惩戒措施清单，推动依法依规实施失信惩戒措施。\n\n市发展改革委\n\n134\n推广信用修复“一件事”办事场景，优化办理流程，减免证明材料，快速办理符合条件的信用修复诉求。\n\n市发展改革委\n\n（三）推进社会信用建设\n\n135\n\n持续推进专用信用报告代替企业有无违法违规证明，按照“应替尽替”原则，将替代领域拓展至47个。\n\n市发展改革委\n\n136\n\n持续优化“全国融资信用服务平台（重庆站）”服务功能，创新以信用评价为基础的融资增信模式，推广产业链信用融资，帮助无抵押、无担保的小微企业以信用资产换取融资便利，融资授信规模达到3000亿元。\n\n市发展改革委\n\n137\n\n持续打造信用赋能超大城市治理场景矩阵，大力推动守信激励“信用+”场景建设，实现信用激励在更多行业应用。\n\n市发展改革委\n\n八、助企暖企护航成长专项行动\n\n（一）建立健全政企沟通服务机制\n\n138\n\n打造“政企同心·渝商渝好”“亲清服务 渝悦发展”“年轻一代民营经济人士‘十百千万’培育工程”工作品牌，定期召开政企沟通座谈会，常态化开展政策宣讲、政策解读、产融对接、项目推介等服务活动。\n\n市委统战部、市发展改革委、市工商联\n\n139\n\n推动构建市政府领导和市级部门负责同志与民营企业沟通交流的“双会”制度，围绕强链延链补链融链，开展民营经济沟通交流专题活动。\n\n市发展改革委\n\n140\n\n开展民营企业大调研大走访专项行动，主动问需、问困、问计于民营企业。\n\n市委统战部、市工商联\n\n141"}], "source": {"pairId": "p-07", "policyDocId": 2097637766162927617, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市2026年度优化营商环境工作任务清单》的通知", "interpretDocId": 2097637772496326658, "interpretTitle": "《重庆市2026年度优化营商环境工作任务清单》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕18号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "九大专项行动", "answerQuote": "《任务清单》围绕九大专项行动提出2026年度工作任务158条。", "candidateChunks": [0, 1, 20, 17, 6, 12, 18, 14, 5, 9, 11, 19], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-07-2", "category": "pair", "question": "在提升政务环境方面，重庆2026年有什么具体的数字化服务举措？", "answer": "提出建立个人和企业全生命周期数字档案，并深化全域无证明城市建设，推进“数据多跑路、群众少跑腿”，相关优化措施共15条。", "expectRefusal": false, "gold": [{"docId": 2097637766162927617, "chunkIndex": 8, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。", "text": "\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55\n加强省际间基本公共服务标准协同，推动川渝通办提质增效，实现基本公共服务同城化便利共享。\n\n市政府办公厅\n\n（三）全面强化政务服务数字赋能\n\n56\n\n优化“渝快办”平台服务体验，安全稳妥有序推进人工智能（AI）大模型运用，优化智能问答、智能搜索、智能导办、智能预审、智能分析、智能推荐等功能，整体提升政务服务智能化水平。\n\n市大数据发展局\n\n57\n\n深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。\n\n市大数据发展局\n\n58\n\n通过“渝快办”平台、“12345”热线联通全市各级政务服务窗口服务信息，开通线上预约、电话预约等服务，实现即到即办。\n\n市政府办公厅、市大数据发展局\n\n59\n\n优化“渝快办”一窗综办受理系统，上线统一预约、统一叫号、统一登记、统一收件、统一分发、统一出证、统一物流、统一查询等功能，支撑跨地域、跨层级通办。\n\n市大数据发展局\n\n60\n\n深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。\n\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61"}, {"docId": 2097637766162927617, "chunkIndex": 8, "why": "重庆市2026年度优化营商环境工作任务清单", "quote": "深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。", "text": "\n推动各级政务服务场所集约化规范化建设，优化综合窗口服务模式，统一服务标准，进一步提升窗口服务效能，更好实现线下办事“只进一门”。\n\n市政府办公厅\n\n55\n加强省际间基本公共服务标准协同，推动川渝通办提质增效，实现基本公共服务同城化便利共享。\n\n市政府办公厅\n\n（三）全面强化政务服务数字赋能\n\n56\n\n优化“渝快办”平台服务体验，安全稳妥有序推进人工智能（AI）大模型运用，优化智能问答、智能搜索、智能导办、智能预审、智能分析、智能推荐等功能，整体提升政务服务智能化水平。\n\n市大数据发展局\n\n57\n\n深入实施数据质量提升行动，全面提升数据的准确性、可用性、及时性，建立个人和企业全生命周期数字档案，推进“一人一档”“一企一档”建设。\n\n市大数据发展局\n\n58\n\n通过“渝快办”平台、“12345”热线联通全市各级政务服务窗口服务信息，开通线上预约、电话预约等服务，实现即到即办。\n\n市政府办公厅、市大数据发展局\n\n59\n\n优化“渝快办”一窗综办受理系统，上线统一预约、统一叫号、统一登记、统一收件、统一分发、统一出证、统一物流、统一查询等功能，支撑跨地域、跨层级通办。\n\n市大数据发展局\n\n60\n\n深化全域无证明城市建设，通过数据共享、部门核验、告知承诺、“信用代证”等方式，推进实现“数据多跑路、群众少跑腿”。\n\n市司法局、市大数据发展局、市发展改革委\n\n（四）全面推动政务服务扩面增效\n\n61"}], "source": {"pairId": "p-07", "policyDocId": 2097637766162927617, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市2026年度优化营商环境工作任务清单》的通知", "interpretDocId": 2097637772496326658, "interpretTitle": "《重庆市2026年度优化营商环境工作任务清单》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕18号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "全生命周期数字档案", "answerQuote": "提出建立个人和企业全生命周期数字档案、深化全域无证明城市建设推进“数据多跑路、群众少跑腿”等优化措施15条。", "candidateChunks": [8, 1, 3, 9, 2, 10, 4, 14, 12, 15, 18, 17], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-08-1", "category": "pair", "question": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）主要包含哪些重点任务？", "answer": "包括现代化产业体系建设、科技创新能力突破、现代基础设施网络巩固提升、重点领域关键环节集成深化改革、欧亚大陆综合枢纽共建、西部金融中心建设提质、巴蜀特色国际消费目的地焕彩、高品质宜居生活悦享、“人工智能+”全要素支撑体系强基、西部引领和战略协同等十项行动。", "expectRefusal": false, "gold": [{"docId": 2097637766913708033, "chunkIndex": 7, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（三）实施现代基础设施网络巩固提升行动", "text": "术开展集中攻关，力争在量子科技、脑机接口、工业智能体等领域取得标志性原创成果。协同四川共建成渝绵“科技创新三角”、成渝中线科创走廊，打造国家重要的科研备份基地。\n5．强化科技创新和产业创新深度融合。健全“产业出题、科技答题”攻关体系，力争“416”科技创新成果数量实现翻番。协同四川建设一批概念验证中心、制造业中试平台，构建成渝地区共享型“中试+”服务网络。全面推广“教育+人才+科创+产业”模式，提质发展环大学创新创业生态圈，加快建设“模力高地”人工智能创新孵化生态社区。深化实施高新技术企业和科技型企业“双倍增”行动、科技领军企业培育行动，推动创新资源和要素向企业集聚。\n\n6．塑造教育科技人才一体化发展新格局。完善高水平研究型大学科技创新体系，提升教育部重庆高等研究院等融合创新平台效能。优化重大科技创新组织机制，推行“揭榜挂帅”等项目组织方式。加力实施“渝跃行动”和“新重庆引才计划”，加快集聚海外战略科学家、科技领军人才，完善新重庆人才服务等支持保障体系。探索职务科技成果权属制度改革，全面推行职务科技成果单列管理。加快全国高校区域技术转移转化中心（成渝地区）建设，会同四川推动全国科技成果在渝转化、重庆科技成果就地转化。\n\n（三）实施现代基础设施网络巩固提升行动\n\n构建系统完备、高效实用、智能绿色、安全可靠的现代基础设施网络，推动传统基础设施更新和数智化改造。到2030年，重庆高速公路通车里程达5700公里、高等级航道里程超1300公里，外电入渝能力达2600万千瓦，新增规模以上水利工程年供水能力14亿立方米，川渝铁路网里程达1.3万公里。"}, {"docId": 2097637766913708033, "chunkIndex": 14, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（七）实施巴蜀特色国际消费目的地焕彩行动", "text": "业及制造业中长期贷款增长。建立资产证券化工作机制，联合探索国有非公益性资产证券化的标准化路径与跨市场发行，推动建立基础设施REITs“首发+扩募”双轮驱动机制。\n19．提升金融服务实体经济能力。完善“股贷债保”“募投管退”科技金融综合服务体系，撬动耐心资本投早、投小、投长期、投硬科技。深化绿色金融改革创新试验区建设，推动产业绿色低碳转型与绿色金融、转型金融协同发展。强化对普惠小微、涉农、消费和民生领域金融服务供给，完善银担风险分担政策。推动养老金融赋能银发经济。迭代“渝金通”等数字金融系统，加快金融机构数字化转型。联合构建跨境金融服务体系，创新发展供应链金融和贸易融资。推进大宗商品期货交割库建设。完善金融支持加快西部陆海新通道建设细化措施，发挥通道金融服务中心、通道金联体等平台作用，提升金融服务大通道、大物流、大产业、大市场能力。\n\n（七）实施巴蜀特色国际消费目的地焕彩行动\n\n以推动巴蜀文化旅游走廊特色发展为重点，着力建设国际消费中心城市，基本建成具有全球吸引力的巴蜀特色国际消费目的地。到2030年，全市文化产业、旅游产业增加值占地区生产总值的比重均达5%，国内游客总花费达7700亿元，双城经济圈社会消费品零售总额达5.2万亿元。"}, {"docId": 2097637766913708033, "chunkIndex": 19, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（十）实施西部引领和战略协同行动", "text": "作模式。面向企业、高校、科研机构等发行算力券，探索开展跨区域用券合作。组建人工智能产业子基金，鼓励川渝企业联合打造开源社区。\n\n（十）实施西部引领和战略协同行动\n优化市域超大城市空间形态，持续完善特色鲜明、布局合理、集约高效的“双城”空间格局。高效联动重点城市群，深度对接国家区域重大战略，构建联结西南西北、带动新时代西部大开发的战略枢纽。到2030年，重庆主城都市区地区生产总值占双城经济圈的比重提升到30%，川渝两省市地区生产总值占全国的比重持续提升。\n\n30．优化双城经济圈协同发展格局。做强中心城区产业引领、科技创新等核心功能，推动两江新区地区生产总值突破8000亿元、西部科学城重庆高新区研发经费投入强度达5.8%。深化重庆成都双核联动联建，推动重庆都市圈与成都都市圈协同互动，共建成渝主轴经济走廊，一体推进资源要素整合、基础设施布局、特色产业发展。加力实施先进制造业发展“渝西跨越计划”。推动万州建设重要城市副中心、永川建设城市副中心、黔江建设区域中心城市，分类推进川渝毗邻地区合作。\n\n31．联动周边做强西部增长极。加强与西部省区交流互动，高水平共建西部陆海新通道，深化在能源、物流、产业等领域的合作。深化与关中平原、兰州—西宁等城市群联动，推动中欧班列（成渝）和中欧班列（西安）联动发展，引导航空航天、新型储能、电子信息等领域创新成果在渝转化。加强与黔中、滇中、北部湾城市群合作，推动渝桂出海大通道扩能提速，构建联结西南五省市的产业链供应链中心。深化与遵义、安康等联结型城市合作。"}, {"docId": 2097637766913708033, "chunkIndex": 4, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "（一）实施现代化产业体系建设跨越行动", "text": "\n＜2\n\n＜1\n\n14\n\n川渝货物贸易进出口总额（万亿元）\n\n2\n\n2.2\n\n15\n\n中欧班列（成渝）开行量（列）\n\n4800\n\n以上\n\n4800\n以上\n\n16\n\n重庆经西部陆海新通道3种主要运输组织方式货运量（万标箱）\n\n41.5\n\n50\n\n17\n\n双城经济圈常住人口城镇化率（%）\n\n67.3\n\n68.5\n\n18\n\n双城经济圈（重庆规划范围内）全体居民人均可支配收入（万元）\n\n4.93\n\n5.39\n\n19\n\n“15分钟高品质生活服务圈”新建成数量（个）\n\n150\n\n300\n\n注：标“#”为其中的主要项。\n\n二、重点任务\n\n（一）实施现代化产业体系建设跨越行动\n\n加快构建以先进制造业为骨干、以生产性服务业为支撑的现代化产业体系，以“产业大脑+未来工厂”新模式牵引“四侧”协同、促进“四链”融合，迭代“33618”现代制造业集群体系，成渝地区形成高度集聚、高效分工、高度开放的区域产业生态。到2030年，重庆规上工业增加值年均增长6%左右，生产性服务业增加值占服务业增加值比重达60%左右。"}], "source": {"pairId": "p-08", "policyDocId": 2097637766913708033, "policyTitle": "重庆市人民政府关于印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》的通知", "interpretDocId": 2097637772546658306, "interpretTitle": "《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕8号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "十项重点任务", "answerQuote": "一是实施现代化产业体系建设跨越行动……二是实施科技创新能力突破行动……三是实施现代基础设施网络巩固提升行动……四是实施重点领域关键环节集成深化改革行动……五是实施欧亚大陆综合枢纽共建行动……六是实施西部金融中心建设提质行动……七是实施巴蜀特色国际消费目的地焕彩行动……八是实施高品质宜居生活悦享行动……九是实施“人工智能+”全要素支撑体系强基行动……十是实施西部引领和战略协同行动。", "candidateChunks": [7, 1, 14, 19, 0, 4, 16, 10, 2, 9, 17, 15], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-08-2", "category": "pair", "question": "根据《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》，到2030年重庆的经济总量目标是多少？", "answer": "通过5年的努力，重庆经济总量超4万亿元，川渝两省市经济总量占全国比重持续提升。", "expectRefusal": false, "gold": [{"docId": 2097637766913708033, "chunkIndex": 1, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。", "text": "\n重庆市人民政府\n\n2026年4月26日\n\n（此件公开发布）\n\n重庆市推动成渝地区\n\n双城经济圈发展能级提升行动方案\n\n（2026—2030年）\n为深入学习贯彻习近平总书记关于推动成渝地区双城经济圈建设重要讲话重要指示批示精神，加快落实党中央关于“提升成渝地区双城经济圈发展能级”的战略部署，全面落实市委六届八次全会精神，在推动成渝地区双城经济圈建设中干出新业绩，特制定本行动方案。\n\n一、总体要求\n\n（一）指导思想\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平总书记视察重庆重要讲话重要指示精神，紧扣“两中心两地”战略定位和“三中心一走廊”部署要求，将成渝地区双城经济圈建设作为推进现代化新重庆建设的重大战略支撑，坚持全市域融入、全方位推进，着力打造更多“西部领先、全国进位和重庆辨识度”的标志性成果，推动成渝地区双城经济圈发展能级整体跃升，加快建设带动全国高质量发展重要增长极和新的动力源。\n\n（二）发展目标\n\n锚定到2030年高质量建成全国区域发展“第四极”的总体目标，全面增强成渝地区双城经济圈经济承载和辐射带动、创新资源集聚和转化、改革集成和开放门户、人口吸纳和综合服务功能，双城经济圈综合实力大幅提升，加快迈入具有国际影响力的现代化城市群行列。\n\n——综合经济实力实现争先进位。重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。"}, {"docId": 2097637766913708033, "chunkIndex": 2, "why": "重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）", "quote": "重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。", "text": "\n——综合经济实力实现争先进位。重庆经济总量超4万亿元，川渝两省市经济总量达13万亿元，占全国比重持续提升。\n——世界级先进制造业集群优势加快形成。重庆智能网联新能源汽车之都、人工智能应用高地、低空经济创新发展强市成势见效，形成一批具有全球市场影响力的领军企业、主流产品、高端品牌。\n\n——高水平区域创新中心领跑突破。重庆综合科技创新水平指数、研发经费投入强度保持西部第1，突破关键核心技术和培育重大产业技术创新产品数量实现倍增，成渝地区创新能力从参与跟跑向面上提速竞跑、点上主动领跑跃升。\n\n——链接欧亚大陆经济走廊的战略枢纽基本建成。重庆成为集聚配置全球高端要素的重要承载地，成渝地区外贸进出口占西部比重达45%。基本建成西部陆海新通道投融资和结算体系，打造立足西部、面向东亚和东南亚、南亚，服务共建“一带一路”国家的西部金融中心。\n\n——进一步全面深化改革红利加速释放。加快探索超大城市现代化治理新路子，数智赋能城市发展服务安全治理水平走在全国前列。川渝统一大市场基本建成，营商环境达到全国一流水平。\n\n——生态宜居水平和人口集聚力居中西部前列。成渝地区双城经济圈人口吸纳能力持续增强，主要环境指标优于全国平均水平，成为具有显著吸引力的高品质生活宜居地，重庆在世界城市体系中的排名持续上升。\n\n——打造区域高水平协作样板。川渝“一体两核多点”区域发展聚合效应加速释放，构建以成渝地区为中心联接西南西北、带动新时代西部大开发的战略枢纽，支撑形成东南西北四极牵引、内陆沿海互促共进的区域发展新格局。"}], "source": {"pairId": "p-08", "policyDocId": 2097637766913708033, "policyTitle": "重庆市人民政府关于印发《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》的通知", "interpretDocId": 2097637772546658306, "interpretTitle": "《重庆市推动成渝地区双城经济圈发展能级提升行动方案（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕8号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "经济总量超4万亿元", "answerQuote": "重庆经济总量超4万亿元，川渝两省市经济总量占全国比重持续提升。", "candidateChunks": [1, 2, 0, 3, 19, 4, 13, 14, 20, 15, 9, 12], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-09-1", "category": "pair", "question": "重庆市推动经济稳中向好若干政策举措主要包含哪些方面的支持措施？", "answer": "该政策涉及促进消费、扩大投资、产业升级、经营主体、就业创业5个方面，共32项具体举措。", "expectRefusal": false, "gold": [{"docId": 2097637767136006145, "chunkIndex": 0, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "重庆市推动经济稳中向好若干政策举措", "text": "---\r\ntitle: \"重庆市人民政府办公厅关于印发《重庆市推动经济稳中向好若干政策举措》的通知\"\r\nfileNum: \"渝府办发〔2026〕22号\"\r\npubDate: 2026-04-30 18:26:39\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/xzgfxwj/szfbgt/202604/t20260430_15650406.html\r\nmetadataId: 15650406\r\nchannelId: 142846\r\nsubcat: 893\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅\n\n关于印发《重庆市推动经济稳中向好\n\n若干政策举措》的通知\n\n渝府办发〔2026〕22号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市推动经济稳中向好若干政策举措》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年4月30日\n\n（此件公开发布）\n\n重庆市推动经济稳中向好若干政策举措\n\n为深入贯彻党的二十届四中全会和习近平总书记视察重庆重要讲话重要指示精神，全面落实市委经济工作会议部署，着力稳预期、强信心、增活力，进一步巩固全市经济稳中向好态势，确保“十五五”开好局起好步，制定以下政策举措。\n\n一、挖掘释放消费潜力"}, {"docId": 2097637767136006145, "chunkIndex": 13, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "五、加力推进就业创业", "text": "精特新优势团队、高校院所科技成果转化项目等各类团队和企业申报市级种子基金。（责任单位：市财政局、市发展改革委、市委金融办、市科技局、重庆证监局、人行重庆市分行）\n29﹒支持企业信用修复。对已补报年报、已变更住所或名称的失信经营主体实行“免申即修”，推行多元“信用预警”提示服务，多项失信事项“并联修复、一次办结”，辅助材料欠缺或存在轻微瑕疵的书面承诺补齐后“容缺受理”，实施关联企业联动信用修复。（责任单位：市市场监管局）\n\n五、加力推进就业创业\n\n30﹒深入推进重点群体稳岗就业。延续实施促进农民工就业补贴政策，新招用返乡农民工并依法依规缴纳城镇职工养老保险的企业，可享受一次性补贴。延续实施县域大学生就业补贴政策，对到城口县、丰都县、忠县、垫江县、云阳县、奉节县、巫山县、巫溪县、石柱县、秀山县、酉阳县、彭水县等12个县的企业就业，签订劳动合同并缴纳社会保险费的毕业年度高校毕业生和离校5年内的高校毕业生（离校时间以毕业年度的7月1日起算），按照学历层次进行补贴，补贴时间最长3年。持续扩大“稳岗贷”与创业担保贷款联动组合贷款支持范围与支持额度，支持政府性融资担保机构进一步下调“稳岗贷”担保费率，从原则上不高于0.8%下调到0.6%，2026年力争发放“稳岗贷”280亿元。（责任单位：市人力社保局、市财政局、人行重庆市分行、重庆金融监管局）"}, {"docId": 2097637767136006145, "chunkIndex": 1, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "一、挖掘释放消费潜力", "text": "全面落实市委经济工作会议部署，着力稳预期、强信心、增活力，进一步巩固全市经济稳中向好态势，确保“十五五”开好局起好步，制定以下政策举措。\n\n一、挖掘释放消费潜力\n1﹒用好国家以旧换新政策。在国家明确的支持范围内重点支持促进优质供给、推进绿色低碳生产的优质消费产品，对个人消费者实施汽车报废更新、汽车置换更新、6类家电产品（冰箱、洗衣机、电视、空调、电脑、热水器）以旧换新、4类数码和智能产品（手机、平板、智能手表手环、智能眼镜）购新、智能家居产品（含适老化产品）购新补贴。（责任单位：市发展改革委、市商务委；各单位按职责分工负责，下同）\n\n2﹒实施汽车家电消费补贴。2026年5月1日—12月31日期间，按照“总额控制、先报先得、用完即止”原则，对在参与消费补贴活动的汽车经销商购买乘用车新车的个人消费者，按购车价格分档给予补贴；对在参与消费补贴活动的二手车经销企业购买二手车的个人消费者给予一定补贴；对个人消费者购买吸油烟机、家用灶具、净水器、洗碗机、微波炉、电饭煲等1级能效（水效）产品给予一定补贴。以上政策与国家消费品以旧换新政策不重复享受。（责任单位：市商务委、市财政局）\n\n3﹒实施“渝悦消费”主题消费促进活动。以“购在中国·爱尚重庆”为主题，举办“中国（重庆）国际消费节”“不夜重庆生活节”“精品消费月”“火锅美食文化节”等主题消费促进活动，重点围绕零售、餐饮、住宿等领域，向个人消费者发放满减、代金、折扣消费券。鼓励各级工会组织创新会员福利实现形式，推出面向职工及家人的文旅体产品，用好职工福利经费。（责任单位：市商务委、市财政局、市总工会）"}, {"docId": 2097637767136006145, "chunkIndex": 8, "why": "重庆市推动经济稳中向好若干政策举措", "quote": "三、加快现代产业体系优化升级", "text": "目全周期”应用功能，通过数据共享避免重复提交，将全流程办理时限压缩至50个工作日以内。（责任单位：市发展改革委、市大数据发展局）\n\n三、加快现代产业体系优化升级\n17﹒培育未来产业标志性产品和应用场景。鼓励企业加大重点领域关键核心技术攻关，对开发培育未来产业标志性产品的企业，依法依规给予50万元支持。鼓励企业加快场景培育和开放，推动新场景大规模应用，对建设“工业母机+”“机器人+”“低空装备+”“农机装备+”等应用场景的企业，依法依规给予最高50万元支持，每个企业年度累计获得的支持资金最高不超过100万元。（责任单位：市经济信息委、市科技局、市财政局）\n\n18﹒深入实施“人工智能+”行动。对开展人工智能大模型训练推理、数据标注、数据分析等算力应用的并在相关算力调度平台或与之联通的第三方平台购买智能算力服务的企业、高等院校、科研机构等，依法依规给予算力补贴，每个单位每年补贴最高不超过100万元。对高质量数据集项目依法依规给予最高不超过50万元的奖励。对可信数据空间项目依法依规给予最高不超过100万元的奖励。（责任单位：市大数据发展局、市科技局、市财政局）\n\n19﹒推动食品及农产品加工业高质量发展。对有实际生产经营活动的食品及农产品加工企业及新型农业经营 实到具体可执行的项目上。财政部门和发展改革等行业主管部门要做好项目对接工作，按照项目具体情况筹集匹配资金来源，实施全生命周期管理，确保大事要事财政保障到位。\n\n（二）创新预算编制方式"}], "source": {"pairId": "p-10", "policyDocId": 2097637768713064450, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市全面深化零基预算改革实施方案》的通知", "interpretDocId": 2097637772659904513, "interpretTitle": "重庆市全面深化零基预算改革实施方案", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕32号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "未通过评估不得安排", "answerQuote": "新增政策严格履行合理性、相关性、一致性评估程序，未通过评估，不得安排预算资金。", "candidateChunks": [3, 5, 2, 1, 10, 6, 4, 0, 7, 9, 8], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-11-1", "category": "pair", "question": "重庆市“十五五”农业农村现代化规划主要部署了哪些重点任务？", "answer": "规划部署了保障粮食供给、巩固脱贫成果、强化科技支撑、发展生态高效农业、建设智慧农业、推进和美乡村、促进农民增收、深化农村改革及构建城乡融合机制等任务。", "expectRefusal": false, "gold": [{"docId": 2097637768968916993, "chunkIndex": 1, "why": "重庆市“十五五”农业农村现代化规划（2026—2030年）", "quote": "统筹发展科技农业、绿色农业、质量农业、品牌农业，统筹推进“五个振兴”和常态化帮扶", "text": "，根据《加快农业农村现代化“十五五”规划》（国发〔2026〕14号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等，制定本规划。\n一、总体要求\n\n（一）指导思想\n\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实习近平总书记关于“三农”工作的重要论述和视察重庆重要讲话重要指示精神，聚焦做实“两大定位”、发挥“三个作用”，坚持农业农村优先发展，坚持尊重农民意愿，突出大城市带大农村大山区大库区，以学习运用“千万工程”经验为引领，以改革创新和数智赋能为动力，以迭代实施“四千行动”为抓手，统筹发展科技农业、绿色农业、质量农业、品牌农业，统筹推进“五个振兴”和常态化帮扶，抓好办成一批农民群众可感可及的实事，加快打造城乡融合乡村振兴示范区建设标志性成果，努力推动基本实现农业现代化、农村基本具备现代生活条件取得重大进展，为奋力谱写中国式现代化重庆篇章提供基础支撑。\n\n（二）发展目标\n\n到2030年，全市农业农村现代化达到西部领先水平。\n\n——粮食稳产增产能力实现新跃升。耕地保有量稳定在2664万亩以上，高标准农田建管用一体化水平显著提升，粮食综合生产能力达到226亿斤以上，农业防灾减灾救灾体系能力全面增强。\n\n——改革赋能乡村发展实现新跃升。以深化改革促进乡村“五个振兴”的机制更加健全、支撑常态化帮扶的体系全面构建，区域农合联服务农户占比达到90%以上。"}, {"docId": 2097637768968916993, "chunkIndex": 28, "why": "重庆市“十五五”农业农村现代化规划（2026—2030年）", "quote": "十、着力构建大城市带大农村城乡融合发展体制机制", "text": "：完善以农合联为纽带的为农服务大平台，在400个农合联中提质增效100个，改造建设200个为农服务中心，建成现代农事综合服务中心300个，打造“套餐式”服务包。\n建设农业创业孵化园：首批用3年左右时间，建成西部领先的市级农创园4个左右，引育农创企业60家以上，培育“农创客”100名以上。鼓励有条件的区县积极创建区县级农创园。\n\n推进农业职业学校融合发展：以需求为导向加快新农科建设，支持涉农高校试点实施乡村全科人才培养计划。推进重庆市农业学校、重庆市农机校与重庆农业职业学院融合发展，鼓励职业学校与农业企业等组建产教联合体，推动涉农专业定向培养，确保到2030年达到“双高”水平。加强农业广播电视学校建设发展。\n\n十、着力构建大城市带大农村城乡融合发展体制机制\n\n（一）构建优势互补的市域发展格局。强化中心城区产业引领、科技创新等核心功能，组团式推进城市功能品质提升。加快建设万州重要城市副中心、永川城市副中心和黔江区域中心城市，推动渝东北三峡库区、渝西地区、渝东南武陵山区高质量发展。深化主城都市区与山区库区协同发展机制，迭代民族地区、革命老区支持政策。加快推进以区县城和中心镇为重要载体的新型城镇化建设。"}], "source": {"pairId": "p-11", "policyDocId": 2097637768968916993, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”农业农村现代化规划（2026—2030年）》的通知", "interpretDocId": 2097637772710236162, "interpretTitle": "《重庆市“十五五”农业农村现代化规划（2026—2030年）》解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕16号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "两条底线 七个重点", "answerQuote": "《规划》部署了“两条底线”“七个重点”", "candidateChunks": [1, 0, 31, 2, 17, 4, 13, 28, 19, 8, 7, 5], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-11-2", "category": "pair", "question": "到2030年，重庆农村常住居民人均可支配收入目标是多少？", "answer": "根据规划核心指标，到2030年，重庆农村常住居民人均可支配收入目标为达到3.1万元。", "expectRefusal": false, "gold": [{"docId": 2097637768968916993, "chunkIndex": 4, "why": "重庆市“十五五”农业农村现代化规划（2026—2030年）", "quote": "18\n农村常住居民人均可支配收入\n万元\n2.34\n3.1\n5.8%\n预期性", "text": "\n巴渝和美乡村建成率\n\n%\n\n65\n\n100\n\n〔35〕\n\n预期性\n\n17\n\n新型农业经营主体带动农户比例\n\n%\n\n47\n\n64\n\n〔17〕\n\n预期性\n\n18\n农村常住居民人均可支配收入\n\n万元\n\n2.34\n\n3.1\n\n5.8%\n\n预期性\n\n19\n\n城乡居民人均可支配收入比\n\n—\n\n2.21∶1\n\n2.1∶1\n\n左右\n\n—\n\n预期性\n\n20\n\n农村产权流转交易额\n\n亿元\n\n60\n\n＞60\n\n—\n\n预期性\n\n21\n\n主城都市区与山区库区地区人均GDP比\n\n—\n\n1.65∶1\n\n1.6∶1\n\n〔0.05〕\n\n预期性\n\n22\n\n常住人口城镇化率\n\n%\n\n73.02\n\n75左右\n\n—\n\n预期性\n\n注：规划中除粮食产量、农产品质量安全例行监测总体合格率外，所列指标均为预期性目标，仅作发展方向引导，不构成对相关行业市场准入的总量限制。\n\n（三）发展布局\n\n1﹒优化区域发展布局。中心城区重点发展智慧设施农业、精品果蔬、休闲农业，推动农村基础设施与公共服务同城化。渝西地区做强现代粮油、绿色蔬菜、生态畜禽及农产品精深加工等产业，深化中心镇带村、产村融合发展。渝东新城巩固提升现代粮油、蔬菜、生态畜牧、中药材等产业优势，转型发展精品设施农业、康养休闲和外向型农业，推动园区景区化、农文旅深度融合。渝东北三峡库区提质建设柑橘、脆李、渔业等特色产业基地，打造“大三峡”现代生态高效农业升级版，改造江城江镇江村风貌，筑牢长江生态屏障。渝东南武陵山区深化农文旅融合发展，打造现代生态高效农业走廊、乡村民俗文旅康养带，建设民族特色巴渝和美乡村。"}], "source": {"pairId": "p-11", "policyDocId": 2097637768968916993, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”农业农村现代化规划（2026—2030年）》的通知", "interpretDocId": 2097637772710236162, "interpretTitle": "《重庆市“十五五”农业农村现代化规划（2026—2030年）》解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕16号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "3.1万元", "answerQuote": "农村常住居民人均可支配收入达到3.1万元", "candidateChunks": [4, 2, 28, 1, 3, 7, 17, 16, 20, 30, 6, 23], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-12-1", "category": "pair", "question": "重庆市建设新型能源算力枢纽实施方案主要包含哪些重点工程？", "answer": "方案围绕七大工程提出14方面重点任务，包括：算力汇渝、算力织网、算力促需、算力扩圈、算力强产、算电协同、安全可控。", "expectRefusal": false, "gold": [{"docId": 2097637768314605570, "chunkIndex": 1, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "（一）实施“算力汇渝”工程，打造西部算力核心引擎", "text": "\n2026年6月15日\n\n（此件公开发布）\n\n重庆市建设新型能源算力枢纽实施方案\n\n为提质建设新型能源算力枢纽，结合我市实际，制定本实施方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，优化市内市外算力资源配置，构建重庆数据中心集群与跨域共享协同发展的算力供给体系，充分利用西部地区绿色能源优势，促进算力和新型能源体系全面耦合、双向赋能，推动算力服务普惠易用、智能高效、绿色安全。到2027年，可调度智算规模达到10万P，AI+综合场景数量达到100个，“用算”企业超过1万家，高水平建成基础设施先进集约、算力调度高效智能、产业发展集聚融合、能源利用绿色低碳、跨域协同互惠互利的新型能源算力枢纽。\n\n二、重点任务\n\n（一）实施“算力汇渝”工程，打造西部算力核心引擎\n\n1．构建跨域共享算力体系。深入实施“疆算入渝”工程，完善渝新算力合作机制，支持算力企业以市场化方式参与重庆（新疆）算力基地建设，建设万卡级超大规模智算集群，打造高性能、低成本“词元工厂”。加强跨域算力资源联动，支持西部算力调度平台与国内算力调度平台互联互通，加快形成跨域共享算力供给体系。（责任单位：市大数据发展局、市发展改革委）"}, {"docId": 2097637768314605570, "chunkIndex": 7, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "（七）实施“安全可控”工程，统筹算力发展和安全保障", "text": "深入推进高效节能技术应用，推广“源网荷储”等模式，加强余热回收利用，降低数据中心电能利用效率。（责任单位：市大数据发展局、市能源局、市发展改革委、市经济信息委）\n12．推动算力电力双向赋能。积极建设智能微电网、虚拟电厂等新型电力系统，基于新能源、新型储能系统开展算力负荷与电力系统的协同优化，实现精准、动态、实时的能源调度与交易。加快推动算力与电力双向调节，建立跨节点算电协同调度技术机制，创新算电供需匹配双向管理机制，提升整体资源利用率。（责任单位：市大数据发展局、市经济信息委、市发展改革委）\n\n（七）实施“安全可控”工程，统筹算力发展和安全保障\n\n13．强化算网安全保障能力。探索构建覆盖“云网数端用”的全链路安全防护体系，培育安全技术创新生态。加强重庆数据中心集群算力设施综合安全管理，研究制定安全管理办法、安全管理能力建设指南等制度，构建数字化安全监测能力，搭建综合安全管理系统、算力网安全靶场等服务平台。定期开展重点行业算力设施、网络、数据等安全演练，强化安全管理和技术人员培训。（责任单位：市大数据发展局、市委网信办）\n\n14．提升自主可控水平。建立全栈算力技术体系，加快AI芯片、AI服务器、自主可控通信协议等研发步伐和产业化进程，打造车规级芯片检测适配验证平台，支持视联网技术在全国一体化算力网中融合应用，探索建设集自主可控芯片、通信网络、训练框架于一体的万卡级算力集群，持续提升算力产业链的安全性和稳定性。（责任单位：市大数据发展局、市委网信办、市科技局、市发展改革委、市经济信息委）\n\n三、保障措施"}, {"docId": 2097637768314605570, "chunkIndex": 2, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "（二）实施“算力织网”工程，建设算力传输调度网络", "text": "成本“词元工厂”。加强跨域算力资源联动，支持西部算力调度平台与国内算力调度平台互联互通，加快形成跨域共享算力供给体系。（责任单位：市大数据发展局、市发展改革委）\n2．提质升级重庆数据中心集群。显著提高通用算力资源利用率，加快实现智能算力资源供需平衡，推动超级算力资源便捷易用。完善数据中心多层次发展格局，支持绿电资源丰富、气温适宜的渝东南、渝东北区县因地制宜布局建设绿色算力设施。迭代数字重庆人工智能底座，灵活配置算力资源，形成算力存储“一朵云”，推动人工智能与数字重庆双向赋能。（责任单位：市大数据发展局、市发展改革委、市经济信息委、重庆通信管理局）\n\n（二）实施“算力织网”工程，建设算力传输调度网络\n\n3．建好算力传输网络。布局建设毫秒级城市算力网，构建全市即联即算、毫秒用算、安全可靠的算网融合网络。打造“疆算入渝”数据高速公路，合作共建双路由、双链路算力高速传输骨干网，探索算力传输网络与公路、电网等沿线光纤通信设施协同衔接与融合应用，实现“重庆—新疆”算力节点互联互通。升级重庆与全国一体化算力网络国家枢纽节点间的传输网络，提升算力传输效率。（责任单位：重庆通信管理局、市大数据发展局）"}, {"docId": 2097637768314605570, "chunkIndex": 5, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "（五）实施“算力强产”工程，构筑高水平算力产业集群", "text": "协同、高效调度。依托成渝地区国家级互联网骨干直联点，提升成渝地区联通全国的网络承载能力。（责任单位：市大数据发展局、市发展改革委、市经济信息委、重庆通信管理局）\n8．推动跨境算力协同合作。构建以重庆为枢纽，打通“中亚—新疆—重庆—东南亚”算力传输通道，联动国内算力供给地区、需求地区的“一线两圈多联”跨境算力网。积极探索开展跨境算力合作，优化完善数据跨境流动机制，依托中新（重庆）国际互联网数据专用通道，推动“外数中算”“中数外算”，探索建设国际数据中心等服务设施，开展数据过境中转、离岸数据加工、“词元”跨境流通等服务，提升跨境算力服务能力。（责任单位：市大数据发展局、市委网信办、重庆通信管理局、市商务委）\n\n（五）实施“算力强产”工程，构筑高水平算力产业集群\n\n9．推动算力全产业链发展。大力发展人工智能芯片、高端服务器、高性能存储设备、智能传感器等硬件设备，加快突破存算一体、异构计算等先进架构。围绕重点行业领域典型应用场景，加快培育具有全国影响力的人工智能产品。重点攻坚算力芯片适配、高速互联通信、智能内存管理等使能软件，提升智算集群管理、全域算力调度等平台服务能力。加快引育国际国内专业化算力服务商，以及具有核心竞争力的行业模型与智能体先导企业。（责任单位：市经济信息委、市大数据发展局）"}], "source": {"pairId": "p-12", "policyDocId": 2097637768314605570, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建设新型能源算力枢纽实施方案》的通知", "interpretDocId": 2097637772802510850, "interpretTitle": "《重庆市建设新型能源算力枢纽实施方案》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕26号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "七大工程", "answerQuote": "《实施方案》围绕七大工程，提出14方面重点任务。", "candidateChunks": [1, 0, 7, 2, 5, 3, 8, 4, 6, 9], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-12-2", "category": "pair", "question": "该方案对新建数据中心的绿电占比有什么具体指标要求？", "answer": "方案要求强化绿色能源高效供给，推动数据中心开展绿电直连等交易，确保新建数据中心绿电占比超过80%。", "expectRefusal": false, "gold": [{"docId": 2097637768314605570, "chunkIndex": 6, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "推动数据中心积极开展绿电直连、绿电绿证交易、碳汇互认，确保新建数据中心绿电占比超过80%。", "text": "集群管理、全域算力调度等平台服务能力。加快引育国际国内专业化算力服务商，以及具有核心竞争力的行业模型与智能体先导企业。（责任单位：市经济信息委、市大数据发展局）\n10．推动数算模用一体化发展。统筹推进数据资源、算力供给、算法模型、应用场景协同联动，高水平建设国家数据产业集聚区，推动数据标注产业高质量发展。加快高质量数据集与语料库建设，持续攻关人工智能基础理论和技术，积极发展行业垂类大模型与智能体。支持一人公司（OPC）发展，培育轻量化、高活力创新主体，丰富数算模用一体化应用生态。（责任单位：市大数据发展局、市发展改革委、市经济信息委）\n\n（六）实施“算电协同”工程，推动算力与新能源一体化融合\n\n11．强化绿色能源高效供给。强化“疆算入渝”“疆电入渝”联动，探索“算—电—碳”协同联动机制，加大跨省绿电现货交易对数据中心的保障力度，推动数据中心积极开展绿电直连、绿电绿证交易、碳汇互认，确保新建数据中心绿电占比超过80%。持续开展绿色数据中心建设，加强新建数据中心节能审查，加快推动“老旧小散”数据中心节能改造，深入推进高效节能技术应用，推广“源网荷储”等模式，加强余热回收利用，降低数据中心电能利用效率。（责任单位：市大数据发展局、市能源局、市发展改革委、市经济信息委）"}, {"docId": 2097637768314605570, "chunkIndex": 9, "why": "重庆市建设新型能源算力枢纽实施方案", "quote": "9\n\n新建数据中心绿电占比\n\n%\n\n—\n\n80\n\n80", "text": "家\n\n2000\n\n5000\n\n10000\n\n9\n\n新建数据中心绿电占比\n\n%\n\n—\n\n80\n\n80\n\n10\n\n新建数据中心PUE值\n\n—\n\n1.3\n\n1.25\n1.2\n\n注：标“*”为累计值指标。"}], "source": {"pairId": "p-12", "policyDocId": 2097637768314605570, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建设新型能源算力枢纽实施方案》的通知", "interpretDocId": 2097637772802510850, "interpretTitle": "《重庆市建设新型能源算力枢纽实施方案》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕26号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "绿电占比", "answerQuote": "确保新建数据中心绿电占比超过80%。", "candidateChunks": [6, 9, 8, 1, 2, 5, 7, 4, 3, 0], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-14-1", "category": "pair", "question": "重庆市“十五五”现代服务业发展规划主要包含哪些方面的重点任务？", "answer": "规划重点任务包括：全链条补强薄弱环节，打造数智信息等9大优势生产性服务业；满足居民期待，培育养老托育等6大特色生活性服务业；做靓做精服务业品牌；以及改革创新营造发展良好生态。", "expectRefusal": false, "gold": [{"docId": 2097637769312849921, "chunkIndex": 5, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "二、全链条补强薄弱环节，聚力打造优势生产性服务业", "text": "\n%\n\n—\n\n8\n\n17\n\n＃现代商贸服务业增加值年均增速\n\n%\n\n—\n\n5\n\n18\n\n住宿和餐饮业增加值\n\n亿元\n\n860.8\n1050\n\n19\n\n居民服务、修理和其他服务业增加值\n\n亿元\n\n915.5\n\n1350\n\n20\n\n＃现代社区服务业营业收入年均增速\n\n%\n\n—\n\n10\n\n21\n\n＃养老托育服务业营业收入年均增速\n\n%\n\n—\n\n5\n\n22\n\n文化、体育和娱乐业增加值\n\n亿元\n\n428.2\n\n550\n\n23\n\n＃营业性演出年均场次\n\n万场\n\n—\n\n6\n\n24\n\n＃医疗健康服务业营业收入年均增速\n\n%\n\n—\n\n5\n\n三、质量效益\n\n1\n\n引育品牌首店\n\n家\n\n435\n\n【1500】\n\n2\n\n5A级物流企业\n\n家\n\n12\n\n【18】\n\n3\n\n每万人口高价值发明专利拥有量\n\n件\n\n10.37\n\n18\n\n4\n\n经西部陆海新通道3种主要运输方式货运量\n\n万标箱\n\n32.8\n\n50\n\n备注：1．主要行业领域根据国民经济统计分类确定，同时对应提出9个生产性服务业和6个生活性服务业细分领域的发展目标。\n\n2．本规划所列指标均为预期性引导目标，仅作行业发展和公共资源配置参考，不构成市场准入限制。\n\n3．“＃”表示此指标是根据“9611”现代服务业体系研提的各行业领域下的细分领域指标。\n\n4．“ 【】 ”表示累计值。\n\n二、全链条补强薄弱环节，聚力打造优势生产性服务业\n\n（一）创新发展数智信息服务"}, {"docId": 2097637769312849921, "chunkIndex": 32, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "五、改革创新多措并举，持续营造服务业发展良好生态", "text": "控。针对国企开展战略使命评价和考核评价，把战略使命、经营业绩、主责主业管理、薪酬管理联动贯通，科学全面评价国企经营效率和综合贡献。\n\n（三）全力营造良好发展氛围\n加大宣传推广力度，持续营造品牌引领、企业争先的浓厚氛围。借助中国品牌日活动，依托智博会、西洽会、国才会、“一带一路”科技交流大会、现代服务业高质量发展大会等重大活动平台，为企业搭建展示推介窗口。持续筛选丰富服务品牌典型案例，搭建品牌展示推广平台。深化与主流媒体的战略合作，用好“国家部委+央媒+地方媒体+新媒体”立体宣传矩阵，提升重庆服务业企业的知名度和市场影响力。深化“广告+”融合行动，整合广告创意、场景营造、新媒体传播等资源，创新品牌表达方式，讲好重庆服务业企业品牌故事。\n\n五、改革创新多措并举，持续营造服务业发展良好生态\n\n（一）推进数智赋能服务业发展"}, {"docId": 2097637769312849921, "chunkIndex": 28, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "四、做靓做精服务业品牌，深度挖掘未来发展新潜力", "text": "消费新场景。构建“水陆空”户外运动服务网络，加快推动汽摩、虚拟、山地、水上、冰雪等新兴项目产业化发展，加快建设高质量户外运动目的地。\n\n（六）打造情绪消费新场景\n持续释放青年群体消费活力，发展潮玩IP及衍生服务、沉浸式演艺、手作体验、文创消费等业态。培育发展“宠物经济”，拓展宠物医疗、寄养、洗护、训导、殡葬、摄影等服务，发展宠物友好消费场景。壮大美容、美妆、服饰等悦己消费规模，打造一批复合功能型消费集聚区和网红打卡地。推进经济型连锁酒店向主题化、精品化、沉浸式转型，发展电竞酒店、旅游民宿、智能酒店。鼓励米其林星级、“黑珍珠”等品牌餐饮企业提档升级，打造美食体验店、旗舰店500家以上。发挥“江崖街洞天”“桥隧轨梯廊”特色优势，建设一批“渝悦消费”新场景。\n\n四、做靓做精服务业品牌，深度挖掘未来发展新潜力\n\n（一）大力实施质量品牌提升行动\n\n加快服务业标准化建设。深化国家服务业标准化试点建设，支持企业、行业协会牵头或参与国家标准、行业标准、团体标准制修订，系统构建特色鲜明的“重庆服务”标准体系。积极引进和培育各类标准研究、检验认证、专业培训等标准化专业服务机构，加快标准研制推广。推进家政、照护、餐饮等领域服务标准化，健全新兴服务领域标准体系。从严规范服务流程、从业人员资质管理与服务质量评价机制。深化成渝地区双城经济圈服务业标准化协同联动，推进重点服务领域标准共建、互通、共享。"}, {"docId": 2097637769312849921, "chunkIndex": 20, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "三、更好满足居民美好生活新期待，培育壮大特色生活性服务业", "text": "域环境综合治理托管等新模式，提供“监测—诊断—治理—运维”一站式服务。推进固体废物综合治理，健全“换新+回收”物流体系。\n\n（九）做强做优人力资源和技能实训服务\n深入实施“技能照亮前程”培训行动，开展各类专业化人才和职业技能规模化培训，提升中国（重庆）职业技能公共实训中心和中国（重庆）康养高技能人才培训基地等公共培训平台能级，支持万州区、永川区、黔江区、涪陵区等建设区域性公共实训基地。深化职业教育产教融合，做强西部职教基地，共建一批产教融合技能实训基地。迭代实施“巴渝工匠”行动计划，构建“政校企”协同育人机制。完善全市人力资源产业园服务体系，着力提升人才全生命周期服务能力，建设专业性人力资源（人才）市场。鼓励灵活用工、共享用工等新模式，发展职业中介、人才测评等业态，建好国家人工智能应用中试基地（人力资源服务方向）。\n\n三、更好满足居民美好生活新期待，培育壮大特色生活性服务业\n\n（一）提高养老托育服务水平\n\n提质扩容养老服务网络。建设老年友好型社会，做实“渝悦养老”数字应用，积极发展社区居家养老服务，深化老年食堂可持续运营机制，完善助餐、助浴、助医、助学、助急、助洁和探访关爱等服务。统筹建设乡镇（街道）区域养老服务中心和社区嵌入式机构。鼓励社会力量兴办普惠性、高品质养老机构，提升失能失智老年人集中照护能力。发展壮大“银发经济”，培育老年用品和养老服务消费市场，发展智慧养老院、社区“虚拟养老院”、旅居养老等新模式。"}], "source": {"pairId": "p-14", "policyDocId": 2097637769312849921, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代服务业发展规划（2026—2030年）》的通知", "interpretDocId": 2097637772886396929, "interpretTitle": "《重庆市“十五五”现代服务业发展规划（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕15号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "9611现代服务业体系", "answerQuote": "第二版块至第五版块为重点任务，按照全市服务业大会提出的“9611”现代服务业体系展开。", "candidateChunks": [2, 5, 1, 6, 0, 32, 35, 36, 30, 28, 33, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-14-2", "category": "pair", "question": "到2030年，重庆服务业发展的具体量化目标是什么？", "answer": "到2030年，服务业总量突破2.5万亿元、占GDP比重达到60%，生产性服务业增加值占服务业比重达到60%，服务业吸纳就业人数占总体就业人数比重达到60%。", "expectRefusal": false, "gold": [{"docId": 2097637769312849921, "chunkIndex": 2, "why": "重庆市“十五五”现代服务业发展规划（2026—2030年）", "quote": "服务业增加值年均增长5.5%左右，总量突破2.5万亿元、占GDP比重达到60%，生产性服务业增加值占服务业增加值比重达到60%，服务业吸纳就业人数占总体就业人数比重达到60%", "text": "优质高效的现代服务业新体系，形成一批西部领先、全国进位和具有重庆辨识度的服务业标志性成果，全面打响“重庆服务”品牌，为奋力谱写中国式现代化重庆篇章提供强劲支撑。\n到2030年，全市服务业综合实力和竞争力进一步增强，数智信息等9大优势生产性服务业、养老托育等6大特色生活性服务业发展质效跃升，以软件“满天星”等11张“金名片”为代表的服务业品牌矩阵加快构建，优质高效的“9611”现代服务业体系持续完善，全球设计之都、“五型”国家物流枢纽、西部金融中心、国际消费中心城市、区域科技创新中心等服务能级显著提升。\n\n——规模能级跃上新台阶。服务业增加值年均增长5.5%左右，总量突破2.5万亿元、占GDP比重达到60%，生产性服务业增加值占服务业增加值比重达到60%，服务业吸纳就业人数占总体就业人数比重达到60%，服务业品牌化标准化建设取得重大突破，新增“中国服务业企业500强”5家。\n\n——产业竞争力实现新提升。数智信息、科技创新、现代物流与供应链、现代金融、商务会展、设计检测、文化创意、节能环保、技能实训等生产性服务业规模整体迈上1.5万亿元新台阶，形成现代服务业与先进制造业双向赋能新生态；养老托育、医疗健康、现代社区服务、现代商贸、文旅赛事、情绪消费等生活性服务业规模整体迈上1万亿元新台阶，高品质多样化便利化水平大幅提升。建成100个生产性服务业集聚区，实现“15分钟高品质生活服务圈”城市建成区全覆盖。"}], "source": {"pairId": "p-14", "policyDocId": 2097637769312849921, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”现代服务业发展规划（2026—2030年）》的通知", "interpretDocId": 2097637772886396929, "interpretTitle": "《重庆市“十五五”现代服务业发展规划（2026—2030年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕15号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "2030年量化指标", "answerQuote": "到2030年，服务业总量突破2.5万亿元、占GDP比重达到60%，生产性服务业增加值占服务业比重达到60%", "candidateChunks": [2, 3, 4, 13, 5, 1, 35, 6, 9, 34, 23, 0], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-15-1", "category": "pair", "question": "重庆市加力培育建设国际消费中心城市政策主要包含哪几个板块？", "answer": "分为打造“品质化”消费空间载体、集聚“多元化”优质消费资源、培育“特色化”服务消费品牌、发展“融合化”创新消费业态、构建“国际化”开放消费平台、优化“便利化”舒适消费环境等6大板块共30条政策。", "expectRefusal": false, "gold": [{"docId": 2097637769212186625, "chunkIndex": 1, "why": "重庆市加力培育建设国际消费中心城市若干政策措施", "quote": "一、打造“品质化”消费空间载体", "text": "\n重庆市人民政府办公厅\n\n2026年7月22日\n\n（此件公开发布）\n\n重庆市加力培育建设\n\n国际消费中心城市若干政策措施\n为深入贯彻党中央、国务院关于扩大内需、促进消费的决策部署，全面落实《国务院办公厅转发商务部〈关于支持国际消费中心城市培育建设的若干措施〉的通知》（国办函〔2025〕27号）精神，持续推进国际消费中心城市培育建设，结合重庆实际，制定如下政策措施。\n\n一、打造“品质化”消费空间载体\n\n1．支持提质打造世界知名商圈。支持打造世界知名商圈，鼓励推进消费环境优化、信息化改造等建设，支持发展首发经济、夜间经济，引导推动符合规划的存量商业资源转型盘活和特色商业街区提档升级，依法依规对符合条件的项目给予最高不超过2000万元的资金补助。（牵头单位：市商务委；责任单位：市财政局、市规划自然资源局、市住房城乡建委、重庆市税务局、人行重庆市分行，两江新区区政府、渝中区政府等有关区县政府）\n\n2．支持聚力打造城市品质商圈。支持实施组团式商圈（步行街）转型升级专项行动，升级改造中心城区商圈，提质发展区县品质商圈，支持有条件的商圈争创全国示范步行街、全国示范智慧商圈，培育建设市级高品质商圈和入境消费友好型商圈，依法依规对符合条件的项目给予最高不超过1000万元的资金补助。（牵头单位：市商务委；责任单位：市财政局、市规划自然资源局、市住房城乡建委，两江新区区政府、渝中区政府等有关区县政府）"}, {"docId": 2097637769212186625, "chunkIndex": 6, "why": "重庆市加力培育建设国际消费中心城市若干政策措施", "quote": "三、培育“特色化”服务消费品牌", "text": "投资额的10%，依法依规给予最高不超过100万元奖补。（牵头单位：市商务委、市经济信息委；责任单位：市发展改革委，各区县政府）\n\n三、培育“特色化”服务消费品牌\n13．支持打造“不夜重庆”城市名片。发挥重庆“江崖街洞天”特色优势，做靓“两江四岸”夜间经济特色消费带，持续做强夜间经济，依法依规对符合条件的项目给予最高不超过200万元资金补助。（牵头单位：市商务委；责任单位：市规划自然资源局、市住房城乡建委、市城市管理局、市文化旅游委，各区县政府）\n\n14．支持打造“美食之都”城市名片。立足重庆美食，做优做靓“渝味360碗”美食品牌，支持培育名菜、名宴、名厨、名店、名企、名街、名节。推动餐饮多元化品质化国际化发展，鼓励创建“米其林”“黑珍珠”等品质餐厅。（牵头单位：市商务委、市文化旅游委；责任单位：各区县政府）\n\n15．支持打造“山水旅游”城市名片。支持培育优化特色文化旅游消费场景，打造知名IP（知识产权）跨界联名综合性场景，依法依规对符合条件的项目给予最高不超过1000万元的资金补助。落实巡演项目首演地内容审核负责制，加强巡演项目引进落地。优化改进大型群众性活动安全管理方式。完善演艺赛事预约机制，打击“黄牛”倒票行为。对组织游客入境来渝的旅行社等主体给予奖励，对赴境外开展旅游营销活动、推广旅游产品的经营主体给予补助。（牵头单位：市文化旅游委；责任单位：市商务委、市公安局，各区县政府）"}, {"docId": 2097637769212186625, "chunkIndex": 3, "why": "重庆市加力培育建设国际消费中心城市若干政策措施", "quote": "二、集聚“多元化”优质消费资源", "text": "础设施，合理规划建设产业服务型、商旅生态型、居住生活型国际化社区。（牵头单位：市商务委；责任单位：市住房城乡建委、市民政局、市卫生健康委、市体育局，各区县政府）\n5．支持优化消费载体建设。加大对新产业、新业态用地的支持力度，引导全球引领型、区域地标型、整体持有型新消费项目在商圈、特色街区等重点区域精准布局。系统性推进城市更新，推广实施方案跨部门联合审批模式，压缩审批时间，着力盘活符合规划的闲置商业资源。利用老旧厂房发展养老、医疗等国家支持产业和行业的企业，可享受5年过渡期政策，继续按原用途和土地权利类型使用土地。推广实施不动产双预告“带押过户”政策，支持消费载体资产高效流转。加强政策引导，推动线下消费商业设施设备更新。鼓励依法依规发行地方政府专项债券，支持符合条件的新型消费基础设施项目加快建设。（牵头单位：市规划自然资源局、市住房城乡建委；责任单位：市发展改革委、市民政局、市卫生健康委、市财政局，各区县政府）\n\n二、集聚“多元化”优质消费资源\n\n6．支持集聚全球消费资源。支持培育“首发巴渝”城市名片，聚力打造具有全球影响力的首发经济集聚区、首发平台、新品发布平台，依法依规对符合条件的项目给予最高不超过1000万元的资金补助。对进口的首发消费品实施差异化检验，助力首发产品加快上市。（牵头单位：市商务委；责任单位：重庆海关，有关区政府）\n\n7．支持集聚引进品质首店。支持集聚引进一批国内外知名品牌入渝发展，依法依规对符合条件的首店集聚消费载体给予最高不超过200万元的资金奖补。（牵头单位：市商务委；责任单位：各区县政府）"}, {"docId": 2097637769212186625, "chunkIndex": 7, "why": "重庆市加力培育建设国际消费中心城市若干政策措施", "quote": "四、发展“融合化”创新消费业态", "text": "客入境来渝的旅行社等主体给予奖励，对赴境外开展旅游营销活动、推广旅游产品的经营主体给予补助。（牵头单位：市文化旅游委；责任单位：市商务委、市公安局，各区县政府）\n16．支持打造“户外运动”城市名片。支持指导区县创建国家级促进体育消费和赛事经济试点城市。积极申办国际国内高水平赛事，川渝联动打造品牌体育赛事。支持社会力量承办赛事，打造特色化、品质化体育消费场景。鼓励利用闲置用地建设运营体育场地。（牵头单位：市体育局；责任单位：市规划自然资源局，各区县政府）\n\n四、发展“融合化”创新消费业态\n\n17．支持提升数字赋能消费能级。实施“人工智能+”赋能消费行动，推出一批虚拟导购、智能购物等数字生活应用场景。支持招引培育、提质壮大电商主体，建设直播电商基地，推动电商园区升级发展。鼓励区县开展网货产业带培育和网销爆品打造，依法依规对实施项目的区县给予不超过50万元的资金补助。（牵头单位：市商务委；责任单位：各区县政府）\n\n18．支持拓展融合消费领域。鼓励“银发+旅游”“绿色+智能”“宠物+社交”“研学+智造”等跨界融合，支持打造商文旅体展农融合消费场景，依法依规对符合条件的项目给予最高不超过1000万元资金补助。（牵头单位：市商务委；责任单位：市文化旅游委、市体育局、市农业农村委，各区县政府）"}], "source": {"pairId": "p-15", "policyDocId": 2097637769212186625, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市加力培育建设国际消费中心城市若干政策措施》的通知", "interpretDocId": 2097637772936728577, "interpretTitle": "《重庆市加力培育建设国际消费中心城市若干政策措施》政策解读材料", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕34号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "6大板块共30条", "answerQuote": "《重庆市加力培育建设国际消费中心城市若干政策措施》分为打造“品质化”消费空间载体、集聚“多元化”优质消费资源、培育“特色化”服务消费品牌、发展“融合化”创新消费业态、构建“国际化”开放消费平台、优化“便利化”舒适消费环境等6大板块共30条政策。", "candidateChunks": [1, 6, 3, 7, 5, 0, 8, 9, 2, 4, 10, 12], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-15-2", "category": "pair", "question": "新增离境退税商店有什么奖励？", "answer": "对2025年10月1日—2026年12月31日期间新增的离境退税商店，给予3000元/家的一次性奖励。", "expectRefusal": false, "gold": [{"docId": 2097637769212186625, "chunkIndex": 10, "why": "重庆市加力培育建设国际消费中心城市若干政策措施", "quote": "大力发展离境退税商店，依法依规对符合条件的项目给予3000元/家的资金奖励。", "text": "多语种翻译工具，依法依规对符合条件的项目给予最高不超过300万元的资金补助。（牵头单位：市商务委；责任单位：市公安局、市交通运输委、市文化旅游委，有关区县政府）\n25．支持提升入境消费便利化水平。大力发展离境退税商店，依法依规对符合条件的项目给予3000元/家的资金奖励。支持开展入境支付便利化环境改造，对设置受理外卡POS机、外币兑换点的商家或企业，依法依规分别给予500元/家、2万元/个的资金奖励。（牵头单位：市商务委；责任单位：重庆市税务局、人行重庆市分行、市文化旅游委、市体育局，各区县政府）\n\n26．支持健全涉外服务体系。支持消费场所提供多语种产品及服务清单，依法依规对符合条件的项目给予最高不超过200万元的资金补助。支持围绕外语接待、支付指导、旅游咨询、购物指引等方面组织开展入境消费志愿者服务，依法依规对符合条件的项目给予最高不超过100万元的资金补助。（牵头单位：市商务委；责任单位：市政府外办、团市委、市文化旅游委、市交通运输委，各区县政府）\n\n27．支持拓展城市营销渠道。川渝联动建设富有巴渝特色的国际消费目的地，拓展“成渝消费”宣传营销矩阵。支持建立专业化、国际化、精准化推介矩阵，健全对外宣传和城市形象推广机制，围绕“一带一路”沿线国家和地区、国际友好城市等开展针对性城市营销，不断提升重庆消费的国际影响力。支持依法设置临时户外广告设施，开展线下宣传推广。（牵头单位：市委宣传部；责任单位：市政府外办、市商务委、市文化旅游委、市城市管理局，各区县政府）"}], "source": {"pairId": "p-15", "policyDocId": 2097637769212186625, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市加力培育建设国际消费中心城市若干政策措施》的通知", "interpretDocId": 2097637772936728577, "interpretTitle": "《重庆市加力培育建设国际消费中心城市若干政策措施》政策解读材料", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕34号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "新增离境退税商店", "answerQuote": "一是对2025年10月1日—2026年12月31日期间新增的离境退税商店，给予3000元/家的一次性奖励；", "candidateChunks": [10, 1, 2, 4, 5, 6, 8, 3, 7, 9, 11, 12], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-16-1", "category": "pair", "question": "重庆市推进服务业扩能提质行动方案主要包含哪些方面的内容？", "answer": "该方案共5个部分、24项措施，包括总体要求、重点任务（生产性、生活性服务业及质效提升行动）和保障措施。重点明确到2027年的阶段性目标、责任主体，旨在建成“9611”现代服务业体系。", "expectRefusal": false, "gold": [{"docId": 2097637768465600513, "chunkIndex": 1, "why": "重庆市推进服务业扩能提质行动方案 （2026—2027年）", "quote": "到2027年，全市数智信息等9大优势生产性服务业、养老托育等6大特色生活性服务业发展能级显著提升，渝贸全球等11张服务业“金名片”激活发展新动能，优质高效的“9611”现代服务业体系基本建成", "text": "\n为深入贯彻《国务院关于推进服务业扩能提质的意见》（国发〔2026〕7号），加快推进我市服务业扩能提质，特制定本方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，紧扣做实“两大定位”、发挥“三个作用”，突出需求牵引、改革攻坚、科技赋能、开放合作，坚持数智化、标准化、融合化、国际化发展方向，推进生产性服务业向专业化和价值链高端延伸，促进生活性服务业高品质、多样化、便利化发展，形成一批西部领先、全国进位和具有重庆辨识度的服务业标志性成果，打响“重庆服务”品牌。到2027年，全市数智信息等9大优势生产性服务业、养老托育等6大特色生活性服务业发展能级显著提升，渝贸全球等11张服务业“金名片”激活发展新动能，优质高效的“9611”现代服务业体系基本建成，服务业增加值达到2.2万亿元。\n\n二、推动生产性服务业向专业化和价值链高端延伸"}, {"docId": 2097637768465600513, "chunkIndex": 2, "why": "重庆市推进服务业扩能提质行动方案 （2026—2027年）", "quote": "二、推动生产性服务业向专业化和价值链高端延伸", "text": "1张服务业“金名片”激活发展新动能，优质高效的“9611”现代服务业体系基本建成，服务业增加值达到2.2万亿元。\n\n二、推动生产性服务业向专业化和价值链高端延伸\n（一）以“人工智能+软件”为主攻方向促进信息服务价值提升，建设有全国影响力的数智信息服务集聚地。实施软件“满天星”行动，推动“人工智能+软件”融合发展，推动软件开发智能化转型、软件产品智能化升级和软信企业智能化改造。推动软件与我市优势产业深度耦合，做强工业软件、汽车软件等专业软件。以超常规措施推动基础软件关键核心技术攻关，打造具有重庆辨识度的开源鸿蒙应用创新生态。促进软件信息技术赋能游戏、直播等领域，建设开源社区、创业社区等产业空间，培育一人公司（OPC）等新业态。构建数据要素支撑体系，形成行业可信数据治理与跨主体数据协同能力，加快形成“数据—模型—应用”协同发展体系。强化聚星成势，打造“星辰”集聚区，形成“核心引领、多点支撑、各具特色”的集聚区发展格局。到2027年，全市软信产业主营业务收入突破6500亿元。（责任单位：市经济信息委、市发展改革委、市大数据发展局等）"}, {"docId": 2097637768465600513, "chunkIndex": 6, "why": "重庆市推进服务业扩能提质行动方案 （2026—2027年）", "quote": "三、促进生活性服务业高品质多样化便利化发展", "text": "价值，塑造品牌特色文化。到2027年，全市文化产业增加值占GDP比重达到4.7%。（责任单位：市经济信息委、市委宣传部、市文化旅游委、市市场监管局、市广电局等）\n（八）提高节能环保服务供给专业化水平，建设低碳环保服务业集群。构建绿色低碳技术咨询服务体系，发展环境规划等环保咨询服务，引导和规范监测技术服务机构健康发展，提升生态环境监测等服务质效。发展碳足迹评价、碳金融服务等碳管理服务新业态，拓展用水权、排污权等交易服务范围。培育壮大合同能源管理、工业企业节能诊断服务等绿色服务机构，推广公共机构能源费用托管服务模式。完善再生资源回收利用体系，推进汽车零部件等再制造产业发展。（责任单位：市生态环境局、市发展改革委、市经济信息委、市水利局、市商务委、市市场监管局、人行重庆市分行等）\n\n（九）加强各类专业服务人才和职业技能规模化培训，建设产教融合技能实训基地。拓展猎头、人才测评、职业中介等业务，持续建设“1+10+N”人力资源服务产业园体系。加强全市公共实训基地布局与建设运营，开发高质量技能培训项目。推行“工学一体化”培训模式，完善职业技能竞赛体系，培育“巴渝工匠”和“数智工匠”。推行订单式、定向式、学徒制培训模式。建好国家人工智能应用中试基地（人力资源服务方向），以技术创新提升人力资源服务效能。到2027年，打造具有重庆辨识度的职业技能培训品牌20个。（责任单位：市人力社保局、市发展改革委、市教委、市科技局、市经济信息委等）\n\n三、促进生活性服务业高品质多样化便利化发展"}], "source": {"pairId": "p-16", "policyDocId": 2097637768465600513, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进服务业扩能提质行动方案（2026—2027年）》的通知", "interpretDocId": 2097637772987060225, "interpretTitle": "《重庆市推进服务业扩能提质行动方案 （2026—2027年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕28号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "5个部分 24项措施", "answerQuote": "《行动方案》共5个部分，24项具体措施任务。", "candidateChunks": [1, 0, 2, 13, 6, 7, 12, 11, 5, 14, 3, 8], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-16-2", "category": "pair", "question": "重庆对软件信息服务产业有什么具体的营收目标吗？", "answer": "有。政策提出以“人工智能+软件”为主攻方向，实施软件“满天星”行动。目标是到2027年，全市软信产业主营业务收入突破6500亿元。", "expectRefusal": false, "gold": [{"docId": 2097637768465600513, "chunkIndex": 2, "why": "重庆市推进服务业扩能提质行动方案 （2026—2027年）", "quote": "到2027年，全市软信产业主营业务收入突破6500亿元。", "text": "1张服务业“金名片”激活发展新动能，优质高效的“9611”现代服务业体系基本建成，服务业增加值达到2.2万亿元。\n\n二、推动生产性服务业向专业化和价值链高端延伸\n（一）以“人工智能+软件”为主攻方向促进信息服务价值提升，建设有全国影响力的数智信息服务集聚地。实施软件“满天星”行动，推动“人工智能+软件”融合发展，推动软件开发智能化转型、软件产品智能化升级和软信企业智能化改造。推动软件与我市优势产业深度耦合，做强工业软件、汽车软件等专业软件。以超常规措施推动基础软件关键核心技术攻关，打造具有重庆辨识度的开源鸿蒙应用创新生态。促进软件信息技术赋能游戏、直播等领域，建设开源社区、创业社区等产业空间，培育一人公司（OPC）等新业态。构建数据要素支撑体系，形成行业可信数据治理与跨主体数据协同能力，加快形成“数据—模型—应用”协同发展体系。强化聚星成势，打造“星辰”集聚区，形成“核心引领、多点支撑、各具特色”的集聚区发展格局。到2027年，全市软信产业主营业务收入突破6500亿元。（责任单位：市经济信息委、市发展改革委、市大数据发展局等）"}, {"docId": 2097637768465600513, "chunkIndex": 3, "why": "重庆市推进服务业扩能提质行动方案 （2026—2027年）", "quote": "到2027年，全市软信产业主营业务收入突破6500亿元。", "text": "心引领、多点支撑、各具特色”的集聚区发展格局。到2027年，全市软信产业主营业务收入突破6500亿元。（责任单位：市经济信息委、市发展改革委、市大数据发展局等）\n（二）聚焦产业发展新质新域提升科技创新服务能力，建设区域科技服务中心。聚焦具身智能、量子科技等新质新域，加快提升研究和试验服务发展、科技推广和应用服务业质效。建强“模力高地”人工智能创新孵化生态社区，打造共享科研、智能体研发等科研新模式。争取国家实验室、国家重大科技基础设施、国家技术创新中心等在渝落地。实施高新技术企业和科技型企业“双倍增”行动，引进创业孵化、技术转移等机构，构建全链条、市场化成果转移转化体系。到2027年，全市技术合同成交额突破1300亿元。（责任单位：市科技局、市经济信息委、市市场监管局等）\n\n（三）构建现代物流网络与供应链组织体系，建设国际物流枢纽。发展跨境物流等专业物流和快递服务，创新发展供应链物流等新业态。拓展多式联运“一单制”“一箱制”服务功能，做优“亚欧快线”，公交化开行“千里轻舟”货运班轮。打造“一核三区三基地”航运服务业集聚区，塑造内河航运服务新高地。推动老旧物流仓储设施更新改造，探索闲置设施和铁路货运场站盘活利用方式，推进分布式仓储设施建设。增强农产品产地冷藏保鲜、产后预冷等服务能力，统筹布局公共型、流通型、功能复合型冷库，更新改造老旧冷库。到2027年，全市A级物流企业增至150家。（责任单位：市政府口岸物流办、市发展改革委、市交通运输委、市农业农村委、市商务委、重庆邮政管理局等）"}], "source": {"pairId": "p-16", "policyDocId": 2097637768465600513, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进服务业扩能提质行动方案（2026—2027年）》的通知", "interpretDocId": 2097637772987060225, "interpretTitle": "《重庆市推进服务业扩能提质行动方案 （2026—2027年）》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕28号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "6500亿元", "answerQuote": "到2027年，全市软信产业主营业务收入突破6500亿元。", "candidateChunks": [2, 3, 10, 13, 5, 14, 1, 11, 4, 6, 12, 0], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-17-1", "category": "pair", "question": "2026年全市安全生产和防灾减灾救灾工作要点主要部署了哪些重点任务？", "answer": "延续“深化6大体系、提升6大能力”框架，部署21项重点任务。涵盖统筹调度、事故防控、应急处置、监管执法、群防群治及数字应急六大方面，推动责任更实、防控更早等目标。", "expectRefusal": false, "gold": [{"docId": 2097637763793145858, "chunkIndex": 0, "why": "2026年全市安全生产和防灾减灾救灾工作要点", "quote": "2026年，全市安全生产、防灾减灾救灾工作要全面落实习近平总书记视察重庆重要讲话重要指示精神，以推进治理模式向事前预防转型为主线，以超大城市现代化安全韧性治理为牵引，持续深化应急管理体系和能力建设，坚决打好安全生产和防灾减灾救灾“保卫战”。", "text": "---\r\ntitle: \"重庆市人民政府关于印发《2026年全市安全生产和防灾减灾救灾工作要点》的通知\"\r\nfileNum: \"渝府发〔2026〕1号\"\r\npubDate: 2026-02-11 10:14:12\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202602/t20260211_15427011.html\r\nmetadataId: 15427011\r\nchannelId: 121935\r\nsubcat: 982\r\nbodyShort: false\r\n---\n\n重庆市人民政府\n\n关于印发《2026年全市安全生产和\n\n防灾减灾救灾工作要点》的通知\n\n渝府发〔2026〕1号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n现将《2026年全市安全生产和防灾减灾救灾工作要点》印发给你们，请认真贯彻执行。\n\n重庆市人民政府\n\n2026年2月6日\n\n（此件公开发布）\n\n2026年全市安全生产和防灾减灾救灾工作要点\n\n2026年，全市安全生产、防灾减灾救灾工作要全面落实习近平总书记视察重庆重要讲话重要指示精神，以推进治理模式向事前预防转型为主线，以超大城市现代化安全韧性治理为牵引，持续深化应急管理体系和能力建设，坚决打好安全生产和防灾减灾救灾“保卫战”。"}, {"docId": 2097637763793145858, "chunkIndex": 7, "why": "2026年全市安全生产和防灾减灾救灾工作要点", "quote": "六、聚力提升实战实效能力，优化贯通协同的数字应急体系", "text": "宣传等工作。完善安全生产举报奖励制度，鼓励群众发现报告身边事故隐患。引导社会组织、志愿者队伍、爱心企业参与抢险救灾、科普宣传，加大成功预警避险转移表彰奖励力度。\n六、聚力提升实战实效能力，优化贯通协同的数字应急体系\n\n（十九）突出应用场景实战实效。迭代升级应急指挥智救、自然灾害防减救、安全生产智管等重点场景，与三级数字化城市运行和治理中心、“141”基层智治平台一体化运转。探索建设“渝小安”人工智能体，深化人工智能在风险预警、监管执法、研判决策等领域的应用。加强370兆赫兹窄带集群、卫星通信等应急通信基础设施建设，强化救援队伍和村（社区）保底通信装备建设，提升“断路、断网、断电”条件下应急通信韧性能力。\n\n（二十）强化重点行业领域风险智能感知预警。提升重点行业领域风险监测预警能力，建设智慧交通、智慧工地、智慧燃气等应用场景，完善“行业+气象”风险预警体系，强化监测数据共建共享共用，提升综合分析研判能力。推进形成风险点位清单并动态落图，加密部署视频监控、气体探测、振动传感等监测设备，提升风险早期识别与预警能力。\n\n（二十一）推动科技研发和装备升级。建立重点急需装备设备孵化平台，鼓励科研机构、高等院校、高新企业等开展装备和技术研发。加强工业机器人、智能装备应用，探索无人机、机器狗等装备在深隧、深水、地下空间等特殊救援场景的实战化运用。\n\n附件：核心绩效指标责任及重点任务分工\n\n附件\n\n核心绩效指标责任及重点任务分工\n\n一、核心绩效指标\n\n序号\n\n名    称\n\n2026年目标\n\n责任单位\n\n1\n\n重特大生产安全事故起数\n\n0"}, {"docId": 2097637763793145858, "chunkIndex": 1, "why": "2026年全市安全生产和防灾减灾救灾工作要点", "quote": "一、聚力提升统筹调度能力，筑牢齐抓共管的安全责任体系", "text": "重要指示精神，以推进治理模式向事前预防转型为主线，以超大城市现代化安全韧性治理为牵引，持续深化应急管理体系和能力建设，坚决打好安全生产和防灾减灾救灾“保卫战”。\n一、聚力提升统筹调度能力，筑牢齐抓共管的安全责任体系\n\n（一）强化党政领导干部履职能力。坚持“党政同责、一岗双责、齐抓共管、失职追责”，将安全生产工作纳入党委议事日程和政府重点工作，纳入党委（党组）会议重要情况通报内容。严格落实党政领导安全生产履责述职制度，将履职情况作为年度考核、选拔任用、职级晋升的参考。制定党政领导干部安全生产、防灾减灾救灾工作职责清单和年度重点任务清单，加强重要时段履职调度。将安全生产、防灾减灾救灾纳入党政领导干部必修课程。\n\n（二）提升行业领域监管能力。坚持“三管三必须”，加强本行业领域、本系统安全生产工作体制机制建设，细化和动态调整内设机构责任分工。动态厘清新兴行业领域安全监管职责。“一件事”全链条细化行业部门在安全生产、防汛抗旱、防震减灾、地灾防治、森林草原防灭火等方面的安全管理责任，明确防范应对极端天气事件重点任务及分工。"}, {"docId": 2097637763793145858, "chunkIndex": 6, "why": "2026年全市安全生产和防灾减灾救灾工作要点", "quote": "五、聚力提升群防群治能力，夯实共建共享的社会共治体系", "text": "查计划，确定重点执法检查企业名单，推进分级分类差异化监管。规范行使行政处罚裁量权，推行非现场监管执法，发布涉企执法“示范优秀案例”。开展“专家进万企”指导服务。\n（十五）加强生产安全事故调查和灾害调查评估。严格开展生产安全事故调查处理，建立健全事故查处监督指导机制。规范灾害事故统计报送工作，建立信息共享比对核查机制。完善自然灾害调查评估流程、内容与标准，开展典型灾害案例复盘。\n\n五、聚力提升群防群治能力，夯实共建共享的社会共治体系\n\n（十六）提升全民安全素养。开展安全生产月、消防宣传月、交通安全日、防灾减灾日等主题活动，打造“全民安全开放日”“新重庆里看应急”等宣传品牌，在主流媒体设立专题栏目。深化安全宣传“进企业、进农村、进社区、进学校、进家庭”工作，鼓励有条件的区县盘活闲置资源，新建改造科普体验场所。将安全教育融入全学段教育，保障中小学、幼儿园安全教育课时。\n\n（十七）发挥市场机制作用。制定安全生产责任保险事故预防评估办法和技术服务规范，发挥保险机构参与事故预防功能。扩大巨灾保险覆盖面，引导保险机构将部分保费投入灾前预防。鼓励团购网站、外卖平台将“九小场所”隐患排查整治情况纳入用户评分评价。规范安全评价、检验检测机构执业行为。\n\n（十八）健全社会协同机制。依托基层治理体系，推动村（社区）、网格做好隐患排查、信息传递、先期处置和安全宣传等工作。完善安全生产举报奖励制度，鼓励群众发现报告身边事故隐患。引导社会组织、志愿者队伍、爱心企业参与抢险救灾、科普宣传，加大成功预警避险转移表彰奖励力度。"}], "source": {"pairId": "p-17", "policyDocId": 2097637763793145858, "policyTitle": "重庆市人民政府关于印发《2026年全市安全生产和防灾减灾救灾工作要点》的通知", "interpretDocId": 2097637773033197569, "interpretTitle": "关于《2026年全市安全生产和防灾减灾救灾工作要点》的解读", "interpretSection": "部门解读", "docNumber": "渝府发〔2026〕1号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "21项重点任务", "answerQuote": "《工作要点》延续“深化6大体系、提升6大能力”总体框架，部署21项重点任务", "candidateChunks": [0, 7, 1, 6, 3, 5, 4, 14, 15, 2, 19, 8], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-18-1", "category": "pair", "question": "重庆市《进一步推动经济稳中向好若干政策举措》主要包含哪些方面的支持措施？", "answer": "该政策形成6个方面共37项举措，聚焦扩需求、强产业、强创新、优环境、促开放、惠民生，旨在提振市场信心，助力下半年经济向新向优向好发展。", "expectRefusal": false, "gold": [{"docId": 2097637770462089218, "chunkIndex": 1, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "突出抓好扩大有效需求，建立各级领导每周调度重大项目机制，推进“六张网”规划建设、城市更新、“好房子”建设，激发民间投资活力，用好专项债券项目“自审自发”试点政策，用好以旧换新、公积金惠民等政策工具，深化商文旅体展农融合消费。", "text": "\n《重庆市进一步推动经济稳中向好若干政策举措》已经市政府同意，现印发给你们，并提出如下工作要求，请认真贯彻执行。\n一、聚焦关键领域，攻坚当前重点任务。突出抓好扩大有效需求，建立各级领导每周调度重大项目机制，推进“六张网”规划建设、城市更新、“好房子”建设，激发民间投资活力，用好专项债券项目“自审自发”试点政策，用好以旧换新、公积金惠民等政策工具，深化商文旅体展农融合消费。突出抓好现代产业升级，推动主导产业稳产增效，挖掘传统产业增长空间，“一业一策”抓实“9611”现代服务业产业培育。突出抓好以科技创新引领全面创新，以“203060”重点攻坚突破体系，牵引支撑“416”科技创新布局迭代优化，完善市域科创走廊体系。突出抓好市场环境营造，提升稳企惠企服务质效，降低重点领域成本，加大产业链招商力度。突出抓好内陆开放综合枢纽建设，扩大高价值产品出口，提升综保区等开放平台能级。突出抓好保障和改善民生，重点做好高校毕业生、农民工等群体稳就业工作。\n\n二、强化市区协同，构建上下联动格局。市级各责任部门要切实履行行业主管责任，加强政策统筹协调和业务指导，主动靠前服务，按照“高效办成一件事”要求打通政策落实梗阻，及时协调解决堵点难点问题。各区县要落实属地责任，结合本地产业基础和发展实际，创造性抓好政策落地。强化政策执行，健全督办机制、服务企业机制，全环节提升政策执行效能。加强经济运行分析和政策效果跟踪，加强存量政策效能评估，动态完善增量政策储备库，适时进行优化迭代。"}, {"docId": 2097637770462089218, "chunkIndex": 1, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "突出抓好现代产业升级，推动主导产业稳产增效，挖掘传统产业增长空间，“一业一策”抓实“9611”现代服务业产业培育。", "text": "\n《重庆市进一步推动经济稳中向好若干政策举措》已经市政府同意，现印发给你们，并提出如下工作要求，请认真贯彻执行。\n一、聚焦关键领域，攻坚当前重点任务。突出抓好扩大有效需求，建立各级领导每周调度重大项目机制，推进“六张网”规划建设、城市更新、“好房子”建设，激发民间投资活力，用好专项债券项目“自审自发”试点政策，用好以旧换新、公积金惠民等政策工具，深化商文旅体展农融合消费。突出抓好现代产业升级，推动主导产业稳产增效，挖掘传统产业增长空间，“一业一策”抓实“9611”现代服务业产业培育。突出抓好以科技创新引领全面创新，以“203060”重点攻坚突破体系，牵引支撑“416”科技创新布局迭代优化，完善市域科创走廊体系。突出抓好市场环境营造，提升稳企惠企服务质效，降低重点领域成本，加大产业链招商力度。突出抓好内陆开放综合枢纽建设，扩大高价值产品出口，提升综保区等开放平台能级。突出抓好保障和改善民生，重点做好高校毕业生、农民工等群体稳就业工作。\n\n二、强化市区协同，构建上下联动格局。市级各责任部门要切实履行行业主管责任，加强政策统筹协调和业务指导，主动靠前服务，按照“高效办成一件事”要求打通政策落实梗阻，及时协调解决堵点难点问题。各区县要落实属地责任，结合本地产业基础和发展实际，创造性抓好政策落地。强化政策执行，健全督办机制、服务企业机制，全环节提升政策执行效能。加强经济运行分析和政策效果跟踪，加强存量政策效能评估，动态完善增量政策储备库，适时进行优化迭代。"}, {"docId": 2097637770462089218, "chunkIndex": 1, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "突出抓好以科技创新引领全面创新，以“203060”重点攻坚突破体系，牵引支撑“416”科技创新布局迭代优化，完善市域科创走廊体系。", "text": "\n《重庆市进一步推动经济稳中向好若干政策举措》已经市政府同意，现印发给你们，并提出如下工作要求，请认真贯彻执行。\n一、聚焦关键领域，攻坚当前重点任务。突出抓好扩大有效需求，建立各级领导每周调度重大项目机制，推进“六张网”规划建设、城市更新、“好房子”建设，激发民间投资活力，用好专项债券项目“自审自发”试点政策，用好以旧换新、公积金惠民等政策工具，深化商文旅体展农融合消费。突出抓好现代产业升级，推动主导产业稳产增效，挖掘传统产业增长空间，“一业一策”抓实“9611”现代服务业产业培育。突出抓好以科技创新引领全面创新，以“203060”重点攻坚突破体系，牵引支撑“416”科技创新布局迭代优化，完善市域科创走廊体系。突出抓好市场环境营造，提升稳企惠企服务质效，降低重点领域成本，加大产业链招商力度。突出抓好内陆开放综合枢纽建设，扩大高价值产品出口，提升综保区等开放平台能级。突出抓好保障和改善民生，重点做好高校毕业生、农民工等群体稳就业工作。\n\n二、强化市区协同，构建上下联动格局。市级各责任部门要切实履行行业主管责任，加强政策统筹协调和业务指导，主动靠前服务，按照“高效办成一件事”要求打通政策落实梗阻，及时协调解决堵点难点问题。各区县要落实属地责任，结合本地产业基础和发展实际，创造性抓好政策落地。强化政策执行，健全督办机制、服务企业机制，全环节提升政策执行效能。加强经济运行 改装文化节、房车体验季等主题活动的，给予最高20万元/场活动补助。（责任单位：市商务委、市公安局、市规划自然资源局、市交通运输委、市文化旅游委、市体育局、市财政局）\n\n7﹒进一步加大公积金惠民力度。支持提高公积金贷款额度，2026年9月至2027年8月期间，住房公积金个人最高贷款额度从80万元提高到100万元，参贷后家庭最高贷款额度从120万元提高到200万元；多子女家庭个人最高贷款额度从100万元提高到120万元，参贷后家庭最高贷款额度从160万元提高到240万元。提升公积金提取频次，缴存人及其配偶在本市行政区域内使用商业性个人住房贷款购买自住住房，符合我市住房公积金提取条件的，提取频次限制由一年提取一次放宽为一个月提取一次。对可通过数据协查核实还款金额的，提取金额为上月已实际偿还的贷款本息额。（责任单位：市住房城乡建委、市财政局）"}, {"docId": 2097637770462089218, "chunkIndex": 9, "why": "重庆市进一步推动经济稳中向好若干政策举措", "quote": "的，提取频次限制由一年提取一次放宽为一个月提取一次。", "text": "的，提取频次限制由一年提取一次放宽为一个月提取一次。对可通过数据协查核实还款金额的，提取金额为上月已实际偿还的贷款本息额。（责任单位：市住房城乡建委、市财政局）\n8﹒接续实施有奖发票活动。2026年9—12月期间，在零售、餐饮、住宿等行业（涵盖吃、住、游、购、娱等消费场景）接续开展有奖发票活动，个人消费者消费后取得票面金额不低于100元的有效数电发票，可参与即时和集中抽奖，最高奖励1万元。（责任单位：市商务委、市财政局、重庆市税务局）\n\n二、加快现代化产业体系建设\n\n9﹒支持汽车产业新能源化智能化转型。对汽车企业承担国家科研项目给予一定配套支持。对整车企业量产上市的新能源全新车型，给予最高8000万元研发补助。推动自动驾驶汽车应用场景发展，对整车企业自主开发或与智驾企业组建联合体开发的智能驾驶系统平台，给予最高1000万元补助。对整车企业获得出口目标国家（地区）认证的产品认证检测费用，给予最高2000万元补助。对汽车专项融资租赁产品、优化新能源商用车商业车险产品给予一定支持。（责任单位：市经济信息委、市商务委、市财政局）"}], "source": {"pairId": "p-18", "policyDocId": 2097637770462089218, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市进一步推动经济稳中向好若干政策举措》的通知", "interpretDocId": 2097637773083529218, "interpretTitle": "《重庆市进一步推动经济稳中向好若干政策举措》政策解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕43号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "提取频次放宽至每月一次", "answerQuote": "将符合条件的偿还商业性个人住房贷款的住房公积金提取频次，由一年一次放宽至每月一次", "candidateChunks": [8, 9, 4, 23, 2, 6, 5, 18, 17, 19, 3, 0], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-19-1", "category": "pair", "question": "重庆市“十五五”文化旅游发展规划主要部署了哪些重点任务？", "answer": "规划从12个方面系统部署任务，包括提升巴蜀文化旅游走廊能级、推动文艺攀峰、促进文脉传承、健全公共文化服务、构筑广电体系、构建现代文旅产业、培塑旗舰产品、促进消费升级、做靓国际品牌、增强主体竞争力、数智赋能及强化综合治理。", "expectRefusal": false, "gold": [{"docId": 2097637770155905026, "chunkIndex": 1, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市", "text": "\n重庆市人民政府办公厅\n\n2026年8月5日\n\n（本文有删减）\n\n重庆市“十五五”文化旅游发展规划\n\n（2026—2030年）\n为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五”规划》（文旅资源发〔2026〕42号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，全面落实习近平总书记视察重庆重要讲话重要指示精神，紧扣做实“两大定位”、发挥“三个作用”，坚持以文塑旅、以旅彰文，突出创新引领、数智赋能、改革突破、开放协同，持续做靓“雄奇山水 新韵重庆”品牌，加快打造巴蜀文化旅游走廊标志性成果，提质建设具有国际范、中国韵、重庆味的文化旅游强市，为奋力谱写中国式现代化重庆篇章注入强劲文旅动能。到2030年，文化旅游强市建设取得显著进展，文化旅游惠民生、扩内需、增动能综合效能全面释放，赋能经济社会高质量发展铸就新篇章。\n\n——巴蜀文化旅游走廊建设实现新提升。平台联通、标准互认、品牌同塑、项目共建等协同联动机制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。"}, {"docId": 2097637770155905026, "chunkIndex": 12, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "七、构建现代文旅产业体系", "text": "行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业\n推动创意设计、数字内容产业向全链条渗透、向高价值链攀升、向体验式升级。创意设计产业重点应用AI（人工智能）生成式设计，发展“文创+工业设计”“文创+在地文化”等融合模式，培育文博IP联名开发、非遗跨界设计等新业态，打造“创意重庆”品牌，建设西部创意产业集聚区。数字内容产业重点培育AI内容生产、虚拟拍摄、云端制作等新业态，推动微短剧、短视频、网络直播等细分领域繁荣发展，搭建内容孵化、开发制作一体化服务平台。\n\n（二）壮大特色品牌产业"}, {"docId": 2097637770155905026, "chunkIndex": 3, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "二、提升巴蜀文化旅游走廊牵引带动能级", "text": "\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局\n强化“世界山水都市旅游核”引领，丰富商务差旅、会展团建、赛事主题、文化交流等特色产品，开发“滨水+”体育、艺术、科技、美食等多元业态，迭代升级“江崖街洞天”“桥隧轨梯廊”等特色文旅场景，优化交通接驳和轻旅居配套服务，打造都市商文旅体展综合圈、滨江休闲带、休闲旅居线。提升“三大高品质文旅景观带”主轴支撑力，活化利用渝西片区历史古镇、非物质文化遗产（以下简称非遗）街区、文化遗址，升级打造渝东北三峡游轮、峡谷风光等经典产品，挖掘放大渝东南“山水林泉洞”“武陵民族风”资源优势，提质千年成渝古道、壮美长江三峡、多彩风情武陵文旅景观带。加快“九大精品旅游线路”全域贯通，谋划打造一批特色旅游支线，加快建设节点串联、业态互补、场景共建的立体旅游网络。\n\n（二）扩面提质建设川渝文旅统一大市场\n\n完善川渝协同共建机制，做强“宽洪大量”“点石成金”“资足常乐”等特色文旅IP（知识产权），优化“渝进蓉出、蓉进渝出”客流共享模式，做实巴蜀文化旅游走廊产业联盟，创新实施“畅游巴蜀”“旅游一卡通”等文旅惠民措施。深化“惠游重庆”“智游天府”平台互联互通，推动两地景区、文博场馆实现“一键预约、一网通办、一码通用”，提升跨区域文旅公共服务便捷度、智慧化水平。健全川渝文旅市场联合执法、案件协查协办、线索移送共享、监管信息互通机制，强化跨区域市场秩序协同整治，打造公平公正、开放有序、诚信守法的川渝文旅市场环境。"}, {"docId": 2097637770155905026, "chunkIndex": 11, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年）", "quote": "（三）强化科技产业引领和行业治理", "text": "绕共建“一带一路”等主题，创新推出电视剧、纪录片、动画片等国际传播内容，实施“长江遇见”系列合拍项目，推动优质视听内容“出海”。\n\n（二）提升内容生产和服务能力\n完善广电视听精品创作生产组织工作机制，开展“登高攀峰”行动，实施“剧美中国·新韵重庆”电视剧繁荣等创作计划，聚焦建军100周年等重要节点，打造一批精品影视剧。加强政策扶持引导，培育更具活力的内容创作生态。深化广电公共服务，迭代完善应急广播体系，推进“智慧广电+公共服务”建设，实施广电视听服务和体验“双提升”工程，推动高清超高清电视公共服务全民共享，构建贯通区县、乡镇（街道）、村（社区）三级的基层广电服务网络。\n\n（三）强化科技产业引领和行业治理\n\n加快数智广电和新型广电网络建设，推动基础设施网络优化升级。完善广电视听产业统筹引导机制，构建市、区县两级政策联动体系，推动广电视听产业补链、强链、延链。强化广播电视安全播出，加强关键信息基础设施保护，推进老旧设备更新换代，防范网络攻击等新型安全风险。加强广电行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业"}], "source": {"pairId": "p-19", "policyDocId": 2097637770155905026, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市“十五五”文化旅游发展规划（2026—2030年）》的通知", "interpretDocId": 2097637773297438722, "interpretTitle": "《重庆市“十五五”文化旅游发展规划（2026—2030年）》解读", "interpretSection": "部门解读", "docNumber": "渝府办发〔2026〕41号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "12个方面", "answerQuote": "《规划》聚焦提质建设具有国际范、中国韵、重庆味的文化旅游强市，从12个方面系统部署任务。", "candidateChunks": [1, 2, 12, 0, 3, 11, 25, 13, 22, 10, 23, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-20-2", "category": "pair", "question": "重庆空中丝绸之路建设到2030年的具体量化目标是什么？", "answer": "到2030年，重庆在飞国际（地区）航线达70条以上，年国际（地区）旅客吞吐量达到500万人次，货邮吞吐量达到30万吨，空中丝绸之路建设取得实质性进展。", "expectRefusal": false, "gold": [{"docId": 2097637762685849602, "chunkIndex": 1, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。", "text": "\n（此件公开发布）\n\n重庆市推进空中丝绸之路建设实施方案\n\n为奋力打造内陆开放综合枢纽，加快推进重庆空中丝绸之路建设，制定本实施方案。\n\n一、总体目标\n深入对接六大国际经济合作走廊，以新亚欧大陆桥经济走廊、中国—中南半岛经济走廊为重点，推进我市与阿姆斯特丹、法兰克福、布达佩斯、新加坡、吉隆坡、曼谷、河内等重点城市共建空中丝绸之路，完善对外开放空中通道，提升口岸通关效能，壮大航空优势特色产业，深化多领域国际交往合作，为深度融入共建“一带一路”高质量发展、加快打造内陆开放综合枢纽提供重要支撑。\n\n到2027年，重庆空中丝绸之路建设取得阶段性成果，重点领域合作实现突破，国际航空枢纽功能显著提升，在飞国际（地区）航线达到60条，年国际（地区）旅客、货邮吞吐量分别达到330万人次、22万吨。到2030年，重庆空中丝绸之路建设取得明显成效，构建起畅通国内、通达全球主要城市的航线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素"}, {"docId": 2097637762685849602, "chunkIndex": 2, "why": "重庆市推进空中丝绸之路建设实施方案", "quote": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。", "text": "线网络，建成现代化国际航空枢纽，在飞国际（地区）航线达到70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨。\n\n二、进一步完善基础资源要素\n（一）完善机场基础设施。有序推进重庆江北国际机场（以下简称江北机场）西区提质改造，持续推进数字孪生机场建设，加强航空口岸指定监管场地硬件设施建设，实现前置拦截、查验作业、检疫处理、冷链暂存等环节标准化、信息化、智能化升级。推进重庆新机场项目前期工作。推动与空中丝绸之路共建城市的机场集团开展战略合作，促进规划建设、口岸环境、安全服务、运营管理等领域交流。探索与海外机场互设海外航空货站。（责任单位：重庆机场集团、市发展改革委、市交通运输委、市政府口岸物流办、重庆海关）\n\n（二）优化资源要素供给。深化空域资源动态利用，以数字化、智能化手段提升运行效率，强化多主体协同，实现“空域—地面—机场”联动。利用大数据、人工智能技术优化机场运行管理，实现对航班调度、资源分配的智能决策。积极推动江北机场增量时刻投入使用，适时启动新一轮时刻容量评估。围绕重点国际客货运中转通道，积极争取扩大“第五航权”覆盖范围。深化与航空枢纽运营人合作，创新战略协同机制，引导航空枢纽运营人加大运力投入，拓展空中丝绸之路航线网络，强化机务、维修等后勤保障。（责任单位：市交通运输委、市政府口岸物流办、重庆机场集团）\n\n三、进一步提升互联互通水平"}], "source": {"pairId": "p-20", "policyDocId": 2097637762685849602, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进空中丝绸之路建设实施方案》的通知", "interpretDocId": 2097637774832553985, "interpretTitle": "《重庆市推进空中丝绸之路建设实施方案》政策例行吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2025〕64号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "2030年...70条以上", "answerQuote": "《实施方案》提出到2030年，重庆在飞国际（地区）航线达70条以上，年国际（地区）旅客、货邮吞吐量分别达到500万人次、30万吨", "candidateChunks": [1, 2, 0, 4, 3, 10, 9, 7, 5, 8, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-21-1", "category": "pair", "question": "重庆市十五五规划纲要里，民生福祉方面主要有哪些具体指标？", "answer": "设置居民收入增长、养老机构护理型床位占比、3岁以下婴幼儿入托率、人均预期寿命等7项民生福祉类指标，占比近30%，是历届五年规划中数量最多的一次。", "expectRefusal": false, "gold": [{"docId": 2097637764095135745, "chunkIndex": 26, "why": "重庆市国民经济和社会发展第十五个五年规划纲要", "quote": "居民人均可支配收入增长（%）", "text": "\n39左右\n\n预期性\n\n三、民生福祉\n\n10\n\n城镇调查失业率（%）\n\n5.3\n\n不超过国家控制标准\n\n预期性\n\n11\n\n居民人均可支配收入增长（%）\n4.7\n\n与地区生产总值增长同步\n\n预期性\n\n12\n\n劳动年龄人口平均受教育年限（年）\n\n预计11.66\n\n12.1\n\n约束性\n\n13\n\n每千人口拥有执业（助理）医师数（人）\n\n预计3.51\n\n3.7\n\n预期性\n\n14\n\n养老机构护理型床位占比（%）\n\n71.4\n\n80\n\n预期性\n\n15\n\n3岁以下婴幼儿入托率提高（百分点）\n\n—\n\n6\n\n预期性\n\n16\n\n人均预期寿命（岁）\n\n—\n\n80.5\n\n预期性\n\n17\n\n城乡居民人均可支配收入比\n\n2.21∶1\n\n2.1∶1左右 场景建设，对新建投资项目立项备案前开展新场景应用评估，支持使用市级重大项目前期研究工作经费推动场景创新工作。通过场景培育和开放与各类改革试点检验验证等方式，支持提升制度设计水平，推动完善与新场景新技术新产品相配套的政策机制、标准体系、法规规章。（责任单位：市发展改革委、市财政局、市科技局、市经济信息委、市人力社保局、市委金融办、市司法局、市市场监管局、市国资委、市委改革办等）"}, {"docId": 2097637767454773249, "chunkIndex": 13, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "为新技术、新产品、新领域在真实场景中的测试、验证、应用提供“沙盒监管”等包容性环境", "text": "等存量政策支持场景建设。（责任单位：市发展改革委、市市场监管局、市科技局、市委金融办、市规划自然资源局、市大数据发展局、市人力社保局、市国资委、市生态环境局等）\n（八）完善场景资源配置规则。健全公平竞争制度，促进各类主体公平高效参与场景资源配置和开发利用。进一步发挥信用制度作用，鼓励各类主体在场景建设中应用信用数据与产品，提高场景资源配置效率，降低制度性交易成本。探索场景使用权、收益权等权益分配机制创新，强化场景创新和知识产权保护。推动管理规则、监管体系等方面的创新供给，在严守安全底线的前提下，为新技术、新产品、新领域在真实场景中的测试、验证、应用提供“沙盒监管”等包容性环境。加强劳动者数字技能培养和技术适应性培训，积极引导劳动者深度融入新模式新业态新场景。（责任单位：市市场监管局、市发展改革委、市知识产权局、市人力社保局等）\n\n四、组织实施\n\n建立市领导牵头的跨部门场景工作协调机制，统筹解决场景培育和开放中的重大问题。各区县要强化协同配合，加大场景培育和开放力度，因地制宜制定场景创新支持政策，结合实际抓好贯彻落实。市级有关部门要围绕重点行业领域，不断完善相关标准体系，探索尽职免责管理模式，营造应用场景建设的“软环境”。事业单位和国有企业要强化工作引领，主动开放自身资源和能力。市发展改革委要加强指导和协调，统筹推进场景培育和开放，深化场景建设管理制度创新，构建综合性重大场景“需求监测—技术响应—复盘评估—迭代优化”闭环管理机制，及时总结经验，做好宣传推广，营造良好氛围。重大事项及时请示报告。"}, {"docId": 2097637767454773249, "chunkIndex": 1, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "每年打造20个具有重庆辨识度的综合性重大场景", "text": "\n重庆市人民政府办公厅\n\n2026年5月9日\n\n（本文有删减）\n\n重庆市加快场景培育和\n\n开放推动新场景大规模应用行动方案\n为贯彻落实国务院办公厅《关于加快场景培育和开放推动新场景大规模应用的实施意见》（国办发〔2025〕37号），扩大场景有效供给，促进场景资源开放和公平高效配置，加快培育发展新质生产力，结合我市实际，制定本行动方案。\n\n一、总体要求\n\n立足重庆“山城”“江城”“智慧名城”特色优势，坚持创新引领、改革推动、因地制宜、安全有序、系统推进、融合发展，健全场景培育和开放的制度机制和政策体系，全面优化政府引导、多方参与、高效协同的场景创新生态，持续提升场景供给能力和驱动作用，每年打造20个具有重庆辨识度的综合性重大场景，举办场景供需对接活动200场以上，开放有效场景机会2000项以上，推动形成场景应用催生高水平创新、场景需求驱动高质量供给的良性循环，基本建成“开放包容、活力迸发、特色鲜明、治理增效”的场景创新活力之城，推动“场景重庆”成为全国场景创新的响亮品牌。\n\n二、重点领域\n\n（一）新领域新赛道应用场景\n\n1﹒数字经济领域。迭代实施“满天星”行动计划，加快推动软件和信息服务业应用场景培育开放。丰富数据产品和服务，探索元宇宙、虚拟现实、智能算力在办公、社交、消费、娱乐等领域的场景应用，推动实体经济和数字经济深度融合。（责任单位：市发展改革委、市经济信息委、市大数据发展局）"}, {"docId": 2097637767454773249, "chunkIndex": 12, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "探索建立引导空天、频谱轨道等新型要素向新质生产力顺畅流动的机制", "text": "机制、标准体系、法规规章。（责任单位：市发展改革委、市财政局、市科技局、市经济信息委、市人力社保局、市委金融办、市司法局、市市场监管局、市国资委、市委改革办等）\n（七）加大要素保障力度。做好要素市场化配置综合改革试点工作，充分发挥技术、土地、数据、人才、资源环境等要素保障作用，探索建立引导空天、频谱轨道等新型要素向新质生产力顺畅流动的机制，以要素整体性协同化配置赋能综合性场景建设。加大金融要素支持力度，建立“多方参与、风险共担”责任机制，支持金融机构开发“场景贷”“场景保险”等金融产品。鼓励引导国有投资基金、社会投资基金等支持场景创新，完善场景基金考核、容错免责机制。围绕技术研发、中试验证、建设落地等环节，用好融资、贴息、保险补贴、超长期特别国债、地方政府专项债券等存量政策支持场景建设。（责任单位：市发展改革委、市市场监管局、市科技局、市委金融办、市规划自然资源局、市大数据发展局、市人力社保局、市国资委、市生态环境局等）"}], "source": {"pairId": "p-22", "policyDocId": 2097637767454773249, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市加快场景培育和开放推动新场景大规模应用行动方案》的通知", "interpretDocId": 2097637775092600834, "interpretTitle": "《重庆市加快场景培育和开放推动新场景大规模应用行动方案》例行政策吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2026〕24号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "5个方面21个领域", "answerQuote": "系统谋划了5个方面21个重点领域的场景...明确在政府投资项目中预留不低于5%的预算用于新场景建设", "candidateChunks": [11, 13, 1, 0, 9, 8, 14, 12, 3, 5, 4, 6], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-22-2", "category": "pair", "question": "重庆场景政策对政府投资项目的资金比例有什么具体要求？", "answer": "政策明确规定，在政府投资项目中必须预留不低于5%的预算专门用于新场景建设，以解决市场主体“不愿投、不敢试”的问题，引导资本敢投、企业敢闯。", "expectRefusal": false, "gold": [{"docId": 2097637767454773249, "chunkIndex": 11, "why": "重庆市加快场景培育和开放推动新场景大规模应用行动方案", "quote": "在政府投资项目中预留不低于5%的预算用于新场景建设", "text": "研金用”协同生态。支持市场化机构开展场景供需对接服务，提升场景服务专业化能力。（责任单位：市发展改革委、市科技局、市经济信息委、市委金融办、市国资委，有关区县）\n（六）强化政策协同配合。推动各类政策协同配合，将支持场景培育和开放与制定产业、科技、人才、资金等各类政策体系以及编制各类规划相结合。发挥政府采购作用，鼓励场景搭建单位依法依规采用单一来源采购、订购首购等方式，支持首台（套）装备、首批次材料、首版次软件推广应用。在政府投资项目中预留不低于5%的预算用于新场景建设，对新建投资项目立项备案前开展新场景应用评估，支持使用市级重大项目前期研究工作经费推动场景创新工作。通过场景培育和开放与各类改革试点检验验证等方式，支持提升制度设计水平，推动完善与新场景新技术新产品相配套的政策机制、标准体系、法规规章。（责任单位：市发展改革委、市财政局、市科技局、市经济信息委、市人力社保局、市委金融办、市司法局、市市场监管局、市国资委、市委改革办等）"}], "source": {"pairId": "p-22", "policyDocId": 2097637767454773249, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市加快场景培育和开放推动新场景大规模应用行动方案》的通知", "interpretDocId": 2097637775092600834, "interpretTitle": "《重庆市加快场景培育和开放推动新场景大规模应用行动方案》例行政策吹风会", "interpretSection": "新闻发布会", "docNumber": "渝府办发〔2026〕24号"}, "permission": null, "meta": {"qType": "detail", "evidenceKey": "预留不低于5%", "answerQuote": "明确在政府投资项目中预留不低于5%的预算用于新场景建设", "candidateChunks": [11, 12, 9, 8, 13, 14, 4, 5, 3, 6, 1, 10], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "A-p-23-1", "category": "pair", "question": "重庆市“十五五”农业农村现代化规划主要围绕哪些方面进行部署？", "answer": "重点在四个方面统筹发力：一是守住粮食安全和防止规模性返贫致贫两条底线；二是聚焦农业现代化和农村现代化两条跑道；三是激活城市带动力和农村内动力两个动力；四是牢牢把住增加农民收入这个关键。", "expectRefusal": false, "gold": [{"docId": 2097637768968916993, "chunkIndex": 1, "why": "重庆市“十五五”农业农村现代化规划（2026—2030年）", "quote": "突出大城市带大农村大山区大库区，以学习运用“千万工程”经验为引领，以改革创新和数智赋能为动力，以迭代实施“四千行动”为抓手，统筹发展科技农业、绿色农业、质量农业、品牌农业，统筹推进“五个振兴”和常态化帮扶，抓好办成一批农民群众可感可及的实事", "text": "，根据《加快农业农村现代化“十五五”规划》（国发〔2026〕14号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等，制定本规划。\n一、总体要求\n\n（一）指导思想\n\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实习近平总书记关于“三农”工作的重要论述和视察重庆重要讲话重要指示精神，聚焦做实“两大定位”、发挥“三个作用”，坚持农业农村优先发展，坚持尊重农民意愿，突出大城市带大农村大山区大库区，以学习运用“千万工程”经验为引领，以改革创新和数智赋能为动力，以迭代实施“四千行动”为抓手，统筹发展科技农业、绿色农业、质量农业、品牌农业，统筹推进“五个振兴”和常态化帮扶，抓好办成一批农民群众可感可及的实事，加快打造城乡融合乡村振兴示范区建设标志性成果，努力推动基本实现农业现代化、农村基本具备现代生活条件取得重大进展，为奋力谱写中国式现代化重庆篇章提供基础支撑。\n\n（二）发展目标\n\n到2030年，全市农业农村现代化达到西部领先水平。\n\n——粮食稳产增产能力实现新跃升。耕地保有量稳定在2664万亩以上，高标准农田建管用一体化水平显著提升，粮食综合生产能力达到226亿斤以上，农业防灾减灾救灾体系能力全面增强。\n\n——改革赋能乡村发展实现新跃升。以深化改革促进乡村“五个振兴”的机制更加健全、支撑常态化帮扶的体系全面构建，区域农合联服务农户占比达到90%以上。"}], "source": {"pairId": "p-23", "policyDocId": 2097637768968916993, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”农业农村现代化规划（2026—2030年）》的通知", "interpretDocId": 2097637775176486914, "interpretTitle": "“开局起步十五五·建设现代化新重庆”《重庆市“十五五”农业农村现代化规划（2026—2030年）》解读专场新闻发布会", "interpretSection": "新闻发布会", "docNumber": "渝府发〔2026〕16号"}, "permission": null, "meta": {"qType": "overview", "evidenceKey": "四个方面", "answerQuote": "“十五五”时期，我们重点在四个方面统筹发力，力争到2030年全市农业农村现代化达到西部领先的水平。", "candidateChunks": [1, 0, 2, 28, 31, 11, 13, 5, 7, 10, 6, 20], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}}, {"id": "
