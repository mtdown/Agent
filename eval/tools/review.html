denceKey": "百万亩级战略储备", "answerQuote": "建设道地中药材优势产区和百万亩级中药材战略储备基地，提质扩能重庆中医药科技产业园等园区。", "candidateChunks": [23, 6, 15, 32, 14, 17, 10, 33, 0, 16, 29, 31], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据无关"], "reason": "标准答案完全忠实于原文且可答，但标注的证据段落[23]中包含了大量与问题（中药材基地、品牌）无关的内容（如中医特色诊疗中心、人才培养、专栏14中的种子种苗基地等），导致证据冗余。", "suggestion": "建议将证据段落[23]进行切片处理，仅保留“发展现代中医药产业。擦亮‘渝十味’中药材品牌……提质扩能重庆中医药科技产业园等园区。”这一部分作为Gold Evidence，或者在评测时允许模型从该长段落中提取关键句而不扣分。若无法切片，当前状态勉强可用，但严格来说证据不够精准。", "suggest": [], "suggestDocId": 2097637769459650561, "fixable": false, "hint": ""}}, {"id": "B-01", "category": "docnum", "question": "渝府发〔2026〕11号 这份文件是关于什么内容的？", "answer": "即《重庆市推进政务服务全面通办实施方案》。“高效办成一件事”部署和数字重庆建设要求，推动政务服务全要素集成、全流程闭环、全场景实战，加快从基本能力向全面通办体系能力跃升，制定本实施方案。", "expectRefusal": false, "gold": [{"docId": 2097637768037781505, "chunkIndex": 1, "why": "重庆市推进政务服务全面通办实施方案 正文开头", "quote": "", "text": "“高效办成一件事”部署和数字重庆建设要求，推动政务服务全要素集成、全流程闭环、全场景实战，加快从基本能力向全面通办体系能力跃升，制定本实施方案。\n\n一、总体要求\n坚持集约高效、整体规划，紧紧围绕线上全程网办、线下全渝通办提质增效，依法依规推进政务服务事项下沉，迭代优化网上办、跨域办、预约办、一门办、集成办、帮代办等服务场景，坚决防治和纠正政务服务中的“面子工程”，加快形成市、区县、乡镇（街道，以下统称乡镇）三级高效协同、全面通办的政务服务体系能力。\n\n二、推动政务服务事项下沉，全面统一标准规范\n\n（一）优化办理层级。坚持依法、合理、就近、便民原则，将程序较简单、基层可承接、审批风险低的涉企政务服务事项下沉区县、个人事项下沉乡镇。其中，多层级行使的事项原则上由下级行政机关行使，只能由市级审批的事项原则上委托区县收件。下级初审、上级审批的事项，企业群众向下级行政机关提出申请，申请材料和相关信息由行政机关内部流转，防止让企业群众多头跑。坚持依法办理，加强对已下沉事项的跟踪指导，防止违规降低审批标准。\n\n（二）加强同源管理。适时修订《重庆市政务服务事项管理办法》，以重庆市政务服务事项管理系统中的事项为唯一源头，落实市级部门对本行业领域事项设立、拆分、发布、实施、监督、评价、调整闭环管理责任，强化市、区县司法行政部门合法性审核责任，确保事项要素与法律法规规定一致、实际办理与办事指南一致、线上与线下办理一致、部门业务系统与“渝快办”平台标准一致。探索推进重庆市政务服务事项管理系统与法律法规规章等权威数据库关联。"}, {"docId": 2097637768037781505, "chunkIndex": 2, "why": "重庆市推进政务服务全面通办实施方案 正文开头", "quote": "", "text": "规规定一致、实际办理与办事指南一致、线上与线下办理一致、部门业务系统与“渝快办”平台标准一致。探索推进重庆市政务服务事项管理系统与法律法规规章等权威数据库关联。\n（三）规范办事指南。全面规范办理情形、受理条件、办理流程、申请材料、受理标准、需要提前知悉的特别要求等内容。制作简洁版办事指南，推动音视频、图文解读和事项名称通俗化表述，编制常见“问答对”，做到一次讲清、一看就懂、准确回应。编制标准统一、内容清晰的审查要点，确保准确受理、规范办理。加强办事指南发布前的审查，把好政治关、法律关、政策关、保密关、程序关。\n\n三、构建全面通办服务场景，更好实现“一次办成”\n\n（四）提质扩面网上办。除法律法规规定必须到现场办理、高度依赖现场检测环境办理外，推动更多事项全程网办，提供办理结果线上下载或通过邮政寄递送达等便利化服务。凡是能线上提交申请材料的，不得再要求邮寄纸质材料或到窗口提交。增强数据共享复用能力，原则上政府部门核发的材料免于提交、能够通过数据共享核验的事项免于提交证明材料、能够提供电子证照的免于提交实体证照，以减证便民“免证办”的更好实效，提高全程网办服务能级。"}], "source": {"pairId": "", "policyDocId": 2097637768037781505, "policyTitle": "重庆市人民政府关于印发《重庆市推进政务服务全面通办实施方案》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕11号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府发〔2026〕11号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 3, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案中明确指出了文件全称《重庆市推进政务服务全面通办实施方案》，该信息仅存在于段落[0]的标题元数据中，但段落[0]未被标记为证据（★），导致证据链断裂。", "suggestion": "将段落 [0] 补充标记为证据（★）。", "suggest": [{"chunkIndex": 0, "text": "---\r\ntitle: \"重庆市人民政府关于印发《重庆市推进政务服务全面通办实施方案》的通知\"\r\nfileNum: \"渝府发〔2026〕11号\"\r\npubDate: 2026-05-26 17:12:25\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202605/t20260526_15705548.html\r\nmetadataId: 15705548\r\nchannelId: 121935\r\nsubcat: 881\r\nbodyShort: false\r\n---\n\n重庆市人民政府关于\n\n印发《重庆市推进政务服务全面通办\n\n实施方案》的通知\n\n渝府发〔2026〕11号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n现将《重庆市推进政务服务全面通办实施方案》印发给你们，请认真贯彻执行。\n\n重庆市人民政府\n\n2026年5月21日\n\n（本文有删减）\n\n重庆市推进政务服务全面通办实施方案\n\n为贯彻落实国务院关于“高效办成一件事”部署和数字重庆建设要求，推动政务服务全要素集成、全流程闭环、全场景实战，加快从基本能力向全面通办体系能力跃升，制定本实施方案。\n\n一、总体要求"}], "suggestDocId": 2097637768037781505, "fixable": true, "hint": ""}}, {"id": "B-02", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕3号 文件的主要内容。", "answer": "即《重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施》。重庆市人民政府办公厅 2026年1月21日 （此件公开发布） 重庆市深化药品医疗器械监管改革 促进医药产业高质量发展若干措施 为深入贯彻《国务院办公厅关于全面深化药品医疗器械监管改革促进医药产业高质量", "expectRefusal": false, "gold": [{"docId": 2097637762941702145, "chunkIndex": 1, "why": "重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年1月21日\n\n（此件公开发布）\n\n重庆市深化药品医疗器械监管改革\n\n促进医药产业高质量发展若干措施\n为深入贯彻《国务院办公厅关于全面深化药品医疗器械监管改革促进医药产业高质量发展的意见》（国办发〔2024〕53号），持续深化药品医疗器械监管改革，聚焦培育生物医药新质生产力，推进创新药、高端医疗器械等全产业链系统创新，促进重庆生物医药产业高质量发展，制定如下措施。\n\n一、强化研发创新支撑\n\n1．建强药械创新平台。依托“渝药创新生态链”平台，集聚“政、产、学、研、用”创新要素。发挥“智汇攻关”数字化平台作用，谋划建设重大科技创新基地，围绕创新药、智慧医疗装备等领域打造一批市级重点实验室、技术创新中心、产业重大平台。（牵头单位：市药监局；责任单位：市科技局、市经济信息委、市卫生健康委）\n\n2．加强药械产品研发。引导支持科研院所、高校、医疗机构、科技企业等补位药品医疗器械创新赛道、申报国家级药品医疗器械科研项目、牵头重大（重点）科技专项。制定创新培源项目清单，对在创新赛道中具有国际国内影响力、关键技术创新突破、临床应用价值的在研项目，靠前对接、精准支持。加快推进金凤实验室干细胞药物质量评价研究，提升干细胞药物质量控制水平。（牵头单位：市科技局；责任单位：市经济信息委、市卫生健康委、市药监局、金凤实验室）"}, {"docId": 2097637762941702145, "chunkIndex": 2, "why": "重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施 正文开头", "quote": "", "text": "准支持。加快推进金凤实验室干细胞药物质量评价研究，提升干细胞药物质量控制水平。（牵头单位：市科技局；责任单位：市经济信息委、市卫生健康委、市药监局、金凤实验室）\n3．促进中药传承创新转化。加强“渝十味”等省级中药饮片炮制规范研究，推动将其纳入国家药品标准体系。鼓励研发机构和企业以临床价值为导向，积极运用新技术、新工艺等进行创新改良，实现中药大品种的二次开发；支持古代经典名方、珍稀濒危中药材替代品研究及成果转化。鼓励医疗机构强化临床有效经方验方向中药制剂转化，探索人用经验规范收集整理机制，强化临床用药经验与新药研发桥接，推动中药新药注册申报。支持中医药高等院校、科研院所开展科技成果“以权代股”改革试点。（牵头单位：市卫生健康委；责任单位：市科技局、市药监局）\n\n4．健全知识产权保护机制。探索建立企业与科研机构之间的专利转化保障机制、知识产权快速维权机制。支持企业加快药品医疗器械原创性成果专利布局，提升专利质量。建设运营重庆生物医药产业知识产权运营中心，促进生物医药产业知识产权转化运用。（牵头单位：市知识产权局；责任单位：市发展改革委、市药监局）"}], "source": {"pairId": "", "policyDocId": 2097637762941702145, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市深化药品医疗器械监管改革促进医药产业高质量发展若干措施》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕3号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕3号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "drop", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["答案不完整", "证据缺失"], "reason": "标准答案仅截取了文件标题和前言部分，完全缺失了文件核心的‘主要内容’（即具体的若干措施条款），导致无法回答用户关于‘主要内容’的提问；且标注的证据段落也仅覆盖前言，未覆盖正文。", "suggestion": "", "suggest": [{"chunkIndex": 3, "text": "专利布局，提升专利质量。建设运营重庆生物医药产业知识产权运营中心，促进生物医药产业知识产权转化运用。（牵头单位：市知识产权局；责任单位：市发展改革委、市药监局）\n5．加速释放国家审评检查资源红利。建好用好国家药监局药品和医疗器械审评检查西南分中心（以下简称西南分中心），建立完善协作机制，促进审评检查核心能力提升。聚焦基因治疗、肿瘤治疗、细胞治疗、小干扰RNA、蛋白降解技术、脑机接口、手术机器人、人工智能等领域创新药械，加强对我市优质企业和创新药械项目的对接服务。加强算力和网络基础设施建设，建立西南地区药品和医疗器械临床机构、科研机构、生产企业、高等院校的创新产品数字热力地图，以技术创新提升审评检查质效。（牵头单位：市药监局、西南分中心；责任单位：市财政局、市大数据发展局、西部科学城重庆高新区管委会）\n\n二、加快产品上市进程\n\n6．优化创新服务机制。支持在两江新区、大渡口区、巴南区、西部科学城重庆高新区、重庆经开区等重点产业聚集地建设创新服务中心（站），开展创新服务中心标准化建设，打造全国一流的生物医药产业全生命周期公共服务平台，为创新药品医疗器械产业快速发展提供“一站式”服务。深化局地合作新模式，实施区县常态化联络机制，全覆盖对接区县生物医药产业需求，及时靠前提供受理、检验、审评、审批、监管等“全链条”服务。（牵头单位：市药监局；责任单位：各区县政府）"}, {"chunkIndex": 4, "text": "，实施区县常态化联络机制，全覆盖对接区县生物医药产业需求，及时靠前提供受理、检验、审评、审批、监管等“全链条”服务。（牵头单位：市药监局；责任单位：各区县政府）\n7．实施项目前置服务。积极争取与国家药监局及相关机构建立联动机制，做好创新药品医疗器械、重点品种等的咨询指导工作。坚持“提前介入、一企一策、研审联动、全程指导”原则，建立健全药品医疗器械注册申报前置服务机制，开展仿制药上市许可申请前置服务试点。对国家级和市级重点项目、境内已上市产品在渝申报项目，以及纳入“渝药创新生态链”或智慧医疗装备重点培育项目库等具备创新性、产业带动潜力的药品医疗器械，依申请提供注册申报前置指导服务。（牵头单位：市药监局）\n\n8．提升临床试验质效。推进重庆市临床研究中心建设，推动有条件的高水平医院开展临床创新研究活动。鼓励高水平医院按一定比例设置研究型床位，建设功能完备、集约共享的研究型病房。建立重庆市医学伦理审查互认联盟，推动多中心试验项目伦理审查时限不超过1个月。对细胞治疗和基因治疗药物、罕见病药物及创新药等重点品种，在临床试验申报准备、启动实施、现场核查等关键环节，加强前置指导和协调对接，支持医疗机构满足创新药临床试验审评审批相关要求。畅通医学研究专职科研人员职称晋升通道，新建医学研究专业职称评价体系，激励医学研究人员专心投入研发。（牵头单位：市卫生健康委；责任单位：市药监局）"}, {"chunkIndex": 5, "text": "评审批相关要求。畅通医学研究专职科研人员职称晋升通道，新建医学研究专业职称评价体系，激励医学研究人员专心投入研发。（牵头单位：市卫生健康委；责任单位：市药监局）\n9．强化检验检测服务。推动开展全流程检验技术服务，对创新药品医疗器械开通优先检验绿色通道，高效准确完成中药改良型新药注册检验。除结构组成、工作原理较为复杂或适用标准较多的医疗器械产品外，无源医疗器械产品平均检验时限由60个工作日压缩至45个工作日，体外诊断试剂产品平均检验时限由45个工作日压缩至30个工作日，有源医疗器械产品平均检验时限由120个工作日压缩至90个工作日。（牵头单位：市药监局）\n\n10．提升审评审批质效。实施国家药监局优化药品补充申请审评审批程序改革试点，落实“药品补充申请审评时限由200个工作日压缩至60个工作日”的创新政策。第二类医疗器械产品平均审评时限由60个工作日压缩至40个工作日，对进入创新或优先审批程序的第二类医疗器械优先审评审批。强化对第三类医疗器械注册创新申请的技术指导，助力产品进入国家药监局创新特别审批通道。（牵头单位：市药监局）\n\n三、提升产业合规水平"}, {"chunkIndex": 6, "text": "的第二类医疗器械优先审评审批。强化对第三类医疗器械注册创新申请的技术指导，助力产品进入国家药监局创新特别审批通道。（牵头单位：市药监局）\n\n三、提升产业合规水平\n11．深化数字技术赋能。加速新一代信息技术与医药产业链深度融合，探索建设远程监管模式，推进血液制品生产智慧监管。强化药品追溯信息化体系建设，开展触发式追溯风险处置，不断拓展药品追溯数据的应用场景。推动医疗器械唯一标识和医保医用耗材分类与代码衔接应用。加强医疗、医保、医药等健康数据整合，深化数据治理、应用共享和场景应用，为医药产业高质量发展提供数智化工具。加入国家药监局“人工智能+药品监管”协作平台，参与人工智能示范项目，推进第二类医疗器械人工智能辅助审评大模型建设试点工作。（牵头单位：市药监局；责任单位：市经济信息委、市卫生健康委、市医保局）\n\n12．优化医药领域市场环境。开展药品安全除险固安行动，实施涉企检查减频增效行动，制定完善行政许可、行政检查、行政强制裁量基准，建立专项整治（行动）事前统筹管理机制，推进分级分类监管和“综合查一次”。动态优化“渝快办”办事指南，鼓励企业全程网办，深化“不见面申报”数字化改革。支持医药流通业态发展，推进药品第三方物流、异地设仓、多仓协同、首营资料电子化、批零一体化等改革试点，降低企业运营成本。（牵头单位：市药监局；责任单位：市市场监管局）"}, {"chunkIndex": 7, "text": "医药流通业态发展，推进药品第三方物流、异地设仓、多仓协同、首营资料电子化、批零一体化等改革试点，降低企业运营成本。（牵头单位：市药监局；责任单位：市市场监管局）\n13．持续完善技术标准体系。建立健全政府主导、企业主体、社会参与的标准工作机制，鼓励企业、科研院所、社会团体等参与标准制定、修订，提高公共标准服务水平。积极参与国际相关标准制定和国家药品医疗器械标准提高工作，补充完善标准勘误程序。强化川渝合作，探索建立中药配方颗粒标准互建互享机制，推动完善川渝两地药品标准。优化中药配方颗粒跨省销售备案流程，对于执行国家标准的，跨省销售至重庆不再备案。（牵头单位：市药监局；责任单位：市市场监管局）\n\n14．强化预警监测和评价。加强创新药品医疗器械警戒工作，指导药品上市许可持有人完善警戒工作体系，开展主动监测，有效控制产品临床使用风险。强化部门协作配合，建立健全医疗机构警戒工作机制，提升医疗机构在创新药品医疗器械监测、识别、评估及上报等方面的工作效能。支持药品上市许可持有人、医疗机构开展药品医疗器械上市后评价研究。（牵头单位：市药监局；责任单位：市卫生健康委、市医保局）\n\n四、优化适应产业发展的监管体系\n\n15．健全药品安全责任体系。深入落实药品安全党政同责，建立药品安全责任约谈机制，健全药品质量安全主体责任工作机制，推动形成一体落实部门监管责任、属地管理责任、企业主体责任的良好格局。针对监管难点、风险隐患和薄弱环节，进一步完善监管机制，形成全链条监管闭环。（牵头单位：市药监局；责任单位：各区县政府）"}, {"chunkIndex": 8, "text": "任、属地管理责任、企业主体责任的良好格局。针对监管难点、风险隐患和薄弱环节，进一步完善监管机制，形成全链条监管闭环。（牵头单位：市药监局；责任单位：各区县政府）\n16．加强创新人才队伍建设。积极引进生物医药领域高水平科研、生产、营销、服务等人才，建设完善生物医药专家智库。培育药品监管审评检查、检验检测领军人才，构建高素质专业化人才梯队。支持高水平医院引进临床科研人才，组织临床研究骨干赴国内外高水平临床研究机构进修学习，全面提升临床科研人员研究方案设计、数据统计、项目管理及组织开展国际多中心临床研究能力。调整优化高校学科专业结构，持续培育一批在国内具有较强影响力的生物医药领域优势特色学科专业。（牵头单位：市药监局；责任单位：市教委、市卫生健康委、市人力社保局）\n\n17．不断提升技术支撑能力。加快疫苗等生物制品批签发项目建设，达到与市内疫苗等生物制品产业相匹配的检验检测能力，支持生物医药生产企业加快疫苗生产。提升智慧医疗装备检验检测能力，建设材料学、人工智能、智慧医疗装备、高端数字诊疗装备、高端医学影像及医疗器械可用性等实验室。（牵头单位：市药监局）\n\n18．大力发展药品监管科学。打造全国唯一的国家药监局麻醉药品与精神药品监管科学创新研究基地，做好麻醉药品与精神药品滥用问题品种的依赖性评价等研究工作。积极参与实施中国药品监管科学行动计划，鼓励支持高等院校、科研机构等积极开展中药、生物制品（疫苗）、高端医疗器械、医疗器械新材料、化妆品新原料等领域监管科学研究，推进监管新工具、新标准、新方法研究应用。（牵头单位：市药监局）"}, {"chunkIndex": 9, "text": "构等积极开展中药、生物制品（疫苗）、高端医疗器械、医疗器械新材料、化妆品新原料等领域监管科学研究，推进监管新工具、新标准、新方法研究应用。（牵头单位：市药监局）\n五、支持医药产业转型升级\n\n19．探索生物制品分段生产模式。鼓励药品上市许可持有人联合具备条件的受托生产企业向国家药监局提出申请，指导制定分段生产方案，按照“一品一策”原则积极争取生物制品分段生产。（牵头单位：市药监局）\n\n20．支持开展药械进出口贸易。支持符合条件的医疗机构依法申请临时进口临床急需药品医疗器械。深入推进重庆市生物医药研发用物品进口试点，不断完善研发用物品进口“白名单”，持续畅通进口药品“保税—清关”路径，提升通关效率。加强中药资源国际交流合作，积极参与国际监管政策宣传和交流，支持具有临床优势的中药在境外注册上市。优化药品医疗器械产品出口销售证明办理程序，拓宽医疗器械销售证明出具范围，平均审核时限由7个工作日压缩至2个工作日内。（牵头单位：市商务委；责任单位：市卫生健康委、重庆海关、市药监局）\n\n21．推动产业集聚发展。积极争取把更多重庆元素纳入国家“十五五”药品安全及高质量发展规划中，推动重庆生物医药产业发展与国家规划、西南分中心建设、服务区域发展等无缝衔接。支持区县之间优势互补、资源共享、错位发展、招大引强，重点打造巴南区、两江新区、西部科学城重庆高新区、长寿经开区、涪陵区、大渡口区、沙坪坝区等产业集聚区，合理布局发展赛道，形成生物医药产业发展集群。（牵头单位：市药监局；责任单位：有关区县政府、市经济信息委）"}], "suggestDocId": 2097637762941702145, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 7 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "B-03", "category": "docnum", "question": "文号 渝府办发〔2026〕36号 对应的政策文件，主要规定了哪些方面？", "answer": "即《重庆市建立健全长期护理保险制度实施方案》。为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。", "expectRefusal": false, "gold": [{"docId": 2097637769677754370, "chunkIndex": 1, "why": "重庆市建立健全长期护理保险制度实施方案 正文开头", "quote": "", "text": "\n为建立健全我市长期护理保险制度，根据《中共中央办公厅国务院办公厅关于加快建立长期护理保险制度的意见》精神，结合重庆实际，制定本实施方案。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大和二十届历次全会精神，全面贯彻落实习近平总书记视察重庆重要讲话重要指示精神，认真贯彻落实市委六届历次全会精神，逐步形成全市统一的多元筹资、待遇标准、需求评估、护理服务、基金监管、经办服务工作体系，加快建立与重庆经济社会发展相协调的覆盖全民、统筹城乡、公平统一、安全规范、可持续的长期护理保险制度。2026年，我市长期护理保险继续覆盖参保职工，并启动居民长期护理保险筹资，与居民医保集中筹资同步。2027年，按国家规定调整职工筹资标准和待遇标准，城乡居民按规定开始享受长期护理保险待遇。2028年及以后，不断健全责任共担的资金筹集机制、公平适度的待遇保障机制和科学规范的管理运行机制，更好满足失能人员长期护理基本保障需求，不断增强人民群众的获得感、幸福感、安全感。\n\n二、参保筹资\n\n职工和居民参加基本医疗保险时同步参加长期护理保险，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资"}, {"docId": 2097637769677754370, "chunkIndex": 2, "why": "重庆市建立健全长期护理保险制度实施方案 正文开头", "quote": "", "text": "，同步缴纳长期护理保险费。建立健全单位、个人、政府、社会等多元筹资渠道，根据国家有关规定和我市经济社会发展水平，对缴费基数和费率进行动态调整。\n\n（一）职工筹资\n1．单位职工。由用人单位和职工个人共同缴费，与城镇职工基本医疗保险（以下简称职工基本医保）费同步缴纳。费率为0.3%，缴费基数与职工基本医保缴费基数保持一致，用人单位和个人按同比例分担，各承担0.15%的缴费费率。2027年，用人单位承担部分从职工基本医保费率（含生育保险费率）8.5%中平移，职工基本医保单位费率（含生育保险费率）由8.5%调整为8.35%。\n\n2．退休人员。缴费费率为0.15%，缴费基数为本人基本养老金，由个人按规定缴费，原用人单位不缴费。\n\n3．以个人身份参加职工医保人员。缴费费率为0.3%，缴费基数为我市上年度在职职工基本医保实际平均缴费基数，由个人按规定缴费。\n\n职工医保个人账户可以用于本人及近亲属（包括配偶、父母、子女、兄弟姐妹、祖父母、外祖父母、孙子女、外孙子女）参加长期护理保险的个人缴费。\n\n（二）居民筹资\n\n1．按年筹集资金，与城乡居民基本医疗保险费同步缴纳。缴费基数为全市上年度城乡居民人均可支配收入；2027年度参保缴费费率减半，从0.15%起步，每年增加0.03个百分点，用5年时间过渡到0.3%；缴费由个人和政府按1∶1分担。18周岁以下居民跟随父母或其他法定抚养人等参保，不单独筹资，符合待遇享受条件的，按居民待遇标准享受待遇；孤儿、事实无人抚养儿童等无法跟从参保的，视同参保。"}], "source": {"pairId": "", "policyDocId": 2097637769677754370, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市建立健全长期护理保险制度实施方案》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕36号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕36号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 4}, "issues": ["证据缺失"], "reason": "问题询问政策文件'主要规定了哪些方面'，属于对全文结构的概括性提问。当前仅标注了前言和筹资部分（段落1-2），严重缺失待遇、服务、监管等核心章节的证据（段落3-9），导致无法完整回答'主要方面'。", "suggestion": "将段落[3]至[9]全部补充为证据段落（标★），以覆盖参保筹资、待遇保障、管理服务、工作要求等所有主要规定方面。", "suggest": [{"chunkIndex": 3, "text": "分担。18周岁以下居民跟随父母或其他法定抚养人等参保，不单独筹资，符合待遇享受条件的，按居民待遇标准享受待遇；孤儿、事实无人抚养儿童等无法跟从参保的，视同参保。\n2．政府对符合条件的困难人群个人缴费部分予以分类资助。对特困人员给予全额资助，对低保对象、符合条件的防止返贫致贫对象给予定额资助。具体资助办法由市医保局商市级有关部门确定。\n\n三、待遇保障\n\n（一）待遇对象。享受长期护理保险待遇对象为，按规定参保缴费且失能状态原则上持续6个月以上，经申请通过评估认定的人员。职工参保人员2026年按现行政策人员范围享受待遇。居民参保人员从2027年起按规定享受待遇，起步阶段待遇享受对象为重度失能人员，并根据国家统一规定逐步扩大保障范围。\n\n（二）待遇标准。待遇享受不设起付标准，根据参保类别、失能等级、服务提供方式等实行差别化待遇保障政策。符合规定的长期护理服务费用，按居民筹资政策参保缴费的，基金支付比例为50%左右；按职工筹资政策参保缴费的，基金支付比例为70%左右。居民和职工年度最高支付限额原则上不超过全市上年度城乡居民人均可支配收入的50%。鼓励发展居家和社区护理服务，在支付比例上给予适当倾斜。探索建立社区护理待遇享受标准。2027年起按国家统一规定逐步调整，根据不同服务方式实行差异化待遇享受标准。\n\n待遇享受标准由市医保局会同市财政局根据本市经济发展水平、基金运行情况、长期护理服务项目变化、长期照护师服务能力等因素研究确定。调整待遇享受标准应按国家有关规定程序办理。"}, {"chunkIndex": 4, "text": "标准由市医保局会同市财政局根据本市经济发展水平、基金运行情况、长期护理服务项目变化、长期照护师服务能力等因素研究确定。调整待遇享受标准应按国家有关规定程序办理。\n（三）激励约束。从2027年1月起，除新生儿等特殊群体外，对未参保以及中断缴费后再次参保的情形，设置参保后固定待遇等待期6个月。其中，未连续参保的，每多断保1年，在固定待遇等待期基础上增加变动待遇等待期1个月，参保人员可通过缴费修复变动待遇等待期，每多缴纳1年可减少1个月变动待遇等待期。研究建立缴费时长和待遇水平相挂钩的连续参保激励机制，对连续参保的居民按规定适当提高待遇水平。探索建立参保诚信机制，促进企业和个人按规定据实参保。\n\n（四）政策衔接。按国家统一部署，做好长期护理保险与经济困难的高龄失能老年人养老服务补贴以及重度残疾人护理补贴、中度以上失能老年人养老服务消费补贴等政策的衔接。领取工伤保险生活护理费的参保人员，不重复享受长期护理保险相关服务待遇。\n\n四、管理服务"}, {"chunkIndex": 5, "text": "贴以及重度残疾人护理补贴、中度以上失能老年人养老服务消费补贴等政策的衔接。领取工伤保险生活护理费的参保人员，不重复享受长期护理保险相关服务待遇。\n\n四、管理服务\n（一）完善定点服务管理体系。长期护理保险服务机构实行定点管理，按照“保障基本、合理布局、择优选择、动态调整”原则，科学规划我市长期护理保险服务机构定点配置，着力推动优质照护资源均衡布局、良性发展。优化完善定点管理准入评估流程，引导定点护理机构提供专业、规范服务，鼓励机构规模化、专业化、连锁化发展；加强长期护理服务标准化，构建分工更加合理、服务更加优质、管理更加规范的长期护理服务体系，促进城乡长期护理服务均质化，鼓励符合条件的家庭医生参与护理服务，鼓励符合条件的转型基层医疗卫生机构、养老服务机构提供长期护理服务。强化协议管理、履约考核和监督检查，健全定点机构“能进能出”的动态管理机制，加强对定点服务机构的运行管理。\n\n（二）健全失能等级评估机制。执行全国统一的长期护理保险失能等级评估标准。探索推动评估结论跨统筹区互认、有关部门按需使用。鼓励支持发展独立的社会化评估机构，探索发挥符合条件的家庭医生在失能等级评估中的作用。建立健全评估服务费合理分担机制，根据评估结果等因素，明确评估服务费由基金和个人合理分担的具体情形，具体分摊标准由市医保局会同市财政局确定。原则上参保人首次评估通过的评估服务费，以及按制度要求参加定期复评的评估服务费，由基金支付。建立健全评估人员规范化培训机制。"}, {"chunkIndex": 6, "text": "体分摊标准由市医保局会同市财政局确定。原则上参保人首次评估通过的评估服务费，以及按制度要求参加定期复评的评估服务费，由基金支付。建立健全评估人员规范化培训机制。\n（三）提升护理服务水平。建立健全长期照护师培训机制和考核评价机制，按照“统筹规划、合理布局、严格条件、择优遴选、动态调整”原则，合理确定培训机构数量及分布。按照规定落实职业培训补贴、职业技能评价等政策。鼓励培训机构与定点机构联合开展定向培养，鼓励定点机构优先聘用取得长期照护师等相关职业资格证书的人员，引导定点机构将长期照护师技能等级作为工资收入分配的重要参考。\n\n（四）健全基金支付机制。按照国家统一部署，建立符合我市实际的长期护理保险基金支付机制。长期护理定点机构和护理人员根据国家统一的长期护理保险服务项目提供服务的费用，由基金按规定支付，不直接向失能人员发放现金。对机构床位费、膳食费等非护理服务项目费用，以及应由医疗保险支付的医疗费用，基金不予支付。\n\n（五）统一护理服务项目。2027年前将我市现行长期护理保险护理服务项目目录的28个项目对照映射为国家目录的36个项目。具体映射办法由市医保局另行制定。\n\n（六）健全基金结算管理机制。建立健全我市长期护理保险服务质效评价机制，探索将服务质效与基金绩效考核挂钩。强化基金支付管理，按月结算拨付。强化智能审核，优化长期护理保险基金结算管理。"}, {"chunkIndex": 7, "text": "理机制。建立健全我市长期护理保险服务质效评价机制，探索将服务质效与基金绩效考核挂钩。强化基金支付管理，按月结算拨付。强化智能审核，优化长期护理保险基金结算管理。\n（七）加强基金财务管理。长期护理保险基金纳入社会保障基金财政专户，实行收支两条线管理，单独建账、单独核算、专款专用。全面开展基金预算管理，强化预算约束力。加强预算执行绩效管理，完善基金管理办法和会计核算制度，做好基金会计核算和统计分析。建立健全基金运行监控和风险防范机制，做好中长期精算分析。2028年起，不得将基金交由经办长期护理保险的第三方机构代管代拨。在长期护理保险基金出现支付困难时，按照规定及时调整筹资或待遇政策。\n\n（八）强化基金监管。建立健全长期护理保险基金监管体系，出台监管制度，做好协议管理与行政监管衔接，加强对长期护理保险护理服务、失能评估、待遇支付等环节的常态化监管。加强财会监督和审计监督，严肃财经纪律，确保基金安全。完善长期护理保险监管长效机制，健全基金监管信用评价体系，强化对长期护理保险基金使用各类主体的信用监管和联合惩戒。探索长期护理保险大数据监管模型的建设运用。建立健全多部门重要线索、重大案件联查联办和追责问责机制，坚决守住基金安全底线。"}, {"chunkIndex": 8, "text": "险基金使用各类主体的信用监管和联合惩戒。探索长期护理保险大数据监管模型的建设运用。建立健全多部门重要线索、重大案件联查联办和追责问责机制，坚决守住基金安全底线。\n（九）增强经办管理服务能力。加强长期护理保险经办能力建设，建立健全经办服务体系，提高经办服务管理效能。经办机构科学编制长期护理保险基金预决算草案。加强定点机构协议管理，优化基金绩效考核、费用审核结算方式，规范完善全市定点机构服务协议范本。建立健全长期护理保险经办机构内控制度，建立完善风险防控机制。建立完善档案管理制度，探索建立电子档案管理制度。建立数据共享机制，加强与相关行业管理部门的信息共享。完善社会力量参与经办管理服务机制，依法依规通过公开招标等竞争性方式有序规范引入社会力量参与经办管理服务，相关费用按规定从基金中支付。完善对参与经办的第三方机构的考核评价机制，强化考核结果应用，提高管理服务质效。\n\n（十）打造智慧长护应用。应用全国统一的医保信息平台长期护理保险子系统，以数据集中为核心支撑，集成数字化和智能化技术，对长期护理保险待遇申请、失能等级评估、长期照护师管理、护理服务供给、基金结算支付、基金监管等关键环节实行全链条智能化管控。通过数据共享、技术支持、协同服务，开展多层次长期照护保障体系建设。\n\n五、工作要求"}, {"chunkIndex": 9, "text": "护师管理、护理服务供给、基金结算支付、基金监管等关键环节实行全链条智能化管控。通过数据共享、技术支持、协同服务，开展多层次长期照护保障体系建设。\n\n五、工作要求\n加强部门协作配合，形成工作合力，统筹推进我市长期护理保险工作。医保部门负责牵头长期护理保险制度建设和组织实施工作，制定基本政策，做好失能评估管理、长护机构管理，推进长期照护师培养培训等工作。财政部门负责及时足额安排相关财政补助资金，配合医保部门做好基金测算等工作。税务部门负责做好保费征收工作。民政部门负责推动养老服务体系建设，配合做好与长期护理保险的政策衔接工作。卫生健康部门负责鼓励基层医疗卫生机构转型提供长期护理服务，探索发挥家庭医生在失能等级评估中的作用。人力社保部门负责配合做好长期照护师培养培训、长期护理保险与工伤保险衔接等工作。农业农村部门负责做好防止返贫致贫对象认定和帮扶工作。残联负责配合做好政策宣传和参保动员相关工作。市级有关部门要提前谋划、精准施策，明确工作要求，细化工作分工，强化部门联动，建立健全沟通协调工作机制，共同推动长期护理保险工作落地实施。注重多渠道多形式宣传解读长期护理保险政策，大力宣传长期护理保险制度的互助共济理念、制度功能，不断增强全社会保险责任意识，凝聚社会共识，形成合理社会预期。"}], "suggestDocId": 2097637769677754370, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 7 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "B-04", "category": "docnum", "question": "渝府办发〔2026〕23号 这份文件是关于什么内容的？", "answer": "即《印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知》。关于印发2025年度重庆市经济建设领域 改革发展最佳实践案例的通知 渝府办发〔2026〕23号 各区县（自治县）人民政府，市政府各部门，有关单位： 2025年，全市各级各部门坚持以习近平新时代中国特色", "expectRefusal": false, "gold": [{"docId": 2097637767274418178, "chunkIndex": 1, "why": "印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知 正文开头", "quote": "", "text": "\n关于印发2025年度重庆市经济建设领域\n\n改革发展最佳实践案例的通知\n\n渝府办发〔2026〕23号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n2025年，全市各级各部门坚持以习近平新时代中国特色社会主义思想为指导，深入学习贯彻党的二十大、二十届历次全会精神和习近平总书记视察重庆重要讲话重要指示精神，聚焦做实“两大定位”、发挥“三个作用”，完整准确全面贯彻新发展理念，积极服务融入新发展格局，迎难而上、实干争先，推动全市经济发展顶压前行、向新向好，涌现出一批勇于创新、卓有成效的典型经验做法。根据《重庆市改革发展最佳实践案例选树推广办法》，经市选委会同意，确定《实施软件和信息服务业高质量发展“满天星”行动》等15个案例为2025年度重庆市经济建设领域改革发展最佳实践案例，现印发给你们，请结合实际认真学习借鉴。\n\n重庆市人民政府办公厅\n\n重庆市发展和改革委员会\n\n2026年5月5日\n\n（本文有删减）\n\n2025年度重庆市经济建设领域改革发展\n\n最佳实践案例\n\n一、最佳案例（10个）"}, {"docId": 2097637767274418178, "chunkIndex": 2, "why": "印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知 正文开头", "quote": "", "text": "\n重庆市发展和改革委员会\n\n2026年5月5日\n\n（本文有删减）\n\n2025年度重庆市经济建设领域改革发展\n\n最佳实践案例\n\n一、最佳案例（10个）\n1．实施软件和信息服务业高质量发展“满天星”行动。建立楼宇、企业、项目、人才、活动、宣传6本台账，迭代完善评价体系，实施“赛马比拼”和典型案例复盘机制。中心城区“一把手”挂帅，市区两级聚焦关键环节精准施策，开放应用场景，梯度培育企业，盘活存量楼宇，校企联动培养人才，形成市区联动、部门协同、政企互动、齐抓共管的工作格局，合力推动软信产业发展。产业规模从2021年的2824亿元跃升至2025年的5017.8亿元，进入全国第一方阵，成为“33618”现代制造业集群体系中首个完成既定目标的支柱产业。\n\n牵头单位：市经济信息委\n\n协同单位：市政府办公厅、市发展改革委、市教委、市科技局、市财政局、市人力社保局、市大数据发展局\n\n2．实施“满园扩园”行动打造千亿级智能网联新能源汽车产业集群。沙坪坝区以赛力斯汽车为链主，实施“满园扩园”行动，推进区域全员招商、深化链群融合，构建“整车+零部件+后市场”全产业链。2025年，招商落地汽车零部件企业62家，其中世界百强企业4家、上市企业13家，新增产能400亿元；出让土地21宗、1350亩，居中心城区第1。新培育规上企业17家、规上企业数量同比增长38%，汽车零部件产值增速达25.5%，赛力斯本地配套率跃升至46%，形成“500亿整车+500亿零部件”产业格局。\n\n牵头单位：沙坪坝区\n\n协同单位：市政府办公厅、市经济信息委"}], "source": {"pairId": "", "policyDocId": 2097637767274418178, "policyTitle": "重庆市人民政府办公厅 重庆市发展和改革委员会关于印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕23号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕23号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 5, "naturalness": 3}, "issues": ["答案不完整", "问题过泛"], "reason": "标准答案仅截取了文件标题和开头，未完整回答“关于什么内容”（即具体包含哪些案例），且问题过于宽泛导致答案难以界定边界。", "suggestion": "1. 优化问题：将问题改为更具体的指向，如“渝府办发〔2026〕23号文件的标题是什么？”或“该文件主要发布了哪类案例？”。2. 完善答案：若保持原问题，标准答案应概括核心内容，例如：“该文件是《关于印发2025年度重庆市经济建设领域改革发展最佳实践案例的通知》，主要发布了包括‘满天星’行动、智能网联新能源汽车产业集群等在内的15个最佳实践案例。”", "suggest": [], "suggestDocId": 2097637767274418178, "fixable": false, "hint": ""}}, {"id": "B-05", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕5号 文件的主要内容。", "answer": "即《印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知》。重庆市人民政府办公厅 2026年2月4日 （此件公开发布） 重庆市支持食品及农产品加工产业 高质量发展新十条政策 一、支持农村一二三产业融合发展 支持农村一二三产业融合发展，对成功创建国家级现代农业产", "expectRefusal": false, "gold": [{"docId": 2097637763717648386, "chunkIndex": 1, "why": "印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年2月4日\n\n（此件公开发布）\n\n重庆市支持食品及农产品加工产业\n\n高质量发展新十条政策\n\n一、支持农村一二三产业融合发展\n支持农村一二三产业融合发展，对成功创建国家级现代农业产业园、优势特色产业集群、农业产业强镇、绿色园区的，按不同标准依法依规给予最高不超过2亿元资金支持。对符合农产品初加工用电政策执行范围的执行农业生产用电价格。\n\n牵头单位：市农业农村委、市经济信息委\n\n责任单位：市财政局、市发展改革委、国网重庆电力\n\n二、支持财政常态化帮扶资金用于食品及农产品加工业发展\n\n将60%以上的财政常态化帮扶资金用于产业发展，重点围绕粮油、肉蛋奶、果蔬茶、休闲食品、调味品、火锅食材、中药材等7大产业领域，支持种养业、食品及农产品加工业发展。支持各区县优先将符合条件的食品及农产品加工项目依法依规作为市级财政常态化帮扶资金提级综合论证项目进行申报。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局\n\n三、支持对食品及农产品加工企业贷款贴息\n\n对有实际生产经营活动的食品及农产品加工企业的新增贷款，贴息比例最高不超过放贷时相应期限贷款市场报价利率（LPR）的60%，单户享受贴息最高不超过200万元。已享受其他贷款贴息政策的，不得重复享受。\n\n牵头单位：市农业农村委\n\n责任单位：市财政局、人行重庆市分行\n\n四、支持政策性担保机构对食品及农产品加工企业降低担保费率\n\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。"}, {"docId": 2097637763717648386, "chunkIndex": 2, "why": "印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知 正文开头", "quote": "", "text": "\n对有实际生产经营活动的食品及农产品加工企业，平均担保费率不超过0.6%。对符合条件的食品及农产品加工贷款依法依规纳入“政银担”风险补偿资金池支持范围。\n牵头单位：市财政局\n\n责任单位：市农业农村委\n\n五、支持对种养业主农业保险保费补贴\n\n支持符合条件的食品及农产品加工原辅料基地种养业主依法依规参与政策性农业保险，给予最高不超过85%的保费补贴。\n\n牵头单位：市财政局\n\n责任单位：市农业农村委、重庆金融监管局\n\n六、支持冷链物流体系建设\n\n支持区域冷链物流基地标准化、智慧化改造及配套设施设备投入，按照不超过实际有效投资额40%的标准，给予金额最高不超过1000万元的补助。支持农村冷链物流资源整合利用，提升运营效益。对家庭农场、农民合作社、供销合作社、邮政快递企业、产业化龙头企业在农村建设的冷链物流仓储设施用电执行农业生产用电价格。支持布局农村冷链物流揽货点、前置仓，有效降低食品及农产品加工产业冷链物流成本。\n\n牵头单位：市政府口岸物流办\n\n责任单位：市商务委、市农业农村委、市发展改革委\n\n七、支持企业数字化、智能化转型"}], "source": {"pairId": "", "policyDocId": 2097637763717648386, "policyTitle": "重庆市人民政府办公厅关于印发重庆市支持食品及农产品加工产业高质量发展新十条政策的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕5号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕5号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 4, "sufficiency": 2, "naturalness": 5}, "issues": ["证据缺失", "答案不完整"], "reason": "标准答案声称介绍“主要内容”且标题为“新十条”，但提供的证据段落仅覆盖前四条（部分），缺失第7-10条的关键内容，导致无法完整回答该政策的全貌。", "suggestion": "将段落[3]和[4]标记为★证据；同时建议完善标准答案，补充第7至10条的核心措施摘要，以匹配“新十条”的完整性要求。", "suggest": [{"chunkIndex": 3, "text": "\n牵头单位：市政府口岸物流办\n\n责任单位：市商务委、市农业农村委、市发展改革委\n\n七、支持企业数字化、智能化转型\n支持食品及农产品加工企业实施数字化、智能化改造，对符合条件的项目，依法依规给予不超过建设项目实际设备投资额10%的补助，总额不超过100万元；支持企业建设先进级智能工厂，依法依规给予不超过项目实际投资额（不含税）10%的补助，最高不超过300万元；支持企业建设未来工厂，依法依规给予不超过项目实际投资额（不含税）10%的补助，最高不超过500万元。支持食品安全数字化管理，建设阳光工厂，采用先进的质量管理体系，提升企业智能制造水平和质量安全控制能力。\n\n牵头单位：市经济信息委\n\n责任单位：市农业农村委、市市场监管局\n\n八、支持对企业技术改造贷款贴息\n\n支持食品及农产品加工企业进行技术改造，按照企业项目实际支出贷款利率的50%，给予最高不超过贷款金额2%的贴息，对单个企业项目每年贴息不超过1000万元；支持食品及农产品加工企业通过直接融资租赁方式购置设备推动实施技术改造，对符合条件的融资租赁直租业务（含“直转回”），依法依规给予2%的贴息，对单个企业项目每年贴息不超过500万元；支持食品及农产品加工企业投保技改项目费用损失保险，按照实际投保年度保费的80%进行补贴，最高不超过100万元。\n\n牵头单位：市经济信息委\n\n责任单位：市委金融办、市财政局、人行重庆市分行、重庆金融监管局\n\n九、用好食品及农产品加工产业生态基金"}, {"chunkIndex": 4, "text": "\n牵头单位：市经济信息委\n\n责任单位：市委金融办、市财政局、人行重庆市分行、重庆金融监管局\n\n九、用好食品及农产品加工产业生态基金\n用好目标规模100亿元的食品及农产品加工产业生态基金。坚持市场化原则，采用“子基金+直投”的分类投资策略支持产业引育。加强市与区县联动，积极引导产业项目落地。\n\n牵头单位：市国资委\n\n十、支持宣传推广和品牌建设\n\n支持办好中国西部国际投资贸易洽谈会、中国西部（重庆）国际农产品交易会、重庆市食品及农产品加工产业高质量发展产业生态大会等重大展会和行业促销活动，对入选综合形象馆等指定区域参展的企业给予不低于20%的展位费减免。对参加纳入“百团千企”国际市场开拓计划目录的境外参展企业给予展位费和人员费奖补。支持培育打造及宣传推广农产品区域公用品牌、地理标志产品，对新获批地理标志产品认定的申请人，给予最高不超过20万元的一次性补助。支持“爆品”打造计划，支持企业创品牌、创名牌，对新获评的国家级非物质文化遗产、中华老字号称号的企业，按不同标准依法依规给予最高不超过200万元的奖励。\n\n牵头单位：市商务委\n\n责任单位：市农业农村委、市知识产权局、市文化旅游委\n\n以上政策自2026年1月1日起实施，有效期至2028年12月31日止。"}], "suggestDocId": 2097637763717648386, "fixable": true, "hint": ""}}, {"id": "B-06", "category": "docnum", "question": "文号 渝府发〔2026〕23号 对应的政策文件，主要规定了哪些方面？", "answer": "即《重庆市“十五五”美丽重庆建设规划（2026—2030年）》。设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。", "expectRefusal": false, "gold": [{"docId": 2097637769845526529, "chunkIndex": 1, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年） 正文开头", "quote": "", "text": "设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深学笃行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，认真落实习近平总书记视察重庆重要讲话重要指示精神，按照市委六届历次全会工作部署，紧扣做实“两大定位”、发挥“三个作用”，牢固树立和践行“绿水青山就是金山银山”理念，全面落实精准科学依法治污方针，协同推进降碳、减污、扩绿、增长，以“九治”为牵引推进污染防治攻坚和生态系统优化，深化改革创新和数智赋能双轮驱动，推动经济社会发展全面绿色转型，提供更多优质生态产品以满足人民日益增长的美好生活需要，为奋力谱写中国式现代化重庆篇章提供有力支撑。\n\n到2030年，美丽重庆建设取得新的重大进展，川渝地区美丽中国先行区基本建成。长江干流重庆段水质稳定保持在Ⅱ类，城乡黑臭水体保持动态清零，细颗粒物（PM2.5）浓度持续下降，基本消除重污染天气，主要污染物排放总量持续减少，生态系统多样性稳定性持续性不断提升，山水都市风貌整体大美全面彰显，碳达峰目标如期实现，绿色生产生活方式基本形成，适应美丽重庆建设的生态环境治理体系不断健全，打造一批“西部领先、全国进位和重庆辨识度”的标志性成果，全面筑牢长江上游重要生态屏障。到2035年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。"}, {"docId": 2097637769845526529, "chunkIndex": 2, "why": "重庆市“十五五”美丽重庆建设规划（2026—2030年） 正文开头", "quote": "", "text": "5年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。\n“十五五”时期建设省域美丽中国先行区的总体布局：\n\n——加快建设各美其美的美丽城市和美丽乡村。以绿色低碳、环境优美、生态宜居、安全健康、智慧高效为导向，差异化、特色化推进美丽城市建设，塑造都市风貌展示区、美丽廊道、区县城特色风貌名片，纳入市级美丽城市培育的区县占比达到60%。立足农村人居环境改善、农业绿色低碳发展、乡村风貌品质提升，梯次分类推进具有巴渝韵味的美丽乡村建设，美丽乡村整县建成比例达到60%。\n\n——全面推进“美丽系列”建设。加快实施美丽河湖保护与建设行动，推进幸福河湖建设，建成美丽河湖45个（段）、幸福河湖400条（个）。深化生态文明建设示范区、“绿水青山就是金山银山”实践创新基地和生态工业园区、零碳园区、零碳工厂建设，提质建设全域“无废城市”。鼓励园区、企业、社区、学校、医院等开展“美丽+”特色模式探索。\n\n专栏1  “十五五”美丽重庆建设主要指标\n\n序号\n\n类别\n\n指标\n\n单位\n\n2025年\n\n2030年\n\n目标值\n\n指标\n\n属性\n\n1\n\n环境质量改善\n\n63个地表水国控断面优良水体比例\n\n%\n\n85.7\n\n93.7\n\n约束性\n\n2\n\n63个地表水国控断面达到或优于Ⅲ类水质比例\n\n%\n\n93.7\n\n96.8\n\n预期性\n\n3\n\n中心城区城市生活污水集中收集率\n\n%\n\n88.3\n\n≥90.0\n\n预期性\n\n4\n\n细颗粒物（PM2.5）浓度\n\n微克/立方米\n\n33.5*"}], "source": {"pairId": "", "policyDocId": 2097637769845526529, "policyTitle": "重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕23号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府发〔2026〕23号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "drop", "scores": {"answerability": 5, "faithfulness": 2, "sufficiency": 1, "naturalness": 4}, "issues": ["答案不完整", "证据缺失", "其他"], "reason": "标准答案严重残缺且逻辑不通（仅包含文件标题和制定依据片段，未回答‘主要规定了哪些方面’），同时标注的证据段落（★）完全无法支撑对政策整体内容的概括，属于典型的坏题。", "suggestion": "", "suggest": [{"chunkIndex": 0, "text": "---\r\ntitle: \"重庆市人民政府关于印发《重庆市“十五五”美丽重庆建设规划（2026—2030年）》的通知\"\r\nfileNum: \"渝府发〔2026〕23号\"\r\npubDate: 2026-08-21 10:12:52\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202608/t20260821_15960177.html\r\nmetadataId: 15960177\r\nchannelId: 121935\r\nsubcat: 943\r\nbodyShort: false\r\n---\n\n重庆市人民政府关于\n\n印发《重庆市“十五五”美丽重庆建设规划\n\n（2026—2030年）》的通知\n\n渝府发〔2026〕23号\n\n各区县（自治县）人民政府，市政府有关部门，有关单位：\n\n现将《重庆市“十五五”美丽重庆建设规划（2026—2030年）》印发给你们，请认真贯彻执行。\n\n重庆市人民政府\n\n2026年8月3日\n\n（本文有删减）\n\n重庆市“十五五”美丽重庆建设规划\n\n（2026—2030年）\n\n为加快建设美丽中国先行区，根据《美丽中国建设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求"}, {"chunkIndex": 1, "text": "设“十五五”规划》（国发〔2026〕20号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深学笃行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，认真落实习近平总书记视察重庆重要讲话重要指示精神，按照市委六届历次全会工作部署，紧扣做实“两大定位”、发挥“三个作用”，牢固树立和践行“绿水青山就是金山银山”理念，全面落实精准科学依法治污方针，协同推进降碳、减污、扩绿、增长，以“九治”为牵引推进污染防治攻坚和生态系统优化，深化改革创新和数智赋能双轮驱动，推动经济社会发展全面绿色转型，提供更多优质生态产品以满足人民日益增长的美好生活需要，为奋力谱写中国式现代化重庆篇章提供有力支撑。\n\n到2030年，美丽重庆建设取得新的重大进展，川渝地区美丽中国先行区基本建成。长江干流重庆段水质稳定保持在Ⅱ类，城乡黑臭水体保持动态清零，细颗粒物（PM2.5）浓度持续下降，基本消除重污染天气，主要污染物排放总量持续减少，生态系统多样性稳定性持续性不断提升，山水都市风貌整体大美全面彰显，碳达峰目标如期实现，绿色生产生活方式基本形成，适应美丽重庆建设的生态环境治理体系不断健全，打造一批“西部领先、全国进位和重庆辨识度”的标志性成果，全面筑牢长江上游重要生态屏障。到2035年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。"}, {"chunkIndex": 2, "text": "5年，高水平美丽重庆建设目标基本实现。生态环境根本好转，生态系统多样性稳定性持续性显著提升，绿色生产生活方式广泛形成，生态环境治理体系和治理能力现代化基本实现。\n“十五五”时期建设省域美丽中国先行区的总体布局：\n\n——加快建设各美其美的美丽城市和美丽乡村。以绿色低碳、环境优美、生态宜居、安全健康、智慧高效为导向，差异化、特色化推进美丽城市建设，塑造都市风貌展示区、美丽廊道、区县城特色风貌名片，纳入市级美丽城市培育的区县占比达到60%。立足农村人居环境改善、农业绿色低碳发展、乡村风貌品质提升，梯次分类推进具有巴渝韵味的美丽乡村建设，美丽乡村整县建成比例达到60%。\n\n——全面推进“美丽系列”建设。加快实施美丽河湖保护与建设行动，推进幸福河湖建设，建成美丽河湖45个（段）、幸福河湖400条（个）。深化生态文明建设示范区、“绿水青山就是金山银山”实践创新基地和生态工业园区、零碳园区、零碳工厂建设，提质建设全域“无废城市”。鼓励园区、企业、社区、学校、医院等开展“美丽+”特色模式探索。\n\n专栏1  “十五五”美丽重庆建设主要指标\n\n序号\n\n类别\n\n指标\n\n单位\n\n2025年\n\n2030年\n\n目标值\n\n指标\n\n属性\n\n1\n\n环境质量改善\n\n63个地表水国控断面优良水体比例\n\n%\n\n85.7\n\n93.7\n\n约束性\n\n2\n\n63个地表水国控断面达到或优于Ⅲ类水质比例\n\n%\n\n93.7\n\n96.8\n\n预期性\n\n3\n\n中心城区城市生活污水集中收集率\n\n%\n\n88.3\n\n≥90.0\n\n预期性\n\n4\n\n细颗粒物（PM2.5）浓度\n\n微克/立方米\n\n33.5*"}, {"chunkIndex": 3, "text": "\n预期性\n\n3\n\n中心城区城市生活污水集中收集率\n\n%\n\n88.3\n\n≥90.0\n\n预期性\n\n4\n\n细颗粒物（PM2.5）浓度\n\n微克/立方米\n\n33.5*\n达到国家考核目标\n\n约束性\n\n5\n\n空气质量优良天数比例\n\n%\n\n84.9*\n\n达到国家考核目标\n\n预期性\n\n6\n\n声环境功能区夜间达标率\n\n%\n\n85.7\n\n86.5\n\n预期性\n\n7\n\n城市生活垃圾资源化利用率\n\n%\n\n80\n\n83\n\n预期性\n\n8\n\n生态系统优化\n\n生态质量指数（EQI）\n\n—\n\n—\n\n达到国家考核目标\n\n预期性\n\n9\n\n森林蓄积量\n\n亿立\n\n方米\n\n2.90\n\n≥2.99\n\n约束性\n\n10\n\n水土保持率\n\n%\n\n72.3\n\n74.5\n\n预期性\n\n11\n\n水生生物完整性指数\n\n—\n\n58\n\n63\n\n预期性\n\n12\n\n人均公园绿地面积\n\n平方米\n\n11.9\n\n≥13.0\n\n预期性\n\n13\n\n海绵城市建成率\n\n%\n\n52.1\n\n80.0\n\n预期性\n\n14\n\n绿色低碳发展\n\n单位地区生产总值二氧化碳排放降低\n\n%\n\n—\n\n达到国家考核目标\n\n约束性\n\n15\n\n非化石能源占能源消费总量比重\n\n%\n\n20.6\n\n25.3\n\n约束性\n\n16\n\n绿色转型贷款余额占全市各项贷款余额比重\n\n%\n\n17\n\n20\n\n预期性\n\n17\n\n绿色低碳发展\n\n主要污染物排放总量下降\n\n氮氧化物、挥发性有机物排放总量分别下降\n\n%\n\n—\n\n达到国家考核目标\n\n约束性\n\n化学需氧量、总磷排放总量分别下降\n\n18\n\n生态安全守护\n\n建设用地安全利用\n\n—\n\n有效\n\n保障\n\n全面保障\n\n预期性"}, {"chunkIndex": 4, "text": "\n—\n\n达到国家考核目标\n\n约束性\n\n化学需氧量、总磷排放总量分别下降\n\n18\n\n生态安全守护\n\n建设用地安全利用\n\n—\n\n有效\n\n保障\n\n全面保障\n\n预期性\n19\n\n地下水国控区域点位优良水质比例\n\n%\n\n—\n\n≥80\n\n预期性\n\n20\n\n非法倾倒和非法处置固体废物事件发生率\n\n%\n\n—\n\n大幅降低\n\n预期性\n\n21\n\n森林火灾受害率\n\n‰\n\n＜0.3\n\n≤0.3\n\n预期性\n\n22\n\n辐射安全与辐射环境优良指数\n\n%\n\n—\n\n达到国家考核目标\n\n预期性\n\n注：1．细颗粒物浓度、空气质量优良天数比例、63个地表水国控断面优良水体比例、63个地表水国控断面达到或优于Ⅲ类水质比例、地下水国控区域点位优良水质比例根据《环境空气质量标准》（GB 3095—2026）和“十五五”国家地表水、地下水生态环境监测断面（点位）测算。\n\n2．优良水体比例是在水质类别基础上叠加水生态指标，综合确定水生态环境达到“优秀”和“良好”状况的比例。\n\n3．带*为“十五五”基准值（国家考核测算基数）。\n\n二、深化实施治水治气治土治废治塑，增进生态环境民生福祉\n\n（一）全力治水，打造美丽河湖"}, {"chunkIndex": 5, "text": "\n3．带*为“十五五”基准值（国家考核测算基数）。\n\n二、深化实施治水治气治土治废治塑，增进生态环境民生福祉\n\n（一）全力治水，打造美丽河湖\n1﹒深化水环境综合治理。优化“流域—控制区—控制单元”水环境分区管理体系，压实河湖长管理责任。健全城乡黑臭水体返黑返臭长效防范体系，推进群众身边水体保护治理。实施农业农村面源污染综合治理，提升入河排污口整治效能。加快补齐城镇污水收集和处理设施短板，推进城市污水处理绿色低碳标杆厂建设，强化“厂网一体”规划建设运维高效协同。深化榨菜行业高盐废水、页岩气开采废水深度治理，强化关闭煤矿矿井涌水分级分类管控。巩固船舶污染物治理成效，实现港口船舶污染物接收、转运、处置全过程闭环管理。\n\n2﹒加强水资源保护。严格用水总量和强度双控，加强水资源论证和取水许可管控，推动污水资源化利用和中水回用，建设节水型社会。健全跨区域、跨流域水资源调度机制，推进水利水电工程生态流量确定（核定）工作，建立河湖生态流量监测预警机制，重点河湖基本生态流量保障率保持在90%以上。巩固城市饮用水水源地保护成效，开展乡镇水源地达标治理和规范化建设，实施提升农村饮水质量专项行动。"}, {"chunkIndex": 6, "text": "态流量监测预警机制，重点河湖基本生态流量保障率保持在90%以上。巩固城市饮用水水源地保护成效，开展乡镇水源地达标治理和规范化建设，实施提升农村饮水质量专项行动。\n3﹒推动水生态修复。编制水生态评价技术指南，探索开展水生态调查评估。因地制宜实施水系连通、河道清淤疏浚等工程，推进长江、嘉陵江、乌江等重点流域、城市河段及其他重要水体河湖生态缓冲带建设。推进长江三峡库区（重庆段）水华重点区域预警与安全监控能力建设，加强湖库富营养化综合治理，逐步解决湖库水生态失衡问题。建立完善美丽河湖、幸福河湖综合评价和管理体系。\n\n（二）精准治气，守护美丽蓝天\n\n1﹒强化重点行业深度治理。推进水泥、垃圾焚烧等重点行业及燃煤锅炉超低排放改造，实施玻璃、有色金属、铸造等工业炉窑及殡葬行业废气深度治理，加强低效失效大气污染治理设施排查整治。推进烧结砖瓦行业整合升级，实施铸造、家具等传统产业集群整治。推动汽车供应链集群整治，加强低（无）挥发性有机物（VOCs）原辅材料源头替代和全流程治理。持续健全以大气环境绩效分级为导向的管理体系，开展绩效等级提升行动。\n\n2﹒强化移动源污染防治。开展油品储运销深度治理，深化机动车年检机构监管执法，推进新生产柴油货车系族检查全覆盖。加强重型货车路检路查和入户检查，严厉打击拆除尾气后处理装置、破坏或篡改车载诊断系统等违法行为。优化调整柴油货车限行区域，严查冒黑烟车辆上路行驶。开展非道路移动机械、船舶清洁化发展攻坚行动，基本实现靠港船舶岸电使用常态化，鼓励使用新能源或国四及以上排放标准的非道路移动机械。"}, {"chunkIndex": 7, "text": "行区域，严查冒黑烟车辆上路行驶。开展非道路移动机械、船舶清洁化发展攻坚行动，基本实现靠港船舶岸电使用常态化，鼓励使用新能源或国四及以上排放标准的非道路移动机械。\n3﹒强化面源污染精细化管控和重污染天气应对。迭代升级扬尘管控措施，严格渣土车、垃圾车等密闭运输管理，持续开展港口码头干散货粉尘、装卸载扬尘专项治理。加强烟花爆竹全链条管控，优化调整烟花爆竹禁放区域。制定“一区（县）一策”差异化改善目标和管控策略，强化秋冬季长时间大范围重污染天气分级分类、分时分段差异化管控措施，提升重污染天气预警应对能力。\n\n（三）强化治土，保卫美丽净土\n\n1﹒加强耕地安全利用和质量提升。实施耕地分类管理，动态调整耕地土壤环境质量类别，加强耕地土壤环境质量监测和保护，推进受污染耕地安全利用，强化严格管控类耕地风险管控措施落实。深入开展耕地有机质提升行动，推进酸化耕地治理。分阶段推进农用地土壤重金属污染溯源和整治全覆盖。\n\n2﹒强化建设用地风险管控。完善土壤污染源头管控“一张图”，深化建设用地土壤污染程度分级和用途分类管理，从严管控农药原药制造、焦化等行业重度污染地块及周边存在饮用水源、居民区等敏感受体的高风险地块。查清沿江1公里化工企业腾退地块土壤污染状况，采取风险管控或修复措施严防污染入江。依法探索“环境修复+”模式，强化土壤污染治理与土地开发利用协同。"}, {"chunkIndex": 8, "text": "体的高风险地块。查清沿江1公里化工企业腾退地块土壤污染状况，采取风险管控或修复措施严防污染入江。依法探索“环境修复+”模式，强化土壤污染治理与土地开发利用协同。\n3﹒协同防控地下水污染风险。实施地下水环境分区管理和分级防治，完善地下水环境监测网络，强化地下水型饮用水水源保护。开展地下水污染调查评价，建立并动态更新污染源、重点污染源、超标污染源、高风险污染源名单。高质量完成化工园区地下水污染专项整治，推进垃圾填埋场地下水污染风险管控及修复治理。\n\n（四）协同治废治塑，提质“无废城市”\n\n1﹒强化工业固体废物处置利用。完成存量磷石膏库整治，做好新增磷石膏综合利用和无害化处理工作，实现磷石膏产生量与综合消纳量动态平衡。加强赤泥综合利用，推动赤泥综合利用产业与氧化铝产业绿色协同发展。健全一般工业固体废物分级分类管理制度，强化工业固体废物全过程信息化监管。\n\n2﹒推进建筑垃圾和生活垃圾全链条治理。加强建筑垃圾运输过程信息化监管，合理布局综合利用场所、消纳场。推进城市环境卫生综合治理，加强生活垃圾全过程数字化闭环管控，健全生活垃圾分类投放、收集、运输、处理体系，推动生活垃圾分类提质转型。完善生活垃圾回收利用体系，推广“互联网+回收”等模式。实施已停用生活垃圾填埋场封场治理（有后续使用计划的除外）。"}, {"chunkIndex": 9, "text": "收集、运输、处理体系，推动生活垃圾分类提质转型。完善生活垃圾回收利用体系，推广“互联网+回收”等模式。实施已停用生活垃圾填埋场封场治理（有后续使用计划的除外）。\n3﹒加强塑料污染治理。深化“白色污染”减量行动，推进快递包装绿色转型，加强废弃农膜、农业投入品包装、快递包装等塑料废弃物回收利用处置。持续开展旅游景区、江河水域、交通场站、文化场馆等重点区域塑料垃圾清理整治，严厉打击非法生产销售“两薄”塑料制品等行为，持续降低一次性塑料制品使用量。\n\n专栏2  环境质量改善重大事项\n\n1﹒治水。推进15个工业园区污水集中处理设施提标改造、新增处理能力2.1万吨/日。加强城镇生活污水溢流污染治理，实施肖家河、唐家沱等城市污水处理厂扩建工程。完成全市入河排污口排查整治，建立分级分类监测监管体系。推进集中式饮用水水源地规范化建设和保护，建设农村供水工程1569处，县级及以上（含县城）集中式饮用水水源水质达标率达到90%以上，农村自来水普及率达到98%。强化大陆溪、梅溪河等农业面源污染突出区域系统治理，实施濑溪河、酉水河、梁滩河、花溪河、大溪河等重点流域综合整治。"}, {"chunkIndex": 10, "text": "标率达到90%以上，农村自来水普及率达到98%。强化大陆溪、梅溪河等农业面源污染突出区域系统治理，实施濑溪河、酉水河、梁滩河、花溪河、大溪河等重点流域综合整治。\n2﹒治气。加强合川电厂等亚临界机组超临界改造和提质增效，基本完成水泥熟料生产企业超低排放改造、燃煤电厂全负荷脱硝改造，推动实现低效失效治理设施动态清零。整合退出6000万标砖/年以下烧结砖及烧结空心砌块生产线，完成3个及以上传统产业集群整治。累计建设环保绩效A级、B级企业350家以上。推行“全周期、全覆盖”扬尘治理模式，科学划定露天焚烧禁烧区、限烧区，推进秸秆综合利用和烟花爆竹打非减量。基本淘汰国四及以下排放标准货车和国二及以下排放标准工程机械，淘汰老旧车25万辆以上。\n\n3﹒治土。完成7个重点区县受污染农用地溯源整治，受污染耕地安全利用率达到95%以上。完成民丰化工、昆仑化工等地块风险管控或修复。实施重点监管单位土壤和地下水污染隐患排查整治，隐患排查整改合格率达到95%以上。"}, {"chunkIndex": 11, "text": "受污染耕地安全利用率达到95%以上。完成民丰化工、昆仑化工等地块风险管控或修复。实施重点监管单位土壤和地下水污染隐患排查整治，隐患排查整改合格率达到95%以上。\n4﹒治废治塑。开展非法倾倒处置固体废物、建筑垃圾、生活垃圾填埋场环境污染隐患、历史遗留固体废物堆存场所等专项整治，完成溶洞垃圾等固体废物污染问题排查整治。推进磷石膏、赤泥等大宗工业固体废物综合利用处置，新增赤泥综合利用率达到25%以上，新增大宗工业固体废物综合利用率达到75%以上。建设400个生活垃圾分类与再生资源回收“两网融合”点，城市生活污泥全部无害化处置。推动建筑垃圾全链条闭环治理改革，城市建筑垃圾资源化利用率达到80%。实施塑料源头减量替代工程，推动“以竹代塑”产业发展，农膜回收率达到95%以上。\n\n三、统筹治山治岸，优化生态系统结构功能\n\n（一）系统治山构筑美丽山川\n\n1﹒推进区域生态屏障建设。深化国土空间分区、分类用途管制，完善“三带四屏多廊多点”总体生态安全格局。以缙云山、中梁山、铜锣山等为重点，建设珍贵濒危野生动物保护廊道。推进候鸟迁飞通道建设，加强开州汉丰湖、梁平双桂湖等湿地公园候鸟重要栖息地、繁殖地、停歇地和越冬地保护。推进中心城区“四山”优化治理，统筹实施生态保护修复等任务。"}, {"chunkIndex": 12, "text": "推进候鸟迁飞通道建设，加强开州汉丰湖、梁平双桂湖等湿地公园候鸟重要栖息地、繁殖地、停歇地和越冬地保护。推进中心城区“四山”优化治理，统筹实施生态保护修复等任务。\n2﹒加强林草湿生态系统保护。加强森林资源用途管制，严格建设项目使用林地总量控制和定额管理。实施公益林保护，强化天然林重点保护区和一般保护区分类保护。健全古树名木挂牌保护制度，推进衰弱濒危古树名木复壮保护。开展草原资源本底调查监测，加强奉节茅草坝、开州雪宝山等草甸生态系统原生态保护。严格湿地用途管控，完善湿地分级分类管理体系，推进国家重要湿地等保护修复。科学推进国土绿化，开展森林质量精准提升，全市森林覆盖率保持在55%以上。\n\n3﹒强化重要生态区域监管。加快自然保护地整合优化成果落地，推进自然保护地勘界立标，加强国家级自然保护区能力建设，自然保护地占国土面积的比例不低于13.55%。严格落实生态保护红线监管制度，持续实施“绿盾”自然保护地生态环境问题排查专项行动，推动国家级自然保护区重点生态破坏问题动态清零，全市生态保护红线面积不低于1.92万平方公里。\n\n（二）精心治岸塑造美丽岸线\n\n1﹒建设绿色生态水域廊道。统筹实施长江岸线保护和利用，严格河道水域岸线分区分类管控。纵深推进河湖“清四乱”常态化规范化，重点清理整治警戒水位以下的违法违规建筑设施。一体打造山水、建筑、滩涂、桥梁、灯光景观，有序推进河湖水域岸线空间开放共享，做靓现代化国际大都市滨江风景线。"}, {"chunkIndex": 13, "text": "规范化，重点清理整治警戒水位以下的违法违规建筑设施。一体打造山水、建筑、滩涂、桥梁、灯光景观，有序推进河湖水域岸线空间开放共享，做靓现代化国际大都市滨江风景线。\n2﹒加强河湖岸线安澜防护。因地制宜推进消落区分级保护与多级治理。实施长江上游干流重庆段防洪达标治理，全面排查整治城市易涝点，持续推进海绵城市建设。健全水土保持空间管控制度，强化重点领域人为水土流失全过程监管。优化矿山生态修复制度，推进绿色矿山建设。按照石漠化发育程度和恢复力强度，分类分级开展石漠化治理。\n\n（三）全面加强生物多样性保护\n\n1﹒健全生物多样性调查评估体系。完善“综合观测站+固定观测点”生物多样性观测网络，基本完成县域生物多样性本底调查评估，持续开展典型生态系统资源、国家重点保护野生动植物资源、水生生物及其栖息地调查观测。建立健全城市生物多样性智慧化观测网络，推动建设城市生物多样性友好单元和体验地。\n\n2﹒加强珍贵濒危特有物种保护恢复。开展崖柏、银杉和黑叶猴、林麝、中华秋沙鸭等珍贵濒危野生动植物生境保护修复，完善动（植）物园、扩繁（繁育）基地等野生动植物迁地保护体系。健全生物安全监管预警防控体系，强化外来入侵物种监测防控和松材线虫等有害生物防治。加强遗传资源保护与可持续利用，开展国家重点区域畜禽基因库、种质资源库建设。"}, {"chunkIndex": 14, "text": "体系。健全生物安全监管预警防控体系，强化外来入侵物种监测防控和松材线虫等有害生物防治。加强遗传资源保护与可持续利用，开展国家重点区域畜禽基因库、种质资源库建设。\n3﹒巩固长江十年禁渔成效。加强长江上游珍稀特有鱼类国家级自然保护区等6个水生生物保护区建设，强化岩原鲤、胭脂鱼等特有珍稀鱼类保护。加强圆口铜鱼、长鳍吻鮈、多鳞白甲鱼等人工繁育技术攻关，有序恢复珍贵濒危鱼类种群数量。统筹开展“平安长江”“渔政亮剑”等专项执法，严厉打击长江禁渔水域违法捕捞、销售非法渔获物等违法行为。\n\n专栏3  生态系统优化重大事项\n\n1﹒治山。推进缙云山生态搬迁区域以及铜锣山—铜锣峡片区、中梁山片区等塌陷坑生态修复。提质建设“两岸青山·千里林带”115万亩、国家储备林200万亩，新建1—2处候鸟保护监测站点、鸟类环志站，基本建成1—2条珍贵濒危野生动物保护廊道。联合湖北持续推动神农架国家公园建设，开展自然保护地和生态保护红线生态环境保护成效评估。\n\n2﹒治岸。整体提升“两江四岸”百公里美丽滨江线，新增打造亲水节点1000个。强化主要支流和中小河流岸线治理，完成130公顷生态缓冲带保护与修复。治理水土流失面积6000平方公里。完成1500公顷废弃矿山生态修复，建成绿色矿山120座以上。"}, {"chunkIndex": 15, "text": "化主要支流和中小河流岸线治理，完成130公顷生态缓冲带保护与修复。治理水土流失面积6000平方公里。完成1500公顷废弃矿山生态修复，建成绿色矿山120座以上。\n3﹒生物多样性保护。科学规范开展增殖放流，每年放流水生生物1500万尾以上，其中珍贵濒危物种比例不低于10%，推动“三江”干流重点水域水生生物资源监测实现全覆盖。开展保护鸟类活动和打击非法捕猎贩卖鸟类专项行动。建成高标准野生植物资源库（圃）不少于10个，保存野生植物资源5万份以上。生物多样性观测站点基本覆盖全市自然保护地和典型生态系统。\n\n四、协同治城治乡，塑造全市域整体大美风貌\n\n（一）聚力治城做靓美丽城市\n\n1﹒整治群众反映强烈的城市环境问题。实施城市噪声综合治理，开展声环境功能区划成效评估，完善数智化噪声地图。加强新建餐饮服务项目选址管控，推进公共机构食堂和特色餐饮油烟深度治理。开展工业、市政等领域恶臭异味重点源排查治理，建立长效巩固机制。完善公众生态环境监督和举报反馈机制，加强网络热点环境污染问题监控分析，及时解决群众急难愁盼问题，生态环境公众满意度稳定在93%左右。\n\n2﹒提升国际化大都市风貌品质。实施城市更新行动，推进现代化都市风貌展示区、城市“美丽廊道”等建设，塑造区县城特色风貌名片，持续擦亮“山城夜景”品牌。实施中心城区第五立面治理提升行动。推进城市绿地微更新，实施“增绿添园”，推动山城绿道建设，打造具有国际风范的“立体绿城”。\n\n（二）纵深治乡建设美丽乡村"}, {"chunkIndex": 16, "text": "”品牌。实施中心城区第五立面治理提升行动。推进城市绿地微更新，实施“增绿添园”，推动山城绿道建设，打造具有国际风范的“立体绿城”。\n\n（二）纵深治乡建设美丽乡村\n1﹒深化农村环境综合整治。推进农村生活污水治理，有序开展农村小微水体排查整治。健全农村生活垃圾收运与分类处置常态化运行保障机制，推进农村厨余垃圾等可降解生活垃圾就地就近资源化、无害化处置。开展畜禽养殖禁养区调整和养殖污染排查整治，规范畜禽粪污还田利用。加强化肥农药科学使用，深入开展有机肥替代行动，实施绿色统防统治。\n\n2﹒引导乡村特色风貌改善。加强对历史文化名镇、名村和传统村落等的有效保护和活态传承，持续开展调查认定和名录管理，实施传统村落修缮和特色文化保护。推进农房连片更新提质，实施“一化（美化）、两改（改厨、改厕）”和村庄清洁行动，推动村庄“微改造精提升”。\n\n（三）传承弘扬巴山渝水生态文化\n\n1﹒赓续传承巴渝生态文化。持续办好长江文明论坛等活动，建好生态文明传播研究中心。加强五里坡、金佛山、武隆喀斯特、大足石刻等世界遗产中生态文化元素的挖掘、保护和传承，加快长江、长征国家文化公园（重庆段）建设。聚焦美丽中国建设、长江大保护等主题，创作一批高质量生态文艺作品。\n\n2﹒推动生态文化转化利用。充分利用重庆中国三峡博物馆、重庆自然博物馆、重庆规划展览馆等场所，打造一批集生态文明宣传教育、科普推广和文化实践于一体的生态文化阵地。推动生态文化元素融入城市公园、街角空间、广场绿地等生活场景，打造特色生态文化体验场所。推动“生态文化+”产业发展，培育推广一批生态文化特色旅游精品线路。"}, {"chunkIndex": 17, "text": "化阵地。推动生态文化元素融入城市公园、街角空间、广场绿地等生活场景，打造特色生态文化体验场所。推动“生态文化+”产业发展，培育推广一批生态文化特色旅游精品线路。\n专栏4  塑造城乡大美风貌重大事项\n\n1﹒治城。推广餐饮油烟“绿岛”集中治理模式，推动油烟治理设施运行状态智慧监管。开展噪声敏感建筑物集中区域划定，建立噪声问题综合治理清单，持续开展噪声治理“千件万户”投诉典型案件调度，建成“宁静小区”750个。以居住敏感区周边和VOCs无组织排放突出企业为重点，开展“无异味园区”建设。实施城市重点片区更新50个以上，建成“山城后巷”300个、现代社区150个，建设口袋公园300个以上。\n\n2﹒治乡。实施新一轮农村人居环境整治提升五年行动，解决好农村改厕、垃圾围村、污水治理问题，农村生活污水治理率达到国家考核要求、保持全国领先水平，农村生活垃圾分类行政村覆盖率达到95%以上。开展工厂化、30亩以上规模化养殖池塘标准化改造及尾水达标治理，畜禽粪污综合利用率达到85%左右。保护传统村落50个，建成传统村落特色保护区3个、大美乡村先行片区10个。\n\n3﹒传承弘扬生态文化。擦亮“生态书香”全民阅读、“青山书角”等特色文化品牌，建设国家级文化生态保护区，建设精品生态文化阵地10个、生态文化实践场地20个，打造生态文化特色旅游精品线路10条。\n\n五、聚焦碳排放双控，厚植高质量发展绿色本底\n\n（一）加快产业绿色低碳转型发展"}, {"chunkIndex": 18, "text": "生态文化阵地10个、生态文化实践场地20个，打造生态文化特色旅游精品线路10条。\n\n五、聚焦碳排放双控，厚植高质量发展绿色本底\n\n（一）加快产业绿色低碳转型发展\n1﹒优化生态环境分区管控体系。强化同国土空间规划双向衔接，开展生态环境分区管控方案更新调整，逐步将温室气体、地下水、声、重金属等纳入分区管控体系。深化生态环境分区管控、环境影响评价与排污许可全链条制度综合改革，强化生态环境分区管控平台建设。加强“两高”项目生态环境源头防控，坚决遏制“两高”项目盲目发展。\n\n2﹒培育壮大绿色产业。坚持智能化、绿色化、融合化发展，推动智能网联新能源汽车、新一代电子信息制造和先进材料产业集群从“链条型”向“生态型”迭代转型。壮大智能绿色能源装备、生物医药等新兴产业和具身智能机器人、前沿新材料等未来产业，打造低空经济创新发展强市。推动生产性服务业扩能提质，推进国家环保产业发展重庆基地建设。\n\n3﹒建立绿色低碳循环产业体系。推动传统产业“智改数转绿色化”转型升级，深化运用“工业绿效码”。推动绿色工厂、绿色园区等绿色制造主体培育，深入推进零碳工厂、零碳园区建设。实施全链条回收循环利用行动，健全报废汽车、再生金属、工业设备及废动力电池、风电机组、光伏组件等固体废物回收循环利用体系。\n\n（二）构建清洁低碳安全高效新型能源体系"}, {"chunkIndex": 19, "text": "施全链条回收循环利用行动，健全报废汽车、再生金属、工业设备及废动力电池、风电机组、光伏组件等固体废物回收循环利用体系。\n\n（二）构建清洁低碳安全高效新型能源体系\n1﹒扩大清洁能源供给。深挖市内清洁能源开发潜力，持续推进“千乡万村驭风行动”和分布式光伏建设，因地制宜发展其他可再生能源，积极拓宽市外“绿电”入渝通道。增强能源系统调节能力，推动新型储能规模化和市场化发展，深化虚拟电厂建设。拓展新能源消纳渠道和场景，探索推广源网荷储一体化、绿电直连、智能微电网等新能源就近消纳模式。\n\n2﹒完善绿色能源消费体系。推进火电在持续提供电力供应保障能力的基础上，加快向系统调节性电源转型。持续推进存量低效数据中心节能降碳改造和“老旧小散”数据中心改造升级。加快超低能耗建筑、低碳建筑规模化发展，加强既有建筑和市政基础设施节能改造。探索开展新上项目非化石能源消费承诺，强化高耗能企业绿电消费责任约束，引领公共领域与居民用电绿色升级。\n\n（三）提升交通运输绿色化水平\n\n1﹒建立绿色高效交通运输体系。大力发展铁水联运、江海联运、水水中转，加快港口、园区铁路专用线建设，推动大宗货运物流配送向“铁路、新能源重卡+兆瓦超充站”转型。推进山城步道、立体过街设施等建设，健全“轨道+公交+慢行”绿色出行系统。推动交通基础设施与能源网深度融合，升级打造成渝“氢走廊”“电走廊”、西部陆海新通道“氢走廊”。"}, {"chunkIndex": 20, "text": "城步道、立体过街设施等建设，健全“轨道+公交+慢行”绿色出行系统。推动交通基础设施与能源网深度融合，升级打造成渝“氢走廊”“电走廊”、西部陆海新通道“氢走廊”。\n2﹒推进交通运输装备低碳升级。积极推广新能源车，推动公共领域车辆电动化，推广应用纯电、氢燃料电池商用车。开展零碳运输通道建设，构建“零碳走廊”。实施老旧营运船舶报废更新，推广新能源、清洁能源动力船舶。推进既有交通基础设施节能降碳改造，建设一批低碳车站、码头、高速公路服务区。\n\n（四）积极应对气候变化\n\n1﹒构筑碳排放双控制度体系。建立健全碳排放总量和强度双控制度，构建区域碳考核、行业碳管控、企业碳管理、项目碳评价、产品碳足迹等工作体系。健全重点行业碳排放和产能管控协同机制，加强重点用能单位碳排放效能管理，开展固定资产投资项目节能审查和碳排放评价。加快建立以出口外贸为导向的产品碳足迹管理体系。加强消耗臭氧层物质、氢氟碳化物管理，有效控制氢氟碳化物等非二氧化碳温室气体排放。\n\n2﹒主动适应气候变化。健全气候风险协作机制，建设气候变化分析系统和气象灾害监测预报系统，定期开展气候变化和极端天气气候事件监测评估。全面提升气候风险防范能力，完善自然灾害综合风险图和防治区划图，优化灾害应急响应救援扁平化组织指挥模式。深化国家气候适应型城市建设试点，开展气候变化适应能力和成效评估。"}, {"chunkIndex": 21, "text": "升气候风险防范能力，完善自然灾害综合风险图和防治区划图，优化灾害应急响应救援扁平化组织指挥模式。深化国家气候适应型城市建设试点，开展气候变化适应能力和成效评估。\n3﹒深入践行绿色低碳生活方式。有序实施消费品以旧换新政策，积极发展绿色消费新模式和新业态，组织开展绿色智能家电以旧换新、新能源汽车置换等促进绿色消费活动。持续开展节约型机关建设，严格执行政府绿色采购政策，引导企业执行绿色采购指南。接续开展国际生物多样性日、世界环境日、全国生态日、全国低碳日等宣传活动，倡导简约适度、绿色低碳、文明健康的生活理念和消费方式。\n\n专栏5  绿色低碳转型重大事项\n\n1﹒产业绿色低碳转型。培育壮大绿色制造体系，累计建成绿色工厂500个、绿色园区36个。实施钢铁、石化等行业节能节水降碳改造升级，加大报废汽车、废动力电池、再生金属等再生资源回收利用力度，全市主要再生资源年循环利用量达到1100万吨。\n\n2﹒构建清洁低碳能源体系。大力发展清洁能源，建成川渝千亿立方米国家油气生产基地，建设百亿立方米储气库群，全市新能源装机达到1100万千瓦，清洁能源装机占比达到50%。实施高耗能、高污染存量机组“上大压小”项目，有序推动老旧煤电机组关停淘汰或退役转备用，煤炭消费比重降至39%，实现煤炭、成品油消费达峰。\n\n3﹒交通运输绿色转型。推进交通运输大规模设备更新，推动新能源重型卡车规模化应用，重点大宗货物清洁运输比例达到90%以上，中心城区公交车和巡游出租车纯电动化占比达到80%以上。推进“零碳枢纽”建设，实施3—5个绿色港口建设工程。"}, {"chunkIndex": 22, "text": "车规模化应用，重点大宗货物清洁运输比例达到90%以上，中心城区公交车和巡游出租车纯电动化占比达到80%以上。推进“零碳枢纽”建设，实施3—5个绿色港口建设工程。\n4﹒应对气候变化。持续推进潼南区和涪陵高新区、西彭工业园区减污降碳协同创新试点，深化两江新区气候投融资试点建设。推动消耗臭氧层物质和氢氟碳化物替代，加强油气生产、畜禽养殖、工业生产等领域温室气体排放控制。\n\n六、加强防灾控险，守护长江上游生态安全底线\n\n（一）严密防控重点领域环境风险\n\n1﹒强化危险废物全过程管理。完善医疗废物收集处置模式，探索推广“小箱进大箱”收集转运模式。深化危险废物综合收集试点和废铅蓄电池收集试点，鼓励有条件的企业自建危险废物利用设施，推动小微企业危险废物应收尽收。开展危险废物填埋场污染隐患排查整治，推行危险废物产生单位“五即”（即生产、即包装、即称重、即打码、即入库）规范化建设和“一码贯通”管理，实现危险废物相关单位全过程信息化监管全覆盖。\n\n2﹒加强重金属环境风险管控。聚焦涉重金属重点区县，排查整治重金属环境风险隐患。推动重点流域重金属水质自动监测站建设，逐步实现属地特征重金属监测能力全覆盖。巩固提升秀山、酉阳、城口锰污染治理成效。强化尾矿库分类分级环境监管，常态化开展环境安全隐患排查整治，动态更新分级环境监管清单。"}, {"chunkIndex": 23, "text": "实现属地特征重金属监测能力全覆盖。巩固提升秀山、酉阳、城口锰污染治理成效。强化尾矿库分类分级环境监管，常态化开展环境安全隐患排查整治，动态更新分级环境监管清单。\n3﹒确保核与辐射环境安全。划定电磁环境质量标准适用区域，落实电磁辐射设施分类管理和排污许可制度。持续开展核与辐射安全隐患排查整治，严格废旧放射源和放射性废物转移处置。推进核与辐射安全监管数智化，提升辐射安全监管系统、高风险移动放射源在线监控系统数据质量，建设固定放射源实时在线监控系统，持续提升辐射环境监测和应急能力。\n\n（二）全面推进森林防灭火一体化\n\n1﹒加强森林火灾源头管控。加强用火审批、防火检查、日常巡护等手段，严格管理祭扫用火、农业生产用火、林区施工生产用火和景区野外用火。推进火灾风险隐患排查整治，强化“森林火险码”应用，建立全市统一的森林火灾风险隐患数据库。推进森林火险预警和林火视频监控系统建设，健全“空塔地”一体化火情预警监测体系。聚焦中低山重点林区，加强城市面山区域、环重要目标的火源管控、以水治火、防火阻隔等基础设施建设。\n\n2﹒提升火灾应急处置能力。加强综合性消防救援力量建设，推进航空救援指挥调度基地及中心城区、渝东南武陵山区区域航空救援基地建设。加强防灭火专业（半专业）队伍建设，完善森林防灭火专业队营房、靠前驻防点、训练场等基础设施，探索森林草原志愿消防员制度。健全森林草原火灾应急预案体系，针对重要区域编制应对极端情况的专项预案，建立联防联训联战机制。科学规划建设防火物资储备库。\n\n（三）深化地质灾害综合防治"}, {"chunkIndex": 24, "text": "防员制度。健全森林草原火灾应急预案体系，针对重要区域编制应对极端情况的专项预案，建立联防联训联战机制。科学规划建设防火物资储备库。\n\n（三）深化地质灾害综合防治\n1﹒强化地质灾害隐患识别和监测预警。开展地质灾害隐患综合遥感识别，实现全市域1∶10000小流域地质灾害精细化调查全覆盖。推进地质灾害监测台站新建和专群结合监测点改建升级，对三峡库区重点崩塌滑坡隐患点实施专业监测，对高风险和极高风险区居民集中的重点斜坡开展面域监测。完成无人机站建设，构建高风险区光学遥感面域巡检能力。优化地质灾害气象风险预警模型，提升地质灾害气象风险早期预警能力。\n\n2﹒有序实施地质灾害综合治理。分级分类推进地质灾害防治，对危害性大且难以实施避险搬迁的地质灾害隐患区域分年度实施工程治理，对稳定性较差、规模较小的隐患点实施排危降险。以易地建房就近安置、鼓励城镇落户安置等方式，逐年部署实施避险搬迁任务。巩固提升三峡库区危岩地灾治理成效，加强对威胁航道安全的危岩地灾隐患点的监测预警，确保三峡库区危岩地灾态势整体稳定、风险总体可控。\n\n（四）健全生态安全应急防护体系\n\n1﹒健全生态安全体系。持续健全生态安全特色指标和风险监测预警体系，提升生态安全智控体系实战化效能。健全突发环境事件联防联控机制，强化重大项目生态安全风险审查，坚决防范重特大突发环境事件和生态破坏事件发生。"}, {"chunkIndex": 25, "text": "标和风险监测预警体系，提升生态安全智控体系实战化效能。健全突发环境事件联防联控机制，强化重大项目生态安全风险审查，坚决防范重特大突发环境事件和生态破坏事件发生。\n2﹒提升环境风险应急实战能力。加强涉危险化学品、涉重金属等的企业和港口码头、物流枢纽等区域环境风险隐患排查整治。统筹完善“一河（园、路、库）一策一图”环境应急准备体系，健全长江干流、跨界河流、化工园区等的突发环境事件监测预警体系。加强突发环境事件应急预案管理，深化生态环境应急基础能力建设，完善环境应急物资储备体系。推动环境应急指挥平台智慧化升级，健全突发环境事件“一键响应”机制。\n\n3﹒有效防范新污染物环境与健康风险。加强对持久性有机污染物、内分泌干扰物、抗生素、微塑料等新污染物的调查监测，开展化学物质环境信息调查，严格落实重点管控新污染物环境风险管控措施。开展生态环境健康风险评估和居民生态环境健康素养监测，提升生态环境健康管理能力。\n\n专栏6  生态安全风险防范重大事项\n\n1﹒环境风险防控。实施中心城区医疗废物收运处置设施建设，梯次推进19张床位以上的医疗卫生机构电子转移联单全覆盖。建成投运西南地区特殊类别危险废物（飞灰）集中处置中心，危险废物填埋量占比控制在10%以内。完成13个涉重金属重点区县环境安全隐患排查整治。"}, {"chunkIndex": 26, "text": "构电子转移联单全覆盖。建成投运西南地区特殊类别危险废物（飞灰）集中处置中心，危险废物填埋量占比控制在10%以内。完成13个涉重金属重点区县环境安全隐患排查整治。\n2﹒森林防灭火一体化。建设重庆市森林草原火灾预防管理系统和应急指挥调度系统，健全森林防灭火“行政指挥+专业指挥+专家组”指挥机制。推进国有林场森林防火专业队伍标准化、专业化和规范化建设，实施重点区域森林防灭火能力提升、森林草原防火综合监测项目，建设人工智能赋能森林火灾风险预警模型。\n\n3﹒地质灾害综合防治。每年汛前1次、汛中2次开展地质灾害隐患综合遥感识别，开展城镇开发边界内城市地质安全风险调查评价与区划，落实“隐患点+风险区”双控管理，实施三峡库区重庆段地质灾害防治项目。\n\n4﹒生态安全防护体系建设。加强沿江环境风险隐患排查整治，推进重点河流“一河一策一图”、市级化工园区“一园一策一图”、危化品运输道路“一路一策一图”、尾矿库“一库一策一图”的应急准备体系建设。推进重点流域环境应急设备物资库、队伍建设，迭代升级重庆市环境风险应急指挥系统。加强新污染物综合治理。深化酉阳、武隆国家生态环境健康管理试点，率先在试点地区开展重点区域生态环境健康风险评估。\n\n七、突出改革创新，提升美丽重庆建设治理效能\n\n（一）完善生态环境保护监督管理机制"}, {"chunkIndex": 27, "text": "\n七、突出改革创新，提升美丽重庆建设治理效能\n\n（一）完善生态环境保护监督管理机制\n1﹒压紧压实生态环境保护责任。全面强化地方党政领导干部生态环境保护责任制，健全生态文明建设情况报告制度，深化领导干部自然资源资产离任审计。严格落实生态环境损害赔偿制度，依法依规开展生态环境损害赔偿。持续优化项目环境影响评价分级分类管理，加强与生态环境分区管控、排污许可、碳排放双控等制度的衔接，探索将甲烷等非二氧化碳温室气体排放管控纳入环评管理范畴。深化生态环境统计改革，健全以排污许可制为核心的固定污染源监管制度，推进生态环境统计与排污许可融合。深化环境信息依法披露制度建设，加强环境信用评价管理。\n\n2﹒完善美丽重庆法规标准体系。对照生态环境法典，有序推进有关地方性法规规章立、改、废等工作，开展大气环境、水环境、碳足迹、新污染物等地方生态环境标准制（修）订。坚持严格规范公正执法，强化生态环境领域司法保护，深化行政执法与刑事司法双向衔接机制规范化建设试点，协同推进生态警务机制建设。加强和规范生态环境司法修复，因地制宜打造生态环境司法修复基地。\n\n3﹒深入推进生态环境保护督察。体系化推进中央生态环境保护督察整改，推动整改事项按期清零并长效巩固。深入开展市级生态环境保护督察，完善以例行督察为主体和以专项督察、日常督察、暗查暗访为补充的生态环境保护督察体系，探索市级部门和市属国有企业例行督察模式。迭代完善“生态环保督察问题清单”工作体系，严格定期调度、跟踪督办、晾晒评价全周期全过程管控。"}, {"chunkIndex": 28, "text": "补充的生态环境保护督察体系，探索市级部门和市属国有企业例行督察模式。迭代完善“生态环保督察问题清单”工作体系，严格定期调度、跟踪督办、晾晒评价全周期全过程管控。\n（二）推动市场激励政策创新优化\n\n1﹒深化资源环境要素市场改革。积极参与全国碳市场建设，升级扩容重庆碳排放权交易市场，探索开展非二氧化碳温室气体管控，率先建成温室气体全品类交易的地方碳排放权交易市场。升级碳惠通平台，构建机制完善、系统智能、区域协同、场景多元、用户活跃的碳普惠体系。完善排污权有偿使用和交易制度，创新排污权资产登记制度，探索水权质押贷款等融资模式。依法依规落实环境保护、节能节水、资源综合利用等财税优惠政策。\n\n2﹒大力发展绿色金融。纵深推进绿色金融改革创新试验区建设，迭代绿色信贷、绿色保险等金融产品和服务，依法依规将符合条件的绿色金融和转型金融产品纳入政府性融资担保支持范围。完善现有绿色金融和转型金融标准体系，开展生物多样性金融标准试用，拓展农业、建材、钢铁、煤电等行业转型金融标准试点应用范围。探索区域性生态环境保护项目金融支持模式，进一步推进生态环境导向的开发模式应用。\n\n3﹒拓展生态产品价值实现途径。深化自然资源资产产权制度改革，优化完善自然资源统一调查评价监测、自然资源和不动产统一产权等制度。健全林业、水土保持等领域生态产品价值实现体系，提质扩面推进转化交易。实施生态产品价值实现机制试点工作，开展特定地域单元生态产品价值核算探索。推动建立长江干流（渝鄂段）、乌江流域跨省市生态补偿机制，深化森林生态效益等综合生态补偿制度建设，探索建立空气质量生态补偿机制。"}, {"chunkIndex": 29, "text": "特定地域单元生态产品价值核算探索。推动建立长江干流（渝鄂段）、乌江流域跨省市生态补偿机制，深化森林生态效益等综合生态补偿制度建设，探索建立空气质量生态补偿机制。\n（三）强化科技创新和智治赋能\n\n1﹒加强关键科技攻关与转化应用。聚焦大气污染精准改善、固体废物处置利用、新污染物治理、生物多样性保护等关键领域开展科技攻关。加强低碳零碳负碳以及分布式能源、再生资源循环、入河排污口快速排查溯源及管控等领域关键技术研发。组建绿色低碳产学研联盟，推动技术创新成果转化应用。\n\n2﹒提升现代化监测执法能力。推进以生态环境监测区域分中心建设为重点的“三级架构”提质升级，协同完善天空地一体化生态环境监测网络，深化监测数智化转型，健全全链条质量监管机制。依法依规推进排污许可重点管理单位安装使用自动监测、视频监控等设备，升级污染源在线监测监管平台。提升现代化执法装备保障能力，增添远程非现场质控手段，强化无人机、水质指纹等新技术装备在环保领域的运用，探索建立人工智能赋能“信用+执法”“执法+监督”等综合场景。\n\n3﹒提升数智赋能生态治理实战效能。构建完善“数字生态环保大脑”，推进生态环境领域知识库及高质量行业数据集建设。深化数据资源共享开放，促进跨部门、跨区域、跨层级数据深度融合与安全流通，夯实生态环境治理数字底座。推进西南地区及长江上游生态环境数智化治理创新应用基地建设，深化智慧河长、智慧林长、数字气象等数字化应用，提升治水、治气、治废等应用实战实效。\n\n（四）深化成渝地区双城经济圈共保联治体系建设"}, {"chunkIndex": 30, "text": "境数智化治理创新应用基地建设，深化智慧河长、智慧林长、数字气象等数字化应用，提升治水、治气、治废等应用实战实效。\n\n（四）深化成渝地区双城经济圈共保联治体系建设\n1﹒加强生态系统协同保护。完善多层次国土空间生态保护体系，统筹推进华蓥山、明月山等跨界平行岭谷保护修复，构筑以长江、嘉陵江、涪江等为主体的水系生态廊道。强化生态保护红线、自然保护地等重要生态空间保护和修复监管协同，加强生态破坏问题线索核查整改。\n\n2﹒推进跨界污染协同治理。全面推进跨界河流联防联治，强化水质超标预警与测管协同。加强大气污染联防联控，联动开展重污染天气预警和应急减排。深化川渝“无废城市”共建，优化危险废物跨省市转移“白名单”制度，推动毗邻地区设施共建共享和跨省市协同应急处置固体废物。完善新污染物环境风险省际联防联控机制，探索新污染物数据信息共享、管控措施协同模式。\n\n3﹒完善生态环境协作机制。探索开展跨区域跨流域生态环境协同立法，有序推进跨区域生态环境案件司法保护协作。深化长江流域川渝横向生态保护补偿机制。开展毗邻地区生态环境保护联合执法，基本实现川渝两地生态环境行政处罚裁量基准统一。\n\n专栏7  生态治理体系和能力提升重大事项\n\n1﹒完善生态环境保护监督管理机制。推动制定水生生物保护、生态环境损害赔偿等地方性法规，推进工业炉窑、砖瓦工业、涉铊工业等地方排放标准制（修）订，推动第三轮中央生态环境保护督察30项整改任务按期完成并长效巩固。"}, {"chunkIndex": 31, "text": "物保护、生态环境损害赔偿等地方性法规，推进工业炉窑、砖瓦工业、涉铊工业等地方排放标准制（修）订，推动第三轮中央生态环境保护督察30项整改任务按期完成并长效巩固。\n2﹒市场激励政策优化。深化绿色金融和转型金融改革、资源环境要素市场化配置改革。持续推进武隆、北碚、梁平等区县生态产品价值实现机制试点工作，争创3—4个国家生态文明建设示范区、“绿水青山就是金山银山”实践创新基地，全市绿色贷款余额力争突破1.6万亿元。\n\n3﹒科技创新和智治赋能。新攻克绿色低碳关键技术100项以上，建设绿色低碳领域市级及以上科技创新平台100个。持续开展生态康养、环境DNA等试点监测。加强数智化监测基础设施建设，提升空气质量、水生态、地下水水质等的预警预报水平，升级空气质量预测预报模型。构建全域污染防治攻坚智管体系，打造“人工智能+生态环境”高质量数据集4个以上，生态环境保护业务运行数字化率达到95%以上。\n\n4﹒成渝地区双城经济圈协同治理。川渝联合申报实施新一轮山水林田湖草沙一体化保护和修复工程，推进琼江、大陆溪、任市河等流域联防联治，协作建成10条以上跨界美丽河湖、幸福河湖。制定川渝高竹新区一体化的生态环境分区管控方案，实施固体废物（危险废物）跨省转移简化审批试点。\n\n八、加强组织实施"}, {"chunkIndex": 32, "text": "联治，协作建成10条以上跨界美丽河湖、幸福河湖。制定川渝高竹新区一体化的生态环境分区管控方案，实施固体废物（危险废物）跨省转移简化审批试点。\n\n八、加强组织实施\n加强党对美丽重庆建设工作的全面领导，充分发挥美丽重庆建设领导小组和市生态环境保护督察工作领导小组的统筹协调作用，强化市负总责、区县抓落实的工作机制。健全美丽重庆建设重大工程实施机制，强化资金和要素保障。开展美丽重庆建设进程评估，深入发掘和宣传美丽重庆建设中涌现出来的标志性成果、创新性举措、示范性案例和先进人物，打造“美丽重庆”故事库。及时开展规划实施动态监测、中期评估、总结评估，强化评估结果与“生态报表”“生态环保督察问题清单”衔接，根据实际情况动态优化任务举措。"}], "suggestDocId": 2097637769845526529, "fixable": false, "hint": "该题答案横跨整篇文档（AI 建议补充 33 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "B-07", "category": "docnum", "question": "渝府办发〔2026〕8号 这份文件是关于什么内容的？", "answer": "即《重庆市推进城市全域数字化转型行动计划》。2026年2月10日 （此件公开发布） 重庆市推进城市全域数字化转型行动计划 为推动数据赋能城市高质量发展，特制定本行动计划。", "expectRefusal": false, "gold": [{"docId": 2097637763906392065, "chunkIndex": 1, "why": "重庆市推进城市全域数字化转型行动计划 正文开头", "quote": "", "text": "\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求\n以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实市委、市政府工作部署，加快推进AI（人工智能）赋能数字重庆建设，塑造城市发展、服务、安全和治理新模式，率先走出超大城市现代化治理新路子。到2027年，全面建成数字重庆体系能力，有力支撑现代化人民城市建设。发布基础空间图层超过1500个，可调度智算规模达到10万PFLOPS，数据供需满足率保持在96%以上，建设高质量数据集5000个，谋划打造综合场景200个，“渝快办”“渝快政”日活用户数超120万，新培育数据企业1000家，数字经济核心产业增加值占地区生产总值的比重达到11.1%。\n\n二、数字底座能力提升行动\n\n（一）融通数据循环。迭代公共数据资源体系，提升公共数据高质量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。"}, {"docId": 2097637763906392065, "chunkIndex": 2, "why": "重庆市推进城市全域数字化转型行动计划 正文开头", "quote": "", "text": "量归集、共享、开放、授权等全生命周期管理能力。推进关键数据基础设施建设，试点建设国家区域数据流通基础设施功能节点，打造城市、行业、企业、跨境、个人可信数据空间。\n（二）提质网络通道。扩容重庆国家级互联网骨干直联点，推进5G-A（第五代移动通信技术演进版）升级、6G（第六代移动通信技术）研发应用、IPv6（互联网协议第6版）规模部署，用好中新（重庆）国际互联网数据专用通道，提升工业互联网基础设施能力，完善政务网络带宽监测调配机制，加快建设国家区块链网络（西南）枢纽节点。深化基于电子政务外网和视联网的“一网两线”政务网建设。积极参与空天地网络融合设施建设，鼓励区县承接试点。\n\n（三）强化算力协同。提质建设全国一体化算力网络成渝国家枢纽节点，加快建设重庆数据中心集群，深入实施“疆算入渝”工程，推动低效数据中心节能降碳改造，探索算力电力协同布局，迭代升级国家（西部）算力调度平台，夯实拓展算力“一朵云”。\n\n（四）推进AI赋能。优化数字重庆人工智能底座，培育建设一批政府侧、行业侧高质量数据集。强化大模型和智能体“一本账”统筹管理，统一部署语言、视觉、多模态等通用大模型，迭代超大城市治理大模型，提速打造汽车行业等垂类大模型。培育AI+市域开源生态，加快建设重庆人工智能学院、重庆通用人工智能研究院，提速发展重庆人工智能湾区，引育一批AI企业，打造“模力高地”等创新孵化生态空间。"}], "source": {"pairId": "", "policyDocId": 2097637763906392065, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕8号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕8号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据缺失"], "reason": "标准答案准确概括了文件主题，但仅标注正文段落[1]作为证据，未包含元数据段落[0]（含文号与标题对应关系），导致无法从证据中直接验证'渝府办发〔2026〕8号'即该行动计划。", "suggestion": "将段落 [0] 补充标记为证据（★），以建立文号与文件名称的直接关联。", "suggest": [{"chunkIndex": 0, "text": "---\r\ntitle: \"重庆市人民政府办公厅关于印发《重庆市推进城市全域数字化转型行动计划》的通知\"\r\nfileNum: \"渝府办发〔2026〕8号\"\r\npubDate: 2026-02-12 17:19:17\r\nsourceUrl: http://www.cq.gov.cn/zwgk/zfxxgkml/szfwj/qtgw/202602/t20260212_15440236.html\r\nmetadataId: 15440236\r\nchannelId: 121935\r\nsubcat: 949\r\nbodyShort: false\r\n---\n\n重庆市人民政府办公厅关于\n\n印发《重庆市推进城市全域数字化转型\n\n行动计划》的通知\n\n渝府办发〔2026〕8号\n\n各区县（自治县）人民政府，市政府各部门，有关单位：\n\n《重庆市推进城市全域数字化转型行动计划》已经市政府同意，现印发给你们，请认真贯彻执行。\n\n重庆市人民政府办公厅\n\n2026年2月10日\n\n（此件公开发布）\n\n重庆市推进城市全域数字化转型行动计划\n\n为推动数据赋能城市高质量发展，特制定本行动计划。\n\n一、总体要求"}], "suggestDocId": 2097637763906392065, "fixable": true, "hint": ""}}, {"id": "B-08", "category": "docnum", "question": "请介绍一下 渝府办发〔2026〕41号 文件的主要内容。", "answer": "即《重庆市“十五五”文化旅游发展规划（2026—2030年）》。重庆市人民政府办公厅 2026年8月5日 （本文有删减） 重庆市“十五五”文化旅游发展规划 （2026—2030年） 为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五", "expectRefusal": false, "gold": [{"docId": 2097637770155905026, "chunkIndex": 1, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年） 正文开头", "quote": "", "text": "\n重庆市人民政府办公厅\n\n2026年8月5日\n\n（本文有删减）\n\n重庆市“十五五”文化旅游发展规划\n\n（2026—2030年）\n为全面提升重庆文化和旅游发展能级，加快建设文化旅游强市，根据《旅游强国建设“十五五”规划》（文旅资源发〔2026〕42号）和《重庆市国民经济和社会发展第十五个五年规划纲要》（渝府发〔2026〕7号）等文件精神，制定本规划。\n\n一、总体要求\n\n坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，全面落实习近平总书记视察重庆重要讲话重要指示精神，紧扣做实“两大定位”、发挥“三个作用”，坚持以文塑旅、以旅彰文，突出创新引领、数智赋能、改革突破、开放协同，持续做靓“雄奇山水 新韵重庆”品牌，加快打造巴蜀文化旅游走廊标志性成果，提质建设具有国际范、中国韵、重庆味的文化旅游强市，为奋力谱写中国式现代化重庆篇章注入强劲文旅动能。到2030年，文化旅游强市建设取得显著进展，文化旅游惠民生、扩内需、增动能综合效能全面释放，赋能经济社会高质量发展铸就新篇章。\n\n——巴蜀文化旅游走廊建设实现新提升。平台联通、标准互认、品牌同塑、项目共建等协同联动机制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。"}, {"docId": 2097637770155905026, "chunkIndex": 2, "why": "重庆市“十五五”文化旅游发展规划（2026—2030年） 正文开头", "quote": "", "text": "制高效运行，文脉相守、文化惠民、旅游利民效应全面彰显，文旅协同发展区等平台持续增效，“渝进蓉出、蓉进渝出”互访游客量达1.5亿人次，川渝文旅统一大市场全面形成。\n——产业发展能级实现新跃升。文旅产业成为国民经济支柱产业，文化及相关产业增加值等主要经济指标进入全国前列，为全国文化旅游高质量发展提供重庆案例。\n\n——文旅深度融合迈出新步伐。文旅市场、产品、业态、场景等领域实现全链条融合，在特色场景营造、新业态培育、现象级消费引流等方面形成区域领先优势。\n\n——高质量便利服务再上新台阶。覆盖全域、便捷高效、安全舒适的现代文旅公共服务体系构建形成，游客综合满意度持续保持全国前列，主客共享的文旅氛围更加浓厚，“最宠游客城市”形象深入人心。\n\n——文化繁荣发展构筑新图景。巴渝文化标识体系全面完善，文艺“攀峰登顶”之作不断涌现，文化遗产保护传承更加有力，文化软实力成为城市发展核心竞争力。\n\n——对外开放合作取得新突破。“雄奇山水 新韵重庆”品牌国际影响力持续攀升，内外联动的文旅交流合作平台日臻完善，入境便利化水平显著提升，打造我国内陆入境游首选地。\n\n——数智全域赋能形成新范式。数智文旅体系能力构建形成，人工智能与数据要素赋能文旅全域发展，重点文旅场所数字化转型基本完成，数智文旅多项创新实践成为全国可复制、可推广的典型经验。\n\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局"}], "source": {"pairId": "", "policyDocId": 2097637770155905026, "policyTitle": "重庆市人民政府办公厅关于印发《重庆市“十五五”文化旅游发展规划（2026—2030年）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府办发〔2026〕41号"}, "permission": null, "meta": {"qType": "docnum", "evidenceKey": "渝府办发〔2026〕41号", "answerQuote": "", "candidateChunks": [1, 2, 3, 4, 5, 6], "goldVerified": false, "generatedBy": "rule", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 2, "naturalness": 4}, "issues": ["证据缺失", "答案不完整"], "reason": "问题要求介绍文件‘主要内容’，但标准答案仅截取了开头部分（总体要求的前半段），严重缺失后续所有章节内容；且标注的证据段落（★）也仅覆盖开头，未包含构成‘主要内容’所需的全文核心章节。", "suggestion": "1. 修改标准答案：需概括或列出文件的十四个主要章节标题及核心要点，而非仅复制开头文本。2. 补充证据标注：将涵盖各章节核心内容的段落（如[3]-[25]中的关键段落）全部标记为 ★，以支撑对‘主要内容’的回答。", "suggest": [{"chunkIndex": 3, "text": "\n二、提升巴蜀文化旅游走廊牵引带动能级\n\n（一）迭代升级“1核3带9线”空间布局\n强化“世界山水都市旅游核”引领，丰富商务差旅、会展团建、赛事主题、文化交流等特色产品，开发“滨水+”体育、艺术、科技、美食等多元业态，迭代升级“江崖街洞天”“桥隧轨梯廊”等特色文旅场景，优化交通接驳和轻旅居配套服务，打造都市商文旅体展综合圈、滨江休闲带、休闲旅居线。提升“三大高品质文旅景观带”主轴支撑力，活化利用渝西片区历史古镇、非物质文化遗产（以下简称非遗）街区、文化遗址，升级打造渝东北三峡游轮、峡谷风光等经典产品，挖掘放大渝东南“山水林泉洞”“武陵民族风”资源优势，提质千年成渝古道、壮美长江三峡、多彩风情武陵文旅景观带。加快“九大精品旅游线路”全域贯通，谋划打造一批特色旅游支线，加快建设节点串联、业态互补、场景共建的立体旅游网络。\n\n（二）扩面提质建设川渝文旅统一大市场\n\n完善川渝协同共建机制，做强“宽洪大量”“点石成金”“资足常乐”等特色文旅IP（知识产权），优化“渝进蓉出、蓉进渝出”客流共享模式，做实巴蜀文化旅游走廊产业联盟，创新实施“畅游巴蜀”“旅游一卡通”等文旅惠民措施。深化“惠游重庆”“智游天府”平台互联互通，推动两地景区、文博场馆实现“一键预约、一网通办、一码通用”，提升跨区域文旅公共服务便捷度、智慧化水平。健全川渝文旅市场联合执法、案件协查协办、线索移送共享、监管信息互通机制，强化跨区域市场秩序协同整治，打造公平公正、开放有序、诚信守法的川渝文旅市场环境。"}, {"chunkIndex": 4, "text": "化水平。健全川渝文旅市场联合执法、案件协查协办、线索移送共享、监管信息互通机制，强化跨区域市场秩序协同整治，打造公平公正、开放有序、诚信守法的川渝文旅市场环境。\n（三）协同打造区域文旅发展共同体\n\n健全大都市、大三峡、大武陵协同联动机制，以都市圈业态输出、客流导入、对口协同等带动山区库区文旅高质量发展。深化川渝协同，探索实施文旅资源集聚区与行政区适度分离，推动文脉相守、线路互通、景区联动，加快建设大巴山与高峡平湖、大华蓥与明月山等协同发展区，打造“游巴蜀·看中国”等区域品牌。强化渝鄂合作，加强水陆空立体文旅线路联动，共建长江三峡国际黄金旅游带。拓展渝湘、渝黔、渝陕文旅合作空间，推出武陵山区、秦巴山区旅游环线与“多景联游”“一程多站”产品。提升西部陆海新通道旅游联结功能，加强京津冀、长三角、粤港澳大湾区等客源市场引流，扩大文旅市场规模。\n\n三、推动新时代文艺攀峰登顶\n\n（一）打造“渝字号”文艺精品\n\n坚守新时代文艺创作方向，提升文化原创能力，围绕新中国成立80周年、重庆直辖30周年等重大时间节点，抓好重大题材文艺创排，推出《重器》《大江安澜》《长江》等一批大剧大戏、小戏小品。实施新时代创作引导计划，健全文艺创作生产和服务智治体系，探索推行重点创作项目“揭榜挂帅”制度，构建策划、创排、打磨、储备良性循环格局。\n\n（二）培塑特色文艺品牌"}, {"chunkIndex": 5, "text": "实施新时代创作引导计划，健全文艺创作生产和服务智治体系，探索推行重点创作项目“揭榜挂帅”制度，构建策划、创排、打磨、储备良性循环格局。\n\n（二）培塑特色文艺品牌\n搭建特色文艺活动品牌矩阵，参与承办国家级艺术节展活动，力争有1项国家级文艺奖项评选活动在渝常年举办。办好市级主题艺术活动，持续培育重庆辨识度演艺品牌，鼓励文旅驻场演艺提升市场影响力。实施“重庆好戏”优质文化资源直达基层项目，鼓励发展新大众文艺创演品牌。实施美术“添彩”计划，夯实油画、雕塑等传统美术发展基础，拓展数字艺术、公共艺术、设计等应用美术内涵。引入沉浸式展览、艺术市集等新业态，打造艺术社区街区、演艺综合体、特色剧场和文艺名家工作室。鼓励文艺单位开辟线上“第二舞台”，孵化网络文艺新品牌。\n\n（三）涵养文艺发展生态\n\n改进艺术管理工作，推进创作机制改革。深化国有文艺院团“一团一策”改革，扶持基层文艺院团发展，形成“国有+民营”协同发展新格局。鼓励市内艺术类院校加强文艺理论研究，与文艺院团、美术馆开展产学研合作。完善人才选育管用全链条机制，优化全国领军、青年拔尖、后备人才队伍，加强编剧导演、经营管理、数字技术等专业人才培养。健全文艺评论常态化引导机制。\n\n四、促进巴渝文脉薪火相传\n\n（一）强化文化遗产系统性保护"}, {"chunkIndex": 6, "text": "青年拔尖、后备人才队伍，加强编剧导演、经营管理、数字技术等专业人才培养。健全文艺评论常态化引导机制。\n\n四、促进巴渝文脉薪火相传\n\n（一）强化文化遗产系统性保护\n加强文物、非遗、历史文化名城名镇名村、历史文化街区、传统村落系统保护和活态传承，推动城市更新、乡村振兴与文化保护传承协同发展。加强文物资源管理，完善不可移动文物资源、博物馆藏品、古籍等数据库。加强文化遗产统一监管，强化文物卫星遥感监测和防灾减灾，加大文物督察执法检查力度，严厉打击文物犯罪行为。\n\n（二）加强文物保护和活化利用\n\n全面落实“先考古、后出让”“先调查、后建设”制度。实施红岩革命文物保护传承工程，着力构建红岩革命文物保护传承体系。加强三峡文物保护利用，争创三峡国家考古遗址公园。推进川渝石窟寺系统性保护，构建全要素展示体系，高水平共建川渝石窟寺国家遗址公园。系统推进工业遗产、“三线建设”遗产等的保护利用。加快推进涪陵白鹤梁题刻与埃及罗达岛尼罗尺联合申报世界文化遗产。活化利用涉外文物旧址及抗战遗址，串珠成链打造文旅精品线路。提档升级历史、革命、抗战、工业、自然博物馆集群，创新沉浸式展览、数字人导览、全息展示等形式，打造一批主题鲜明的文物外展精品。\n\n（三）深化文明探源与价值阐释"}, {"chunkIndex": 7, "text": "路。提档升级历史、革命、抗战、工业、自然博物馆集群，创新沉浸式展览、数字人导览、全息展示等形式，打造一批主题鲜明的文物外展精品。\n\n（三）深化文明探源与价值阐释\n实施文化基因激活计划，深化巴渝文化、三峡文化、抗战文化、革命文化、统战文化、移民文化研究阐释，打造名城、名人、名馆、名品、名作标志性项目，弘扬“坚韧、忠勇、开放、争先”城市精神。加强长江文化研究，促进世界大河文明交流互鉴。持续推进巴蜀文明进程研究，系统阐释川渝地区文明演进及其融入中华民族多元一体格局的历史进程。深化巴文化研究，系统研究巴文明在长江上游地区形成发展脉络与文化特质。加强世界反法西斯远东指挥中心、中共中央南方局等历史研究阐释，弘扬伟大的抗战精神。挖掘远古巴巫遗存向上向善价值，探索现代表达与价值转化机制。充分发挥大足石刻研究院、市文物考古研究院作用，强化全市重点石窟寺和各类文物考古研究。\n\n（四）提升非遗保护传承水平\n\n加强非遗系统性保护，高质量建设武陵山区（渝东南）土家族苗族文化生态保护区，加快创建巴蜀文化生态保护区。谋划建设重庆非物质文化遗产馆，打造非遗工坊和非遗传承体验新场景。实施非遗焕新计划，推动传统工艺、戏剧、曲艺等高质量传承发展。深化非遗与旅游融合发展，发布非遗特色旅游线路。办好第九届中国非物质文化遗产博览会，打造非遗传播活动品牌。深入开展“非遗在社区”“非遗在校园”工作。实施青年非遗传承人培育行动，强化非遗保护专家人才队伍建设，推动形成梯次合理的非遗传承体系。\n\n五、健全现代公共文化服务体系\n\n（一）推动公共文化服务改革创新"}, {"chunkIndex": 8, "text": "作。实施青年非遗传承人培育行动，强化非遗保护专家人才队伍建设，推动形成梯次合理的非遗传承体系。\n\n五、健全现代公共文化服务体系\n\n（一）推动公共文化服务改革创新\n兼顾城乡差异、人口均衡，推动“15分钟高品质文化生活圈”市域全覆盖，打造群众“家门口”的文化服务站。构建公共文化资源供需对接平台，推进精准供给与质效提升。完善社会力量参与公共文化服务机制，探索合作共建、公建民营等模式，创新发展文化志愿者服务。深化公共文化机构改革，健全一馆多址、总分馆建设运营机制，探索有偿提供普惠性非基本公共文化服务，分级分类稳步推进公共文化设施所有权和使用权分置改革试点。\n\n（二）实施公共文化服务提质增效行动\n\n扩容提质图书、文博、艺术等重大文化设施，补齐功能性文化设施短板，补强基层弱项，健全市—区县—乡镇（街道）—村社“四级”网络，打造主题场馆。融入城市更新，用好存量资源，实施新型公共文化空间培育计划，制定出台运营服务地方标准。推动优质文化资源直达基层，常态化开展流动文化进基层活动，培育基层文化服务“百强”品牌，探索建立基层文化指导员制度。\n\n（三）深入推进文化惠民"}, {"chunkIndex": 9, "text": "台运营服务地方标准。推动优质文化资源直达基层，常态化开展流动文化进基层活动，培育基层文化服务“百强”品牌，探索建立基层文化指导员制度。\n\n（三）深入推进文化惠民\n深化全民阅读服务，构建“133N”（1个全民阅读生态集群，公共文化服务、社会公益服务、文化消费服务3大服务形态，融合阅读、共同阅读、终身阅读3大服务场景，以“书香重庆”为代表的系列全民阅读品牌）全民阅读体系，实施“陆海之阅”共同阅读行动，拓展“巴·掌书进轨道”和“巴蜀高铁掌书廊”覆盖面，提升“书香重庆”品牌辨识度。繁荣发展群众文化，丰富艺术夜校、老年文艺大学、青少年美育等服务供给。繁荣互联网条件下新大众文艺，引导群众文化与人工智能、网络视听深度融合。强化部门联动，推行分众化精准文化服务，面向重点群体构建无障碍、陪伴式、友好型公共文化服务保障体系。\n\n六、构筑新型广电大视听体系\n\n（一）推进广电媒体系统性变革"}, {"chunkIndex": 10, "text": "强化部门联动，推行分众化精准文化服务，面向重点群体构建无障碍、陪伴式、友好型公共文化服务保障体系。\n\n六、构筑新型广电大视听体系\n\n（一）推进广电媒体系统性变革\n深化新型主流媒体建设，做强“第1眼TV”，迭代升级“台、网、端、号、屏、夜空”六维一体传播体系，构建“电视+移动端+新媒体平台”立体传播矩阵。推动广电媒体深度融合发展，优化频率频道部署，整合配置地面电视频道资源，促进频道专业化特色化发展。实施广播电视内容焕新计划，强化新闻立台，创新民生节目，拓展“广电+”行动，丰富多元化内容。体系化推进重庆4K超高清频道建设。依托IPTV（交互式网络电视）、有线网络渠道，联动头部平台，深化台网融合。加强区县广电媒体节目制作和播出，推动区县融媒体中心特色化发展。做强西部视听译制出海中心，完善西部国际传播中心事业产业协同运行机制，增强国际传播效能。支持优秀视听创作机构做强海外传播平台，围绕共建“一带一路”等主题，创新推出电视剧、纪录片、动画片等国际传播内容，实施“长江遇见”系列合拍项目，推动优质视听内容“出海”。\n\n（二）提升内容生产和服务能力"}, {"chunkIndex": 11, "text": "绕共建“一带一路”等主题，创新推出电视剧、纪录片、动画片等国际传播内容，实施“长江遇见”系列合拍项目，推动优质视听内容“出海”。\n\n（二）提升内容生产和服务能力\n完善广电视听精品创作生产组织工作机制，开展“登高攀峰”行动，实施“剧美中国·新韵重庆”电视剧繁荣等创作计划，聚焦建军100周年等重要节点，打造一批精品影视剧。加强政策扶持引导，培育更具活力的内容创作生态。深化广电公共服务，迭代完善应急广播体系，推进“智慧广电+公共服务”建设，实施广电视听服务和体验“双提升”工程，推动高清超高清电视公共服务全民共享，构建贯通区县、乡镇（街道）、村（社区）三级的基层广电服务网络。\n\n（三）强化科技产业引领和行业治理\n\n加快数智广电和新型广电网络建设，推动基础设施网络优化升级。完善广电视听产业统筹引导机制，构建市、区县两级政策联动体系，推动广电视听产业补链、强链、延链。强化广播电视安全播出，加强关键信息基础设施保护，推进老旧设备更新换代，防范网络攻击等新型安全风险。加强广电行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业"}, {"chunkIndex": 12, "text": "行业综合治理，深入开展境外卫星电视传播秩序规范、违规广告播出整治、“黑广播”整治和“清朗视听”等专项行动。\n\n七、构建现代文旅产业体系\n\n（一）做强主导优势产业\n推动创意设计、数字内容产业向全链条渗透、向高价值链攀升、向体验式升级。创意设计产业重点应用AI（人工智能）生成式设计，发展“文创+工业设计”“文创+在地文化”等融合模式，培育文博IP联名开发、非遗跨界设计等新业态，打造“创意重庆”品牌，建设西部创意产业集聚区。数字内容产业重点培育AI内容生产、虚拟拍摄、云端制作等新业态，推动微短剧、短视频、网络直播等细分领域繁荣发展，搭建内容孵化、开发制作一体化服务平台。\n\n（二）壮大特色品牌产业"}, {"chunkIndex": 13, "text": "点培育AI内容生产、虚拟拍摄、云端制作等新业态，推动微短剧、短视频、网络直播等细分领域繁荣发展，搭建内容孵化、开发制作一体化服务平台。\n\n（二）壮大特色品牌产业\n大力发展科技影视、出版传媒、动漫游戏、娱乐演艺、文旅智能装备制造等特色产业。推动科技影视全产业链发展，布局全媒体AIGC（人工智能内容生成）视听创新中心，组建影视产业投资专项基金，放大中国（重庆）科技电影周品牌效应，加强“渝版”影视创制。推动出版传媒创新发展，强化知识资源集成和智能交互，拓展知识服务新场景，建设陆海出版文化综合体。推动动漫游戏产业蓬勃发展，办好中国西部动漫文化节，引育高水平头部电竞企业、战队及赛事，做强重庆市小游戏产业和动漫基地，培育本土动漫品牌。推动娱乐演艺产业繁荣发展，巩固并完善大型文旅活动、大型演唱会、驻场演出、剧场演出、演艺新空间等演艺市场体系，鼓励文艺精品首演首秀首发，发展线上演播、智慧剧场等新模式，打造中央演艺集聚区。推动文旅智能装备制造转型发展，鼓励传统文化制造业“智改数转”，加速研发智能穿戴、文娱无人机等新装备新产品，孵化一批“渝创星品”。\n\n（三）培育文旅新经济\n\n顺应产业发展新形势，推动“AI+文创”“沉浸式体验+文创”“科创+文创”深度融合，大力发展文创潮品、网络短剧、冰雪旅游、康养旅居、低空观光等新兴文旅产业。深化“文旅+百业”“百业+文旅”融合发展，实施场景与项目引领计划，打造“行走的阅读”“跟着赛事去旅行”等一批文旅新业态，引导各区县找准细分赛道，培育新增长点。\n\n八、培塑文旅旗舰产品集群\n\n（一）提质“红岩精神”红色旅游产品"}, {"chunkIndex": 14, "text": "，打造“行走的阅读”“跟着赛事去旅行”等一批文旅新业态，引导各区县找准细分赛道，培育新增长点。\n\n八、培塑文旅旗舰产品集群\n\n（一）提质“红岩精神”红色旅游产品\n构建红岩文化育人体系，支持革命旧址、文化场馆建设爱国主义教育基地，推动革命文物深度融入“大思政课”，提升“红岩思政”等品牌影响力。加强八路军重庆办事处旧址、歌乐山“中美合作所”集中营旧址等红岩革命旧址保护利用，迭代升级重点红色剧目，推动红岩文化公园建设承载红色记忆、赓续红色血脉的重要阵地。统筹綦江、城口、酉阳革命文物连片保护、整体展示，联合打造“重走长征路”主题徒步线路。\n\n（二）做强“潮玩重庆”都市休闲产品\n\n实施“城市更新+文旅”提质工程，对老城肌理、工业遗存、背街小巷等存量空间实施“微改造、精提升”，打造一批都市文旅街区。推动国际国内资本合作，谋划建设具有重庆在地文化特色的主题公园。强化洪崖洞、磁器口、长江索道等的国际化服务功能，聚力打造燕子岩—飞机码头等一批新锐项目，孵化情绪消费、青春经济、电竞经济等新兴业态。推动艺术、文博资源与都市休闲深度融合，做强川美“开放的六月”等艺术展览品牌，增加高品质文博展览供给。升级打造重庆马拉松、渝超联赛等城市精品赛事IP，培育“都市+赛事”新亮点。丰富夜间消费场景，常态化运营城市灯光秀、交响音乐会、江畔演艺、潮玩主题季等精品活动。\n\n（三）打造“文景交融”精品旅游景区产品"}, {"chunkIndex": 15, "text": "事IP，培育“都市+赛事”新亮点。丰富夜间消费场景，常态化运营城市灯光秀、交响音乐会、江畔演艺、潮玩主题季等精品活动。\n\n（三）打造“文景交融”精品旅游景区产品\n实施旅游景区强基焕新工程，推动巫山巫峡·神女、合川钓鱼城、巫溪红池坝、北碚金刀峡等提速创建高品质旅游景区，着力培育千万级核心大景区和多业态文旅大街区。提档升级大足石刻、巫山小三峡·小小三峡、武隆喀斯特、南川金佛山等老牌旅游景区，打造国际知名旅游精品景区。深化“文化润景”发展模式，深挖巴渝文化内涵，推动3A级以上旅游景区业态更新、场景焕新、体验创新。\n\n（四）焕新“亲山乐水”生态康养产品\n\n实施旅游度假区品质提升行动，引导武隆仙女山、丰都南天湖、石柱黄水等国家级旅游度假区培育在地美食、诗意栖居、自然课堂等细分产品，推动开州汉丰湖、北碚缙云山—北温泉、万盛等创建高品质旅游度假区。擦亮“世界温泉之都”“中国温泉之都”品牌，焕新打造主题式康养温泉，拓展康复、美护、疗愈等衍生服务。发展森林康养、气候康养、冰雪度假、中医药康养等融合产品，建设大巴山森林康养步道体系，打造武陵山区中医药康养精品游线。\n\n（五）升级“巴渝乡韵”乡村旅游产品"}, {"chunkIndex": 16, "text": "服务。发展森林康养、气候康养、冰雪度假、中医药康养等融合产品，建设大巴山森林康养步道体系，打造武陵山区中医药康养精品游线。\n\n（五）升级“巴渝乡韵”乡村旅游产品\n实施乡村旅游提质增效行动，探索农文旅融合发展新范式，开展乡村“微提升、精改造”，盘活乡村闲置房产、低效土地、传统村落等存量资源，丰富美丽田园、景观农业、休闲渔业、户外运动等新业态，完善房车露营、乡村民宿等旅游配套设施，推动乡村旅游转型升级。串联二十四节气，开展“渝见四季·沃野生辉”农文旅融合主题活动。做强巴渝特色村超、村晚、村歌、乡戏等在地文体活动，提升乡村内生吸引力。实施乡村旅游后备箱工程，做强“巴味渝珍”特色品牌。\n\n（六）培育“赛博智造”工业旅游产品\n\n焕新升级传统工业旅游，以全息光影、真人实景剧本等新技术赋能工业遗存，让老厂房、老设备讲述新工业故事。做强新工业科创旅游，聚焦智能驾驶、汽车摩托车等优势赛道，开放智能车间、研发实验室等观摩体验场景，开发VR（虚拟现实）/AR（增强现实）智造模拟、整车拼装、智能座舱等沉浸式体验项目，引进国际国内高水平汽摩赛事，提升游客综合体验。丰富“工业旅游+”融合业态，拓展汽摩衍生品、智能穿戴等消费品类，完善工业主题食宿、工业文创展销等配套项目，构建可尝、可居、可购、可体验的全链条消费生态。大力推广重庆先进制造品牌，打造工业主题旅游线路，串联工业遗存、科创场景与赛事活动，让游客充分感知“重庆造”硬核实力。\n\n九、促进文旅消费提质升级\n\n（一）做靓“渝味360碗”美食品牌"}, {"chunkIndex": 17, "text": "牌，打造工业主题旅游线路，串联工业遗存、科创场景与赛事活动，让游客充分感知“重庆造”硬核实力。\n\n九、促进文旅消费提质升级\n\n（一）做靓“渝味360碗”美食品牌\n聚力建设国际美食名城，引育国内“八大菜系”代表性名店、国际知名餐饮品牌首店，引进“米其林”星级、“黑珍珠”钻级等品牌餐饮，高标准发布精品美食线路和指南。培塑丰富多元的渝味圈层，构建“渝味360碗”美食体验店、旗舰店、美食街区矩阵。提升一批魅力菜品，创新发展小面、酸辣粉等名小吃“大单品”，以菜品标准牵引本土食材培育、非遗厨艺活化、文创伴手礼全链条开发，培育一批美食名节名街、名厨名宴。\n\n（二）打造巴渝文旅消费品牌集群\n\n做优“巴渝美宿”住宿品牌，引进培育国内外知名酒店品牌及新概念首店，引导住宿行业龙头企业整合资源培育知名住宿品牌，推出一批云端民宿、江景酒店、森林树屋，培育情景式住宿体系，打造绿色饭店、未来酒店。升级“重庆好礼”购物品牌，培育国货“潮牌”“潮品”，建设一批文旅商体展综合体。打响“重庆好剧”文娱品牌，推动重庆大剧院、国泰艺术中心等场馆设立常态化驻场精品项目，提升一批非遗实景体验，升级重庆奥体中心、龙兴足球场等文体展演地标，引入带动性强的演唱会、音乐节。\n\n（三）丰富拓展新兴消费场景"}, {"chunkIndex": 18, "text": "中心等场馆设立常态化驻场精品项目，提升一批非遗实景体验，升级重庆奥体中心、龙兴足球场等文体展演地标，引入带动性强的演唱会、音乐节。\n\n（三）丰富拓展新兴消费场景\n瞄准“亲子家庭”“Z世代”“银发族”等重点群体，打造“悦己旅游”“Citywalk山城漫游”“萌宠市集”“轻户外微露营”等情绪消费新场景，推动实景直播、AR打卡、线上种草与线下引流双向转化。盘活城市闲置空地、街巷边角等“金角银边”资源及低效楼宇、闲置商业空间，植入轻量化、复合型消费载体。推动影院、剧场、书店等数字化改造，赋予传统文娱空间新型消费功能。引导社区咖啡店、餐饮店深挖在地文化内涵，构建主客共享型邻里消费空间。推进菜园坝等老成渝铁路线站点改造，丰富主题旅游专列线路。打造便民惠民的社区微度假空间。开展中医药入境消费服务贸易试点，培育国际医疗旅游集聚区。优化文旅消费环境，鼓励推出旅游套票、年卡、消费券等惠民措施，持续举办消费促进活动。\n\n十、做靓“雄奇山水 新韵重庆”国际品牌形象\n\n（一）培育打造国际化文旅IP\n\n实施“雄奇山水 新韵重庆”全球推广计划，深挖品牌内涵、讲好重庆故事，打造国内一流、享誉国际的城市文旅主品牌。塑优山水都市、长江三峡等国际名片，推广大足石刻、武隆喀斯特、南川金佛山等世界遗产，系统构建国际文旅品牌矩阵。迭代升级无人机灯光秀、三峡游轮等爆款项目，培育一批“云梯幻境”空中廊桥、“未来山城”光影公园、“赛博朋克”主题街区，孵化一批具有国际影响力的文旅IP及衍生产品。\n\n（二）打造内陆入境游首选地"}, {"chunkIndex": 19, "text": "等爆款项目，培育一批“云梯幻境”空中廊桥、“未来山城”光影公园、“赛博朋克”主题街区，孵化一批具有国际影响力的文旅IP及衍生产品。\n\n（二）打造内陆入境游首选地\n着眼“巩固港澳台、深耕东南亚、拓展欧美”客源市场布局，完善国际及地区客运航线网络，实施“一国一案”精准营销，丰富“一国一主题”专项供给，培育入境旅游重点城市。激活澜湄旅游城市合作联盟总部效应，创新开发跨境文旅产品，制定区域文旅行业标准，健全跨境旅游安全协同体系，加密重庆至新加坡、马来西亚、泰国等国家精品快线，打造东南亚入境旅游第一站。创新多式联运组合，与成都、西安、三亚、张家界等重点旅游城市合作推出“多点进出、一程多站”线路产品，建设旅游枢纽城市。以数智化、一站式为核心，纵深推进签证、通关、通信、支付、离境退税等全链条入境旅游便利化服务，完善多语种标识导览设施，组建一线外语服务人员及志愿者队伍，加强国际交往语言环境建设，提升入境游客便捷舒适体验。\n\n（三）建设文明交流互鉴窗口\n\n深化与驻外机构、国际组织、国际友城的常态化合作。全面推进巴渝文化“出海”，大力发展对外文化贸易。拓展对外传播渠道，提升西部国际传播中心能级，鼓励引导企业团体、专家学者、海外博主等民间力量多元发声。办好第五届全球媒体创新论坛、西洽会、长江文明论坛等品牌节会，引育高端国际节会、赛事，支持境外机构在渝举办人文交流活动，擦亮“四季新韵·感知重庆”“你好！重庆”“渝见”等交流品牌。\n\n十一、增强经营主体综合竞争力\n\n（一）壮大龙头骨干文旅企业"}, {"chunkIndex": 20, "text": "事，支持境外机构在渝举办人文交流活动，擦亮“四季新韵·感知重庆”“你好！重庆”“渝见”等交流品牌。\n\n十一、增强经营主体综合竞争力\n\n（一）壮大龙头骨干文旅企业\n实施文旅龙头企业“领航”计划，大力招引国内外知名文旅总部企业与研发机构，综合运用并购重组、业态拓展等方式，培育一批链主型文旅企业，争创中国旅游集团20强、全国文化企业30强。开展文旅企业上市梯次培育，推动优质龙头文旅企业加速上市。鼓励龙头骨干文旅企业拓展海外市场，全面提升国际竞争力。\n\n（二）培育新锐成长文旅企业\n\n实施新锐成长文旅企业“倍增”计划，建立“发现一批、培育一批、壮大一批”动态培育机制，重点扶持文化科技、内容原创类企业，引导传统企业向数据资产运营商、技术服务商转型。优化文旅企业梯度培育体系，聚焦数字内容、人工智能应用、创意设计等细分赛道，强化融资、场景、平台多维赋能。推进专精特新文旅企业“育苗”计划，培育“种子企业—专精特新—隐形冠军”成长梯队，引导文旅企业攻坚内容创意、非遗活化、研学体验等领域，培育一批营收过亿“小巨人”文旅企业。依托文化科技孵化器、产业园区集聚创新资源，助力文旅企业“上云用数赋智”。\n\n（三）育优小微特色文旅主体"}, {"chunkIndex": 21, "text": "活化、研学体验等领域，培育一批营收过亿“小巨人”文旅企业。依托文化科技孵化器、产业园区集聚创新资源，助力文旅企业“上云用数赋智”。\n\n（三）育优小微特色文旅主体\n实施中小微文旅企业“繁星”计划，扶持大师工作室、主理人商店、非遗工坊、文创团队、个体工商户等小微主体特色化、差异化发展。聚焦文旅融合、乡村旅游等领域，着力培育剧本创作、直播运营、乡村创客等小微业态。推动旅行社向专业化、定制化转型，酒店企业向品牌化、智能化升级。支持企业参与国家绿色饭店、中华老字号等评选评级。加力培育“名优特新”文旅个体工商户，畅通“个转企”通道。\n\n十二、提升数智赋能文旅发展水平\n\n（一）建强数字文旅“大脑中枢”\n\n构建文旅场所全覆盖智联感知体系，筑牢“文旅大脑”数据底座，提升“AI+文旅”整体智治能力。加快建设文旅全场景高质量数据集，促进文旅资源数字化转化与开发。加强文旅数字化政务管理体系建设，提升“预测、监测、预警、处置”一体化管控水平。完善假日文旅监测体系，优化文旅市场运行、旅游目的地游客接待情况、文旅全量消费等统计分析，搭建高效互通的文旅数据共享平台，构建全行业、全内容、全链路数据分析应用模式。\n\n（二）营造数智文旅服务新生态"}, {"chunkIndex": 22, "text": "行、旅游目的地游客接待情况、文旅全量消费等统计分析，搭建高效互通的文旅数据共享平台，构建全行业、全内容、全链路数据分析应用模式。\n\n（二）营造数智文旅服务新生态\n迭代“惠游重庆”“巴渝文物”“高品质文化生活”等数字化应用，丰富线上线下文旅综合服务场景。集成开发文旅AI智能体，做优全域全链智慧旅游服务，升级行前规划、行中伴游、行后分享等智慧功能。实施数字博物馆建设工程，持续推进“重庆云上博物馆”建设。实施“数智非遗计划”，运用VR、AI等技术推动技艺复刻、线上传习与数字文创开发。探索AI辅助艺术创作新路径，创新“数字融合+演艺互动”新模式。鼓励经营主体运用数字技术，打造一批具有科技感、未来感的文旅新空间。加快智慧景区建设，创新推广AI客流预警、智能预约、无感通行等应用场景，实现一屏统管、全域智控。\n\n（三）促进文旅科技创新转化\n\n争创部级文旅科技创新平台，搭建市级重点实验室、技术创新中心梯度培育体系。强化文物保护、艺术创作、文旅装备、智慧旅游等领域关键技术攻关和集成转化，推动文旅科技项目纳入市级重大（重点）科技专项。发布文旅科技需求清单，加强知识产权保护与资产规范化运营。\n\n十三、强化超大城市现代化文旅综合治理\n\n（一）提升文旅综合服务品质"}, {"chunkIndex": 23, "text": "项目纳入市级重大（重点）科技专项。发布文旅科技需求清单，加强知识产权保护与资产规范化运营。\n\n十三、强化超大城市现代化文旅综合治理\n\n（一）提升文旅综合服务品质\n提升“一干四支”沿线旅游码头泊位能级，强化交通接驳、智能调度等功能，拓展两江游、三峡游主题游线。深化实施“城景通”“城乡通”“景景通”工程，构建“快旅慢游”交通体系。布局建设“市级旅游集散中心+区县旅游集散点+重点景区驿站”三级服务体系，优化旅游便民服务体系，打造“一站式”服务平台，完善旅游国际化标识，推进旅游厕所质量提升工程，改造提升适老适幼和无障碍旅游公共服务设施，加强与市政、交通设施的统筹衔接，推广随身穿戴式“AI导游”。实施旅游服务质量提升工程，开展服务质量分级分类评价，深入推行服务承诺、先行赔付等制度。\n\n（二）增强文旅市场综合监管效能\n\n深化“大综合一体化”行政执法改革，强化中心城区一体化治理。创新市场监管方式，建设应用文化市场非现场监管系统，推广移动执法、电子取证，推动数智执法应用场景建设。完善旅游投诉纠纷闭环响应机制，加强对导游乱象、强制消费等重点问题的整治。推进文旅市场信用体系建设，推出文旅企业“诚信主体公示榜”“失信主体曝光台”。打造多跨协同综合监管场景，提升突发状况应对能力。\n\n（三）筑牢文旅发展安全屏障"}, {"chunkIndex": 24, "text": "整治。推进文旅市场信用体系建设，推出文旅企业“诚信主体公示榜”“失信主体曝光台”。打造多跨协同综合监管场景，提升突发状况应对能力。\n\n（三）筑牢文旅发展安全屏障\n完善文化产品和服务内容审核机制，强化源头治理。防范文旅领域投资风险，避免项目盲目上马和低水平重复建设。健全旅游安全预警机制，提升灾害风险管理能力。深化部门联动、市区（县）联合、专家联智的“三联”暗访检查和第三方视频暗访机制。推动“突发事件直报快响”与旅游业运行监测、应急指挥平台一体运行，加强对重点时段、重要设施设备、重大节庆活动的监管。推动文旅场所落实安全生产技术规范，扎实开展安全宣传教育和应急演练，增强从业人员安全意识和应急救助技能。\n\n（四）树立文明旅游新风尚\n\n全面提升文旅行业文明水平，健全文旅行业服务标准化体系，制定文明服务细则，统一服务流程、礼仪标准与评价机制，培育一批文明旅游单位。加强文旅从业人员职业道德与岗位技能培训，提升行业文明素养及规范化发展水平。深化文明旅游宣传引导，建立健全旅游不文明行为记录管理制度，依法依规处置不文明行为。\n\n十四、加强组织实施"}, {"chunkIndex": 25, "text": "业道德与岗位技能培训，提升行业文明素养及规范化发展水平。深化文明旅游宣传引导，建立健全旅游不文明行为记录管理制度，依法依规处置不文明行为。\n\n十四、加强组织实施\n加强党对文化和旅游发展工作的全面领导，优化市旅游经济发展领导小组统筹协调机制，强化“党委领导、政府主导、部门联动、社会参与”。加大财政资金保障力度，完善多元投入机制，用好重庆文化艺术基金，筹备组建文化创意产业基金。加强对文旅企业金融服务供给，推动文旅项目发行基础设施领域不动产投资信托基金。升级打造文旅职业教育办学主体，完善高端技能人才培养体系，壮大国际化文旅人才队伍，实施全球招才引智，引进高层次和紧缺型文旅人才。强化规划实施全过程管理，做好规划宣传解读工作，开展实施情况定期评估，深化评估结果应用，根据实际动态调整任务举措。"}], "suggestDocId": 2097637770155905026, "fixable": true, "hint": "该题答案横跨整篇文档（AI 建议补充 23 段），建议把问题收窄到具体条款或指标，而不是把整篇都标为证据"}}, {"id": "B-09", "category": "docnum", "question": "文号 渝府发〔2026〕12号 对应的政策文件，主要规定了哪些方面？", "answer": "即《公布重庆市第七批市级非物质文化遗产代表性项目名录的通知》。条例》有关规定，市政府批准重庆市第七批市级非物质文化遗产代表性项目名录（共计129项）和市级非物质文化遗产代表性项目名录扩展项目名录（共计13项），现予以公布。", "expectRefusal": false, "gold": [{"docId": 2097637768415268865, "chunkIndex": 1, "why": "公布重庆市第七批市级非物质文化遗产代表性项目名录的通知 正文开头", "quote": "", "text": "条例》有关规定，市政府批准重庆市第七批市级非物质文化遗产代表性项目名录（共计129项）和市级非物质文化遗产代表性项目名录扩展项目名录（共计13项），现予以公布。\n各区县政府、市级各部门、有关单位要深入学习贯彻习近平文化思想，坚持“保护为主、抢救第一、合理利用、传承发展”工作方针，扎实做好非物质文化遗产系统性保护工作，推动中华优秀传统文化创造性转化和创新性发展，为加快建设文化旅游强市提供有力支撑。\n\n附件：\n\n1．重庆市第七批市级非物质文化遗产代表性项目名录\n\n2．重庆市市级非物质文化遗产代表性项目名录扩展项目名录\n\n重庆市人民政府\n\n2026年6月15日\n\n（此件公开发布）\n\n附件1\n\n重庆市第七批市级非物质文化遗产\n\n代表性项目名录\n\n（共计129项）\n\n一、民间文学（2项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n1\n\nⅠ―32\n\n沙坪坝民间故事\n\n沙坪坝区\n\n2\n\nⅠ―33\n\n长寿民间故事\n\n长寿区\n\n二、传统音乐（4项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n3\n\nⅡ―106\n\n古琴艺术\n\n两江新区、大渡口区、沙坪坝区、北碚区、西部科学城重庆高新区\n\n4\n\nⅡ―107\n\n盐客调\n\n黔江区\n\n5\n\nⅡ―108\n\n华岩寺上江腔音乐\n\n九龙坡区\n\n6\n\nⅡ―109\n\n巫溪小调\n\n巫溪县\n\n三、传统舞蹈（2项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n7\n\nⅢ―55\n\n巴渝莲箫\n\n巴南区、巫山县、秀山土家族苗族自治县\n\n8\n\nⅢ―56\n\n石柱土家水龙\n\n石柱土家族自治县\n\n四、传统戏剧（1项）"}, {"docId": 2097637768415268865, "chunkIndex": 2, "why": "公布重庆市第七批市级非物质文化遗产代表性项目名录的通知 正文开头", "quote": "", "text": "\n7\n\nⅢ―55\n\n巴渝莲箫\n\n巴南区、巫山县、秀山土家族苗族自治县\n\n8\n\nⅢ―56\n\n石柱土家水龙\n\n石柱土家族自治县\n\n四、传统戏剧（1项）\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n9\n\nⅣ―29\n\n丰都木棒头戏\n\n丰都县\n\n五、传统体育、游艺与杂技（11项）\n\n序号\n\n项目编号\n\n项目名称\n\n申报地区或单位\n\n10\n\nⅥ―34\n\n岳家拳\n\n两江新区\n\n11\n\nⅥ―35\n\n子午拳术\n\n南岸区\n\n12\n\nⅥ―36\n\n四维拳\n\n开州区\n\n13\n\nⅥ―37\n\n字门拳\n\n梁平区\n\n14\n\nⅥ―38\n\n逍遥无极拳\n\n云阳县\n\n15\n\nⅥ―39\n\n克星掌\n\n云阳县\n\n16\n\nⅥ―40\n\n拦手门武术\n\n长寿区\n\n17\n\nⅥ―41\n\n三元门武术\n\n合川区\n\n18\n\nⅥ―42\n\n铜梁竞技龙\n\n铜梁区\n\n19\n\nⅥ―43\n\n高空绳技\n\n重庆杂技艺术团有限 \n第二十七条  市、区县（自治县）发布工作机构应当视情对预警信息发布、响应情况和工作动态进行通报。\n市、区县（自治县）发布工作机构应当对发布责任单位和区县（自治县）、乡镇人民政府、街道办事处的预警信息发布、传播、响应等情况进行效能评估。\n\n第二十八条  发布责任单位和发布工作机构应当加强对预警信息发布全链条的监督管理，对未经授权发布或者因工作人员玩忽职守等导致预警信息发布出现重大失误的，依法依规追究相关责任。\n\n第六章  附 则\n\n第二十九条  本办法自发布之日起施行。法律、法规或规章另有规定的，从其规定。原《重庆市突发事件预警信息发布管理办法》（渝府发〔2011〕31号）《重庆市突发事件预警信息发布平台运行管理办法（试行）》（渝府办发〔2016〕75号）同时废止。\n\n附件：1．重庆市突发事件预警信息发布清单\n\n2．重庆市突发事件预警信息发布备案表\n\n附件1\n\n重庆市突发事件预警信息发布清单\n\n类别\n\n专项名称\n\n发布责任单位\n\n备    注\n\n自然灾害\n\n洪水、干旱\n\n市水利局\n\n区县（自治县）水行政主管部门\n\n中小河流涨水风险提示\n\n市水利局、重庆气象局\n\n联合发布预警信息。\n\n区县（自治县）水行政主管部门、气象主管机构\n\n小流域山洪灾害气象风险预警\n\n市水利局、重庆气象局\n\n联合发布预警信息。\n\n区县（自治县）水行政主管部门、气象主管机构\n\n城市内涝灾害气象风险预警\n\n市住房城乡建委、重庆气象局\n\n联合发布预警信息。"}], "source": {"pairId": "", "policyDocId": 2097637763164000258, "policyTitle": "重庆市人民政府关于印发《重庆市突发事件预警信息发布管理办法（修订）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕6号"}, "permission": null, "meta": {"qType": "synthetic", "evidenceKey": "同时废止", "answerQuote": "原《重庆市突发事件预警信息发布管理办法》（渝府发〔2011〕31号）《重庆市突发事件预警信息发布平台运行管理办法（试行）》（渝府办发〔2016〕75号）同时废止。", "candidateChunks": [7], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "keep", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 5, "naturalness": 4}, "issues": [], "reason": "标准答案准确引用了原文第二十九条关于废止旧办法的规定，证据段落[7]完整覆盖了该条款，问题表述清晰自然。", "suggestion": "", "suggest": [], "suggestDocId": 2097637763164000258, "fixable": false, "hint": ""}}, {"id": "E-08", "category": "synthetic", "question": "重庆市突发事件预警信息里具体都包含哪些内容？", "answer": "主要包括发布单位、发布时间、可能发生突发事件的类别、起始时间、可能影响范围、预警级别、警示事项、事态发展、相关措施、咨询电话等。", "expectRefusal": false, "gold": [{"docId": 2097637763164000258, "chunkIndex": 3, "why": "重庆市人民政府关于印发《重庆市突发事件预警信息发布管理办法（修订）》的通知", "quote": "预警信息的内容主要包括发布单位、发布时间、可能发生突发事件的类别、起始时间、可能影响范围、预警级别、警示事项、事态发展、相关措施、咨询电话等。", "text": "第十一条  市、区县（自治县）人民政府授权的发布工作机构，承担本级预警信息发布以及预警信息发布平台的建设、运行、管理和预警效能评估工作。\n\n第三章  信息发布\n第十二条  发布责任单位应当按照各自职责，组织开展突发事件风险普查和隐患排查，完善突发事件监测设施，建立历史、实时监测信息数据库和突发事件风险隐患数据库并通过一体化数字资源系统（IRS）实现共享。\n\n市外发生可能影响本市的突发事件，相关发布责任单位应当立即组织开展应急监测监控。\n\n第十三条  发布责任单位应当及时汇总分析突发事件隐患和监测信息，及时组织相关部门、专业技术人员、专家学者进行会商，对发生突发事件的可能性及其可能造成的影响进行推演和评估。\n\n对可能造成国内、国际重大影响的突发事件，相关发布责任单位应当及时逐级上报至市政府，经批准后通报相关省（自治区、直辖市），并向国务院报告。\n\n第十四条  发布责任单位应当根据突发事件可能发生发展的态势，按照预警等级划分标准，制作相应级别的预警信息。\n\n预警信息的内容主要包括发布单位、发布时间、可能发生突发事件的类别、起始时间、可能影响范围、预警级别、警示事项、事态发展、相关措施、咨询电话等。\n\n第十五条  按照“谁产生、谁审核、谁负责”的原则，预警信息应当经发布责任单位审核后发布。需报地方人民政府批准的预警信息，由发布责任单位按照程序报批。未按照规定审批的预警信息，不得发布。"}], "source": {"pairId": "", "policyDocId": 2097637763164000258, "policyTitle": "重庆市人民政府关于印发《重庆市突发事件预警信息发布管理办法（修订）》的通知", "interpretDocId": 0, "interpretTitle": "", "interpretSection": "政策文件", "docNumber": "渝府发〔2026〕6号"}, "permission": null, "meta": {"qType": "synthetic", "evidenceKey": "预警信息的内容", "answerQuote": "预警信息的内容主要包括发布单位、发布时间、可能发生突发事件的类别、起始时间、可能影响范围、预警级别、警示事项、事态发展、相关措施、咨询电话等。", "candidateChunks": [3], "goldVerified": true, "generatedBy": "qwen3.8-flash", "temperature": 0, "reviewState": "pending", "reviewNote": ""}, "ai": {"verdict": "edit", "scores": {"answerability": 5, "faithfulness": 5, "sufficiency": 4, "naturalness": 5}, "issues": ["证据无关"], "reason": "标准答案完全忠实于原文第十四条，可答性高且问题自然。但标注的证据段落[★3]中包含了第十一条（关于发布工作机构职责）和第十二、十三、十五条等大量与“预警信息内容”无直接关系的冗余文本，仅第十四条为强相关证据，导致标注不够精准。", "suggestion": "建议优化证据标注粒度：若系统支持段落级标注，应仅保留包含第十四条内容的片段；若不支持拆分，需接受该段落因包含核心证据而带来的少量冗余，或检查是否可将第十四条单独切分为一个更小的chunk进行标注。当前状态下，由于核心证据在标★段落内，不影响检索召回，但影响评测的精确度，故判为edit以提示数据清洗优化。", "suggest": [], "suggestDocId": 2097637763164000258, "fixable": false, "hint": ""}}, {"id": "E-09", "category": "synthetic", "question": "重庆打造国际化环境三年行动计划里，2026年底中心城区重点区域中英双语标识标牌规范化设置率要达到多少？", "answer": "到2026年底，中心城区重点区域中英双语标识标牌规范化设置率达95%。", "expectRefusal": false, "gold": [{"docId": 2097637768520126465, "chunkIndex": 1, "why": "重庆市人民政府办公厅关于印发《重庆市提升境外人员来渝服务便利化水平加快打造国际化", "quote": "中心城区重点区域中英双语标识标牌规范化设置率达95%", "text": "\n加快打造国际化环境三年行动计划\n\n为全面提升境外人员来渝服务便利化水平，加快打造国际化环境，制定本行动计划。\n\n一、总体要求\n坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面落实习近平总书 const KEY = 'rag-eval-review-v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
let cur = 0, view = [];

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function st(id){ return (state[id] && state[id].st) || 'pending'; }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(text, quote){
  if(!quote) return esc(text);
  const flat = t => (t||'').replace(/[\s，,。.；;：:、（）()《》""''\-—－]/g,'');
  const f = flat(text), q = flat(quote);
  const i = f.indexOf(q);
  if(i < 0) return esc(text);
  // 把 flat 下标映射回原文下标
  let n = -1, j = 0;
  for(let k = 0; k < text.length && j <= i; k++){
    if(!/[\s，,。.；;：:、（）()《》""''\-—－]/.test(text[k])){ if(j === i){ n = k; break; } j++; }
  }
  if(n < 0) return esc(text);
  let m = n, cnt = 0;
  while(m < text.length && cnt < q.length){
    if(!/[\s，,。.；;：:、（）()《》""''\-—－]/.test(text[m])) cnt++;
    m++;
  }
  return esc(text.slice(0,n)) + '<mark>' + esc(text.slice(n,m)) + '</mark>' + esc(text.slice(m));
}
function render(){
  const cat = document.getElementById('fcat').value;
  const stt = document.getElementById('fst').value;
  const q   = document.getElementById('fq').value.trim();
  const v = document.getElementById('fv').value;
  view = DATA.filter(d => (!cat || d.category===cat) && (!stt || st(d.id)===stt) &&
                          (!q || d.question.includes(q)) &&
                          (!v || (v==='fixable' ? (d.ai && d.ai.fixable)
                                                : (d.ai && d.ai.verdict===v))));
  const L = document.getElementById('list');
  L.innerHTML = view.map((d,i)=>{
    const s = st(d.id);
    const av = d.ai ? `<span class="tag v-${d.ai.verdict}" title="AI 建议">${d.ai.verdict}</span>` : '';
    return `<div class="item ${i===cur?'active':''}" onclick="go(${i})">
      <span class="idx">${d.id}</span>
      <span class="tag t-${d.category}">${d.category.slice(0,4)}</span>
      <span class="qq">${esc(d.question)}</span>
      ${av}
      <span class="st-${s}">${s==='kept'?'✓':s==='dropped'?'✗':'·'}</span></div>`;
  }).join('');
  document.getElementById('prog').textContent =
    `已处理 ${Object.keys(state).length}/${DATA.length} · 保留 ${DATA.filter(d=>st(d.id)==='kept').length} · 删除 ${DATA.filter(d=>st(d.id)==='dropped').length}`;
  show();
}
function go(i){ cur = i; render(); }
function nav(d){ cur = Math.min(view.length-1, Math.max(0, cur+d)); render();
  document.querySelector('.item.active')?.scrollIntoView({block:'nearest'}); }
function show(){

  if(!d){ document.getElementById('main').innerHTML = '<div class="card">没有匹配的题目</div>'; return; }
