server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: cloud
  # Session 配置 (使用 Redis 存储，与本地保持一致)
  session:
    store-type: redis
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 【注意】数据库名已更新为 picture，请确保线上数据库已创建此库
    # 使用环境变量配置敏感信息，格式：${ENV_VAR:default_value}
    url: jdbc:mysql://localhost:3306/picture?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}  # 建议生产环境不要用 root
    password: ${DB_PASSWORD}      # 必须通过环境变量设置
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  # Redis 配置 (使用旧线上的主机地址，合并本地的超时设置)
  redis:
    database: ${REDIS_DB:0}
    host: ${REDIS_HOST:111.230.167.134}
    port: ${REDIS_PORT:6379}
    timeout: 5000
    password: ${REDIS_PASSWORD} # 必须通过环境变量设置

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 【重要】生产环境通常关闭 StdOutImpl，改用日志框架的文件输出
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档配置
knife4j:
  # 开启 Basic 认证，保护线上接口文档
  basic:
    enable: true
    username: ${DOC_USERNAME:admin} # 接口文档登录账号
    password: ${DOC_PASSWORD}       # 接口文档登录密码
  enable: true
  # 生产环境通常建议设为 true 来关闭在线调试功能，如果您确实需要在线调试则保持 false
  production: false
  openapi:
    title: "云图库接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.et.cloud.controller

# 对象存储配置 (腾讯云 COS)
cos:
  client:
    host: https://cloud-1380686335.cos.ap-chongqing.myqcloud.com
    region: ap-chongqing
    bucket: cloud-1380686335
    secretId: ${COS_SECRET_ID}   # 从环境变量读取
    secretKey: ${COS_SECRET_KEY} # 从环境变量读取

# 阿里云 AI 配置
aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:}   # 阿里云 AI 功能已废弃；未配置时不阻塞启动和测试

# RAG 配置（add-wiki-rag-pipeline）。api-key 未配置时索引流程降级跳过，不阻塞文档保存
rag:
  embedding:
    # 默认云端 DashScope compatible-mode（qwen3.7-text-embedding-flash）；api-key 经环境变量
    # RAG_EMBEDDING_API_KEY 注入（start-dev.ps1 会读取根目录 .env.dev）。
    # 切回本地 Ollama 示例：RAG_EMBEDDING_BASE_URL=http://localhost:11434/v1
    # RAG_EMBEDDING_MODEL=qwen3-embedding:4b（本地端点无需 api-key）
    base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    model: ${RAG_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    timeout-seconds: 30
  retrieval:
    top-k: 6
    # topK 硬上限：无上限时可一次请求整个空间（全量暴力余弦 + 巨量回传），并稀释下游 prompt
    top-k-max: 50
    # 粗排候选池：重排只能重排池子里已有的候选，池深决定 recall 的理论上限。
    # 实测（399 题；oracle = 该深度下完美重排的理论上限，端到端 = 本系统实测 recall@6，
    # 延迟为同一 120 题取样、单并发的客户端端到端耗时）：
    #   深度 20  → oracle 0.7690 / 实测 0.7590（吃到上限 98.7%）
    #   深度 50  → oracle 0.8600 / 实测 0.7930（92.2%），mean 516ms / p95 600ms
    #   深度 100 → oracle 0.9061 / 实测 0.8030（88.6%），mean 720ms / p95 928ms
    # 池越深，重排从 N 里挑 6 的精度越低（命中率衰减），故 50→100 只多 1.0pt 却多 190ms。
    # 默认取 50；可用 RAG_CANDIDATE_POOL_SIZE / RAG_FUSION_POOL_SIZE 覆盖。
    candidate-pool-size: ${RAG_CANDIDATE_POOL_SIZE:50}
    # 融合池 = 交给重排的那一批候选的深度，与 candidate-pool-size 共同决定有效池深
    fusion-pool-size: ${RAG_FUSION_POOL_SIZE:50}
    # RRF 常数取文献默认值，刻意不针对评测集调参，保证收益可对外声明
    rrf-k: 60
    lexical:
      # 中文 bigram 的 BM25 通道：零外部依赖，把候选池 oracle@50 从 0.8148 抬到 0.8600
      enabled: true
      k1: 1.2
      b: 0.75
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      # DashScope 原生 text-rerank 端点（注意不是 OpenAI 兼容 base-url）；与 embedding 复用同一把 key
      base-url: ${RAG_RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      api-key: ${RAG_RERANK_API_KEY:${RAG_EMBEDDING_API_KEY:}}
      # 同文档集实测 top 分：qwen3.7-text-rerank 0.9973 vs gte-rerank-v2 0.5897（无关文档 0.0321 vs 0.006）
      model: ${RAG_RERANK_MODEL:qwen3.7-text-rerank}
      timeout-seconds: 20
      # 单次请求可送的最大文档数；必须 >= 有效池深，否则候选池会被静默截断。
      # 与池深分开控制是为了让「池子多深」和「重排吃多深」能被独立观测。
      max-documents: ${RAG_RERANK_MAX_DOCUMENTS:50}
  llm:
    # 回答生成 LLM（OpenAI 兼容 /chat/completions 流式）；key 走环境变量，未配置时问答接口返回可读错误
    base-url: ${RAG_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${RAG_LLM_API_KEY:}
    model: ${RAG_LLM_MODEL:deepseek-v4-flash-vision-exp}
    # 默认（快速）模式的非思考模型，勾选「深度思考」时才用上面的思考型模型
    fast-model: ${RAG_LLM_FAST_MODEL:deepseek-chat}
    timeout-seconds: 120
    # 思考型模型的 reasoning_content 与正文共用 token 预算，2048 会导致复杂题思考阶段即被截断（finishReason=length、正文为空）
    max-tokens: 8192
  index:
    batch-embed-size: 10
    async-core-pool-size: 2
    async-max-pool-size: 4
    async-queue-capacity: 200

